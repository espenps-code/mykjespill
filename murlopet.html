document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

yle=\"grid-area:{{ m.area }};z-index:3;border-radius:var(--wallRadius);background:{{ m.fyll }};box-shadow:var(--wallShadow);animation:dunk .28s cubic-bezier(.2,1.6,.4,1)\"><\u002Fdiv>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{ visForhand }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"grid-area:{{ forhandArea }};z-index:4;border-radius:var(--wallRadius);background:{{ forhandFyll }};opacity:.9;box-shadow:0 0 0 2px {{ forhandKant }};animation:puls 1.2s ease-in-out infinite\"><\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"position:absolute;left:{{ rodX }};top:{{ rodY }};width:6.2%;aspect-ratio:1;border-radius:50%;background:var(--pieceRed);box-shadow:var(--pieceGlowRed);transform:translate(-50%,-50%);transition:left .32s cubic-bezier(.3,1.3,.5,1),top .32s cubic-bezier(.3,1.3,.5,1);z-index:6;pointer-events:none\"><\u002Fdiv>\n      <div style=\"position:absolute;left:{{ blaX }};top:{{ blaY }};width:6.2%;aspect-ratio:1;border-radius:50%;background:var(--pieceBlue);box-shadow:var(--pieceGlowBlue);transform:translate(-50%,-50%);transition:left .32s cubic-bezier(.3,1.3,.5,1),top .32s cubic-bezier(.3,1.3,.5,1);z-index:6;pointer-events:none\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:min(92vw,540px);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:var(--panelRadius);background:{{ blaPanelBg }};border:2px solid {{ blaPanelKant }};box-shadow:var(--panelShadow);box-sizing:border-box\">\n    <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n      <div style=\"width:20px;height:20px;border-radius:50%;background:var(--pieceBlue);box-shadow:var(--pieceGlowBlue);flex:none\"><\u002Fdiv>\n      <span style=\"font-family:var(--display);font-weight:800;letter-spacing:.1em;font-size:1rem;color:var(--blue)\">BLÅ<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:8px\">\n      <div style=\"display:flex;gap:3px;align-items:center\">\n        <sc-for list=\"{{ blaBrikker }}\" as=\"b\" hint-placeholder-count=\"10\">\n          <div style=\"width:7px;height:20px;border-radius:2px;background:var(--wallBlue);opacity:{{ b.o }};transform:scaleY({{ b.s }});box-shadow:var(--wallShadow)\"><\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <span style=\"font:700 .78rem var(--display);color:var(--muted);min-width:22px;text-align:right\">{{ blaIgjen }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:4px;padding:3px;border-radius:999px;background:var(--btn);border:1px solid var(--btnBorder)\">\n      <button sc-camel-on-click=\"{{ settFlytt }}\" style=\"font:700 11px var(--display);padding:5px 10px;border-radius:999px;border:none;cursor:pointer;background:{{ flyttBg }};color:{{ flyttFg }}\">FLYTT<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ settMur }}\" style=\"font:700 11px var(--display);padding:5px 10px;border-radius:999px;border:none;cursor:pointer;background:{{ murBg }};color:{{ murFg }}\">MUR<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ visForhand }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;border-radius:var(--panelRadius);background:var(--card);border:1px solid var(--btnBorder);box-shadow:var(--panelShadow);animation:inn .18s ease-out\">\n      <span style=\"font-size:.85rem;font-weight:700\">{{ forhandTekst }}<\u002Fspan>\n      <button sc-camel-on-click=\"{{ byggMur }}\" style=\"font:700 .82rem var(--display);padding:8px 16px;border-radius:var(--btnRadius);border:none;cursor:pointer;background:{{ byggBg }};color:#fff;opacity:{{ byggOpacity }}\">Bygg<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ avbryt }}\" style=\"font:700 .82rem var(--display);padding:8px 14px;border-radius:var(--btnRadius);border:1px solid var(--btnBorder);cursor:pointer;background:transparent;color:var(--ink)\">Avbryt<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"min-height:1.2rem;font-size:.82rem;font-weight:700;text-align:center;padding:0 1rem;color:{{ meldingFarge }}\">{{ melding }}<\u002Fdiv>\n\n  <div style=\"display:flex;gap:8px\">\n    <button sc-camel-on-click=\"{{ angre }}\" style=\"font:600 .82rem var(--display);padding:9px 16px;border-radius:var(--btnRadius);border:1px solid var(--btnBorder);background:var(--btn);color:var(--btnInk);cursor:pointer\" style-hover=\"filter:brightness(1.12)\">↩ Angre<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ nyttSpill }}\" style=\"font:600 .82rem var(--display);padding:9px 16px;border-radius:var(--btnRadius);border:1px solid var(--btnBorder);background:var(--btn);color:var(--btnInk);cursor:pointer\" style-hover=\"filter:brightness(1.12)\">Nytt spill<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ apneRegler }}\" style=\"font:600 .82rem var(--display);padding:9px 16px;border-radius:var(--btnRadius);border:1px solid var(--btnBorder);background:var(--btn);color:var(--btnInk);cursor:pointer\" style-hover=\"filter:brightness(1.12)\">Regler<\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ visSeier }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,14,20,.6);backdrop-filter:blur(5px);padding:16px\">\n      <div style=\"background:var(--card);color:var(--ink);border-radius:24px;padding:28px 34px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5);animation:dunk .4s cubic-bezier(.2,1.6,.4,1);max-width:88vw\">\n        <div style=\"font-size:2.6rem;line-height:1\">🏆<\u002Fdiv>\n        <h2 style=\"font-family:var(--display);font-weight:800;font-size:1.7rem;margin:.4rem 0 .2rem;color:{{ seierFarge }}\">{{ seierTittel }}<\u002Fh2>\n        <p style=\"margin:.2rem 0 1.2rem;color:var(--muted);font-size:.9rem\">{{ seierTekst }}<\u002Fp>\n        <button sc-camel-on-click=\"{{ nyttSpill }}\" style=\"font:700 .95rem var(--display);padding:12px 26px;border-radius:var(--btnRadius);border:none;cursor:pointer;background:{{ seierFarge }};color:#fff\">Spill igjen<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ visRegler }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(10,14,20,.6);backdrop-filter:blur(5px);padding:16px\">\n      <div style=\"background:var(--card);color:var(--ink);border-radius:22px;padding:22px 24px;max-width:460px;max-height:82vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.5);-webkit-user-select:text;user-select:text\">\n        <h2 style=\"font-family:var(--display);font-weight:800;margin:0 0 .6rem;font-size:1.25rem\">Slik spiller dere<\u002Fh2>\n        <p style=\"font-size:.9rem;line-height:1.55;margin:.5rem 0\"><b>Mål:<\u002Fb> Rød starter øverst og skal først til nederste rad. Blå starter nederst og skal først til øverste rad.<\u002Fp>\n        <p style=\"font-size:.9rem;line-height:1.55;margin:.5rem 0\"><b>FLYTT:<\u002Fb> Trykk på et av de blinkende feltene – ett steg opp, ned, høyre eller venstre.<\u002Fp>\n        <p style=\"font-size:.9rem;line-height:1.55;margin:.5rem 0\"><b>MUR:<\u002Fb> Bytt til MUR-modus og trykk i en sprekk mellom feltene. Muren dekker to felt – trykk <b>Bygg<\u002Fb> for å bekrefte. Hver spiller har {{ murTotalt }} murer.<\u002Fp>\n        <p style=\"font-size:.9rem;line-height:1.55;margin:.5rem 0\"><b>Hopp:<\u002Fb> Står kulene inntil hverandre, hopper du rett over motstanderen. Er det mur eller kant bak, hopper du på skrå i stedet.<\u002Fp>\n        <p style=\"font-size:.9rem;line-height:1.55;margin:.5rem 0\"><b>Viktig:<\u002Fb> Du kan aldri sperre motstanderen helt inne – det må alltid finnes minst én vei til mål.<\u002Fp>\n        <button sc-camel-on-click=\"{{ lukkRegler }}\" style=\"margin-top:.8rem;font:700 .9rem var(--display);padding:10px 22px;border-radius:var(--btnRadius);border:none;background:var(--blue);color:#fff;cursor:pointer\">Skjønner!<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;],&quot;default&quot;:&quot;b&quot;,&quot;tsType&quot;:&quot;'a'|'b'&quot;},&quot;murerPerSpiller&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:5,&quot;max&quot;:14,&quot;tsType&quot;:&quot;number&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p){\n    super(p);\n    const tot = (p && p.murerPerSpiller) || 10;\n    this.state = Object.assign({\n      theme: (p && p.variant) || 'b',\n      modus: 'flytt',\n      forhand: null,\n      historikk: [],\n      melding: '',\n      visRegler: false\n    }, this.friskt(tot));\n  }\n\n  friskt(tot){\n    const t = tot || this.murTotalt();\n    return { pos:{rod:{r:0,c:4}, bla:{r:8,c:4}}, igjen:{rod:t, bla:t}, murer:[], tur:'bla', vinner:null };\n  }\n  murTotalt(){ return this.props.murerPerSpiller || 10; }\n\n  sett(murer){ const s = new Set(); for(const m of murer) s.add(m.o+':'+m.r+','+m.c); return s; }\n\n  blok(S,r,c,dr,dc){\n    const N=9, nr=r+dr, nc=c+dc;\n    if(nr<0||nr>=N||nc<0||nc>=N) return true;\n    if(dr===1)  return S.has('h:'+r+','+(c-1)) || S.has('h:'+r+','+c);\n    if(dr===-1) return S.has('h:'+(r-1)+','+(c-1)) || S.has('h:'+(r-1)+','+c);\n    if(dc===1)  return S.has('v:'+(r-1)+','+c) || S.has('v:'+r+','+c);\n    return S.has('v:'+(r-1)+','+(c-1)) || S.has('v:'+r+','+(c-1));\n  }\n\n  gyldigeTrekk(sp){\n    const S = this.sett(this.state.murer);\n    const meg = this.state.pos[sp];\n    const andre = this.state.pos[sp==='rod'?'bla':'rod'];\n    const ut = [];\n    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){\n      if(this.blok(S,meg.r,meg.c,dr,dc)) continue;\n      const nr=meg.r+dr, nc=meg.c+dc;\n      if(nr===andre.r && nc===andre.c){\n        if(!this.blok(S,nr,nc,dr,dc)){ ut.push({r:nr+dr,c:nc+dc}); }\n        else {\n          const perp = dr!==0 ? [[0,1],[0,-1]] : [[1,0],[-1,0]];\n          for(const [pr,pc] of perp){\n            if(!this.blok(S,nr,nc,pr,pc)){\n              const tr=nr+pr, tc=nc+pc;\n              if(!(tr===meg.r && tc===meg.c)) ut.push({r:tr,c:tc});\n            }\n          }\n        }\n      } else ut.push({r:nr,c:nc});\n    }\n    return ut;\n  }\n\n  harVei(sp, murer){\n    const S = this.sett(murer);\n    const malRad = sp==='rod' ? 8 : 0;\n    const start = this.state.pos[sp];\n    const sn = new Set([start.r+','+start.c]);\n    const ko = [start];\n    while(ko.length){\n      const {r,c} = ko.shift();\n      if(r===malRad) return true;\n      for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){\n        if(this.blok(S,r,c,dr,dc)) continue;\n        const k=(r+dr)+','+(c+dc);\n        if(!sn.has(k)){ sn.add(k); ko.push({r:r+dr,c:c+dc}); }\n      }\n    }\n    return false;\n  }\n\n  murGyldig(m){\n    const st = this.state;\n    if(m.r<0||m.r>7||m.c<0||m.c>7) return {ok:false, hvorfor:'Muren må ligge på brettet.'};\n    if(st.igjen[st.tur]<=0) return {ok:false, hvorfor:'Ingen murer igjen!'};\n    const S = this.sett(st.murer);\n    if(S.has('h:'+m.r+','+m.c) || S.has('v:'+m.r+','+m.c)) return {ok:false, hvorfor:'Murer kan ikke krysse hverandre.'};\n    if(m.o==='h' && (S.has('h:'+m.r+','+(m.c-1)) || S.has('h:'+m.r+','+(m.c+1)))) return {ok:false, hvorfor:'Murer kan ikke overlappe.'};\n    if(m.o==='v' && (S.has('v:'+(m.r-1)+','+m.c) || S.has('v:'+(m.r+1)+','+m.c))) return {ok:false, hvorfor:'Murer kan ikke overlappe.'};\n    const test = st.murer.concat([m]);\n    if(!(this.harVei('rod',test) && this.harVei('bla',test))) return {ok:false, hvorfor:'Det må alltid finnes en vei til mål for begge!'};\n    return {ok:true};\n  }\n\n  lagre(){\n    const st = this.state;\n    const snap = JSON.stringify({pos:st.pos, igjen:st.igjen, murer:st.murer, tur:st.tur, vinner:st.vinner});\n    const h = st.historikk.concat([snap]);\n    if(h.length>120) h.shift();\n    return h;\n  }\n\n  gjorTrekk(t){\n    const st = this.state;\n    if(st.vinner) return;\n    const h = this.lagre();\n    const pos = Object.assign({}, st.pos); pos[st.tur] = {r:t.r,c:t.c};\n    const malRad = st.tur==='rod' ? 8 : 0;\n    if(t.r===malRad){ this.setState({historikk:h, pos, vinner:st.tur, forhand:null, melding:''}); return; }\n    this.setState({historikk:h, pos, tur: st.tur==='rod'?'bla':'rod', forhand:null, melding:''});\n  }\n\n  velgSpor(m){\n    const st = this.state;\n    if(st.vinner) return;\n    if(st.igjen[st.tur]<=0){ this.setState({melding:'Ingen murer igjen – du må flytte kula.', feil:true}); return; }\n    if(st.forhand && st.forhand.mur.o===m.o && st.forhand.mur.r===m.r && st.forhand.mur.c===m.c && st.forhand.ok){ this.byggMur(); return; }\n    let g = this.murGyldig(m), mur = m;\n    if(!g.ok && m.o==='h' && m.c>0){ const alt={r:m.r,c:m.c-1,o:'h'}; const g2=this.murGyldig(alt); if(g2.ok){ mur=alt; g=g2; } }\n    if(!g.ok && m.o==='v' && m.r>0){ const alt={r:m.r-1,c:m.c,o:'v'}; const g2=this.murGyldig(alt); if(g2.ok){ mur=alt; g=g2; } }\n    this.setState({forhand:{mur, ok:g.ok, hvorfor:g.hvorfor}, melding: g.ok ? '' : g.hvorfor, feil: !g.ok});\n  }\n\n  byggMur = () => {\n    const st = this.state;\n    if(!st.forhand || !st.forhand.ok) return;\n    const h = this.lagre();\n    const igjen = Object.assign({}, st.igjen); igjen[st.tur] = igjen[st.tur]-1;\n    this.setState({\n      historikk:h,\n      murer: st.murer.concat([Object.assign({eier:st.tur}, st.forhand.mur)]),\n      igjen, forhand:null, melding:'', feil:false,\n      tur: st.tur==='rod'?'bla':'rod',\n      modus:'flytt'\n    });\n  };\n\n  avbryt = () => this.setState({forhand:null, melding:'', feil:false});\n\n  angre = () => {\n    const st = this.state;\n    if(!st.historikk.length) return;\n    const h = st.historikk.slice();\n    const snap = JSON.parse(h.pop());\n    this.setState(Object.assign({historikk:h, forhand:null, melding:'Angret siste trekk.', feil:false}, snap));\n  };\n\n  nyttSpill = () => this.setState(Object.assign({historikk:[], forhand:null, melding:'', feil:false, modus:'flytt'}, this.friskt()));\n\n  renderVals(){\n    const st = this.state;\n    const tot = this.murTotalt();\n    const enhet = 1, gap = .26, sum = 9*enhet + 8*gap;\n    const senter = i => (((i*(enhet+gap)) + enhet/2) / sum * 100).toFixed(3) + '%';\n    const aktiv = st.tur;\n    const turFarge = aktiv==='rod' ? 'var(--red)' : 'var(--blue)';\n    const kanFlytte = !st.vinner && st.modus==='flytt' && !st.forhand;\n    const kanMur = !st.vinner && st.modus==='mur' && st.igjen[aktiv]>0;\n\n    const trekk = kanFlytte ? this.gyldigeTrekk(aktiv) : [];\n    const trekkSett = new Set(trekk.map(t=>t.r+','+t.c));\n\n    const ruter = [];\n    for(let r=0;r<9;r++) for(let c=0;c<9;c++){\n      const erMal = trekkSett.has(r+','+c);\n      ruter.push({\n        key: r+'-'+c,\n        area: (2*r+1)+' / '+(2*c+1),\n        bg: r===8 ? 'var(--goalRed)' : (r===0 ? 'var(--goalBlue)' : 'var(--cell)'),\n        mal: erMal,\n        pe: erMal ? 'auto' : 'none',\n        klikk: erMal ? () => this.gjorTrekk({r,c}) : null\n      });\n    }\n\n    const spor = [];\n    if(kanMur){\n      for(let r=0;r<8;r++) for(let c=0;c<8;c++){\n        spor.push({key:'h'+r+'-'+c, area:(2*r+2)+' / '+(2*c+1)+' / span 1 / span 3', margin:'-7px 0', pe:'auto', klikk:()=>this.velgSpor({r,c,o:'h'})});\n        spor.push({key:'v'+r+'-'+c, area:(2*r+1)+' / '+(2*c+2)+' / span 3 / span 1', margin:'0 -7px', pe:'auto', klikk:()=>this.velgSpor({r,c,o:'v'})});\n      }\n    }\n\n    const fyll = (eier,o) => {\n      const base = eier==='rod' ? 'var(--wallRed)' : 'var(--wallBlue)';\n      return base;\n    };\n    const murOmr = m => m.o==='h'\n      ? (2*m.r+2)+' / '+(2*m.c+1)+' / span 1 / span 3'\n      : (2*m.r+1)+' / '+(2*m.c+2)+' / span 3 / span 1';\n\n    const murer = st.murer.map((m,i)=>({key:'m'+i, area:murOmr(m), fyll:fyll(m.eier,m.o)}));\n\n    const brikker = (n) => {\n      const ut = [];\n      for(let i=0;i<tot;i++) ut.push({key:i, o: i<n ? '1' : '.15', s: i<n ? '1' : '.55'});\n      return ut;\n    };\n\n    const pillPa = 'var(--turn-pill, ' + turFarge + ')';\n    const flyttAktiv = st.modus==='flytt';\n\n    return {\n      theme: st.theme,\n      velgA: () => this.setState({theme:'a'}),\n      velgB: () => this.setState({theme:'b'}),\n      tabABg: st.theme==='a' ? 'var(--red)' : 'transparent',\n      tabAFg: st.theme==='a' ? '#fff' : 'var(--muted)',\n      tabBBg: st.theme==='b' ? 'var(--blue)' : 'transparent',\n      tabBFg: st.theme==='b' ? '#fff' : 'var(--muted)',\n      undertittel: st.theme==='a' ? 'To spillere · ett brett · én vei fram' : 'Kom deg først over brettet – eller sperr veien!',\n\n      turFarge,\n      ruter, spor, murer,\n\n      rodBrikker: brikker(st.igjen.rod),\n      blaBrikker: brikker(st.igjen.bla),\n      rodIgjen: st.igjen.rod,\n      blaIgjen: st.igjen.bla,\n      murTotalt: tot,\n\n      rodPanelBg: (aktiv==='rod' && !st.vinner) ? 'var(--panelActive)' : 'var(--panel)',\n      blaPanelBg: (aktiv==='bla' && !st.vinner) ? 'var(--panelActive)' : 'var(--panel)',\n      rodPanelKant: (aktiv==='rod' && !st.vinner) ? 'var(--red)' : 'transparent',\n      blaPanelKant: (aktiv==='bla' && !st.vinner) ? 'var(--blue)' : 'transparent',\n\n      settFlytt: () => this.setState({modus:'flytt', forhand:null, melding:''}),\n      settMur: () => this.setState({modus:'mur', melding:''}),\n      flyttBg: flyttAktiv ? turFarge : 'transparent',\n      flyttFg: flyttAktiv ? '#fff' : 'var(--muted)',\n      murBg: !flyttAktiv ? turFarge : 'transparent',\n      murFg: !flyttAktiv ? '#fff' : 'var(--muted)',\n\n      visForhand: !!st.forhand,\n      forhandArea: st.forhand ? murOmr(st.forhand.mur) : '1 / 1',\n      forhandFyll: st.forhand && !st.forhand.ok\n        ? 'repeating-linear-gradient(45deg,rgba(214,69,69,.85) 0 7px,rgba(255,180,180,.85) 7px 14px)'\n        : (aktiv==='rod' ? 'var(--wallRed)' : 'var(--wallBlue)'),\n      forhandKant: st.forhand && !st.forhand.ok ? '#D64545' : 'rgba(255,255,255,.5)',\n      forhandTekst: st.forhand && st.forhand.ok ? 'Bygge muren her?' : (st.forhand ? st.forhand.hvorfor : ''),\n      byggBg: st.forhand && st.forhand.ok ? '#3AA35C' : '#8A9098',\n      byggOpacity: st.forhand && st.forhand.ok ? '1' : '.5',\n      byggMur: this.byggMur,\n      avbryt: this.avbryt,\n\n      rodX: senter(st.pos.rod.c), rodY: senter(st.pos.rod.r),\n      blaX: senter(st.pos.bla.c), blaY: senter(st.pos.bla.r),\n\n      melding: st.melding || (st.vinner ? '' : (st.modus==='mur' ? 'Trykk i en sprekk mellom feltene for å bygge.' : (aktiv==='rod' ? 'Rød sin tur – velg et blinkende felt.' : 'Blå sin tur – velg et blinkende felt.'))),\n      meldingFarge: st.feil ? '#D64545' : 'var(--muted)',\n\n      angre: this.angre,\n      nyttSpill: this.nyttSpill,\n      apneRegler: () => this.setState({visRegler:true}),\n      lukkRegler: () => this.setState({visRegler:false}),\n      visRegler: st.visRegler,\n\n      visSeier: !!st.vinner,\n      seierFarge: st.vinner==='rod' ? 'var(--red)' : 'var(--blue)',\n      seierTittel: st.vinner==='rod' ? 'RØD VANT!' : 'BLÅ VANT!',\n      seierTekst: st.vinner==='rod' ? 'Rød kule kom seg først over brettet.' : 'Blå kule kom seg først over brettet.'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
