document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ground:rgba(255,255,255,.04);padding:20px 22px;\">\n        <div style=\"font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(242,238,255,.45);margin-bottom:12px;\">Tips<\u002Fdiv>\n        <p style=\"margin:0;font-size:.93rem;line-height:1.6;color:rgba(242,238,255,.78);\">Hold én hånd på veggen hele veien, så finner du alltid fram til slutt. Porten er låst til nøkkelen er funnet.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ spiller }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;inset:0;z-index:30;background:#07040f;\">\n  <canvas ref=\"{{ canvasRef }}\" sc-camel-on-pointer-down=\"{{ dragNed }}\" sc-camel-on-pointer-move=\"{{ dragBeveg }}\" sc-camel-on-pointer-up=\"{{ dragOpp }}\" sc-camel-on-pointer-cancel=\"{{ dragOpp }}\" style=\"position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;\"><\u002Fcanvas>\n\n  <div style=\"position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;pointer-events:none;background:linear-gradient(180deg,rgba(7,4,15,.55),transparent);\">\n    <button sc-camel-on-click=\"{{ tilMeny }}\" style=\"pointer-events:auto;display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.22);background:rgba(13,8,36,.62);color:#fff;backdrop-filter:blur(10px);border-radius:99px;padding:9px 15px;font-weight:700;font-size:.9rem;\">← Meny<\u002Fbutton>\n    <div style=\"flex:1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;\">\n      <span style=\"pointer-events:auto;display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.18);background:rgba(13,8,36,.62);backdrop-filter:blur(10px);border-radius:99px;padding:9px 15px;font-weight:700;font-size:.9rem;color:#fff;white-space:nowrap;\"><span style=\"{{ nivaPrikkStil }}\"><\u002Fspan>{{ spillNavn }}<\u002Fspan>\n      <span style=\"{{ tidStil }}\">{{ tidTekst }}<\u002Fspan>\n      <span style=\"{{ nokkelStil }}\">{{ nokkelTekst }}<\u002Fspan>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ vekselLyd }}\" title=\"Lyd av eller på\" style=\"pointer-events:auto;border:1px solid rgba(255,255,255,.22);background:rgba(13,8,36,.62);color:#fff;backdrop-filter:blur(10px);border-radius:99px;width:42px;height:42px;font-size:1.05rem;display:inline-flex;align-items:center;justify-content:center;\">{{ lydIkon }}<\u002Fbutton>\n  <\u002Fdiv>\n\n  <div style=\"{{ meldingStil }}\">{{ melding }}<\u002Fdiv>\n\n  <div style=\"position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:3;display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none;\">\n    <div style=\"{{ padStil }}\">\n      <div><\u002Fdiv>\n      <button sc-camel-on-pointer-down=\"{{ pad.fram.ned }}\" sc-camel-on-pointer-up=\"{{ pad.fram.opp }}\" sc-camel-on-pointer-cancel=\"{{ pad.fram.opp }}\" sc-camel-on-pointer-leave=\"{{ pad.fram.opp }}\" sc-camel-on-context-menu=\"{{ stopp }}\" style=\"{{ pad.fram.stil }}\">▲<\u002Fbutton>\n      <div><\u002Fdiv>\n      <button sc-camel-on-pointer-down=\"{{ pad.venstreSide.ned }}\" sc-camel-on-pointer-up=\"{{ pad.venstreSide.opp }}\" sc-camel-on-pointer-cancel=\"{{ pad.venstreSide.opp }}\" sc-camel-on-pointer-leave=\"{{ pad.venstreSide.opp }}\" sc-camel-on-context-menu=\"{{ stopp }}\" style=\"{{ pad.venstreSide.stil }}\">⇠<\u002Fbutton>\n      <button sc-camel-on-pointer-down=\"{{ pad.bak.ned }}\" sc-camel-on-pointer-up=\"{{ pad.bak.opp }}\" sc-camel-on-pointer-cancel=\"{{ pad.bak.opp }}\" sc-camel-on-pointer-leave=\"{{ pad.bak.opp }}\" sc-camel-on-context-menu=\"{{ stopp }}\" style=\"{{ pad.bak.stil }}\">▼<\u002Fbutton>\n      <button sc-camel-on-pointer-down=\"{{ pad.hoyreSide.ned }}\" sc-camel-on-pointer-up=\"{{ pad.hoyreSide.opp }}\" sc-camel-on-pointer-cancel=\"{{ pad.hoyreSide.opp }}\" sc-camel-on-pointer-leave=\"{{ pad.hoyreSide.opp }}\" sc-camel-on-context-menu=\"{{ stopp }}\" style=\"{{ pad.hoyreSide.stil }}\">⇢<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"{{ snuStil }}\">\n      <button sc-camel-on-pointer-down=\"{{ pad.snuV.ned }}\" sc-camel-on-pointer-up=\"{{ pad.snuV.opp }}\" sc-camel-on-pointer-cancel=\"{{ pad.snuV.opp }}\" sc-camel-on-pointer-leave=\"{{ pad.snuV.opp }}\" sc-camel-on-context-menu=\"{{ stopp }}\" style=\"{{ pad.snuV.stil }}\">↶<\u002Fbutton>\n      <button sc-camel-on-pointer-down=\"{{ pad.snuH.ned }}\" sc-camel-on-pointer-up=\"{{ pad.snuH.opp }}\" sc-camel-on-pointer-cancel=\"{{ pad.snuH.opp }}\" sc-camel-on-pointer-leave=\"{{ pad.snuH.opp }}\" sc-camel-on-context-menu=\"{{ stopp }}\" style=\"{{ pad.snuH.stil }}\">↷<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ laster }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0d0824;color:#fff;font-family:'Fredoka',sans-serif;font-size:1.25rem;\">\n      <div style=\"width:46px;height:46px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#fbbf24;animation:lab-spinn 1s linear infinite;\"><\u002Fdiv>\n      {{ lasterTekst }}\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ ferdig }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(9,5,26,.74);backdrop-filter:blur(10px);\">\n      <div style=\"width:100%;max-width:430px;padding:34px 30px 28px;border-radius:26px;background:linear-gradient(180deg,#ffffff,#f6f2ff);color:#241a52;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:lab-sprett .45s cubic-bezier(.2,1.4,.4,1);\">\n        <div style=\"font-size:3rem;line-height:1;\">🎉<\u002Fdiv>\n        <h2 style=\"font-family:'Fredoka',sans-serif;font-size:2rem;margin:12px 0 8px;\">Du fant veien ut!<\u002Fh2>\n        <p style=\"margin:0 0 4px;font-size:1.05rem;color:rgba(36,26,82,.75);\">{{ ferdigTekst }}<\u002Fp>\n        <div style=\"display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 16px;border-radius:99px;background:rgba(251,191,36,.18);color:#92610a;font-weight:700;font-size:.95rem;\">{{ ferdigRekord }}<\u002Fdiv>\n        <div style=\"display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px;\">\n          <sc-if value=\"{{ harNeste }}\" hint-placeholder-val=\"{{ true }}\">\n            <button sc-camel-on-click=\"{{ neste }}\" style=\"border:0;border-radius:99px;padding:13px 24px;font-weight:700;font-size:1rem;background:#4c1d95;color:#fff;box-shadow:0 4px 0 rgba(36,26,82,.3);\">Neste labyrint →<\u002Fbutton>\n          <\u002Fsc-if>\n          <button sc-camel-on-click=\"{{ tilMeny }}\" style=\"border:0;border-radius:99px;padding:13px 24px;font-weight:700;font-size:1rem;background:#ede9fe;color:#241a52;box-shadow:0 4px 0 rgba(36,26,82,.15);\">Til menyen<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nconst VERDENER = [\n  { id:0, navn:'Hagen',   under:'Lett',      rutenett:'7 × 7',   farge:'#34d399' },\n  { id:1, navn:'Slottet', under:'Middels',   rutenett:'11 × 11', farge:'#fb923c' },\n  { id:2, navn:'Natten',  under:'Vanskelig', rutenett:'15 × 15', farge:'#a855f7' },\n];\nconst ANTALL = 10;\nconst LS = 'labyrint-framgang';\n\nfunction fmtTid(s){ s = Math.round(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }\n\nconst PILLE = 'pointer-events:auto;display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:9px 15px;font-weight:700;font-size:.9rem;white-space:nowrap;backdrop-filter:blur(10px);';\n\nclass Component extends DCLogic {\n  state = {\n    valgt: 0, framgang: {}, lyd: true,\n    spiller: false, laster: false, niva: 0, idx: 0,\n    harNokkel: false, ferdig: false, ferdigTid: 0, ferdigRekord: '',\n    tid: 0, melding: '', trykt: {},\n  };\n\n  componentDidMount(){\n    this.canvasRef = React.createRef();\n    let framgang = {}, lyd = true, valgt = 0;\n    try { framgang = JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){}\n    try { lyd = localStorage.getItem('labyrint-lyd') !== '0'; } catch(e){}\n    try { const v = parseInt(localStorage.getItem('labyrint-niva'),10); if(v>=0&&v<3) valgt = v; } catch(e){}\n    this.setState({ framgang, lyd, valgt });\n    import((window.__resources && window.__resources.motor) || './labyrint-motor.js').then(m => { this.M = m; m.settLyd(lyd); });\n    this.onKey = e => {\n      if(!this.motor || this.state.ferdig) return;\n      const kart = { ArrowUp:'fram', KeyW:'fram', ArrowDown:'bak', KeyS:'bak', ArrowLeft:'snuV', KeyA:'snuV', ArrowRight:'snuH', KeyD:'snuH', KeyQ:'venstreSide', KeyE:'hoyreSide' };\n      const k = kart[e.code]; if(!k) return;\n      e.preventDefault();\n      this.motor.settTast(k, e.type === 'keydown' ? 1 : 0);\n    };\n    window.addEventListener('keydown', this.onKey);\n    window.addEventListener('keyup', this.onKey);\n    this.onBlur = () => { if(this.motor) this.motor.nullstillTaster(); };\n    window.addEventListener('blur', this.onBlur);\n    this.onResize = () => { if(this.motor) this.motor.tilpass(); };\n    window.addEventListener('resize', this.onResize);\n  }\n  componentWillUnmount(){\n    window.removeEventListener('keydown', this.onKey);\n    window.removeEventListener('keyup', this.onKey);\n    window.removeEventListener('blur', this.onBlur);\n    window.removeEventListener('resize', this.onResize);\n    clearInterval(this.ur); clearTimeout(this.meldTimer);\n    if(this.motor) this.motor.stopp();\n  }\n  componentDidUpdate(){\n    if(this.state.spiller && !this.motor && this.canvasRef.current && this.M && window.THREE){\n      this.startMotor();\n    }\n  }\n\n  ventPaaThree(n){\n    if(window.THREE && this.M){ this.startMotor(); return; }\n    if(n > 100){ this.setState({ lasterTekst:'Fant ikke 3D-motoren.' }); return; }\n    setTimeout(()=>this.ventPaaThree(n+1), 100);\n  }\n\n  startMotor(){\n    const c = this.canvasRef.current;\n    if(!c || !this.M || !window.THREE) return;\n    if(this.motor) this.motor.stopp();\n    this.motor = new this.M.Motor(c);\n    this.M.settLyd(this.state.lyd);\n    this.motor.start(this.state.niva, this.state.idx, {\n      onNokkel: () => {\n        this.setState({ harNokkel:true });\n        this.visMelding('Du fant nøkkelen — porten er åpen!', 3200);\n      },\n      onVinn: tid => this.vinn(tid),\n    });\n    clearInterval(this.ur);\n    this.ur = setInterval(()=>{ if(this.motor && !this.state.ferdig) this.setState({ tid:this.motor.tid() }); }, 120);\n    setTimeout(()=>{\n      this.setState({ laster:false });\n      this.visMelding('Finn nøkkelen — så åpner porten seg', 3000);\n    }, 260);\n  }\n\n  visMelding(t, ms){\n    clearTimeout(this.meldTimer);\n    this.setState({ melding:t });\n    this.meldTimer = setTimeout(()=>this.setState({ melding:'' }), ms||2600);\n  }\n\n  start(niva, idx){\n    if(this.M) this.M.lydKlikk();\n    if(this.motor){ this.motor.stopp(); this.motor = null; }\n    this.setState({ spiller:true, laster:true, niva, idx, harNokkel:false, ferdig:false, tid:0, melding:'', trykt:{} },\n      ()=>{ if(window.THREE && this.M) this.startMotor(); else this.ventPaaThree(0); });\n  }\n  vinn(tid){\n    const n = this.state.niva+'-'+this.state.idx;\n    const framgang = Object.assign({}, this.state.framgang);\n    const gammel = framgang[n];\n    const rekord = !gammel || tid < gammel.tid;\n    if(rekord) framgang[n] = { tid: Math.round(tid*10)/10 };\n    try { localStorage.setItem(LS, JSON.stringify(framgang)); } catch(e){}\n    this.setState({\n      ferdig:true, framgang, tid,\n      ferdigRekord: rekord ? (gammel ? '⭐ Ny rekord!' : '⭐ Første gang løst!') : 'Beste tid: '+fmtTid(gammel.tid),\n    });\n  }\n  tilMeny(){\n    if(this.M) this.M.lydKlikk();\n    clearInterval(this.ur);\n    if(this.motor){ this.motor.stopp(); this.motor = null; }\n    this.setState({ spiller:false, ferdig:false, laster:false, melding:'' });\n  }\n  neste(){\n    const { niva, idx } = this.state;\n    if(idx < ANTALL-1) this.start(niva, idx+1);\n    else if(niva < 2) this.start(niva+1, 0);\n    else this.tilMeny();\n  }\n\n  lostAntall(niva){\n    let k = 0;\n    for(let i=0;i<ANTALL;i++) if(this.state.framgang[niva+'-'+i]) k++;\n    return k;\n  }\n\n  padKnapp(k, stor){\n    const trykt = !!this.state.trykt[k];\n    const s = stor ? 74 : 66;\n    return {\n      ned: e => { e.preventDefault(); if(this.motor) this.motor.settTast(k,1);\n        this.setState(p=>({ trykt: Object.assign({}, p.trykt, {[k]:1}) })); },\n      opp: () => { if(this.motor) this.motor.settTast(k,0);\n        this.setState(p=>({ trykt: Object.assign({}, p.trykt, {[k]:0}) })); },\n      stil: 'pointer-events:auto;width:'+s+'px;height:'+s+'px;border-radius:18px;font-size:1.5rem;display:flex;align-items:center;justify-content:center;'\n        + 'backdrop-filter:blur(8px);-webkit-tap-highlight-color:transparent;touch-action:none;transition:background .1s,transform .1s;'\n        + (trykt\n            ? 'background:rgba(251,191,36,.9);border:1px solid #fff;color:#241a52;transform:scale(.95);'\n            : 'background:rgba(13,8,36,.55);border:1px solid rgba(255,255,255,.28);color:#fff;'),\n    };\n  }\n\n  renderVals(){\n    const st = this.state;\n    const total = VERDENER.reduce((s,v)=>s+this.lostAntall(v.id), 0);\n    const aktiv = VERDENER[st.valgt];\n\n    const verdener = VERDENER.map(v => {\n      const lost = this.lostAntall(v.id);\n      const paa = v.id === st.valgt;\n      return {\n        navn: v.navn, under: v.under, rutenett: v.rutenett,\n        lostTekst: lost + ' / ' + ANTALL,\n        velg: () => { if(this.M) this.M.lydKlikk();\n          try{ localStorage.setItem('labyrint-niva', String(v.id)); }catch(e){}\n          this.setState({ valgt: v.id }); },\n        stil: 'text-align:left;display:flex;flex-direction:column;gap:12px;padding:18px 20px 16px;border-radius:20px;transition:transform .14s,background .14s;'\n          + (paa\n              ? 'background:rgba(255,255,255,.13);border:1px solid '+v.farge+';box-shadow:0 0 0 3px '+v.farge+'22, 0 14px 34px rgba(0,0,0,.3);color:#fff;'\n              : 'background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.11);color:rgba(242,238,255,.85);'),\n        prikkStil: 'width:11px;height:11px;border-radius:50%;background:'+v.farge+';box-shadow:0 0 12px '+v.farge+';',\n        merkeStil: 'font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:99px;'\n          + 'background:'+v.farge+'22;color:'+v.farge+';border:1px solid '+v.farge+'44;',\n        dempetStil: 'color:rgba(242,238,255,.5);',\n        tellerStil: 'font-weight:700;font-variant-numeric:tabular-nums;color:'+(lost?v.farge:'rgba(242,238,255,.5)')+';',\n        sporStil: 'height:5px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;',\n        barStil: 'height:100%;width:'+(lost/ANTALL*100)+'%;border-radius:99px;background:'+v.farge+';transition:width .3s;',\n      };\n    });\n\n    const ruter = [];\n    for(let i=0;i<ANTALL;i++){\n      const f = st.framgang[st.valgt+'-'+i];\n      ruter.push({\n        nr: i+1,\n        info: f ? 'Beste ' + fmtTid(f.tid) : 'Ikke løst',\n        start: () => this.start(st.valgt, i),\n        stil: 'text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:14px;min-height:104px;padding:15px 16px 13px;border-radius:18px;transition:transform .12s,box-shadow .12s;'\n          + (f\n              ? 'background:linear-gradient(165deg,#ffffff,#f2fbf7);border:1px solid '+aktiv.farge+';color:#241a52;box-shadow:0 6px 0 rgba(0,0,0,.22);'\n              : 'background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.6);color:#241a52;box-shadow:0 6px 0 rgba(0,0,0,.22);'),\n        hakeStil: f\n          ? 'width:26px;height:26px;border-radius:50%;background:'+aktiv.farge+';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;'\n          : 'display:none;',\n        infoStil: 'font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums;color:'+(f?'#0f766e':'rgba(36,26,82,.45)'),\n      });\n    }\n\n    const niva = VERDENER[st.niva];\n    const pad = {};\n    ['fram','bak','venstreSide','hoyreSide'].forEach(k => pad[k] = this.padKnapp(k,false));\n    ['snuV','snuH'].forEach(k => pad[k] = this.padKnapp(k,true));\n\n    return {\n      iMeny: !st.spiller,\n      spiller: st.spiller,\n      laster: st.laster,\n      lasterTekst: st.lasterTekst || 'Bygger labyrinten …',\n      canvasRef: this.canvasRef,\n      totaltLost: total,\n      totalBarStil: 'height:100%;width:'+(total/30*100)+'%;border-radius:99px;background:linear-gradient(90deg,#2dd4bf,#fbbf24);transition:width .4s;',\n      verdener, ruter,\n      valgtNavn: aktiv.navn, valgtUnder: aktiv.under + ' · ' + aktiv.rutenett,\n\n      spillNavn: niva.navn + ' ' + (st.idx+1),\n      nivaPrikkStil: 'width:9px;height:9px;border-radius:50%;background:'+niva.farge+';box-shadow:0 0 10px '+niva.farge+';',\n      tidTekst: fmtTid(st.tid),\n      tidStil: PILLE + 'border:1px solid rgba(255,255,255,.18);background:rgba(13,8,36,.62);color:#fff;font-variant-numeric:tabular-nums;min-width:5ch;justify-content:center;',\n      nokkelTekst: st.harNokkel ? '🔑 Nøkkel funnet' : '🔑 Ikke funnet',\n      nokkelStil: PILLE + (st.harNokkel\n        ? 'background:rgba(251,191,36,.92);border:1px solid #fff;color:#241a52;'\n        : 'background:rgba(13,8,36,.62);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.72);'),\n      lydIkon: st.lyd ? '🔊' : '🔇',\n      vekselLyd: () => {\n        const lyd = !st.lyd;\n        try{ localStorage.setItem('labyrint-lyd', lyd?'1':'0'); }catch(e){}\n        if(this.M){ this.M.settLyd(lyd); if(lyd) this.M.lydKlikk(); }\n        this.setState({ lyd });\n      },\n      melding: st.melding,\n      meldingStil: 'position:absolute;left:50%;top:20%;transform:translateX(-50%);z-index:4;max-width:90vw;text-align:center;pointer-events:none;'\n        + 'padding:14px 24px;border-radius:20px;border:1px solid rgba(255,255,255,.28);background:rgba(13,8,36,.78);backdrop-filter:blur(10px);'\n        + \"font-family:'Fredoka',sans-serif;font-weight:600;font-size:1.2rem;color:#fff;transition:opacity .35s;opacity:\" + (st.melding ? '1' : '0') + ';',\n      padStil: 'display:grid;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(2,66px);gap:7px;pointer-events:none;',\n      snuStil: 'display:grid;grid-template-columns:repeat(2,74px);gap:9px;pointer-events:none;',\n      pad,\n      stopp: e => e.preventDefault(),\n      dragNed: e => { this.drar = { id:e.pointerId, x:e.clientX };\n        try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){} },\n      dragBeveg: e => { if(!this.drar || e.pointerId!==this.drar.id) return;\n        if(this.motor) this.motor.dra(e.clientX - this.drar.x);\n        this.drar.x = e.clientX; },\n      dragOpp: e => { if(this.drar && e.pointerId===this.drar.id) this.drar = null; },\n      tilMeny: () => this.tilMeny(),\n      neste: () => this.neste(),\n      ferdig: st.ferdig,\n      harNeste: st.idx < ANTALL-1 || st.niva < 2,\n      ferdigTekst: niva.navn + ' ' + (st.idx+1) + ' på ' + fmtTid(st.tid) + '.',\n      ferdigRekord: st.ferdigRekord,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
