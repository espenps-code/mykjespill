<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Straffespark – Mykje Spill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --natt:#060b20; --panel:#101a3e; --panel2:#17245a; --kant:rgba(255,255,255,.12);
  --lys:#f1f5f9; --dempet:#a5b4cf;
  --lime:#a3e635; --limeL:#d9f99d; --limeM:#3f6212;
  --gull:#fbbf24; --gullL:#fde68a; --gullM:#92400e;
  --bla:#3b82f6; --blaL:#93c5fd; --blaM:#1e3a8a;
  --rod:#f43f5e; --lilla:#a855f7;
  --mork:#0f172a; --gronn:#84cc16;
  --tekst:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --tittel:'Lilita One','Arial Black','Trebuchet MS',sans-serif;
  --sprett:cubic-bezier(.2,1.5,.4,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--natt);font-family:var(--tekst);color:var(--lys);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas#bane{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
canvas#konfetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:3px}
h1,h2,h3{font-family:var(--tittel);font-weight:400;margin:0;letter-spacing:.5px}
svg.i{width:1em;height:1em;vertical-align:-.12em;flex:none}

/* ---------- skjermer ---------- */
.skjerm{position:fixed;inset:0;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:10;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
  background:radial-gradient(120% 90% at 50% 0%,rgba(30,58,138,.55),rgba(4,8,24,.88) 70%);
  -webkit-backdrop-filter:blur(6px) saturate(1.2);backdrop-filter:blur(6px) saturate(1.2)}
.skjerm.vis{display:flex;animation:tone .3s ease-out}
@keyframes tone{from{opacity:0}to{opacity:1}}
.kort{position:relative;width:100%;max-width:1040px;margin:auto 0;padding:24px;border-radius:30px;
  background:linear-gradient(170deg,var(--panel2) 0%,var(--panel) 45%,#0b1330 100%);
  border:2px solid var(--kant);
  box-shadow:0 0 0 6px rgba(255,255,255,.03),0 30px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.kort::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 14px)}
.skjerm.vis .kort{animation:kortInn .5s var(--sprett) both}
@keyframes kortInn{from{transform:translateY(40px) scale(.94);opacity:0}to{transform:none;opacity:1}}
.inn{animation:dukkOpp .45s var(--sprett) both;animation-delay:calc(var(--i,0)*55ms + 120ms)}
@keyframes dukkOpp{from{transform:translateY(18px) scale(.9);opacity:0}to{transform:none;opacity:1}}

/* poeng-pille */
.poeng{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:5px 16px 5px 6px;white-space:nowrap;
  font-family:var(--tittel);font-size:22px;color:#fff;background:linear-gradient(180deg,#3b2a05,#1f1603);
  border:2px solid var(--gull);box-shadow:0 0 18px rgba(251,191,36,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.poeng .mynt{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#7c2d12;font-size:18px;
  background:radial-gradient(circle at 35% 30%,#fff7c2,#fbbf24 55%,#b45309);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.poeng.dunk{animation:dunk .5s var(--sprett)}
@keyframes dunk{0%{transform:scale(1)}35%{transform:scale(1.22)}100%{transform:scale(1)}}

.ikon{width:50px;height:50px;border-radius:16px;font-size:24px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,#2a3a73,#18234d);border:2px solid var(--kant);box-shadow:0 4px 0 #0a1130;transition:transform .1s}
.ikon:hover{transform:translateY(-2px)}
.ikon:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1130}

/* ---------- knapper ---------- */
.knapp{position:relative;overflow:hidden;isolation:isolate;font-family:var(--tittel);font-size:22px;letter-spacing:.5px;
  border-radius:18px;padding:14px 20px;min-height:58px;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:linear-gradient(180deg,#60a5fa,#2563eb);text-shadow:0 2px 0 rgba(0,0,0,.25);
  box-shadow:0 6px 0 var(--blaM),0 12px 24px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4);
  transition:transform .1s,box-shadow .1s,filter .15s}
.knapp::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;z-index:-1;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);transition:left .5s}
.knapp:hover{filter:brightness(1.08);transform:translateY(-2px)}
.knapp:hover::after{left:130%}
.knapp:active{transform:translateY(5px);box-shadow:0 1px 0 var(--blaM),0 4px 10px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.3)}
.knapp.gronn{background:linear-gradient(180deg,#d9f99d,#84cc16 55%,#65a30d);color:#1a2e05;text-shadow:0 1px 0 rgba(255,255,255,.4);
  box-shadow:0 6px 0 var(--limeM),0 12px 24px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.6)}
.knapp.gronn:active{box-shadow:0 1px 0 var(--limeM)}
.knapp.gul{background:linear-gradient(180deg,#fde68a,#fbbf24 55%,#f59e0b);color:#451a03;text-shadow:0 1px 0 rgba(255,255,255,.4);
  box-shadow:0 6px 0 var(--gullM),0 12px 24px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.6)}
.knapp.gul:active{box-shadow:0 1px 0 var(--gullM)}
.knapp.gra{background:linear-gradient(180deg,#334372,#1e2a52);color:#fff;border:2px solid var(--kant);
  box-shadow:0 6px 0 #0a1130,0 12px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.15)}
.knapp.gra:active{box-shadow:0 1px 0 #0a1130}
.knapp.rod{background:linear-gradient(180deg,#fb7185,#e11d48);box-shadow:0 6px 0 #881337,0 12px 24px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4)}
.knapp:disabled{filter:grayscale(.6) brightness(.75);pointer-events:none}
.knapp.glans::after{animation:glans 2.8s ease-in-out infinite}
@keyframes glans{0%,55%{left:-60%}85%,100%{left:130%}}

/* ---------- meny ---------- */
.topprad{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px;position:relative;z-index:1}
.merke{font-family:var(--tittel);font-size:15px;letter-spacing:2px;color:var(--dempet);text-transform:uppercase}
.meny{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:26px;align-items:center;position:relative;z-index:1}
.meny .forhand{display:flex;flex-direction:column;align-items:center;gap:0}
.tittel1{font-size:clamp(50px,7.5vw,86px);line-height:.82;color:#fff;text-align:center;transform:rotate(-4deg);margin:6px 0 4px;
  -webkit-text-stroke:2px #0b1a4a;filter:drop-shadow(0 6px 0 #0b1a4a) drop-shadow(0 0 26px rgba(163,230,53,.35));
  animation:svev 3.5s ease-in-out infinite}
.tittel1 span{display:block;font-size:1.12em;background:linear-gradient(180deg,#fef08a 10%,#a3e635 60%,#4d7c0f);
  -webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes svev{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-6px)}}
.scene{position:relative;width:100%;display:grid;place-items:center;margin-top:-6px}
.scene::before{content:"";position:absolute;left:50%;top:-10%;width:90%;height:110%;transform:translateX(-50%);pointer-events:none;
  background:conic-gradient(from 160deg at 50% 0%,transparent 0deg,rgba(255,255,220,.16) 18deg,rgba(255,255,220,.05) 30deg,transparent 40deg);
  filter:blur(4px)}
.scene::after{content:"";position:absolute;bottom:4%;left:50%;width:78%;height:18%;transform:translateX(-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(163,230,53,.55),rgba(34,197,94,.18) 45%,transparent 70%)}
#menySpiller{position:relative;z-index:1;width:260px;height:300px;max-width:100%}
.steg{display:flex;align-items:center;gap:10px;font-size:22px;margin:4px 0 12px;color:#fff}
.steg i{font-style:normal;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:18px;
  background:var(--lime);color:#1a2e05;transform:rotate(-6deg);box-shadow:0 3px 0 var(--limeM)}
.keepere{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keeperkort{--k:#4ade80;position:relative;border-radius:20px;padding:0 0 12px;text-align:center;overflow:hidden;
  background:linear-gradient(180deg,#1d2b5e,#121b40);border:3px solid rgba(255,255,255,.1);
  box-shadow:0 6px 0 #0a1130;transition:transform .18s var(--sprett),border-color .2s,box-shadow .2s}
.keeperkort:hover{transform:translateY(-4px)}
.keeperkort .kk-topp{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;
  background:color-mix(in srgb,var(--k) 22%,transparent);font-family:var(--tittel);font-size:15px;color:var(--k);letter-spacing:.5px}
.keeperkort .kk-x{background:var(--k);color:#0b1330;border-radius:8px;padding:1px 7px}
.keeperkort canvas{width:96px;height:96px;display:block;margin:4px auto 0;
  background:radial-gradient(circle at 50% 60%,color-mix(in srgb,var(--k) 35%,transparent),transparent 65%)}
.keeperkort b{display:block;font-family:var(--tittel);font-weight:400;font-size:20px;color:#fff;margin-top:2px}
.keeperkort .kk-stjerner{display:block;font-size:17px;letter-spacing:3px;color:var(--gull)}
.keeperkort .kk-stjerner em{font-style:normal;color:rgba(255,255,255,.2)}
.keeperkort.valgt{border-color:var(--k);transform:translateY(-6px);
  box-shadow:0 6px 0 #0a1130,0 0 0 4px color-mix(in srgb,var(--k) 25%,transparent),0 0 34px color-mix(in srgb,var(--k) 55%,transparent)}
.keeperkort.valgt::after{content:"VALGT";position:absolute;top:40px;right:6px;transform:rotate(8deg);
  font-family:var(--tittel);font-size:13px;letter-spacing:1px;background:var(--k);color:#0b1330;padding:2px 9px;border-radius:7px;
  box-shadow:0 3px 10px rgba(0,0,0,.4);animation:dunk .4s var(--sprett)}
.spillknapp{width:100%;margin-top:20px;font-size:clamp(24px,3.4vw,32px);min-height:76px;border-radius:22px}
.spillknapp .ball{display:inline-grid;place-items:center;animation:rull 2.4s linear infinite}
@keyframes rull{to{transform:rotate(360deg)}}
.fliser{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.flis{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:19px;min-height:92px;padding:10px 8px}
.flis .stor{font-size:32px;line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.statrad{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px}
.statchip{display:flex;align-items:baseline;gap:6px;padding:6px 14px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1px solid var(--kant);font-size:15px;color:var(--dempet)}
.statchip b{font-family:var(--tittel);font-weight:400;font-size:22px;color:#fff}
.stat{margin-top:16px;color:var(--dempet);font-size:16px;text-align:center}

/* ---------- butikk ---------- */
.hode{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;position:relative;z-index:1}
.hode h2{font-size:clamp(30px,4.5vw,42px);flex:1;color:#fff;text-shadow:0 4px 0 #0b1a4a}
.faner{display:inline-flex;gap:6px;margin-bottom:18px;padding:6px;border-radius:18px;background:rgba(0,0,0,.3);border:1px solid var(--kant);position:relative;z-index:1}
.faner button{font-family:var(--tittel);font-size:20px;padding:10px 20px;border-radius:13px;background:transparent;color:var(--dempet);transition:background .2s,color .2s}
.faner button.aktiv{background:linear-gradient(180deg,#fde68a,#fbbf24);color:#451a03;box-shadow:0 4px 0 var(--gullM)}
.vareliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:16px;position:relative;z-index:1}
.vare{--r:#94a3b8;position:relative;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--r) 18%,#16214a),#111a3d 60%);
  border:3px solid color-mix(in srgb,var(--r) 55%,transparent);box-shadow:0 6px 0 #0a1130;transition:transform .18s var(--sprett)}
.vare:hover{transform:translateY(-4px) rotate(-.5deg)}
.vare.r-legend{box-shadow:0 6px 0 #0a1130,0 0 28px color-mix(in srgb,var(--r) 45%,transparent)}
.vare.r-legend::before{content:"";position:absolute;inset:-50%;pointer-events:none;
  background:conic-gradient(from 0deg,transparent 0 80%,rgba(255,230,150,.22) 88%,transparent 96%);animation:snurr 6s linear infinite}
@keyframes snurr{to{transform:rotate(360deg)}}
.vare > *{position:relative}
.vare .sjelden{align-self:flex-start;font-family:var(--tittel);font-size:13px;letter-spacing:1px;text-transform:uppercase;
  padding:2px 9px;border-radius:7px;background:var(--r);color:#0b1330}
.vare .eid{position:absolute;top:12px;right:12px;font-size:13px;font-weight:700;color:var(--limeL);background:rgba(0,0,0,.35);padding:2px 8px;border-radius:7px}
.vare canvas{width:100%;height:110px;display:block;border-radius:14px;
  background:radial-gradient(ellipse at 50% 70%,color-mix(in srgb,var(--r) 30%,transparent),transparent 70%)}
.vare h3{font-size:22px;color:#fff}
.vare p{margin:0;font-size:15px;color:var(--dempet);min-height:38px}
.stolper{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:14px;align-items:center;color:#cbd5e1}
.stolpe{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.stolpe i{height:9px;border-radius:3px;background:rgba(255,255,255,.12)}
.stolpe i.p{background:linear-gradient(90deg,var(--lime),#facc15);box-shadow:0 0 6px rgba(163,230,53,.5)}
.vare .knapp{font-size:18px;padding:10px;min-height:50px;margin-top:auto}
.vare.valgt{border-color:var(--lime)}
.vare.valgt .knapp{background:rgba(163,230,53,.15);color:var(--limeL);box-shadow:inset 0 0 0 2px var(--lime);filter:none;text-shadow:none}

/* ---------- drakt ---------- */
.drakt{display:grid;grid-template-columns:minmax(220px,330px) 1fr;gap:24px;position:relative;z-index:1}
.drakt .forhand{display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:0;align-self:start}
#draktSpiller{width:300px;height:380px;max-width:100%;border-radius:24px;border:2px solid var(--kant);
  background:radial-gradient(ellipse 60% 14% at 50% 94%,rgba(163,230,53,.55),transparent 80%),
             conic-gradient(from 165deg at 50% -5%,transparent,rgba(255,255,220,.14) 15deg,transparent 30deg),
             linear-gradient(180deg,#1b2a63,#0c1435)}
.valg{background:rgba(0,0,0,.18);border:1px solid var(--kant);border-radius:22px;padding:16px}
.valg h3{font-size:19px;margin:16px 0 8px;color:var(--limeL)}
.valg h3:first-child{margin-top:0}
.rutenett{display:flex;flex-wrap:wrap;gap:9px}
.farge{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.9);box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .15s var(--sprett)}
.farge:hover{transform:scale(1.1)}
.farge.valgt{transform:scale(1.12);box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--lime),0 0 16px var(--lime)}
.monsterknapp{background:linear-gradient(180deg,#22316a,#18234d);border-radius:16px;padding:5px 5px 7px;border:3px solid transparent;font-size:13px;color:#cbd5e1;box-shadow:0 4px 0 #0a1130}
.monsterknapp canvas{width:58px;height:58px;display:block}
.monsterknapp.valgt{border-color:var(--lime);color:#fff;box-shadow:0 4px 0 #0a1130,0 0 14px rgba(163,230,53,.45)}
.tekstknapp{background:linear-gradient(180deg,#22316a,#18234d);border-radius:12px;padding:10px 16px;font-size:16px;border:3px solid transparent;color:#e2e8f0;box-shadow:0 4px 0 #0a1130}
.tekstknapp.valgt{border-color:var(--lime);font-weight:700;color:#fff}
.nummer{display:flex;align-items:center;gap:12px}
.nummer b{font-family:var(--tittel);font-weight:400;font-size:40px;min-width:64px;text-align:center;color:#fff;text-shadow:0 3px 0 #0b1a4a}
.nummer button{width:50px;height:50px;border-radius:14px;font-size:28px;font-weight:700;color:#fff;background:linear-gradient(180deg,#2a3a73,#18234d);border:2px solid var(--kant);box-shadow:0 4px 0 #0a1130}
.nummer button:active{transform:translateY(3px);box-shadow:0 1px 0 #0a1130}
#navnFelt{font-family:var(--tittel);font-size:24px;padding:10px 14px;border:3px solid rgba(255,255,255,.18);border-radius:14px;width:100%;max-width:280px;
  text-transform:uppercase;-webkit-user-select:text;user-select:text;background:#0b1330;color:#fff}
#navnFelt::placeholder{color:#64748b}
#navnFelt:focus{border-color:var(--lime);outline:none;box-shadow:0 0 0 4px rgba(163,230,53,.25)}
.liten{font-size:14px;color:var(--dempet);margin:8px 0 0}

/* ---------- HUD ---------- */
#hud{position:fixed;left:0;right:0;top:0;display:none;align-items:flex-start;justify-content:space-between;gap:10px;z-index:5;
  padding:max(10px,env(safe-area-inset-top)) 12px 0;pointer-events:none}
#hud.vis{display:flex;animation:hudInn .4s var(--sprett)}
@keyframes hudInn{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
#hud > *{pointer-events:auto}
#tavle{display:grid;grid-template-columns:auto auto auto;align-items:stretch;border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,rgba(17,26,62,.95),rgba(8,13,36,.95));border:2px solid rgba(255,255,255,.18);
  box-shadow:0 8px 24px rgba(0,0,0,.45);font-family:var(--tittel)}
#tavle .lag{display:grid;place-items:center;padding:4px 12px;font-size:16px;letter-spacing:1px;color:#0b1330}
#tavle .lag.du{background:var(--lime)}
#tavle .lag.dem{background:#cbd5e1}
#tavle .prikker{padding:6px 12px;align-items:center}
#tavle .tall{display:grid;place-items:center;min-width:44px;font-size:26px;color:#fff;background:rgba(0,0,0,.35)}
#tavle > :nth-child(-n+3){border-bottom:1px solid rgba(255,255,255,.1)}
.prikker{display:flex;gap:6px}
.prikk{width:17px;height:17px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.3)}
.prikk.mal{background:var(--lime);border-color:var(--limeL);box-shadow:0 0 8px var(--lime);animation:dunk .4s var(--sprett)}
.prikk.bom{background:var(--rod);border-color:#fecdd3;animation:dunk .4s var(--sprett)}
#treningsskilt{border-radius:14px;padding:10px 16px;font-family:var(--tittel);font-size:20px;color:#fff;
  background:linear-gradient(180deg,rgba(17,26,62,.95),rgba(8,13,36,.95));border:2px solid rgba(255,255,255,.18);box-shadow:0 8px 24px rgba(0,0,0,.45)}
#hudHoyre{display:flex;gap:8px;align-items:center}

#banner{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;display:none;width:92%;z-index:6}
#banner.vis{display:block;animation:pop .5s var(--sprett)}
#banner .straaler{position:absolute;left:50%;top:40%;width:150vmin;height:150vmin;margin:-75vmin 0 0 -75vmin;z-index:-1;display:none;
  background:repeating-conic-gradient(rgba(253,224,71,.28) 0 8deg,transparent 8deg 22deg);
  -webkit-mask:radial-gradient(circle,#000 8%,transparent 55%);mask:radial-gradient(circle,#000 8%,transparent 55%);
  animation:snurr 9s linear infinite}
#banner.mal .straaler{display:block}
#banner .stor{font-family:var(--tittel);font-size:clamp(50px,11vw,120px);color:#fff;-webkit-text-stroke:5px #0b1330;paint-order:stroke fill;padding-top:.12em;
  text-shadow:0 7px 0 #0b1330,0 0 40px rgba(0,0,0,.45);line-height:1;transform:rotate(-4deg)}
#banner.mal .stor{color:#fde047;text-shadow:0 7px 0 #0b1330,0 0 50px rgba(253,224,71,.7);animation:puls .9s ease-in-out infinite}

/* ---------- hjelpere ---------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => v<a?a:v>b?b:v;

const MAL = {b:3.66, h:2.44, z:11};

function nyKeeper(){ return {hx:0, hy:0.95, th:0, tx:0, ty:1, start:99, dykk:false, korr:0, korrT:99, korrGjort:false, vk:5}; }

function ballPos(sh, s){
  return {
    x: sh.xt*s + 4*sh.B*s*(1-s),
    y: BR + (sh.h-BR)*s + 4*sh.loft*s*(1-s),
    z: MAL.z*s
  };
}
function ballFart(sh, s){
  return {
    x: (sh.xt + 4*sh.B*(1-2*s))/sh.T,
    y: ((sh.h-BR) + 4*sh.loft*(1-2*s))/sh.T,
    z: MAL.z/sh.T

}

// inp: {xt, p, B} fra fingeren. sko gir kraft/skru/presisjon.
function lagSkudd(inp, sko){

  const xt = inp.xt + rnorm()*sig;
  const h = Math.max(BR, hoydeFraKraft(p) + rnorm()*sig*0.6);
  const v = 15 + Math.min(p,1.1)*9 + sko.kraft*1.3;
  return { xt, h, B:inp.B, loft:0.15+0.35*p, T:MAL.z/v, p, t:0, s:0, fri:false, sjekket:false, ferdig:false,
           b:{x:0,y:BR,z:0}, vel:null, rot:0, spinn:(10+20*p)*(inp.B>=0?1:-1), cb:null, res:null, k:null };
}
function hoydeFraKraft(p){ return 0.12 + p*2.65; }

function planleggKeeper(k, sh, kp){
  let tx, ty;
  if (Math.random() < kp.guess) {
    tx = [-2.9, 0, 2.9][Math.floor(Math.random()*3)];
    ty = 0.4 + Math.random()*1.5;
  } else {
    tx = sh.xt + 2.2*sh.B + rnorm()*kp.sigma;   // skru lurer keeperen
    ty = sh.h + rnorm()*0.5;
  }
  k.tx = clamp(tx,-4.2,4.2); k.ty = clamp(ty,0.1,2.5);
  k.start = kp.delay; k.korr = kp.korr; k.korrT = kp.delay + 0.14; k.korrGjort = false; k.vk = kp.vk; k.dykk = false;
}

function oppdaterKeeper(k, dt, t){
  if (t < k.start) return;
  k.dykk = true;
  let thD, hyD, hxD;
  if (Math.abs(k.tx) < 0.55) {
    thD = 0; hyD = clamp(k.ty-1.25, 0.95, 1.45); hxD = k.tx;
  } else {
    const side = Math.sign(k.tx);
    const a = lerp(1.35, 0.45, clamp((k.ty-0.2)/2.1, 0, 1));
    thD = side*a;
    hyD = Math.max(0.32, 0.95 - 0.55*Math.sin(a));
    const handY = hyD + 1.25*Math.cos(a);
    if (handY < k.ty) hyD += Math.min(0.55, k.ty-handY);
    hxD = k.tx - side*1.25*Math.sin(a);
  }
  hxD = clamp(hxD, -2.5, 2.5);
  k.hx = mot(k.hx, hxD, k.vk*dt);
  k.th = mot(k.th, thD, 5.5*dt);
  k.hy = mot(k.hy, hyD, 4*dt);
}

function keeperTreff(k, bx, by){
  const ux = Math.sin(k.th), uy = Math.cos(k.th);
  const fx = k.hx-0.95*ux, fy = k.hy-0.95*uy, hx = k.hx+1.25*ux, hy = k.hy+1.25*uy;
  if (segDist(bx,by,fx,fy,hx,hy) < 0.3+BR) return true;
  if (!k.dykk) {
    const sy = k.hy+0.85;
    if (segDist(bx,by,k.hx-0.75,sy,k.hx+0.75,sy) < 0.14+BR) return true;
  }
  return false;
}

function oppdaterSkudd(sh, dt){
  sh.t += dt;
  sh.rot += sh.spinn*dt;
  const k = sh.k;
  if (!sh.fri) {
    if (k.korr > 0 && !k.korrGjort && sh.t >= k.korrT) {
      k.korrGjort = true;
      const s = clamp(sh.t/sh.T,0,1), b = ballPos(sh,s), v = ballFart(sh,s);
      const ex = b.x + v.x*sh.T*(1-s), ey = b.y + v.y*sh.T*(1-s);
      k.tx = lerp(k.tx, ex, k.korr); k.ty = lerp(k.ty, ey, k.korr);
    }
    oppdaterKeeper(k, dt, sh.t);
    const s = sh.t/sh.T, sk = KZ/MAL.z;
    if (!sh.sjekket && s >= sk) {
      sh.sjekket = true;
      const b = ballPos(sh, sk);
      if (Math.abs(b.x) < MAL.b+0.2 && b.y < MAL.h+0.2 && keeperTreff(k, b.x, b.y)) {
        sh.b = b; startFri(sh, {x: Math.sign(b.x-k.hx||1)*(2+Math.random()*3), y: 2+Math.random()*2.5, z: -6-Math.random()*3});
        avgjor(sh, {type:'redning'}); return;
      }
    }
    if (s >= 1) {
      const b = ballPos(sh,1); sh.b = b;
      const ax = Math.abs(b.x), v = ballFart(sh,1);
      let r;
      if (Math.abs(ax-MAL.b) <= 0.17 && b.y <= MAL.h+0.06) { r = {type:'stolpe'}; startFri(sh,{x:-Math.sign(b.x)*3, y:1.5, z:-7}); }
      else if (Math.abs(b.y-MAL.h) <= 0.17 && ax <= MAL.b) { r = {type:'tverrligger'}; startFri(sh,{x:v.x*0.4, y:b.y>MAL.h?4:-3, z:-6}); }
      else if (b.y > MAL.h+0.17) { r = {type: ax > MAL.b+0.6 ? 'utenfor' : 'over'}; startFri(sh, v); }
      else if (ax > MAL.b+0.17) { r = {type:'utenfor'}; startFri(sh, v); }
      else {
        r = {type:'mal', kryss: ax>2.55 && b.y>1.45, skru: Math.abs(sh.B)>0.5, x:b.x, y:b.y};
        startFri(sh, {x:v.x*0.5, y:v.y*0.5, z:v.z*0.6});
      }
      avgjor(sh, r); return;
    }
    sh.s = s; sh.b = ballPos(sh, s);
  } else {
    oppdaterKeeper(k, dt, sh.t);
    const b = sh.b, v = sh.vel;
    v.y -= 9.8*dt; v.x *= (1-0.4*dt); v.z *= (1-0.4*dt);
    b.x += v.x*dt; b.y += v.y*dt; b.z += v.z*dt;
    if (b.y < BR) { b.y = BR; if (v.y < 0) v.y = -v.y*0.5; v.x *= 0.8; v.z *= 0.8; if (Math.abs(v.y)<0.6) v.y=0; }
    if (sh.res && sh.res.type === 'mal') {
      if (b.z > 12.4) { b.z = 12.4; v.z = -Math.abs(v.z)*0.12; v.x *= 0.3; }
      if (b.z > 11 && Math.abs(b.x) > MAL.b-0.15) { b.x = Math.sign(b.x)*(MAL.b-0.15); v.x *= -0.2; }
      const tak = lerp(MAL.h, 1.6, clamp((b.z-11)/1.6,0,1)) - BR;
      if (b.z > 11 && b.y > tak) { b.y = tak; v.y = -Math.abs(v.y)*0.2; }
    }
  }
}
function startFri(sh, vel){ sh.fri = true; sh.vel = {x:vel.x, y:vel.y, z:vel.z}; }
function avgjor(sh, r){ if (sh.res) return; sh.res = r; if (sh.cb) sh.cb(r); }

// For testing/finjustering: simuler mange skudd uten skjerm
window.__sim = function(n, keeperId, skoId, strategi){
  const kp = KEEPERE.find(k=>k.id===keeperId), sk = SKO.find(s=>s.id===skoId);
  const telling = {};
  for (let i=0;i<n;i++){
    const sh = lagSkudd(strategi(), sk); sh.k = nyKeeper(); sh.k.hx = (Math.random()-0.5)*0.5;
    planleggKeeper(sh.k, sh, kp);
    while (!sh.res && sh.t < 3) oppdaterSkudd(sh, 1/60);
    const t = sh.res ? sh.res.type : 'ingen'; telling[t] = (telling[t]||0)+1;
  }
  return telling;
};

  hc.globalAlpha = 1;

  let y = bt - 2, rad = 0;
  while (y > topp + 6) {
    const frac = clamp((bt-y)/(bt-topp),0,1);

  }
  lag.publikum = p;

  const [b,bc] = lagLag();
  const striper = ['#1f9d4a','#23ad54'];

  for (let z = 14.5; z > CAMZ+0.4; z -= 2.2, i++) {

  bc.fillStyle = g; bc.fillRect(0,bb,W,H-bb);

  for (let n=0, x=-35; x<35; x+=7.5, n++) {

  L(-20.16,MAL.z-16.5,20.16,MAL.z-16.5); L(-20.16,MAL.z-16.5,-20.16,MAL.z); L(20.16,MAL.z-16.5,20.16,MAL.z);

function linje(c,x1,z1,x2,z2){
  const w = 0.07, dx = x2-x1, dz = z2-z1, l = Math.hypot(dx,dz), nx = -dz/l*w, nz = dx/l*w;
  const pts = [P(x1+nx,0,z1+nz),P(x2+nx,0,z2+nz),P(x2-nx,0,z2-nz),P(x1-nx,0,z1-nz)];
  c.beginPath(); c.moveTo(pts[0].x,pts[0].y); for (const q of pts) c.lineTo(q.x,q.y); c.closePath(); c.fill();
}

/* ---------- nett og mål ---------- */
const nett = {amp:0, x:0, y:1, t:0};
function nettPunkt(x,y,z){
  if (nett.amp > 0.001 && z > 11.05) {
    const d2 = (x-nett.x)**2 + (y-nett.y)**2;
    z += nett.amp*Math.exp(-d2/0.6)*Math.cos(nett.t*14)*((z-11)/1.6);
  }
  return P(x,y,z);
}
function nettLinje(a,b,n=6){
  ctx.beginPath();
  for (let i=0;i<=n;i++){ const t=i/n; const q = nettPunkt(lerp(a[0],b[0],t), lerp(a[1],b[1],t), lerp(a[2],b[2],t)); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); }
  ctx.stroke();
}
function tegnNett(){
  const B = MAL.b, HH = MAL.h, ZB = 12.6, HB = 1.6;
  ctx.strokeStyle = 'rgba(235,240,250,.42)'; ctx.lineWidth = Math.max(0.7, f/1600);
  for (let x=-B; x<=B+0.01; x+=0.36) { nettLinje([x,0,ZB],[x,HB,ZB]); nettLinje([x,HH,11],[x,HB,ZB]); }
  for (let y=0; y<=HB+0.01; y+=0.3) nettLinje([-B,y,ZB],[B,y,ZB],10);
  for (let t=0.2; t<1; t+=0.2) nettLinje([-B,lerp(HH,HB,t),lerp(11,ZB,t)],[B,lerp(HH,HB,t),lerp(11,ZB,t)],10);
  for (const sx of [-B,B]) {
    for (let z=11; z<=ZB+0.01; z+=0.4) nettLinje([sx,0,z],[sx,lerp(HH,HB,(z-11)/1.6),z],4);
    for (let y=0; y<HH; y+=0.3) { const zt = y<=HB ? ZB : lerp(11,ZB,(HH-y)/(HH-HB)); nettLinje([sx,y,11],[sx,y,zt],3); }
  }
  // bakramme
  ctx.strokeStyle = 'rgba(200,210,225,.8)'; ctx.lineWidth = Math.max(1.5, f/700);
  nettLinje([-B,0,ZB],[-B,HB,ZB],1); nettLinje([B,0,ZB],[B,HB,ZB],1); nettLinje([-B,HB,ZB],[B,HB,ZB],1);
}

function stjerne(c,x,y,r,rot){ c.beginPath(); for(let i=0;i<10;i++){ const a=rot+i*Math.PI/5-Math.PI/2, rr=i%2?r*0.45:r; i?c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr):c.moveTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);} c.closePath(); }

    case 'regnbue': {
      const fr=['#ef4444','#f97316','#facc15','#22c55e','#3b82f6','#8b5cf6'];
      for(let i=0;i<6;i++){ c.fillStyle=fr[i]; c.beginPath(); c.moveTo(0,0); c.arc(0,0,r*1.1,i*Math.PI/3,(i+1)*Math.PI/3); c.fill(); }
      c.fillStyle='#fff'; c.beginPath(); c.arc(0,0,r*0.22,0,7); c.fill();
      break; }
    case 'gull': {
      const g=c.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r); g.addColorStop(0,'#fff7c2'); g.addColorStop(0.5,'#fbbf24'); g.addColorStop(1,'#b45309');
      c.fillStyle=g; c.fillRect(-r,-r,2*r,2*r);
      c.strokeStyle='rgba(120,53,15,.6)'; c.lineWidth=Math.max(0.6,r*0.05);
      femkant(c,0,0,r*0.36,0); c.stroke(); for(let i=0;i<5;i++){ const a=i*Math.PI*2/5-Math.PI/2+Math.PI/5; femkant(c,Math.cos(a)*r*0.92,Math.sin(a)*r*0.92,r*0.33,a+Math.PI/2); c.stroke(); }
      break; }
    default: c.fillStyle='#ffffff'; c.fillRect(-r,-r,2*r,2*r); ring('#111827','#111827');
  }
  c.restore();
  // skygge og glans
  const g = c.createRadialGradient(-r*0.35,-r*0.4,r*0.05,0,0,r*1.05);
  g.addColorStop(0,'rgba(255,255,255,.55)'); g.addColorStop(0.35,'rgba(255,255,255,0)'); g.addColorStop(0.8,'rgba(0,0,0,.12)'); g.addColorStop(1,'rgba(0,0,0,.4)');
  c.fillStyle = g; c.beginPath(); c.arc(0,0,r,0,7); c.fill();
  c.strokeStyle = 'rgba(0,0,0,.45)'; c.lineWidth = Math.max(0.6, r*0.04); c.stroke();
  c.restore();
}

function tegnSko(c, x, y, w, sk){
  const h = w*0.5;
  c.save(); c.translate(x,y);
  const form = () => { c.beginPath(); c.moveTo(w*0.06,h*0.8); c.lineTo(w*0.06,h*0.22); c.quadraticCurveTo(w*0.08,h*0.04,w*0.24,h*0.08); c.lineTo(w*0.38,h*0.15);
    c.quadraticCurveTo(w*0.5,h*0.32,w*0.7,h*0.4); c.quadraticCurveTo(w*0.98,h*0.48,w*0.96,h*0.74); c.lineTo(w*0.96,h*0.8); c.closePath(); };
  // knotter
  c.fillStyle = sk.saale;
  for (const sx of [0.14,0.26,0.55,0.7,0.85]) { c.beginPath(); c.moveTo(w*(sx-0.04),h*0.88); c.lineTo(w*(sx+0.04),h*0.88); c.lineTo(w*(sx+0.025),h*1.0); c.lineTo(w*(sx-0.025),h*1.0); c.fill(); }
  c.fillRect(w*0.05,h*0.78,w*0.92,h*0.11);
  form();
  if (sk.gull) { const g=c.createLinearGradient(0,0,w,h); g.addColorStop(0,'#fff3b0'); g.addColorStop(0.5,'#fbbf24'); g.addColorStop(1,'#b45309'); c.fillStyle=g; } else c.fillStyle = sk.farge;
  c.fill();
  c.save(); form(); c.clip();
  c.fillStyle = sk.aksent; c.strokeStyle = sk.aksent; c.lineWidth = w*0.035;
  switch(sk.dekor){
    case 'striper': for (const o of [0.38,0.48]) { c.beginPath(); c.moveTo(w*o,h*0.78); c.lineTo(w*(o+0.12),h*0.25); c.lineTo(w*(o+0.17),h*0.25); c.lineTo(w*(o+0.05),h*0.78); c.fill(); } break;
    case 'flamme': c.beginPath(); c.moveTo(w*0.96,h*0.75); c.quadraticCurveTo(w*0.7,h*0.7,w*0.5,h*0.35); c.quadraticCurveTo(w*0.6,h*0.6,w*0.66,h*0.45); c.quadraticCurveTo(w*0.7,h*0.65,w*0.8,h*0.5); c.quadraticCurveTo(w*0.82,h*0.68,w*0.96,h*0.6); c.fill(); break;
    case 'spiral': c.beginPath(); c.moveTo(w*0.12,h*0.7); c.bezierCurveTo(w*0.3,h*0.2,w*0.5,h*0.9,w*0.7,h*0.5); c.bezierCurveTo(w*0.8,h*0.3,w*0.9,h*0.6,w*0.95,h*0.55); c.stroke(); break;
    case 'sikte': c.beginPath(); c.arc(w*0.3,h*0.5,h*0.2,0,7); c.stroke(); c.beginPath(); c.moveTo(w*0.3,h*0.22); c.lineTo(w*0.3,h*0.78); c.moveTo(w*0.18,h*0.5); c.lineTo(w*0.42,h*0.5); c.lineWidth=w*0.02; c.stroke(); break;
    case 'lyn': c.beginPath(); c.moveTo(w*0.2,h*0.25); c.lineTo(w*0.45,h*0.45); c.lineTo(w*0.4,h*0.5); c.lineTo(w*0.75,h*0.7); c.lineTo(w*0.5,h*0.55); c.lineTo(w*0.55,h*0.5); c.closePath(); c.fill(); break;
    case 'stjerne': c.fillStyle='#fff'; stjerne(c,w*0.3,h*0.5,h*0.22,0); c.fill(); stjerne(c,w*0.62,h*0.6,h*0.12,0.3); c.fill(); break;
  }
  c.restore();
  // lisser
  c.strokeStyle = sk.id==='gym' ? '#64748b' : '#ffffff'; c.lineWidth = w*0.015;
  for (let i=0;i<4;i++){ const lx=w*(0.4+i*0.07), ly=h*(0.18+i*0.06); c.beginPath(); c.moveTo(lx-w*0.03,ly-h*0.03); c.lineTo(lx+w*0.03,ly+h*0.05); c.stroke(); }
  form(); c.strokeStyle = 'rgba(0,0,0,.55)'; c.lineWidth = Math.max(1,w*0.015); c.stroke();
  c.restore();
}

function fyllMonster(c, d, x, y, w, h){
  const f1 = d.farge, f2 = d.farge2;
  c.fillStyle = f1; c.fillRect(x,y,w,h);
  c.fillStyle = f2;
  switch(d.monster){
    case 'striper': for (let sx=x+w/9; sx<x+w; sx+=w*2/9) c.fillRect(sx, y, w/9, h); break;
    case 'tverr': for (let sy=y+h/7; sy<y+h; sy+=h*2/7) c.fillRect(x, sy, w, h/7); break;
    case 'halv': c.fillRect(x+w/2, y, w/2, h); break;
    case 'diagonal': c.beginPath(); c.moveTo(x,y+h*0.05); c.lineTo(x+w,y+h*0.55); c.lineTo(x+w,y+h*0.78); c.lineTo(x,y+h*0.28); c.fill(); break;
    case 'ruter': { const q=w/6; for (let i=0;i*q<w;i++) for (let j=0;j*q<h;j++) if ((i+j)%2) c.fillRect(x+i*q,y+j*q,q,q); break; }
    case 'skulder': c.fillRect(x,y,w,h*0.24); break;
  }
}

function tegnTroye(c, x, y, w, d){ // liten trøye-ikon (forfra)
  const h = w;
  c.save(); c.translate(x,y);
  const form = () => { c.beginPath(); c.moveTo(w*0.32,h*0.08); c.quadraticCurveTo(w*0.5,h*0.2,w*0.68,h*0.08); c.lineTo(w*0.95,h*0.22); c.lineTo(w*0.86,h*0.42); c.lineTo(w*0.76,h*0.37);
    c.lineTo(w*0.76,h*0.95); c.lineTo(w*0.24,h*0.95); c.lineTo(w*0.24,h*0.37); c.lineTo(w*0.14,h*0.42); c.lineTo(w*0.05,h*0.22); c.closePath(); };
  form(); c.save(); c.clip(); fyllMonster(c,d,0,h*0.08,w,h*0.9); c.restore();
  form(); c.strokeStyle='rgba(0,0,0,.5)'; c.lineWidth=Math.max(1,w*0.03); c.stroke();
  c.restore();
}

function tegnHar(c, m, d, bak){
  c.fillStyle = d.har;
  const hy = -1.42;
  if (d.harstil === 'krøller') {
    for (let i=0;i<9;i++){ const a=Math.PI+i*Math.PI/8; c.beginPath(); c.arc(m(Math.cos(a)*0.12), m(hy+Math.sin(a)*0.12), m(0.06), 0, 7); c.fill(); }
    c.beginPath(); c.arc(0, m(hy), m(0.13), 0, 7); c.fill();
    if (bak) { for (let i=0;i<5;i++){ c.beginPath(); c.arc(m(-0.1+i*0.05), m(hy+0.08), m(0.05),0,7); c.fill(); } }
    return;
  }
  c.beginPath(); c.arc(0, m(hy), m(0.122), Math.PI*0.95, Math.PI*2.05); c.fill();
  if (bak) { c.beginPath(); c.ellipse(0, m(hy+0.02), m(0.12), m(0.1), 0, 0, Math.PI); c.fill(); }
  if (d.harstil === 'langt') { c.beginPath(); c.moveTo(m(-0.125),m(hy)); c.lineTo(m(-0.14),m(hy+0.22)); c.quadraticCurveTo(0,m(hy+0.27),m(0.14),m(hy+0.22)); c.lineTo(m(0.125),m(hy)); c.fill(); }
  if (d.harstil === 'hestehale') { c.beginPath(); c.ellipse(0, m(hy+0.16), m(0.05), m(0.13), 0.1, 0, 7); c.fill(); c.fillStyle='#ef4444'; c.fillRect(m(-0.03),m(hy+0.06),m(0.06),m(0.03)); }
}

// Spilleren sett bakfra. fx,fy = midt mellom føttene på skjermen, s = piksler per meter.
function tegnSpiller(c, fx, fy, s, d, sk, pose){
  const m = v => v*s;
  c.save(); c.translate(fx, fy); c.lineCap = 'round'; c.lineJoin = 'round';
  let svL = 0, svR = 0, arm = 0, fotOpp = 0, fotX = 0, lene = 0;
  if (pose.lop != null) { svL = Math.sin(pose.lop)*0.1; svR = -svL; arm = Math.sin(pose.lop)*0.12; }
  if (pose.spark != null) { const q = clamp(pose.spark,0,1); fotOpp = 0.42*Math.sin(Math.PI*Math.min(q*1.3,1)); fotX = 0.04+0.1*q; lene = -0.06*Math.sin(Math.PI*q); arm = 0.12*Math.sin(Math.PI*q); }
  c.rotate(lene);
  // skygge
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(0, 0, m(0.3), m(0.06), 0, 0, 7); c.fill();
  // bein
  const bein = (side, sv, opp, ex) => {
    const hx = side*0.09, fx2 = side*0.1 + ex, fy2 = -opp + sv*0.4;
    c.strokeStyle = d.hud; c.lineWidth = m(0.1); c.beginPath(); c.moveTo(m(hx), m(-0.7)); c.lineTo(m(fx2), m(fy2-0.05)); c.stroke();
    c.strokeStyle = d.sokker; c.lineWidth = m(0.11); c.beginPath(); c.moveTo(m(lerp(hx,fx2,0.55)), m(lerp(-0.7,fy2,0.55))); c.lineTo(m(fx2), m(fy2-0.06)); c.stroke();
    c.fillStyle = sk.saale; c.beginPath(); c.ellipse(m(fx2), m(fy2-0.02), m(0.075), m(0.045), 0, 0, 7); c.fill();
    c.fillStyle = sk.farge; c.beginPath(); c.ellipse(m(fx2), m(fy2-0.05), m(0.07), m(0.05), 0, 0, 7); c.fill();
  };
  bein(-1, svL, 0, 0);
  bein(1, svR, fotOpp, fotX);
  // armer
  c.strokeStyle = d.hud; c.lineWidth = m(0.075);
  c.beginPath(); c.moveTo(m(-0.22), m(-1.18)); c.lineTo(m(-0.29), m(-0.88 + arm)); c.stroke();
  c.beginPath(); c.moveTo(m(0.22), m(-1.18)); c.lineTo(m(0.29), m(-0.88 - arm)); c.stroke();
  // shorts
  c.fillStyle = d.shorts; c.beginPath(); c.moveTo(m(-0.18),m(-0.88)); c.lineTo(m(0.18),m(-0.88)); c.lineTo(m(0.2),m(-0.64)); c.lineTo(m(0.02),m(-0.64)); c.lineTo(0,m(-0.7)); c.lineTo(m(-0.02),m(-0.64)); c.lineTo(m(-0.2),m(-0.64)); c.closePath(); c.fill();
  // trøye
  const torso = () => { c.beginPath(); c.moveTo(m(-0.2),m(-1.3)); c.lineTo(m(0.2),m(-1.3)); c.lineTo(m(0.27),m(-1.12)); c.lineTo(m(0.2),m(-1.08)); c.lineTo(m(0.17),m(-0.84)); c.lineTo(m(-0.17),m(-0.84)); c.lineTo(m(-0.2),m(-1.08)); c.lineTo(m(-0.27),m(-1.12)); c.closePath(); };
  torso(); c.save(); c.clip(); fyllMonster(c, d, m(-0.28), m(-1.31), m(0.56), m(0.48));
  if (d.monster === 'skulder') { c.fillStyle = d.farge2; c.fillRect(m(-0.28),m(-1.31),m(0.1),m(0.25)); c.fillRect(m(0.18),m(-1.31),m(0.1),m(0.25)); }
  c.restore();
  torso(); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = Math.max(1,m(0.008)); c.stroke();
  // nummer og navn
  const tekstF = lys(d.farge) > 0.6 ? '#111827' : '#ffffff', kant = tekstF === '#ffffff' ? '#111827' : '#ffffff';
  const font = getComputedStyle(document.body).getPropertyValue('--tittel');
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.font = `${m(0.2)}px ${font}`; c.lineWidth = m(0.025); c.strokeStyle = kant; c.fillStyle = tekstF;
  c.strokeText(String(d.nummer), 0, m(-0.99)); c.fillText(String(d.nummer), 0, m(-0.99));
  if (d.navn) { c.font = `${m(0.065)}px ${font}`; c.lineWidth = m(0.014); c.strokeText(d.navn.toUpperCase(), 0, m(-1.2), m(0.34)); c.fillText(d.navn.toUpperCase(), 0, m(-1.2), m(0.34)); }
  // hals og hode
  c.fillStyle = d.hud; c.fillRect(m(-0.045), m(-1.36), m(0.09), m(0.08));
  c.beginPath(); c.arc(0, m(-1.42), m(0.115), 0, 7); c.fill();
  c.beginPath(); c.arc(m(-0.115), m(-1.42), m(0.03), 0, 7); c.arc(m(0.115), m(-1.42), m(0.03), 0, 7); c.fill();
  tegnHar(c, m, d, true);
  c.restore();
}

// Keeper sett forfra. sx,sy = hofta på skjermen.
function tegnKeeper(c, sx, sy, s, th, armerOpp, kp, vink=0){
  const m = v => v*s;
  c.save(); c.translate(sx, sy); c.rotate(th); c.lineCap = 'round'; c.lineJoin = 'round';
  // bein
  c.strokeStyle = kp.hud; c.lineWidth = m(0.11);
  c.beginPath(); c.moveTo(m(-0.09),0); c.lineTo(m(-0.14),m(0.9)); c.moveTo(m(0.09),0); c.lineTo(m(0.14),m(0.9)); c.stroke();
  c.strokeStyle = kp.sokk; c.lineWidth = m(0.12);
  c.beginPath(); c.moveTo(m(-0.12),m(0.5)); c.lineTo(m(-0.14),m(0.88)); c.moveTo(m(0.12),m(0.5)); c.lineTo(m(0.14),m(0.88)); c.stroke();
  c.fillStyle = '#111827'; c.beginPath(); c.ellipse(m(-0.15),m(0.93),m(0.08),m(0.045),0,0,7); c.ellipse(m(0.15),m(0.93),m(0.08),m(0.045),0,0,7); c.fill();
  c.fillStyle = kp.shorts; c.fillRect(m(-0.2), m(-0.05), m(0.4), m(0.26));
  // armer
  const hL = armerOpp ? [-0.16,-1.25] : [-0.74,-0.86+vink], hR = armerOpp ? [0.16,-1.25] : [0.74,-0.86-vink];
  c.strokeStyle = kp.drakt; c.lineWidth = m(0.11);
  c.beginPath(); c.moveTo(m(-0.17),m(-0.55)); c.lineTo(m(hL[0]),m(hL[1])); c.moveTo(m(0.17),m(-0.55)); c.lineTo(m(hR[0]),m(hR[1])); c.stroke();
  // kropp
  c.fillStyle = kp.drakt; c.beginPath(); c.roundRect ? c.roundRect(m(-0.21),m(-0.66),m(0.42),m(0.64),m(0.08)) : c.rect(m(-0.21),m(-0.66),m(0.42),m(0.64)); c.fill();
  c.fillStyle = kp.drakt2; c.fillRect(m(-0.21),m(-0.46),m(0.42),m(0.08));
  c.fillStyle = '#fff'; c.font = `${m(0.18)}px ${getComputedStyle(document.body).getPropertyValue('--tittel')}`; c.textAlign='center'; c.textBaseline='middle';
  c.fillText('1', 0, m(-0.22));
  // hansker
  c.fillStyle = kp.hanske; c.strokeStyle = 'rgba(0,0,0,.4)'; c.lineWidth = Math.max(1, m(0.015));
  for (const hh of [hL,hR]) { c.beginPath(); c.arc(m(hh[0]),m(hh[1]),m(0.1),0,7); c.fill(); c.stroke(); }
  // hode
  c.fillStyle = kp.hud; c.fillRect(m(-0.05),m(-0.74),m(0.1),m(0.1));
  c.beginPath(); c.arc(0, m(-0.84), m(0.13), 0, 7); c.fill();
  c.fillStyle = kp.har; c.beginPath(); c.arc(0, m(-0.86), m(0.135), Math.PI*1.02, Math.PI*1.98); c.fill();
  c.fillStyle = '#111827'; c.beginPath(); c.arc(m(-0.045),m(-0.84),m(0.016),0,7); c.arc(m(0.045),m(-0.84),m(0.016),0,7); c.fill();
  c.strokeStyle = '#7f1d1d'; c.lineWidth = Math.max(1,m(0.014)); c.beginPath(); c.arc(0,m(-0.8),m(0.045),0.2,Math.PI-0.2); c.stroke();
  c.restore();
}

/* =====================================================================
   SPILLTILSTAND
   ===================================================================== */
let skjerm = 'meny';         // meny | spill | butikk | drakt | resultat
let fase = 'sikt';           // sikt | tilop | flukt | etter | motst | slutt
let modus = 'kamp';          // kamp | trening
let kp = keeperStat();
let K = nyKeeper();
let sh = null, sikte = null, drag = null;
const spiller = {x:-1.2, z:-1.15, lop:null, spark:null, tl:0};
let kamp = {du:[], dem:[], tjent:0};
let tid = 0, publikumHopp = 0;

/* ---------- effekter: konfetti og risting ---------- */
const ROLIG = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const kv = $('konfetti'), kctx = kv.getContext('2d');
const biter = [];
let rist = 0;
function ristSkjerm(a){ if (!ROLIG) rist = Math.max(rist, a); }
function konfetti(x, y, n=120, spredning=1){
  if (ROLIG) n = Math.round(n/4);
  const farger = ['#a3e635','#fde047','#fbbf24','#ffffff','#38bdf8','#f472b6','#c084fc', S.drakt.farge];
  for (let i=0;i<n;i++){
    const a = -Math.PI/2 + (Math.random()-0.5)*Math.PI*1.3*spredning, v = 380 + Math.random()*620;
    biter.push({x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, r:Math.random()*6, vr:(Math.random()-0.5)*14,
      w:6+Math.random()*7, h:4+Math.random()*6, c:farger[i%farger.length], liv:2.2+Math.random()*1.4, rund:Math.random()<0.25});
  }
}
function oppdaterEffekter(dt){
  rist = Math.max(0, rist - dt*28);
  if (kv.width !== cv.width || kv.height !== cv.height) { kv.width = cv.width; kv.height = cv.height; }
  kctx.setTransform(DPR,0,0,DPR,0,0); kctx.clearRect(0,0,W,H);
  for (let i=biter.length-1;i>=0;i--){
    const b = biter[i];
    b.liv -= dt; if (b.liv <= 0 || b.y > H+40) { biter.splice(i,1); continue; }
    b.vy += 900*dt; b.vx *= (1-1.6*dt); b.vy *= (1-1.2*dt); b.x += b.vx*dt; b.y += b.vy*dt; b.r += b.vr*dt;
    kctx.save(); kctx.globalAlpha = Math.min(1, b.liv); kctx.translate(b.x, b.y); kctx.rotate(b.r);
    kctx.fillStyle = b.c;
    if (b.rund) { kctx.beginPath(); kctx.arc(0,0,b.w*0.4,0,7); kctx.fill(); }
    else kctx.fillRect(-b.w/2, -b.h/2*Math.abs(Math.cos(b.r*1.7)), b.w, b.h*Math.abs(Math.cos(b.r*1.7))+0.5);
    kctx.restore();
  }
}
function tellOpp(el, til, ms=900){
  if (ROLIG || til <= 0) { el.textContent = til; return; }
  const t0 = performance.now();
  const steg = n => { const q = Math.min(1,(n-t0)/ms); el.textContent = Math.round(til*(1-Math.pow(1-q,3))); if (q<1) requestAnimationFrame(steg); };
  requestAnimationFrame(steg);
}
const timere = [];
function planlegg(sek, fn){ timere.push({t:tid+sek, fn}); }

function nyttSkudd(){
  sh = null; sikte = null; drag = null;
  K = nyKeeper();
  spiller.x = geo.startX; spiller.z = -1.15; spiller.lop = null; spiller.spark = null; spiller.tl = 0;
  fase = 'sikt';
  skjulBanner();
  plasserHint();
}

function startSpill(m){
  modus = m; kp = keeperStat(); kamp = {du:[], dem:[], tjent:0};
  timere.length = 0;
  visSkjerm('spill');
  $('tavle').style.display = modus==='kamp' ? 'grid' : 'none';
  $('treningsskilt').style.display = modus==='kamp' ? 'none' : 'block';
  oppdaterTavle();
  nyttSkudd();
  LYD.floyte();
}

function beregnSikte(pts){
  const a = pts[0], b = pts[pts.length-1];
  const dx = b.x-a.x, dy = b.y-a.y, L = Math.hypot(dx,dy);
  if (L < 25 || dy > -15) return null;
  const X = geo.ball.x + dx/(-dy)*(geo.ball.y-geo.malBunn);
  const k11 = f/(MAL.z-CAMZ);
  const xt = clamp((X-cx)/k11, -9, 9);
  const p = clamp(L/geo.dragD, 0, 1.15);
  let best = 0;
  for (const q of pts) {
    const t = ((q.x-a.x)*dx+(q.y-a.y)*dy)/(L*L);
    const lx = q.x-(a.x+dx*t), ly = q.y-(a.y+dy*t);
    const d = Math.hypot(lx,ly)*(lx>=0?1:-1);
    if (Math.abs(d) > Math.abs(best)) best = d;
  }
  let bu = best/L;
  bu = Math.abs(bu) < 0.05 ? 0 : Math.sign(bu)*(Math.abs(bu)-0.05);
  bu = clamp(bu/0.28, -1, 1);
  const sk = skoStat();
  return {xt, p, B: bu*(0.35+sk.skru*0.22)};
}

    if (b > a + (5-na)) return 'tap';
    if (na === 5 && nb === 5 && a !== b) return a > b ? 'seier' : 'tap';

/* =====================================================================
   OPPDATERING OG TEGNING PER BILDE

function oppdater(dt){
  tid += dt;
  for (let i=timere.length-1;i>=0;i--) if (tid >= timere[i].t) { const t = timere.splice(i,1)[0]; t.fn(); }
  nett.t += dt; nett.amp *= Math.pow(0.12, dt);
  publikumHopp = Math.max(0, publikumHopp - dt*0.45);
  if (fase === 'sikt' || fase === 'tilop' || skjerm !== 'spill') {
    K.hx = 0.3*Math.sin(tid*1.7); K.hy = 0.95 + 0.03*Math.abs(Math.sin(tid*3.4)); K.th = 0; K.dykk = false;
  }
  if (skjerm !== 'spill') return;
  if (fase === 'tilop') {
    spiller.tl += dt;
    const q = clamp(spiller.tl/0.5, 0, 1);
    spiller.x = lerp(geo.startX, -0.34, q); spiller.z = lerp(-1.15, -0.3, q);
    spiller.lop = spiller.tl*16;
    if (q >= 1) { spiller.lop = null; skyt(); }
  }
  if (sh) {
    if (spiller.spark != null) spiller.spark = Math.min(1, spiller.spark + dt*2.6);
    let rest = dt; while (rest > 0) { const st = Math.min(rest, 1/120); oppdaterSkudd(sh, st); rest -= st; }
  }
}

function tegn(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if (rist > 0) {
    ctx.fillStyle = '#060b20'; ctx.fillRect(0,0,W,H);
    const z = 1 + rist*0.004;
    ctx.translate(W/2 + (Math.random()-0.5)*rist, H/2 + (Math.random()-0.5)*rist); ctx.scale(z,z); ctx.translate(-W/2,-H/2);
  }
  ctx.drawImage(lag.himmel, 0, 0, W, H);
  const hopp = publikumHopp > 0 ? Math.abs(Math.sin(tid*14))*6*publikumHopp : 0;
  ctx.drawImage(lag.publikum, 0, -hopp, W, H);
  ctx.drawImage(lag.bakke, 0, 0, W, H);
  tegnNett();

  const ting = [];
  const b = sh ? sh.b : {x:0, y:BR, z:0};
  const ballId = S.valgtBall, rot = sh ? sh.rot : 0;
  ting.push({d: b.z - CAMZ, fn: () => {
    if (b.z > 14.4) return;
    const sk = P(b.x, 0, b.z), q = P(b.x, b.y, b.z);
    ctx.fillStyle = `rgba(0,0,0,${clamp(0.35-b.y*0.06,0.08,0.35)})`;
    ctx.beginPath(); ctx.ellipse(sk.x, sk.y, BR*sk.k*1.15, BR*sk.k*0.35, 0, 0, 7); ctx.fill();
    tegnBall(ctx, q.x, q.y, BR*q.k, ballId, rot);
  }});
  ting.push({d: KZ - CAMZ, fn: () => {
    const fot = P(K.hx, 0, KZ);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(fot.x, fot.y, fot.k*0.5, fot.k*0.1, 0, 0, 7); ctx.fill();
    const q = P(K.hx, K.hy, KZ);
    tegnKeeper(ctx, q.x, q.y, q.k, K.th, K.dykk, kp, K.dykk ? 0 : Math.sin(tid*4)*0.08);
  }});
  ting.push({d: MAL.z - CAMZ, fn: tegnStolper});
  ting.push({d: spiller.z - CAMZ, fn: () => {
    const q = P(spiller.x, 0, spiller.z);
    tegnSpiller(ctx, q.x, q.y, q.k, S.drakt, skoStat(), {lop: spiller.lop, spark: spiller.spark});
  }});
  ting.sort((a,b) => b.d - a.d);
  for (const t of ting) t.fn();

  if (skjerm === 'spill' && (fase === 'sikt' || fase === 'tilop') && sikte) tegnSikte();
  if (skjerm === 'spill' && drag) tegnSpor();
}

function tegnSpor(){
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); drag.pts.forEach((q,i) => i ? ctx.lineTo(q.x,q.y) : ctx.moveTo(q.x,q.y)); ctx.stroke();
}

function tegnSikte(){
  const s0 = {xt:sikte.xt, h:hoydeFraKraft(sikte.p), B:sikte.B, loft:0.15+0.35*sikte.p};
  const inne = Math.abs(s0.xt) < MAL.b-0.05 && s0.h < MAL.h-0.05;
  const farge = inne ? '#4ade80' : '#f87171';
  for (let i=1;i<=22;i++){
    const s = i/22, q = ballPos(s0, s), p = P(q.x, q.y, q.z);
    ctx.fillStyle = farge; ctx.globalAlpha = 0.9 - s*0.4;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(2, 0.05*p.k), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  const e = P(s0.xt, s0.h, MAL.z), r = Math.max(10, 0.28*e.k);
  ctx.strokeStyle = farge; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, 7); ctx.moveTo(e.x-r*1.5, e.y); ctx.lineTo(e.x-r*0.5, e.y); ctx.moveTo(e.x+r*0.5, e.y); ctx.lineTo(e.x+r*1.5, e.y);
  ctx.moveTo(e.x, e.y-r*1.5); ctx.lineTo(e.x, e.y-r*0.5); ctx.moveTo(e.x, e.y+r*0.5); ctx.lineTo(e.x, e.y+r*1.5); ctx.stroke();
  // kraftmåler
  const bx = Math.min(geo.ball.x + Math.max(90, BR*geo.ball.k*5), W - 44), bh = clamp(geo.ball.y - geo.malBunn - 60, 90, 220), bw = 26, by = geo.ball.y - bh + 10;
  const over = (MAL.h - 0.05 - 0.12)/2.65 / 1.15;
  ctx.fillStyle = 'rgba(15,23,42,.8)'; rundRekt(bx-4, by-30, bw+8, bh+36, 10); ctx.fill();
  ctx.fillStyle = '#334155'; ctx.fillRect(bx, by, bw, bh);
  const andel = sikte.p/1.15;
  const g = ctx.createLinearGradient(0, by+bh, 0, by);
  g.addColorStop(0,'#fde047'); g.addColorStop(over*0.55,'#4ade80'); g.addColorStop(over,'#22c55e'); g.addColorStop(over+0.001,'#ef4444'); g.addColorStop(1,'#b91c1c');
  ctx.fillStyle = g; ctx.fillRect(bx, by+bh*(1-andel), bw, bh*andel);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx-4, by+bh*(1-over)); ctx.lineTo(bx+bw+4, by+bh*(1-over)); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.font = `bold 13px ${getComputedStyle(document.body).getPropertyValue('--tekst')}`; ctx.textAlign = 'center';
  ctx.fillText('KRAFT', bx+bw/2, by-12);
  if (Math.abs(sikte.B) > 0.05) {
    ctx.font = `bold 16px ${getComputedStyle(document.body).getPropertyValue('--tekst')}`;
    const tx = geo.ball.x - Math.max(60, BR*geo.ball.k*4) - 10;
    ctx.fillStyle = 'rgba(15,23,42,.8)'; rundRekt(tx-46, geo.ball.y-60, 92, 30, 10); ctx.fill();
    ctx.fillStyle = '#f0abfc'; ctx.fillText((sikte.B > 0 ? 'Skru ↷' : '↶ Skru'), tx, geo.ball.y-40);
  }
}
function rundRekt(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

let sistTid = performance.now();

  const dt = Math.min(0.05, (n - sistTid)/1000); sistTid = n;
  oppdater(dt); tegn(); oppdaterEffekter(dt);
  requestAnimationFrame(loop);
}

  const varer = fane === 'sko' ? SKO : BALLER;
  varer.forEach((v, idx) => {
    const eier = (fane === 'sko' ? S.sko : S.baller).includes(v.id);
    const valgt = fane === 'sko' ? S.valgtSko === v.id : S.valgtBall === v.id;
    const sj = sjeldenhet(v.pris);
    const el = document.createElement('div'); el.className = 'vare ' + sj.kl + (valgt ? ' valgt' : '') + (butikkAnimert ? '' : ' inn');
    el.style.setProperty('--r', sj.farge); el.style.setProperty('--i', idx);
    el.innerHTML = `<span class="sjelden">${sj.navn}</span>` + (eier ? '<span class="eid">✓ Din</span>' : '') +
      `<canvas width="440" height="220"></canvas><h3>${v.navn}</h3>` +
      (fane === 'sko' ? `<p>${v.tekst}</p><div class="stolper"><span>Kraft</span>${pips(v.kraft)}<span>Skru</span>${pips(v.skru)}<span>Presisjon</span>${pips(v.pres)}</div>` : '') +
      `<button class="knapp ${valgt ? 'gra' : eier ? '' : 'gronn'}"></button>`;
    const c = el.querySelector('canvas').getContext('2d');
    if (fane === 'sko') tegnSko(c, 70, 20, 300, v);
    else { c.fillStyle='rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(220,200,70,14,0,0,7); c.fill(); tegnBall(c, 220, 110, 86, v.id, 0.3); }
    const k = el.querySelector('button');
    if (valgt) { k.textContent = 'Valgt ✓'; k.disabled = true; }
    else if (eier) { k.textContent = 'Bruk'; k.onclick = () => { velg(v.id); }; }
    else {
      k.textContent = `Kjøp · ${v.pris} ⭐`;
      if (S.poeng < v.pris) { k.disabled = true; k.classList.replace('gronn','gra'); k.textContent = `🔒 ${v.pris} ⭐ · mangler ${v.pris - S.poeng}`; }
      k.onclick = () => {
        if (!k.dataset.sikker) { k.dataset.sikker = '1'; k.textContent = 'Trykk igjen for å kjøpe!'; k.classList.replace('gronn','gul'); setTimeout(() => { if (k.isConnected) byggButikk(); }, 2500); return; }
        if (S.poeng < v.pris) return;
        S.poeng -= v.pris; (fane === 'sko' ? S.sko : S.baller).push(v.id); LYD.pling();
        const rr = el.getBoundingClientRect(); konfetti(rr.left + rr.width/2, rr.top + rr.height*0.4, 90);
        velg(v.id);
      };
    }
    liste.appendChild(el);
  });
  butikkAnimert = true;
  function velg(id){ if (fane === 'sko') S.valgtSko = id; else S.valgtBall = id; lagre(); LYD.klikk(); oppdaterPoeng(); byggButikk(); }
}

/* ---------- drakt ---------- */
function byggDrakt(){
  const d = S.drakt, box = $('draktValg'); box.innerHTML = '';
  const seksjon = (tittel) => { const h = document.createElement('h3'); h.textContent = tittel; box.appendChild(h); const r = document.createElement('div'); r.className = 'rutenett'; box.appendChild(r); return r; };
  const endre = (felt, verdi) => { d[felt] = verdi; lagre(); LYD.klikk(); byggDrakt(); byggBakgrunn(); };

  let r = seksjon('Mønster');
  for (const [id, navn] of MONSTER) {
    const b = document.createElement('button'); b.className = 'monsterknapp' + (d.monster === id ? ' valgt' : '');
    b.innerHTML = `<canvas width="116" height="116"></canvas>${navn}`;
    tegnTroye(b.querySelector('canvas').getContext('2d'), 6, 6, 104, Object.assign({}, d, {monster:id}));
    b.onclick = () => endre('monster', id); r.appendChild(b);
  }
  const fargerad = (tittel, felt, liste) => {
    const r = seksjon(tittel);
    for (const fc of liste) { const b = document.createElement('button'); b.className = 'farge' + (d[felt] === fc ? ' valgt' : ''); b.style.background = fc; b.setAttribute('aria-label', tittel + ' ' + fc); b.onclick = () => endre(felt, fc); r.appendChild(b); }
  };
  fargerad('Draktfarge', 'farge', FARGER);
  if (d.monster !== 'ensfarget') fargerad('Mønsterfarge', 'farge2', FARGER);
  fargerad('Shorts', 'shorts', FARGER);
  fargerad('Strømper', 'sokker', FARGER);

  r = seksjon('Nummer på ryggen');
  r.innerHTML = `<div class="nummer"><button id="nMinus">−</button><b>${d.nummer}</b><button id="nPluss">+</button></div>`;
  $('nMinus').onclick = () => endre('nummer', d.nummer <= 1 ? 99 : d.nummer-1);
  $('nPluss').onclick = () => endre('nummer', d.nummer >= 99 ? 1 : d.nummer+1);

  r = seksjon('Navn på ryggen');
  const inp = document.createElement('input'); inp.id = 'navnFelt'; inp.maxLength = 10; inp.value = d.navn; inp.placeholder = 'Kallenavn';
  inp.setAttribute('autocomplete','off'); inp.setAttribute('autocorrect','off'); inp.setAttribute('spellcheck','false');
  inp.oninput = () => { d.navn = inp.value.replace(/[^A-Za-zÆØÅæøåÄÖÜäöüÉé .\-]/g,'').slice(0,10); if (inp.value !== d.navn) inp.value = d.navn; lagre(); tegnDraktSpiller(); };
  r.appendChild(inp);
  const lite = document.createElement('p'); lite.className = 'liten'; lite.textContent = 'Tips: bruk et kallenavn. Navnet lagres bare på denne enheten.'; box.appendChild(lite);

  r = seksjon('Hudfarge');
  for (const fc of HUD) { const b = document.createElement('button'); b.className = 'farge' + (d.hud === fc ? ' valgt' : ''); b.style.background = fc; b.onclick = () => endre('hud', fc); r.appendChild(b); }
  r = seksjon('Hår');
  for (const [id, navn] of HARSTIL) { const b = document.createElement('button'); b.className = 'tekstknapp' + (d.harstil === id ? ' valgt' : ''); b.textContent = navn; b.onclick = () => endre('harstil', id); r.appendChild(b); }
  r = seksjon('Hårfarge');
  for (const fc of HARFARGER) { const b = document.createElement('button'); b.className = 'farge' + (d.har === fc ? ' valgt' : ''); b.style.background = fc; b.onclick = () => endre('har', fc); r.appendChild(b); }

  tegnDraktSpiller();
}
function tegnDraktSpiller(){
  const c = $('draktSpiller').getContext('2d'); c.clearRect(0,0,600,760);
  tegnSpiller(c, 300, 730, 440, S.drakt, skoStat(), {lop:null, spark:null});
}
$('tilfeldig').onclick = () => {
  const v = a => a[Math.floor(Math.random()*a.length)];
  const d = S.drakt;
  d.monster = v(MONSTER)[0]; d.farge = v(FARGER); do { d.farge2 = v(FARGER); } while (d.farge2 === d.farge);
  d.shorts = v(FARGER); d.sokker = Math.random() < 0.5 ? d.farge : v(FARGER); d.nummer = 1 + Math.floor(Math.random()*99);
  lagre(); LYD.pling(); byggDrakt(); byggBakgrunn();
};

/* ---------- knapper ---------- */
$('startKamp').onclick = () => { lyd(); startSpill('kamp'); };
$('startTrening').onclick = () => { lyd(); startSpill('trening'); };
$('tilButikk').onclick = () => { LYD.klikk(); visSkjerm('butikk'); };
$('tilDrakt').onclick = () => { LYD.klikk(); visSkjerm('drakt'); };
document.querySelectorAll('.tilbake').forEach(b => b.onclick = () => { LYD.klikk(); visSkjerm('meny'); });
document.querySelectorAll('.lydknapp').forEach(b => b.onclick = () => { S.lyd = !S.lyd; lagre(); oppdaterLydknapper(); if (S.lyd) LYD.klikk(); });
$('hudUt').onclick = () => {
  LYD.klikk();
  if (modus === 'kamp' && fase !== 'slutt' && (kamp.du.length || kamp.dem.length)) {
    $('dialog').classList.add('vis'); $('dialogNei').focus(); return;
  }
  timere.length = 0; sh = null; visSkjerm('meny');
};
$('dialogNei').onclick = () => { LYD.klikk(); $('dialog').classList.remove('vis'); };
$('dialogJa').onclick = () => { LYD.klikk(); $('dialog').classList.remove('vis'); timere.length = 0; sh = null; visSkjerm('meny'); };
$('resIgjen').onclick = () => startSpill('kamp');
$('resMeny').onclick = () => { sh = null; visSkjerm('meny'); };

window.addEventListener('resize', storrelse);
window.addEventListener('orientationchange', () => setTimeout(storrelse, 200));
document.addEventListener('gesturestart', e => e.preventDefault());

storrelse();
oppdaterLydknapper();
visSkjerm('meny');
requestAnimationFrame(loop);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { byggBakgrunn(); if (skjerm === 'meny') byggMeny(); });
</script>
</body>
</html>
