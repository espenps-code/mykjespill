<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vaskemester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d3557;--ink2:#46607f;--aqua:#2bb3c0;--aqua2:#1d8f9b;--mint:#7fd8be;--sun:#ffd166;--coral:#ef6f6c;--card:#ffffff;--soft:#eef8fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#a9e2fb 0%,#d9f3ff 55%,#fff7e6 100%);user-select:none;-webkit-user-select:none}
h1,h2,h3,.baloo{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.1}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block}
.hidden{display:none!important}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud > *{pointer-events:auto}
#topbar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:flex;gap:8px;align-items:center}
.pill{background:rgba(255,255,255,.92);border-radius:18px;box-shadow:0 4px 14px rgba(29,53,87,.12);padding:8px 12px;display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.95);box-shadow:0 4px 14px rgba(29,53,87,.14);font-size:22px;display:grid;place-items:center;flex:none}
.iconbtn:active{transform:scale(.94)}
#lvlName{font-weight:800;font-family:'Baloo 2';font-size:18px;white-space:nowrap}
#meterWrap{flex:1;min-width:0}
#meterLbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink2)}
#meter{height:12px;border-radius:8px;background:#e1ecf2;overflow:hidden;margin-top:3px}
#meterFill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--aqua));border-radius:8px;transition:width .6s cubic-bezier(.3,1.4,.5,1)}
#score{font-weight:800;font-family:'Baloo 2';font-size:18px;white-space:nowrap}
#order{position:absolute;top:calc(env(safe-area-inset-top,0px) + 68px);left:50%;transform:translateX(-50%)}
#minimap{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 68px);width:130px;height:130px;border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(29,53,87,.14)}
#joy{position:absolute;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 18px rgba(29,53,87,.18);touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(29,53,87,.25);pointer-events:none}
#joyKnob::after{content:'👣';position:absolute;inset:0;display:grid;place-items:center;font-size:26px}
#compass{position:absolute;top:calc(env(safe-area-inset-top,0px) + 128px);left:50%;transform:translateX(-50%);background:var(--sun);border-radius:18px;padding:6px 14px;font-weight:800;display:flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(29,53,87,.18);pointer-events:none}
#compArrow{display:inline-block;font-size:24px;transition:transform .15s}
#crosshair{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 0 0 2px rgba(29,53,87,.25);pointer-events:none}
#scrub{position:fixed;inset:0;z-index:25;touch-action:none;cursor:none}
#scrubTop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);flex-direction:column;gap:6px;min-width:260px;font-family:'Baloo 2';font-weight:800;font-size:20px}
#scrubBar{width:100%;height:14px;border-radius:8px;background:#e1ecf2;overflow:hidden}
#scrubFill{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--aqua))}
#scrubTool{position:absolute;font-size:84px;left:50%;top:60%;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
#scrubHint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);left:50%;transform:translateX(-50%);background:rgba(29,53,87,.8);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;animation:bob 1.2s infinite}
.bub{position:fixed;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 30% 30%,#fff,rgba(190,240,255,.5) 60%,rgba(255,255,255,.8));border:1.5px solid rgba(255,255,255,.9);animation:bubUp 1s ease-out forwards;z-index:26}
@keyframes bubUp{to{transform:translate(var(--dx),-80px) scale(1.4);opacity:0}}
.mapWrap canvas{width:100%;height:auto;border-radius:18px;background:#eef8fb;touch-action:manipulation}
#xchips{position:absolute;top:calc(env(safe-area-inset-top,0px) + 66px);left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding:4px 10px 8px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:rgba(255,255,255,.9);border-radius:14px;padding:7px 12px;font-weight:700;font-size:14px;box-shadow:0 3px 10px rgba(29,53,87,.1);display:flex;gap:6px;align-items:center;border:2px solid transparent}
.chip.on{border-color:var(--aqua);background:#fff}
.chip.done{background:#dff7ee}
.chip small{color:var(--ink2);font-weight:700}
#bottombar{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:8px;align-items:flex-end;justify-content:space-between}
#order{display:flex;gap:4px;align-items:center;padding:6px 10px;flex-wrap:nowrap;overflow:hidden}
#order .ph{display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;color:#8aa0b5;min-width:44px;padding:2px 2px;border-radius:10px}
#order .ph span{font-size:20px;filter:grayscale(1);opacity:.55}
#order .ph.cur{color:var(--ink);background:#fff4cf}
#order .ph.cur span{filter:none;opacity:1;animation:bob 1.2s ease-in-out infinite}
#order .ph.ok{color:var(--aqua2)}
#order .ph.ok span{filter:none;opacity:1}
#order .arr{color:#b8c7d4;font-weight:800}
#order .ph span img{width:26px;height:26px;display:block}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
#helpBtns{display:flex;gap:8px}

/* ---------- Toast ---------- */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 118px);transform:translate(-50%,-20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-weight:700;opacity:0;transition:.35s;z-index:30;pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- Sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(29,53,87,.25);padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,1,.3,1);max-height:78vh;overflow:auto}
#sheet.open{transform:translateY(0)}
#sheet .grab{width:44px;height:5px;border-radius:3px;background:#d4dee6;margin:-6px auto 10px}
.sheetHead{display:flex;gap:12px;align-items:center}
.sheetEmoji{font-size:40px;width:60px;height:60px;border-radius:18px;background:var(--soft);display:grid;place-items:center;flex:none}
.sheetHead h2{font-size:22px}
.sheetHead p{margin:2px 0 0;color:var(--ink2);font-size:15px}
.ask{margin:14px 0 8px;font-weight:800;font-family:'Baloo 2';font-size:18px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tool{background:var(--soft);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:14px;text-align:center;border:3px solid transparent;transition:transform .1s}
.tool .ti{font-size:34px;line-height:1.1}.tool .ti img{width:72px;height:72px;display:block;margin:-4px auto 0;filter:drop-shadow(0 3px 4px rgba(29,53,87,.15))}.badge img{width:22px;height:22px;vertical-align:middle}#scrubTool img{width:130px;height:130px;display:block}
.tool:active{transform:scale(.95)}
.tool.wrong{background:#ffe3e1;border-color:var(--coral);opacity:.6;animation:shake .4s}
.tool.right{background:#dcf7ec;border-color:var(--mint)}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#sheetMsg{margin-top:12px;background:#fff4e5;border-radius:14px;padding:10px 12px;font-size:15px;display:none}
#sheetMsg.show{display:block}
.closeX{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:12px;background:var(--soft);font-size:20px}
.speak{background:var(--soft);border-radius:12px;padding:6px 10px;font-size:18px}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(29,53,87,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:16px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.card{background:#fff;border-radius:28px;box-shadow:0 20px 60px rgba(29,53,87,.3);padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto;position:relative;animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.bobla{width:64px;height:64px;flex:none}
.bobimg{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(29,53,87,.18))}.sheetEmoji img{width:58px;height:58px}.dmini{width:26px;height:26px;vertical-align:middle}.bubbleRow{display:flex;gap:12px;align-items:flex-start}
.bubbleText{background:var(--soft);border-radius:4px 18px 18px 18px;padding:12px 14px;font-size:16px;line-height:1.45;flex:1}
.cardTitle{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cardTitle h2{font-size:24px;flex:1}
.badge{display:inline-flex;align-items:center;gap:4px;background:#fff4cf;border-radius:10px;padding:3px 9px;font-size:13px;font-weight:700}
.btnRow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;min-width:130px;padding:14px 16px;border-radius:16px;font-weight:800;font-size:17px;font-family:'Baloo 2';background:var(--aqua);color:#fff;box-shadow:0 4px 0 var(--aqua2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--aqua2)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 4px 0 #cfe0e8}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #e0ad35}
.plus{font-family:'Baloo 2';font-weight:800;color:var(--aqua2);font-size:20px}

/* ---------- Start ---------- */
#start{position:fixed;inset:0;z-index:50;overflow:auto;background:linear-gradient(180deg,#9fdcf7 0%,#d6f2ff 50%,#fff3db 100%);padding:calc(env(safe-area-inset-top,0px) + 24px) 16px 40px}
.bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bubbles i{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,rgba(255,255,255,.35) 40%,rgba(120,210,240,.25) 70%,rgba(255,255,255,.6));border:1.5px solid rgba(255,255,255,.8);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) translateX(30px)}}
.startInner{max-width:880px;margin:0 auto;position:relative}
.logo{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:6px}
.logo h1{font-size:clamp(44px,9vw,76px);color:#fff;text-shadow:0 4px 0 var(--aqua2),0 10px 24px rgba(29,53,87,.25);letter-spacing:.5px}
.tag{text-align:center;font-size:18px;font-weight:700;color:var(--ink);margin-bottom:22px}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.lvl{background:#fff;border-radius:26px;padding:18px;box-shadow:0 10px 30px rgba(29,53,87,.14);text-align:left;position:relative;overflow:hidden;border:3px solid transparent;transition:transform .15s}
.lvl:active{transform:scale(.97)}
.lvl .art{height:120px;border-radius:18px;display:grid;place-items:center;font-size:64px;margin-bottom:12px}
.lvl h3{font-size:26px}
.lvl p{margin:4px 0 10px;color:var(--ink2);font-size:15px;line-height:1.35}
.lvl .meta{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
.lvl .stars{font-size:22px;letter-spacing:2px}
.lvl.locked{filter:grayscale(.9);opacity:.75}
.lvl.locked::after{content:'🔒';position:absolute;top:14px;right:16px;font-size:30px}
.startBtns{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.startBtns .btn{flex:0 1 220px}
.small{font-size:13px;color:var(--ink2)}
.linkbtn{text-decoration:underline;color:var(--ink2);font-size:13px;margin-top:22px;display:block;margin-left:auto;margin-right:auto}

/* ---------- Sort minigame ---------- */
.sortItems{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:96px;margin:14px 0}
.sItem{width:96px;background:var(--soft);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;text-align:center;border:3px solid transparent;transition:.2s}
.sItem .se{font-size:40px;height:52px;display:grid;place-items:center}
.sItem svg{width:52px;height:52px}
.sItem.sel{border-color:var(--aqua);background:#e0f7fa;transform:translateY(-4px) scale(1.05);box-shadow:0 8px 18px rgba(43,179,192,.3)}
.sItem.gone{transform:scale(0);opacity:0;width:0;padding:0;margin:0 -5px;border:0}
.sItem.bad{animation:shake .4s;border-color:var(--coral)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.bin{border-radius:18px;padding:12px 6px;text-align:center;font-weight:800;font-size:14px;border:3px dashed rgba(29,53,87,.25);min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:.15s}
.bin .bi{font-size:30px}
.bin small{font-weight:700;opacity:.8}
.bin.ready{border-style:solid;border-color:var(--aqua);transform:scale(1.03)}
.bin.flash{animation:binok .5s}
@keyframes binok{50%{transform:scale(1.1);box-shadow:0 0 0 6px rgba(127,216,190,.6)}}
#sortMsg{min-height:46px;margin-bottom:10px;background:var(--soft);border-radius:14px;padding:10px 12px;font-size:15px}

.sortDock{position:sticky;bottom:-22px;background:#fff;padding:10px 0 14px;margin-top:6px;box-shadow:0 -10px 16px -10px rgba(29,53,87,.15)}
@media (max-width:760px){.sItem{width:76px;padding:6px 2px;font-size:12px}.sItem .se{font-size:30px;height:40px}.sItem svg{width:40px;height:40px}.bins{grid-template-columns:repeat(3,1fr);gap:6px}.bin{min-height:70px;padding:6px 4px;font-size:12px}.bin .bi{font-size:22px}#sortMsg{font-size:13px;padding:8px 10px;min-height:38px}}
/* ---------- Quiz ---------- */
.qOpt{display:block;width:100%;text-align:left;background:var(--soft);border-radius:16px;padding:14px 16px;margin-top:10px;font-size:17px;font-weight:700;border:3px solid transparent}
.qOpt.right{background:#dcf7ec;border-color:var(--mint)}
.qOpt.wrong{background:#ffe3e1;border-color:var(--coral)}
.qExpl{margin-top:12px;background:#fff4e5;border-radius:14px;padding:12px;font-size:15px;line-height:1.45}

/* ---------- End ---------- */
.bigStars{font-size:56px;text-align:center;letter-spacing:6px;margin:6px 0}
.bigStars span{display:inline-block;animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both}
.bigStars span:nth-child(2){animation-delay:.2s}.bigStars span:nth-child(3){animation-delay:.4s}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 14px}
.stats .badge{font-size:14px;padding:6px 10px}
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:8px}
.planCol{background:var(--soft);border-radius:16px;padding:12px}
.planCol h3{font-size:18px;margin-bottom:6px}
.planCol li{list-style:none;font-size:14px;padding:4px 0;display:flex;gap:6px}
.planCol li::before{content:'☐';color:var(--aqua2)}
.planCol ul{margin:0;padding:0}

/* ---------- Tips book ---------- */
.tipGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.tipCard{background:var(--soft);border-radius:16px;padding:12px;font-size:14px;line-height:1.4}
.tipCard b{display:block;font-size:15px;margin-bottom:4px}
.tipCard.locked{opacity:.55;text-align:center;display:grid;place-items:center;min-height:80px}
.how li{margin:8px 0;line-height:1.4;font-size:16px}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:60;background:#d6f2ff;font-family:'Baloo 2';font-size:22px}
@media (max-width:760px){
#order{left:10px;transform:none;padding:6px 8px}
#order .ph{min-width:30px;font-size:0;padding:2px}
#order .ph span{font-size:19px}
#order .arr{font-size:12px}
#minimap{width:96px;height:96px}
#joy{width:126px;height:126px;left:16px}
#compass{top:calc(env(safe-area-inset-top,0px) + 120px)}
}
</style>
</head>
<body>
<div id="loading">Fyller vaskebøtta … 🫧</div>
<div id="scene"></div>

<div id="hud" class="hidden">
  <div id="topbar">
    <button class="iconbtn" id="homeBtn" aria-label="Meny">🏠</button>
    <div class="pill" id="meterWrap">
      <div style="flex:1;min-width:0">
        <div id="meterLbl"><span id="lvlName">Hybel</span><span id="meterPct">0 % rent</span></div>
        <div id="meter"><div id="meterFill"></div></div>
      </div>
    </div>
    <div class="pill" id="score">⭐ 0</div>
  </div>
  <button class="pill" id="order" aria-label="Rekkefølge"></button>
  <div id="compass" class="hidden"><span id="compArrow">⬆️</span><span id="compTxt"></span></div>
  <canvas id="minimap" width="260" height="260" aria-label="Kart"></canvas>
  <div id="joy"><div id="joyKnob"></div></div>
  <div id="bottombar">
    <div></div>
    <div id="helpBtns">
      <button class="iconbtn" id="voiceBtn" aria-label="Opplesing">🗣️</button>
      <button class="iconbtn" id="soundBtn" aria-label="Lyd">🔊</button>
      <button class="iconbtn" id="mapBtn" aria-label="Kart">🗺️</button>
      <button class="iconbtn" id="hintBtn" aria-label="Hint">💡</button>
    </div>
  </div>
  <div id="crosshair"></div>
</div>

<div id="scrub" class="hidden">
  <div id="scrubTop" class="pill"><span id="scrubTxt">Gni bort skitten!</span><div id="scrubBar"><div id="scrubFill"></div></div></div>
  <div id="scrubTool">🧽</div>
  <div id="scrubHint">👆 Dra fingeren fram og tilbake</div>
</div>

<div id="sheet">
  <div class="grab"></div>
  <button class="closeX" id="sheetClose" aria-label="Lukk">✕</button>
  <div class="sheetHead">
    <div class="sheetEmoji" id="sheetEmoji">🧽</div>
    <div style="flex:1;padding-right:44px">
      <h2 id="sheetTitle">…</h2>
      <p id="sheetDesc">…</p>
    </div>
  </div>
  <div class="ask">Hva bruker du? <button class="speak" id="sheetSpeak" aria-label="Les opp">🔊</button></div>
  <div class="tools" id="sheetTools"></div>
  <div id="sheetMsg"></div>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>

<div id="start" class="hidden">
  <div class="bubbles" id="bubbles"></div>
  <div class="startInner">
    <div class="logo"><span id="logoBobla"></span><h1>Vaskemester</h1></div>
    <div class="tag">Lær å holde et hjem skinnende rent – fra hybel til hus!</div>
    <div class="levels" id="levels"></div>
    <div class="startBtns">
      <button class="btn sun" id="howBtn">❓ Slik spiller du</button>
      <button class="btn ghost" id="bookBtn">📖 Tipsboka</button>
    </div>
    <button class="linkbtn" id="resetBtn">Nullstill framgang (voksen)</button>
  </div>
</div>

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const VA=new Audio();VA.preload='auto';let vq=[],vAuto=true,vFallback=null,vUnlocked=false;
let voiceOn=store.voice!==false;
function unlockVoice(){if(vUnlocked)return;vUnlocked=true;try{VA.src='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';const p=VA.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
function stopVoice(){vq=[];try{VA.pause();}catch(e){}try{speechSynthesis.cancel();}catch(e){}}
function vNext(){const n=vq.shift();if(!n)return;try{VA.src='vaskemester/lyd/'+n+'.mp3';const p=VA.play();if(p&&p.catch)p.catch(()=>vErr());}catch(e){vErr();}}
function vErr(){if(!vAuto&&vFallback){const f=vFallback;vFallback=null;vq=[];speak(f);}else vNext();}
VA.addEventListener('ended',vNext);VA.addEventListener('error',()=>{if(VA.src.indexOf('/lyd/')>=0)vErr();});
function voice(names,fallback,auto){auto=auto!==false;if(auto&&!voiceOn)return;stopVoice();vAuto=auto;vFallback=fallback||null;vq=names.slice();vNext();}
function quizFile(q){for(const k of Object.keys(QUIZ)){if(k==='hybel')continue;const i=QUIZ[k].indexOf(q);if(i>=0)return `quiz-${k}-${i+1}`;}return 'quiz-x';}

// ---------- toast & modal ----------
let toastT=0;
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms||2200);}
function modal(html,mount){
  return new Promise(res=>{
    const root=$('#modalRoot');
    const wrap=document.createElement('div');wrap.className='modal';
    wrap.innerHTML=`<div class="card">${html}</div>`;
    root.appendChild(wrap);
    const close=(v)=>{wrap.remove();res(v);};
    wrap.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{SND.tap();close(b.dataset.close);}));
    wrap.querySelectorAll('[data-say]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.voice)voice(b.dataset.voice.split(','),b.dataset.say,false);else speak(b.dataset.say);}));
    if(mount)mount(wrap,close);
  });
}

  const off=th/2+0.05;const rA=ax==='x'?roomAt(mid,fixed-off):roomAt(fixed-off,mid);const rB=ax==='x'?roomAt(mid,fixed+off):roomAt(fixed+off,mid);

  const cs=[...cuts].sort((p,q)=>p-q);for(let i=0;i<cs.length-1;i++){const s=cs[i],e=cs[i+1],m=(s+e)/2;const inGap=gp.some(g=>m>g[0]&&m<g[1]);

const EYE=1.42, RAD=0.22, SPEED=2.1;

function hitsAt(x,z){for(const c of colliders){if(x>c.x0-RAD&&x<c.x1+RAD&&z>c.z0-RAD&&z<c.z1+RAD)return true;}return false;}
function moveBy(dx,dz){let ok=false;if(dx&&!hitsAt(P.x+dx,P.z)){P.x+=dx;ok=true;}if(dz&&!hitsAt(P.x,P.z+dz)){P.z+=dz;ok=true;}return ok;}

function freeSpot(r){let best=null,bs=-99;for(let i=1;i<10;i++)for(let j=1;j<10;j++){const x=r.x+r.w*i/10,z=r.z+r.d*j/10;if(hitsAt(x,z))continue;let d=9;colliders.forEach(c=>{const a=Math.max(c.x0-x,0,x-c.x1),b=Math.max(c.z0-z,0,z-c.z1);d=Math.min(d,Math.hypot(a,b));});const sc=Math.min(d,0.7)-Math.hypot(x-(r.x+r.w/2),z-(r.z+r.d/2))*0.25;if(sc>bs){bs=sc;best=[x,z];}}return best||[r.x+r.w/2,r.z+r.d/2];}

const ray=new THREE.Raycaster();

function handleTap(x,y){if(!L||S.busy||S.scrub||$('#sheet').classList.contains('open'))return;
  const v=new THREE.Vector2(x/window.innerWidth*2-1,-(y/window.innerHeight)*2+1);ray.setFromCamera(v,camera);
  let tid=null;const mh=ray.intersectObjects(markers.filter(m=>m.visible),false)[0];if(mh)tid=mh.object.userData.taskId;

    if(h){if(h.object.userData.taskId&&!S.done.has(h.object.userData.taskId))tid=h.object.userData.taskId;else{walkTo(h.point.x,h.point.z,null);ring(h.point.x,h.point.z);return;}}}
  if(tid){const t=L.tasks.find(t=>t.id===tid);if(t&&!S.done.has(tid))approach(t);}}
let ringMesh=null;
function ring(x,z){if(!ringMesh){ringMesh=new THREE.Mesh(new THREE.RingGeometry(0.12,0.18,28),new THREE.MeshBasicMaterial({color:0x2bb3c0,transparent:true,depthWrite:false}));ringMesh.rotation.x=-PI/2;}
  world.add(ringMesh);ringMesh.position.set(x,0.01,z);ringMesh.material.opacity=1;ringMesh.scale.set(1,1,1);anims.push({t:0,dur:0.8,fn:p=>{ringMesh.material.opacity=1-p;ringMesh.scale.setScalar(1+p);}});}
const losRay=new THREE.Raycaster();
function wallBetween(t){const o=new THREE.Vector3(P.x,EYE,P.z),tg=new THREE.Vector3(t.pos[0],t.pos[1]+0.05,t.pos[2]);const dir=tg.clone().sub(o);const dist=dir.length();if(dist<0.01)return false;losRay.set(o,dir.normalize());losRay.far=Math.max(0,dist-0.08);return losRay.intersectObjects(walls,false).length>0;}
function notHere(t){const r=roomOf(taskRoom(t));S.hint=t.id;updateCompass();SND.lock();const pre=['bad','kjokken','vaskerom'].includes(r.kind)?'på':'i';toast(`Du må gå inn ${pre} ${r.name.toLowerCase()} først 🚪 Følg pila!`,2600);voice(['replikk-ga-inn']);}
function approach(t){if(taskRoom(t)!==P.room){notHere(t);return;}SND.tap();const d=Math.hypot(t.pos[0]-P.x,t.pos[2]-P.z);
  if(d<=1.75&&!wallBetween(t)){lookAtP(t.pos[0],t.pos[1],t.pos[2]);setTimeout(()=>onTask(t),180);return;}
  const k=(d-1.1)/d;walkTo(P.x+(t.pos[0]-P.x)*k,P.z+(t.pos[2]-P.z)*k,()=>{const d2=Math.hypot(t.pos[0]-P.x,t.pos[2]-P.z);
    if(taskRoom(t)!==P.room){notHere(t);}else if(d2<=2.8&&!wallBetween(t)){lookAtP(t.pos[0],t.pos[1],t.pos[2]);setTimeout(()=>onTask(t),280);}else toast('Jeg kommer ikke nærmere – prøv å gå rundt! 🚶');});}

function updatePlayer(dt){
  let f=-joy.vy,s=joy.vx;if(keys.w||keys.arrowup)f+=1;if(keys.s||keys.arrowdown)f-=1;if(keys.a)s-=1;if(keys.d)s+=1;
  if(keys.arrowleft){P.yaw+=dt*1.9;P.ty=null;}if(keys.arrowright){P.yaw-=dt*1.9;P.ty=null;}
  const fw=[-Math.sin(P.yaw),-Math.cos(P.yaw)],rt=[Math.cos(P.yaw),-Math.sin(P.yaw)];let moving=false;
  if(!S.scrub&&!S.busy&&(Math.abs(f)>0.06||Math.abs(s)>0.06)){P.walk=null;const m=Math.min(1,Math.hypot(f,s));let dx=fw[0]*f+rt[0]*s,dz=fw[1]*f+rt[1]*s;const n=Math.hypot(dx,dz)||1;const sp=SPEED*dt*m;moving=moveBy(dx/n*sp,dz/n*sp);}
  else if(P.walk){const w=P.walk;const dx=w.x-P.x,dz=w.z-P.z,d=Math.hypot(dx,dz);w.t+=dt;
    if(d<0.12||w.t>7){P.walk=null;w.cb&&w.cb();}
    else{const sp=Math.min(d,SPEED*dt);const ok=moveBy(dx/d*sp,dz/d*sp);P.ty=Math.atan2(-dx,-dz);if(!ok){w.stuck+=dt;if(w.stuck>0.3){P.walk=null;w.cb&&w.cb();}}else{moving=true;w.stuck=0;}}}
  if(P.ty!=null){let d=P.ty-P.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));P.yaw+=d*Math.min(1,dt*7);if(Math.abs(d)<0.005&&!P.walk)P.ty=null;}
  if(P.tp!=null){P.pitch+=(P.tp-P.pitch)*Math.min(1,dt*7);if(Math.abs(P.tp-P.pitch)<0.004)P.tp=null;}
  if(moving)P.bob+=dt*9;
  camera.position.set(P.x,EYE+Math.sin(P.bob)*0.022,P.z);camera.rotation.set(P.pitch,P.yaw,0);
  const r=roomAt(P.x,P.z);if(r&&r.id!==P.room){P.room=r.id;updateHUD();}}

function drawMap(cv,big){const x=cv.getContext('2d'),Wc=cv.width,Hc=cv.height,pad=big?24:14;const sc=Math.min((Wc-pad*2)/L.W,(Hc-pad*2)/L.D);const ox=(Wc-L.W*sc)/2,oy=(Hc-L.D*sc)/2;
  x.clearRect(0,0,Wc,Hc);
  L.rooms.forEach(r=>{const ts=roomTasks(r.id),done=ts.every(t=>S.done.has(t.id));x.fillStyle=r.id===P.room?'#fff4cf':(done?'#dcf7ec':'#ffffff');x.fillRect(ox+r.x*sc,oy+r.z*sc,r.w*sc,r.d*sc);x.strokeStyle='#46607f';x.lineWidth=big?3:2;x.strokeRect(ox+r.x*sc,oy+r.z*sc,r.w*sc,r.d*sc);
    if(big){x.fillStyle='#1d3557';x.font='bold 32px "Baloo 2",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText((done?'✅ ':'')+r.name,ox+(r.x+r.w/2)*sc,oy+(r.z+r.d/2)*sc-16);x.font='bold 24px sans-serif';x.fillStyle='#46607f';x.fillText(ts.filter(t=>S.done.has(t.id)).length+' / '+ts.length,ox+(r.x+r.w/2)*sc,oy+(r.z+r.d/2)*sc+18);}});
  L.tasks.forEach(t=>{if(S.done.has(t.id))return;x.beginPath();x.arc(ox+t.pos[0]*sc,oy+t.pos[2]*sc,big?10:4.5,0,PI*2);x.fillStyle=t.id===S.hint?'#ffb703':(blockers(t).length?'#a9b6c2':'#2bb3c0');x.fill();});
  const px=ox+P.x*sc,py=oy+P.z*sc,fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw),s=big?16:10;
  x.beginPath();x.moveTo(px+fx*s,py+fz*s);x.lineTo(px-fx*s*0.6+fz*s*0.6,py-fz*s*0.6-fx*s*0.6);x.lineTo(px-fx*s*0.6-fz*s*0.6,py-fz*s*0.6+fx*s*0.6);x.closePath();x.fillStyle='#ef6f6c';x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke();
  return {sc,ox,oy};}
function showMap(){if(!L||S.busy||S.scrub)return;SND.tap();S.busy=true;const ar=L.D/L.W;
  modal(`<div class="cardTitle"><h2>🗺️ Kart</h2></div><p class="small" style="margin:0 0 8px">Trykk på et rom for å hoppe dit. 🔵 = skittent · ⚪ = låst · 🟠 = hint</p><div class="mapWrap"><canvas id="bigMap" width="800" height="${Math.round(800*ar)}"></canvas></div><div class="btnRow"><button class="btn ghost" data-close="1">Lukk</button></div>`,
  (wrap,close)=>{const cv=wrap.querySelector('#bigMap');const g=drawMap(cv,true);cv.addEventListener('click',e=>{const b=cv.getBoundingClientRect();const mx=(e.clientX-b.left)*cv.width/b.width,my=(e.clientY-b.top)*cv.height/b.height;const wx=(mx-g.ox)/g.sc,wz=(my-g.oy)/g.sc;const r=roomAt(wx,wz);if(r){close();teleport(r.id);}});})
  .then(()=>{S.busy=false;});}
$('#minimap').addEventListener('click',showMap);$('#mapBtn').onclick=showMap;

let last=performance.now(),mapT=0;
function loop(now){requestAnimationFrame(loop);const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(L){updatePlayer(dt);
    markers.forEach(m=>{const u=m.userData;const t=L.tasks.find(t=>t.id===u.taskId);const d=Math.hypot(m.position.x-P.x,m.position.z-P.z);m.visible=taskRoom(t)===P.room&&!S.done.has(u.taskId);
      let s=clamp(0.1+d*0.055,0.13,0.45);if(u.pulse>0){u.pulse-=dt;s*=1+0.35*Math.abs(Math.sin(u.pulse*8));}m.scale.set(s,s,1);m.position.y=u.base+Math.sin(now/400+u.ph)*0.04;});
    mapT-=dt;if(mapT<=0){mapT=0.2;drawMap($('#minimap'),false);updateCompass();}}
  Object.values(dirts).forEach(g=>g.children.forEach(o=>{if(o.userData.float!=null){o.position.y+=Math.sin(now/500+o.userData.float*2)*0.0015;o.rotation.y+=dt*0.5;}}));
  Object.values(grimes).forEach(g=>{if(g.userData.target!=null)g.material.opacity+=(g.userData.target-g.material.opacity)*Math.min(1,dt*3);});
  for(let i=anims.length-1;i>=0;i--){const a=anims[i];a.t+=dt;const p=Math.min(1,a.t/a.dur);a.fn(p);if(p>=1){anims.splice(i,1);a.done&&a.done();}}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.v.y-=dt*1.2;p.s.position.addScaledVector(p.v,dt);p.s.material.opacity=Math.max(0,p.life/p.max);if(p.life<=0){world.remove(p.s);particles.splice(i,1);}}
  renderer.render(scene,camera);}
function updateCompass(){const el=$('#compass');if(!S.hint||S.done.has(S.hint)){S.hint=null;el.classList.add('hidden');return;}const t=L.tasks.find(t=>t.id===S.hint);const dx=t.pos[0]-P.x,dz=t.pos[2]-P.z;const a=Math.atan2(-dx,-dz);let rel=a-P.yaw;rel=Math.atan2(Math.sin(rel),Math.cos(rel));
  el.classList.remove('hidden');$('#compArrow').style.transform=`rotate(${-rel*180/PI}deg)`;$('#compTxt').textContent=`${MARK[t.type]} ${Math.hypot(dx,dz).toFixed(1).replace('.',',')} m`;}

function sparkle(pos,n,spread){for(let i=0;i<(n||16);i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:STAR,transparent:true,depthWrite:false,color:[0xffffff,0xfff2a8,0xbdf2ff][i%3]}));const sc=R(0.06,0.14);s.scale.set(sc,sc,1);s.position.set(pos.x+R(-0.1,0.1)*(spread||1),pos.y+0.1,pos.z+R(-0.1,0.1)*(spread||1));const l=R(0.7,1.2);particles.push({s,v:new THREE.Vector3(R(-0.6,0.6)*(spread||1),R(0.8,1.6),R(-0.6,0.6)*(spread||1)),life:l,max:l});world.add(s);}}

  if(b.length){SND.lock();if(!S.orderHit.has(t.id)){S.orderHit.add(t.id);S.miss.order++;}

const SCRUBTXT={rydd:'Dra for å rydde!',stovsuger:'Støvsug fram og tilbake!',mopp:'Mopp fram og tilbake!',lufte:'Dra for å åpne vinduet!',sengetoy:'Dra for å re opp senga!',sopel:'Dra for å knyte igjen posen!',rist:'Rist matta – dra fram og tilbake!',sjekkmat:'Dra for å rydde kjøleskapet!',oppvaskmaskin:'Dra for å fylle maskinen!',oppvask:'Skrubb oppvasken!',lofilter:'Dra for å tømme filteret!',tomvask:'Dra for å starte maskinen!',vaskeklut:'Dra for å bytte klut!',plukk:'Dra for å plukke opp!',stovklut:'Tørk støvet bort!',glass:'Puss glasset blankt!',toalett:'Skrubb toalettet!',mugg:'Spray og skrubb!',sitron:'Dra for å tørke av!',fettfilter:'Skrubb filteret!',baderens:'Skrubb bort kalken!'};
function bubble(x,y){for(let i=0;i<2;i++){const b=document.createElement('div');b.className='bub';const s=10+Math.random()*22;b.style.cssText=`width:${s}px;height:${s}px;left:${x-s/2+(Math.random()-0.5)*40}px;top:${y-s/2+(Math.random()-0.5)*30}px;--dx:${(Math.random()-0.5)*60}px`;document.body.appendChild(b);setTimeout(()=>b.remove(),1000);}}
function scrub(t){return new Promise(res=>{S.scrub=true;const el=$('#scrub'),tool=$('#scrubTool'),fill=$('#scrubFill');
  el.classList.remove('hidden');$('#scrubTxt').textContent=SCRUBTXT[t.tool]||'Gni bort skitten!';tool.innerHTML=ti(t.tool);fill.style.width='0';tool.style.left='50%';tool.style.top='60%';$('#scrubHint').style.display='';
  lookAtP(t.pos[0],t.pos[1],t.pos[2]);
  const g=dirts[t.id];const s0=g.scale.clone();let prog=0,lastP=null,lastB=0;const need=Math.min(window.innerWidth,window.innerHeight)*2.6;
  const mv=e=>{tool.style.left=e.clientX+'px';tool.style.top=e.clientY+'px';if(!lastP)return;const d=Math.hypot(e.clientX-lastP.x,e.clientY-lastP.y);lastP={x:e.clientX,y:e.clientY};if(d<1)return;
    $('#scrubHint').style.display='none';prog=Math.min(1,prog+d/need);fill.style.width=(prog*100)+'%';const k=1-prog*0.8;g.scale.set(s0.x*k,s0.y*k,s0.z*k);
    tool.style.transform=`translate(-50%,-50%) rotate(${Math.sin(performance.now()/55)*18}deg)`;const now=performance.now();if(now-lastB>70){lastB=now;bubble(e.clientX,e.clientY);if(Math.random()<0.25)tone(600+Math.random()*500,0,0.05,'sine',0.04);}
    if(prog>=1)finish();};
  const down=e=>{lastP={x:e.clientX,y:e.clientY};try{el.setPointerCapture(e.pointerId);}catch(_){}tool.style.left=e.clientX+'px';tool.style.top=e.clientY+'px';};
  const up=()=>{lastP=null;};
  function finish(){el.removeEventListener('pointermove',mv);el.removeEventListener('pointerdown',down);el.removeEventListener('pointerup',up);el.classList.add('hidden');S.scrub=false;res();}
  el.addEventListener('pointerdown',down);el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);});}
window.__scrubAuto=()=>{};

function completeTask(t){S.busy=true;const g=dirts[t.id];const pos=new THREE.Vector3(t.pos[0],t.pos[1]+0.15,t.pos[2]);

// ================= MINISPILL =================
function runMini(id){const M=MINIS[id];const isL=M.kind==='laundry';const src=isL?LAUNDRY_ITEMS:SORT_ITEMS;const items=shuffle(M.items).map(k=>Object.assign({k},src[k]));
  return modal(`<div class="cardTitle"><h2>${isL?'🧺':'♻️'} ${esc(M.title)}</h2></div>
    <div class="bubbleRow">${bob('glad')}<div class="bubbleText">${esc(M.intro)}</div></div>
    <div class="sortItems" id="sItems">${items.map((it,i)=>`<button class="sItem" data-i="${i}">${it.svg?it.svg:`<span class="se">${it.e}</span>`}<span>${esc(it.n)}</span></button>`).join('')}</div>
    <div class="sortDock"><div id="sortMsg">Velg noe først 👆</div>
    <div class="bins">${M.bins.map(b=>`<button class="bin" data-b="${b.id}" style="background:${b.c}"><span class="bi">${b.i}</span>${esc(b.n)}${b.s?`<small>${esc(b.s)}</small>`:''}</button>`).join('')}</div></div>`,
  (wrap,close)=>{let sel=null,left=items.length;const msg=wrap.querySelector('#sortMsg');
    const bins=wrap.querySelectorAll('.bin');
    wrap.querySelectorAll('.sItem').forEach(b=>b.onclick=()=>{SND.tap();wrap.querySelectorAll('.sItem').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;bins.forEach(x=>x.classList.add('ready'));msg.textContent=`Hvor skal «${items[+b.dataset.i].n}»?`;});
    bins.forEach(bn=>bn.onclick=()=>{if(!sel){msg.textContent='Trykk på noe først 👆';return;}const it=items[+sel.dataset.i];
      if(it.bin===bn.dataset.b){SND.ok();bn.classList.remove('flash');void bn.offsetWidth;bn.classList.add('flash');sel.classList.remove('sel');sel.classList.add('gone');const s=sel;setTimeout(()=>s.remove(),300);sel=null;bins.forEach(x=>x.classList.remove('ready'));left--;msg.innerHTML=`✅ <b>Riktig!</b> ${esc(it.why)}`;S.score+=10;voice([`mini-${isL?'klaer':'sopel'}-${it.k}`]);
        if(left===0){setTimeout(()=>{msg.innerHTML=`<b>Alt sortert! 🎉</b> ${esc(M.end)}`;voice([isL?'mini-klesvask-ferdig':'mini-sortering-ferdig']);const row=document.createElement('div');row.className='btnRow';row.innerHTML='<button class="btn">Ferdig!</button>';msg.parentNode.after(row);row.querySelector('button').onclick=()=>{SND.tap();updateHUD();close();};},500);}}
      else{SND.bad();S.miss.mini++;sel.classList.remove('bad');void sel.offsetWidth;sel.classList.add('bad');msg.innerHTML=`❌ <b>Ikke der!</b> ${esc(it.why)}`;voice([`mini-${isL?'klaer':'sopel'}-${it.k}`]);}});});}

// ================= SLUTT =================
function endLevel(){const n=L.tasks.length;const err=S.miss.tool+S.miss.order+S.miss.quiz+Math.ceil(S.miss.mini/2);
  const stars=err<=Math.ceil(n*0.1)?3:err<=Math.ceil(n*0.3)?2:1;
  store.stars[L.id]=Math.max(store.stars[L.id]||0,stars);store.best[L.id]=Math.max(store.best[L.id]||0,S.score);if(store.unlocked<L.id+1)store.unlocked=Math.min(LEVELS.length,L.id+1);save();
  const plan={daglig:[],ukentlig:[],månedlig:[]};L.tasks.forEach(t=>{const x=txt(t);if(!plan[x.freq].includes(x.plan))plan[x.freq].push(x.plan);});
  const planTxt=`Vaskeplan – ${L.name}\n\nHver dag:\n${plan.daglig.map(p=>'☐ '+p).join('\n')}\n\nHver uke:\n${plan.ukentlig.map(p=>'☐ '+p).join('\n')}\n\nHver måned:\n${plan.månedlig.map(p=>'☐ '+p).join('\n')}`;
  const next=LEVELS.find(l=>l.id===L.id+1);
  SND.fanfare();sparkle(new THREE.Vector3(L.W/2,1,L.D/2),60,3);voice(['replikk-slutt']);
  const titles={3:'Vaskemester! 🏆',2:'Supert jobba! 🌟',1:'Huset er rent! 👍'};
  modal(`<div style="text-align:center"><h2 style="font-size:30px">${titles[stars]}</h2><div class="bigStars">${[1,2,3].map(i=>`<span>${i<=stars?'⭐':'☆'}</span>`).join('')}</div>
    <div class="stats"><span class="badge">⭐ ${S.score} poeng</span><span class="badge">🧽 ${n} oppgaver</span><span class="badge">🙈 ${S.miss.tool} feil verktøy</span><span class="badge">✋ ${S.miss.order} rekkefølge-feil</span></div></div>
    <div class="bubbleRow">${bob('jubel')}<div class="bubbleText">${L.name}en er skinnende ren! Her er din <b>vaskeplan</b> – slik holder du det rent hver dag, uke og måned.</div></div>
    <div class="plan"><div class="planCol"><h3>☀️ Hver dag</h3><ul>${plan.daglig.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div><div class="planCol"><h3>📅 Hver uke</h3><ul>${plan.ukentlig.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div><div class="planCol"><h3>🗓️ Hver måned</h3><ul>${plan.månedlig.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div></div>
    <div class="btnRow"><button class="btn ghost" id="copyPlan">📋 Kopier vaskeplan</button></div>
    <div class="btnRow">${next?`<button class="btn sun" data-close="next">Neste: ${next.icon} ${next.name} ›</button>`:''}<button class="btn ghost" data-close="again">↻ Spill igjen</button><button class="btn" data-close="menu">🏠 Meny</button></div>`,
  (wrap)=>{wrap.querySelector('#copyPlan').onclick=()=>{try{navigator.clipboard.writeText(planTxt).then(()=>toast('Vaskeplanen er kopiert! 📋'),()=>toast('Klarte ikke å kopiere'));}catch(e){toast('Klarte ikke å kopiere');}};})
  .then(v=>{if(v==='next'&&next)startLevel(next.id);else if(v==='again')startLevel(L.id);else showStart();});}

// ================= START / MENY =================
function startLevel(id){L=JSON.parse(JSON.stringify(LEVELS.find(l=>l.id===id)));
  Object.assign(S,{done:new Set(),first:new Map(),miss:{tool:0,order:0,quiz:0,mini:0},score:0,asked:new Set(),celebrated:new Set(),orderHit:new Set(),focus:null,busy:true});
  $('#start').classList.add('hidden');$('#hud').classList.remove('hidden');$('#lvlName').textContent=L.icon+' '+L.name;
  buildLevel(L);resize();Object.assign(P,{x:L.spawn[0],z:L.spawn[1],yaw:L.spawn[2],pitch:-0.12,ty:null,tp:null,walk:null,room:null});S.hint=null;S.scrub=false;updateHUD();
  const ord=`<div style="display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:12px">${[1,2,3,4,5].map(p=>`<span class="badge" style="font-size:15px">${p}. ${PHASES[p][1]} ${PHASES[p][0]}</span>`).join('')}</div>`;
  modal(`<div class="cardTitle"><h2>${L.icon} ${L.name}</h2></div><div class="bubbleRow">${bob('hoved')}<div class="bubbleText">${id===1?'Hei! Jeg er <b>Bobla</b>, og jeg skal hjelpe deg. ':''}${esc(L.story)}<br><br><b>Gå rundt</b> med joysticken nede til venstre, og <b>dra med fingeren</b> for å se deg rundt. <b>Trykk på boblene</b> for å vaske, og husk proff-rekkefølgen – skitt faller nedover!</div></div>${ord}
    <div class="btnRow"><button class="btn ghost" data-voice="intro-${id}" data-say="${esc(L.story)}">🔊 Les opp</button><button class="btn" data-close="1">La oss vaske! 🧽</button></div>`).then(()=>{S.busy=false;});voice(id===1?['replikk-velkommen','intro-1']:['intro-'+id]);}
function renderLevels(){$('#levels').innerHTML=LEVELS.map(l=>{const lock=l.id>store.unlocked;const st=store.stars[l.id]||0;
  return `<button class="lvl ${lock?'locked':''}" data-l="${l.id}"><div class="art" style="background:${l.color}">${l.icon}</div><h3>${l.id}. ${l.name}</h3><p>${esc(l.blurb)}</p><div class="meta"><span>${l.tasks.length} oppgaver · ${l.rooms.length} rom</span><span class="stars">${[1,2,3].map(i=>i<=st?'⭐':'☆').join('')}</span></div></button>`;}).join('');
  $('#levels').querySelectorAll('.lvl').forEach(b=>b.onclick=()=>{ensureAudio();const id=+b.dataset.l;if(id>store.unlocked){SND.lock();toast(`Fullfør ${LEVELS[id-2].name} først! 🔒`);return;}SND.tap();startLevel(id);});}
function showStart(){closeSheet();$('#hud').classList.add('hidden');$('#start').classList.remove('hidden');renderLevels();}

$('#homeBtn').onclick=()=>{SND.tap();S.busy=true;modal(`<div class="cardTitle"><h2>Tilbake til menyen?</h2></div><p>Framgangen på dette nivået blir ikke lagret.</p><div class="btnRow"><button class="btn ghost" data-close="no">Fortsett å vaske</button><button class="btn" data-close="yes">Til menyen</button></div>`).then(v=>{S.busy=false;if(v==='yes')showStart();});};
$('#voiceBtn').textContent=voiceOn?'🗣️':'🤐';$('#voiceBtn').onclick=()=>{voiceOn=!voiceOn;store.voice=voiceOn;save();$('#voiceBtn').textContent=voiceOn?'🗣️':'🤐';if(!voiceOn)stopVoice();toast(voiceOn?'Bobla leser høyt 🗣️':'Bobla er stille 🤐');};
$('#soundBtn').onclick=()=>{soundOn=!soundOn;$('#soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn){ensureAudio();SND.tap();}};
$('#hintBtn').onclick=()=>{if(!L||S.busy||S.scrub)return;SND.tap();const open=L.tasks.filter(t=>!S.done.has(t.id)&&!blockers(t).length);
  open.sort((a,b)=>(taskRoom(a)===P.room?0:1)-(taskRoom(b)===P.room?0:1)||Math.hypot(a.pos[0]-P.x,a.pos[2]-P.z)-Math.hypot(b.pos[0]-P.x,b.pos[2]-P.z));const t=open[0];if(!t)return;
  S.hint=t.id;updateCompass();const m=markers.find(m=>m.userData.taskId===t.id);if(m)m.userData.pulse=3;
  toast(taskRoom(t)===P.room?`Følg pila til ${MARK[t.type]}!`:`Neste: ${MARK[t.type]} i ${roomOf(taskRoom(t)).name.toLowerCase()}. Følg pila eller bruk kartet 🗺️`,3000);};
$('#order').onclick=()=>{SND.tap();S.busy=true;modal(`<div class="cardTitle"><h2>Proff-rekkefølgen</h2></div><div class="bubbleRow">${bob('tenker')}<div class="bubbleText">Proffene vasker <b>ovenfra og ned</b>, og tar <b>gulvet til slutt</b>. Skitt og støv faller nedover – så hvorfor vaske gulvet to ganger?</div></div>
  <ol class="how">${[1,2,3,4,5].map(p=>`<li><b>${PHASES[p][1]} ${PHASES[p][0]}</b> – ${['plukk opp rot, klær og søppel','tørk støv fra høye hyller og skap','vask benker, vasker, speil og toalett','sug opp støv og smuler fra gulvet','mopp gulvet helt til slutt'][p-1]}</li>`).join('')}</ol>
  <p class="small">Lufting (🌬️) kan du gjøre når som helst!</p><div class="btnRow"><button class="btn" data-close="1">Skjønner!</button></div>`).then(()=>S.busy=false);};

$('#howBtn').onclick=()=>{SND.tap();modal(`<div class="cardTitle"><h2>❓ Slik spiller du</h2></div><ol class="how">
  <li>🕹️ <b>Gå</b> med joysticken nede til venstre (på PC: WASD eller piltaster).</li><li>👀 <b>Dra med fingeren</b> for å se deg rundt.</li><li>👆 <b>Trykk på en boble</b>, så går du bort til den. Trykk på gulvet for å gå dit.</li><li>🧽 <b>Velg riktig verktøy</b> – og <b>gni</b> med fingeren til det er rent! Feil verktøy gir et hint.</li><li>🔒 Grå bobler er <b>låst</b> – gjør det som skal gjøres først (ovenfra og ned, gulvet sist).</li>
  <li>🧠 Når et rom er rent, får du et <b>bonusspørsmål</b>.</li><li>🗺️ <b>Kartet</b> viser hvor det er skittent – trykk på et rom for å hoppe dit.</li><li>💡 Står du fast? <b>Lyspæra</b> gir deg en pil mot neste oppgave.</li><li>📋 Til slutt får du en <b>vaskeplan</b> du kan ta med hjem!</li></ol>
  <div class="btnRow"><button class="btn" data-close="1">Den er grei!</button></div>`);};
$('#bookBtn').onclick=()=>{SND.tap();const keys=[];LEVELS.forEach(l=>l.tasks.forEach(t=>{if(!keys.includes(t.tx))keys.push(t.tx);}));const got=keys.filter(k=>store.tips.includes(k)).length;
  modal(`<div class="cardTitle"><h2>📖 Tipsboka</h2><span class="badge">${got} / ${keys.length}</span></div><p class="small">Hvert tips du låser opp i spillet, havner her.</p>
  <div class="tipGrid">${keys.map(k=>store.tips.includes(k)?`<div class="tipCard"><b>✨ ${esc(TX[k].tip[0])}</b>${esc(TX[k].tip[1])}</div>`:`<div class="tipCard locked">🔒 Ikke funnet ennå</div>`).join('')}</div>
  <div class="btnRow"><button class="btn" data-close="1">Lukk</button></div>`);};
$('#resetBtn').onclick=()=>{modal(`<div class="cardTitle"><h2>Nullstille?</h2></div><p>Alle stjerner, tips og opplåste nivåer slettes på denne enheten.</p><div class="btnRow"><button class="btn ghost" data-close="no">Avbryt</button><button class="btn" data-close="yes" style="background:var(--coral);box-shadow:0 4px 0 #c24b48">Nullstill</button></div>`).then(v=>{if(v==='yes'){store={unlocked:1,stars:{},best:{},tips:[]};save();renderLevels();toast('Nullstilt');}});};

// bobler i bakgrunnen
(function(){const b=$('#bubbles');for(let i=0;i<18;i++){const e=document.createElement('i');const s=12+Math.random()*50;e.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${8+Math.random()*12}s;animation-delay:${-Math.random()*20}s`;b.appendChild(e);}$('#logoBobla').innerHTML=bob('hoved').replace('class="bobla','style="width:96px;height:96px" class="bobla');})();

// test-krok
window.__VM={S,get L(){return L;},startLevel,completeTask:(id)=>completeTask(L.tasks.find(t=>t.id===id)),teleport,P,approach:(id)=>approach(L.tasks.find(t=>t.id===id)),wallBetween:(id)=>wallBetween(L.tasks.find(t=>t.id===id)),blockers:(id)=>blockers(L.tasks.find(t=>t.id===id)),runMini,endLevel,onTask:(id)=>onTask(L.tasks.find(t=>t.id===id))};

resize();$('#loading').remove();showStart();requestAnimationFrame(loop);
})();

</script>
</body>
</html>
