document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-for list=\"{{ tastrader }}\" as=\"tr\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;gap:5px;justify-content:center\">\n            <sc-for list=\"{{ tr.taster }}\" as=\"t\" hint-placeholder-count=\"11\">\n              <button type=\"button\" sc-camel-on-click=\"{{ t.trykk }}\" aria-label=\"{{ t.aria }}\" style=\"{{ t.style }}\" style-active=\"transform:translateY(3px);border-bottom-width:2px\">{{ t.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <footer style=\"margin-top:auto;padding-top:16px;font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#A5977C\">Ordjakt · for klasserommet<\u002Ffooter>\n\n  <sc-if value=\"{{ visOverlegg }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(23,32,58,.62);display:grid;place-items:center;padding:18px;z-index:20\">\n      <div style=\"width:100%;max-width:400px;background:#fff;border:3px solid #17203A;border-radius:28px;box-shadow:0 10px 0 rgba(23,32,58,.3);padding:26px 22px;text-align:center;animation:opp .32s ease\">\n        <span style=\"font-size:11px;font-weight:900;letter-spacing:2.2px;text-transform:uppercase;color:#8B7F66\">{{ modalKicker }}<\u002Fspan>\n        <h2 style=\"margin:8px 0 14px;font-family:Fredoka,sans-serif;font-size:27px;font-weight:600;line-height:1.15;text-wrap:pretty\">{{ modalTittel }}<\u002Fh2>\n        <div style=\"display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:14px\">\n          <sc-for list=\"{{ fasit }}\" as=\"f\" hint-placeholder-count=\"4\"><span style=\"{{ f.style }}\">{{ f.ch }}<\u002Fspan><\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:15px;font-weight:700;color:#6E7789;text-wrap:pretty\">{{ modalTekst }}<\u002Fp>\n        <div style=\"display:flex;gap:8px;justify-content:center;margin:16px 0 18px;border-top:2px dashed #E3D6BC;padding-top:14px\">\n          <div style=\"flex:1\"><b style=\"display:block;font-family:Fredoka,sans-serif;font-size:19px;color:#33429B\">{{ stSpilt }}<\u002Fb><small style=\"font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#8B7F66\">Spilt<\u002Fsmall><\u002Fdiv>\n          <div style=\"flex:1\"><b style=\"display:block;font-family:Fredoka,sans-serif;font-size:19px;color:#33429B\">{{ stVunnet }}<\u002Fb><small style=\"font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#8B7F66\">Vunnet<\u002Fsmall><\u002Fdiv>\n          <div style=\"flex:1\"><b style=\"display:block;font-family:Fredoka,sans-serif;font-size:19px;color:#33429B\">{{ stStrek }}<\u002Fb><small style=\"font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#8B7F66\">Strek nå<\u002Fsmall><\u002Fdiv>\n          <div style=\"flex:1\"><b style=\"display:block;font-family:Fredoka,sans-serif;font-size:19px;color:#33429B\">{{ stBest }}<\u002Fb><small style=\"font-size:10.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#8B7F66\">Best<\u002Fsmall><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:10px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ nyttOrd }}\" style=\"flex:1;font-family:Fredoka,sans-serif;font-size:16px;font-weight:600;padding:14px 10px;border-radius:18px;border:3px solid #17203A;background:#14A08C;color:#fff;cursor:pointer;box-shadow:0 5px 0 #0B6F60\" style-active=\"transform:translateY(4px);box-shadow:0 1px 0 #0B6F60\">Nytt ord<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ tilStart }}\" style=\"flex:1;font-family:Fredoka,sans-serif;font-size:16px;font-weight:600;padding:14px 10px;border-radius:18px;border:3px solid #17203A;background:#fff;color:#17203A;cursor:pointer;box-shadow:0 5px 0 #17203A\" style-active=\"transform:translateY(4px);box-shadow:0 1px 0 #17203A\">Bytt nivå<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;forsok&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;min&quot;:3,&quot;max&quot;:8,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Spillregler&quot;},&quot;tidMinutter&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:10,&quot;unit&quot;:&quot;min&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Spillregler&quot;},&quot;hintAlleNiva&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Spillregler&quot;}}\">\nclass Component extends DCLogic {\n  ORD = {\n    lett: [\"KATT\",\"HUND\",\"GRIS\",\"HEST\",\"FISK\",\"FUGL\",\"LØVE\",\"HARE\",\"GEIT\",\"KALV\",\"VALP\",\"MAUR\",\"MÅKE\",\"EPLE\",\"PÆRE\",\"DRUE\",\"KAKE\",\"MELK\",\"BRØD\",\"SMØR\",\"SAFT\",\"TACO\",\"VANN\",\"SAND\",\"SKOG\",\"REGN\",\"MÅNE\",\"BLAD\",\"ROSE\",\"HAGE\",\"GRAS\",\"PENN\",\"SAKS\",\"KART\",\"TALL\",\"STOL\",\"BORD\",\"SENG\",\"VEGG\",\"GULV\",\"BARN\",\"VENN\",\"GUTT\",\"BROR\",\"LEKE\",\"DANS\",\"SANG\",\"BALL\",\"BUSS\",\"SKIP\",\"NEBB\",\"PELS\",\"HOPP\",\"KOKK\",\"SOFA\",\"PUTE\",\"DYNE\",\"STUE\",\"BEKK\",\"FOSS\"],\n    middels: [\"BJØRN\",\"KANIN\",\"SVANE\",\"FROSK\",\"HUMLE\",\"BILLE\",\"BOLLE\",\"SUPPE\",\"PIZZA\",\"PØLSE\",\"KAKAO\",\"SALAT\",\"BANAN\",\"POTET\",\"TOMAT\",\"AGURK\",\"SKOLE\",\"LEKSE\",\"TAVLE\",\"KRITT\",\"BØKER\",\"NORSK\",\"MATTE\",\"FJELL\",\"SKYER\",\"STORM\",\"KVIST\",\"STEIN\",\"SEIER\",\"LAGET\",\"MAMMA\",\"PAPPA\",\"JENTE\",\"TANTE\",\"ONKEL\",\"HYTTE\",\"LAMPE\",\"TRAPP\",\"VINDU\",\"SMILE\",\"FARGE\",\"GRØNN\",\"BLÅTT\",\"SVART\",\"LÆRER\",\"SLEDE\",\"BUKSE\",\"MELON\",\"SPADE\",\"MOTOR\",\"TOGET\",\"FLYET\",\"SNØEN\",\"ISBIT\"],\n    vanskelig: [\"SLANGE\",\"PINGVIN\",\"DELFIN\",\"SØSKEN\",\"SØSTER\",\"KOMPIS\",\"KAMERAT\",\"FAMILIE\",\"SYKKEL\",\"FOTBALL\",\"SKØYTER\",\"LØPETUR\",\"MÅLVAKT\",\"DOMMER\",\"MEDALJE\",\"VINTER\",\"SOMMER\",\"TORDEN\",\"STRAND\",\"INNSJØ\",\"REGNBUE\",\"ISFJELL\",\"REGNVÆR\",\"BLOMST\",\"GULROT\",\"PLOMME\",\"JORDBÆR\",\"BLÅBÆR\",\"MIDDAG\",\"FROKOST\",\"VAFFEL\",\"SUKKER\",\"LINJAL\",\"NØKKEL\",\"KLOKKE\",\"HJERTE\",\"GYMSAL\",\"RANSEL\",\"BLYANT\",\"PENNAL\",\"ORDBOK\",\"TRENER\",\"KUSINE\",\"VENNER\",\"BADEKAR\",\"KJØKKEN\",\"SKOLEN\"]\n  };\n  RADER = [\n    [\"Q\",\"W\",\"E\",\"R\",\"T\",\"Y\",\"U\",\"I\",\"O\",\"P\",\"Å\"],\n    [\"A\",\"S\",\"D\",\"F\",\"G\",\"H\",\"J\",\"K\",\"L\",\"Ø\",\"Æ\"],\n    [\"ENTER\",\"Z\",\"X\",\"C\",\"V\",\"B\",\"N\",\"M\",\"SLETT\"]\n  ];\n  SEIER = {1:\"Utrolig! Første forsøk!\",2:\"Fantastisk gjettet!\",3:\"Veldig bra jobbet!\",4:\"Bra jobbet!\",5:\"Godt jobbet!\",6:\"Så vidt! Sterkt kjempet!\",7:\"Sterkt kjempet!\",8:\"Sterkt kjempet!\"};\n  S = \"clamp(42px,11.6vw,62px)\";\n\n  state = {\n    skjerm: \"start\", niva: \"lett\", ord: \"\", rader: [], statuser: [], gjett: [],\n    rad: 0, tastStatus: {}, ferdig: false, laser: false, melding: \"\", varsel: false,\n    hintBrukt: false, hintTekst: \"\", maksForsok: 6, tidsvalg: false, tidsfrist: false,\n    tidIgjen: 0, avslutning: null, rist: false, avsloerRad: -1,\n    stat: { spilt: 0, vunnet: 0, strek: 0, best: 0 }\n  };\n\n  get maks() { return Math.max(3, Math.min(8, this.props.forsok ?? 6)); }\n  get minutter() { return Math.max(1, this.props.tidMinutter ?? 3); }\n\n  componentDidMount() {\n    try {\n      const s = JSON.parse(localStorage.getItem(\"ordjakt-stat\") || \"null\");\n      if (s) this.setState({ stat: Object.assign({ spilt:0, vunnet:0, strek:0, best:0 }, s) });\n    } catch (e) {}\n    this._tast = (e) => {\n      if (this.state.skjerm !== \"spill\" || this.state.avslutning) return;\n      if (e.key === \"Enter\") { e.preventDefault(); this.trykk(\"ENTER\"); }\n      else if (e.key === \"Backspace\") { e.preventDefault(); this.trykk(\"SLETT\"); }\n      else if (/^[a-zæøåA-ZÆØÅ]$/.test(e.key)) this.trykk(e.key.toUpperCase());\n    };\n    document.addEventListener(\"keydown\", this._tast);\n  }\n  componentWillUnmount() { document.removeEventListener(\"keydown\", this._tast); this.stoppTid(); }\n\n  lagreStat(stat) { try { localStorage.setItem(\"ordjakt-stat\", JSON.stringify(stat)); } catch (e) {} }\n\n  nyRunde(niva) {\n    const n = niva || this.state.niva;\n    const liste = this.ORD[n];\n    const ord = liste[Math.floor(Math.random() * liste.length)];\n    const tidsfrist = n === \"vanskelig\" && this.state.tidsvalg;\n    this.setState({\n      skjerm: \"spill\", niva: n, ord, rader: [], statuser: [], gjett: [], rad: 0,\n      tastStatus: {}, ferdig: false, laser: false, melding: \"\", varsel: false,\n      hintBrukt: false, hintTekst: \"\", maksForsok: this.maks, avslutning: null,\n      rist: false, avsloerRad: -1, tidsfrist, tidIgjen: this.minutter * 60\n    });\n    this.stoppTid();\n    if (tidsfrist) {\n      this._ur = setInterval(() => {\n        const t = this.state.tidIgjen - 1;\n        if (t <= 0) { this.stoppTid(); this.setState({ tidIgjen: 0 }); this.avslutt(false, \"tid\"); }\n        else this.setState({ tidIgjen: t });\n      }, 1000);\n    }\n  }\n  stoppTid() { if (this._ur) { clearInterval(this._ur); this._ur = null; } }\n\n  trykk(t) {\n    const s = this.state;\n    if (s.ferdig || s.laser || s.avslutning) return;\n    if (t === \"ENTER\") return this.sjekk();\n    if (t === \"SLETT\") return this.setState({ gjett: s.gjett.slice(0, -1) });\n    if (s.gjett.length < s.ord.length) this.setState({ gjett: s.gjett.concat(t), melding: \"\", varsel: false });\n  }\n\n  sjekk() {\n    const s = this.state, lengde = s.ord.length;\n    if (s.gjett.length < lengde) {\n      this.setState({ melding: \"Ordet må ha \" + lengde + \" bokstaver\", varsel: true, rist: true });\n      setTimeout(() => this.setState({ rist: false }), 430);\n      return;\n    }\n    const forsok = s.gjett.join(\"\");\n    const fasit = s.ord.split(\"\");\n    const svar = new Array(lengde).fill(\"borte\");\n    const brukt = new Array(lengde).fill(false);\n    for (let i = 0; i < lengde; i++) if (forsok[i] === fasit[i]) { svar[i] = \"riktig\"; brukt[i] = true; }\n    for (let i = 0; i < lengde; i++) {\n      if (svar[i] === \"riktig\") continue;\n      for (let j = 0; j < lengde; j++) if (!brukt[j] && forsok[i] === fasit[j]) { svar[i] = \"nesten\"; brukt[j] = true; break; }\n    }\n    const rang = { riktig: 3, nesten: 2, borte: 1 };\n    const tastStatus = Object.assign({}, s.tastStatus);\n    svar.forEach((st, i) => {\n      const b = forsok[i];\n      if (!tastStatus[b] || rang[st] > rang[tastStatus[b]]) tastStatus[b] = st;\n    });\n    this.setState({\n      rader: s.rader.concat(forsok), statuser: s.statuser.concat([svar]),\n      tastStatus, laser: true, avsloerRad: s.rad, gjett: []\n    });\n    setTimeout(() => {\n      if (forsok === s.ord) { this.setState({ laser: false }); return this.avslutt(true, null, s.rad + 1); }\n      const rad = s.rad + 1;\n      if (rad >= s.maksForsok) { this.setState({ laser: false, rad }); return this.avslutt(false); }\n      this.setState({ laser: false, rad, melding: this.underveis(rad), varsel: false });\n    }, lengde * 110 + 480);\n  }\n\n  underveis(n) {\n    const igjen = this.state.maksForsok - n;\n    if (igjen === 1) return \"Siste forsøk. Du klarer det!\";\n    return [\"Godt forsøk. Fortsett!\", \"Du er på sporet.\", \"Bruk fargene som hjelp.\", \"Fine ledetråder nå!\"][n % 4];\n  }\n\n  avslutt(vant, arsak, forsokBrukt) {\n    this.stoppTid();\n    const stat = Object.assign({}, this.state.stat);\n    stat.spilt++;\n    if (vant) { stat.vunnet++; stat.strek++; if (stat.strek > stat.best) stat.best = stat.strek; }\n    else stat.strek = 0;\n    this.lagreStat(stat);\n    this.setState({ ferdig: true, stat });\n    setTimeout(() => this.setState({\n      avslutning: { vant, arsak: arsak || null, forsok: forsokBrukt || this.state.maksForsok }\n    }), 320);\n  }\n\n  hint() {\n    const s = this.state;\n    if (s.ferdig || s.laser || s.hintBrukt) return;\n    if (s.maksForsok - s.rad <= 1) return this.setState({ melding: \"For få forsøk igjen til å bruke hint\", varsel: true });\n    const kandidater = [];\n    for (let i = 0; i < s.ord.length; i++) if (s.gjett[i] !== s.ord[i]) kandidater.push(i);\n    const pos = kandidater[Math.floor(Math.random() * kandidater.length)];\n    const tastStatus = Object.assign({}, s.tastStatus);\n    tastStatus[s.ord[pos]] = \"riktig\";\n    const maksForsok = s.maksForsok - 1;\n    this.setState({\n      hintBrukt: true, maksForsok, tastStatus,\n      hintTekst: \"Bokstav \" + (pos + 1) + \" er \" + s.ord[pos],\n      melding: \"Nå har du \" + (maksForsok - s.rad) + \" forsøk igjen.\"\n    });\n  }\n\n  celleStil(tilstand, anim, i) {\n    const S = this.S;\n    let s = \"position:relative;width:\" + S + \";height:\" + S + \";display:grid;place-items:center;border-radius:16px;font-family:Fredoka,sans-serif;font-weight:600;text-transform:uppercase;font-size:calc(\" + S + \" * .5);transition:transform .12s ease,background .18s;\";\n    if (tilstand === \"riktig\") s += \"background:#14A08C;border:3px solid #17203A;color:#fff;box-shadow:0 4px 0 #0B6F60;\";\n    else if (tilstand === \"nesten\") s += \"background:#FFC94D;border:3px solid #17203A;color:#17203A;box-shadow:0 4px 0 #C79300;\";\n    else if (tilstand === \"borte\") s += \"background:#E0D8C6;border:3px solid #A79E8B;color:#7C7565;\";\n    else if (tilstand === \"fylt\") s += \"background:#fff;border:3px solid #4457C7;color:#17203A;box-shadow:0 4px 0 rgba(68,87,199,.3);transform:scale(1.04);\";\n    else s += \"background:#FFFDF6;border:3px solid #E3D6BC;color:#17203A;\";\n    if (anim) s += \"animation:snu .5s ease both;animation-delay:\" + (i * 0.11).toFixed(2) + \"s;\";\n    return s;\n  }\n  markStil(tilstand) {\n    const b = \"position:absolute;top:3px;right:5px;font-size:11px;font-weight:900;line-height:1;font-family:Nunito,sans-serif;\";\n    if (tilstand === \"riktig\") return b + \"color:rgba(255,255,255,.9)\";\n    if (tilstand === \"nesten\") return b + \"color:rgba(23,32,58,.5)\";\n    if (tilstand === \"borte\") return b + \"color:rgba(124,117,101,.75)\";\n    return b + \"display:none\";\n  }\n\n  renderVals() {\n    const s = this.state, lengde = s.ord.length || 5;\n    const brett = [];\n    for (let r = 0; r < s.maksForsok; r++) {\n      const celler = [];\n      for (let c = 0; c < lengde; c++) {\n        let ch = \"\", tilstand = \"tom\";\n        if (r < s.rader.length) { ch = s.rader[r][c]; tilstand = s.statuser[r][c]; }\n        else if (r === s.rad) { ch = s.gjett[c] || \"\"; tilstand = ch ? \"fylt\" : \"tom\"; }\n        const mark = tilstand === \"riktig\" ? \"✓\" : tilstand === \"nesten\" ? \"↔\" : tilstand === \"borte\" ? \"–\" : \"\";\n        celler.push({ ch, mark, markStil: this.markStil(tilstand), style: this.celleStil(tilstand, r === s.avsloerRad, c) });\n      }\n      brett.push({\n        celler,\n        style: \"display:grid;gap:8px;grid-template-columns:repeat(\" + lengde + \",auto);\" + (s.rist && r === s.rad ? \"animation:rist .42s;\" : \"\")\n      });\n    }\n\n    const tastrader = this.RADER.map((r) => ({\n      taster: r.map((t) => {\n        const bred = t.length > 1;\n        const st = s.tastStatus[t];\n        let style = \"flex:\" + (bred ? \"1.8\" : \"1\") + \" 1 auto;min-width:0;max-width:\" + (bred ? \"92px\" : \"50px\") + \";height:clamp(44px,9vw,54px);display:grid;place-items:center;border-radius:12px;cursor:pointer;user-select:none;font-family:Fredoka,sans-serif;font-weight:600;font-size:\" + (bred ? \"clamp(11px,2.7vw,13px)\" : \"clamp(14px,3.6vw,18px)\") + \";border:2.5px solid #17203A;border-bottom-width:5px;transition:transform .08s;\";\n        if (st === \"riktig\") style += \"background:#14A08C;color:#fff;\";\n        else if (st === \"nesten\") style += \"background:#FFC94D;color:#17203A;\";\n        else if (st === \"borte\") style += \"background:#D9D1BF;color:#8C8577;border-color:#A79E8B;\";\n        else style += \"background:#fff;color:#17203A;\";\n        return {\n          label: t === \"SLETT\" ? \"SLETT\" : t, style,\n          aria: t === \"SLETT\" ? \"Slett bokstav\" : t === \"ENTER\" ? \"Sjekk ordet\" : \"Bokstaven \" + t,\n          trykk: () => this.trykk(t)\n        };\n      })\n    }));\n\n    const prikker = [];\n    for (let i = 0; i < s.maksForsok; i++) {\n      const brukt = i < s.rader.length;\n      prikker.push({ style: \"width:9px;height:14px;border-radius:4px;border:2px solid #17203A;background:\" + (brukt ? \"#17203A\" : \"#FFFDF6\") });\n    }\n\n    const m = Math.floor(s.tidIgjen / 60), sek = String(s.tidIgjen % 60).padStart(2, \"0\");\n    const knapp = s.tidIgjen <= 30;\n    const av = s.avslutning;\n    const kanHint = s.niva === \"lett\" || this.props.hintAlleNiva;\n\n    return {\n      erStart: s.skjerm === \"start\", erSpill: s.skjerm === \"spill\",\n      brett, tastrader, prikker,\n      nivaEtikett: { lett: \"Lett · 4 bokstaver\", middels: \"Middels · 5 bokstaver\", vanskelig: \"Vanskelig · 6–7 bokstaver\" }[s.niva],\n      melding: s.hintTekst && !s.melding ? s.hintTekst : (s.melding || (s.hintTekst || \"\\u00a0\")),\n      meldingStil: \"margin:0;min-height:24px;font-family:Fredoka,sans-serif;font-size:15.5px;font-weight:500;text-align:center;color:\" + (s.varsel ? \"#C3402F\" : \"#33429B\"),\n      tidVisning: s.tidsfrist ? m + \":\" + sek : \"\",\n      tidStil: s.tidsfrist\n        ? \"font-family:Fredoka,sans-serif;font-size:13.5px;font-weight:600;padding:5px 11px;border-radius:999px;border:2.5px solid \" + (knapp ? \"#C3402F\" : \"#E0BF6A\") + \";background:\" + (knapp ? \"#FFF0ED\" : \"#FFFBEF\") + \";color:\" + (knapp ? \"#C3402F\" : \"#9A7B1F\") + \";\" + (knapp ? \"animation:puls 1s infinite;\" : \"\")\n        : \"display:none\",\n      hintStil: \"font-family:Fredoka,sans-serif;font-size:13.5px;font-weight:600;padding:8px 14px;border-radius:999px;border:2.5px solid #17203A;background:\" + (s.hintBrukt ? \"#F0EADC\" : \"#FFC94D\") + \";color:#17203A;cursor:\" + (s.hintBrukt ? \"not-allowed\" : \"pointer\") + \";box-shadow:\" + (s.hintBrukt ? \"none\" : \"0 3px 0 #C79300\") + \";opacity:\" + (s.hintBrukt ? \".5\" : \"1\") + \";\" + (kanHint ? \"\" : \"display:none\"),\n      hintKnappTekst: s.hintBrukt ? \"Hint brukt\" : \"Hint (koster 1 forsøk)\",\n      hintAv: s.hintBrukt,\n      forsokTekst: String(this.maks),\n      tidTekst: \"på \" + this.minutter + \" minutter\",\n      bryterSpor: \"flex:0 0 auto;display:flex;align-items:center;width:52px;height:30px;border-radius:999px;border:3px solid #17203A;padding:2px;background:\" + (s.tidsvalg ? \"#14A08C\" : \"#EFE7D5\") + \";justify-content:\" + (s.tidsvalg ? \"flex-end\" : \"flex-start\") + \";transition:background .2s\",\n      bryterKule: \"width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #17203A\",\n      stSpilt: s.stat.spilt, stVunnet: s.stat.vunnet, stStrek: s.stat.strek, stBest: s.stat.best,\n      visOverlegg: !!av,\n      modalKicker: av ? (av.vant ? \"Ordet er funnet\" : av.arsak === \"tid\" ? \"Tiden er ute\" : \"Ingen flere forsøk\") : \"\",\n      modalTittel: av ? (av.vant ? (this.SEIER[Math.min(av.forsok, 8)] || \"Bra jobbet!\") : av.arsak === \"tid\" ? \"Klokka vant denne gangen\" : \"Så nære! Prøv igjen\") : \"\",\n      modalTekst: av ? (av.vant ? \"Du fant ordet på \" + av.forsok + (av.forsok === 1 ? \" forsøk.\" : \" forsøk.\") : \"Ordet var \" + s.ord + \". Neste runde går bedre!\") : \"\",\n      fasit: (s.ord || \"\").split(\"\").map((ch) => ({\n        ch, style: \"display:grid;place-items:center;width:38px;height:44px;border-radius:11px;background:\" + (av && av.vant ? \"#14A08C\" : \"#4457C7\") + \";border:3px solid #17203A;box-shadow:0 4px 0 rgba(23,32,58,.3);color:#fff;font-family:Fredoka,sans-serif;font-size:20px;font-weight:600\"\n      })),\n      velgLett: () => this.nyRunde(\"lett\"),\n      velgMiddels: () => this.nyRunde(\"middels\"),\n      velgVanskelig: () => this.nyRunde(\"vanskelig\"),\n      vekslTid: () => this.setState({ tidsvalg: !s.tidsvalg }),\n      brukHint: () => this.hint(),\n      nyttOrd: () => this.nyRunde(),\n      tilStart: () => { this.stoppTid(); this.setState({ skjerm: \"start\", avslutning: null, ferdig: false, laser: false }); }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
