  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n  font-display: swap;\n  src: url(\"39076e0f-7d41-4d87-a8a6-64f6cdf81cf3\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f359f9c4-b69b-4e2c-b7ba-b07042e4dfc0\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"dff41525-f19a-48bb-a898-6ed57b41f9cd\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"6943966c-1a7a-4604-ad08-7f7864be3a0f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"2242ed54-2e0b-41c0-a091-2e0528b9b45f\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"ea3b6fad-4522-430e-b138-9469603f47c4\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"d7227063-02b4-4f04-9714-e9a01355da6c\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"4782f1c0-fb0f-4099-920d-97306224b8d3\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"af1ae421-c5fe-4f1d-bc5a-2cf241d949c3\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Nunito';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"c3cde747-c8d0-4b05-9a76-1887c5650ca0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;\n  -webkit-user-select:none;user-select:none}\n:root{\n  --eng:#6DBE45; --eng-lys:#8FD46A; --skog:#2C6E49; --skog-dyp:#1E4D33;\n  --korn:#F4B942; --korn-dyp:#D99A1E; --jord:#B5651D;\n  --krem:#FFF6E3; --papir:#FFFDF6; --morkt:#24402C; --grå:#7C8B7F; --rod:#E05A47;\n}\nhtml,body{height:100%;overflow:hidden;position:fixed;width:100%}\nbody{font-family:'Nunito',system-ui,sans-serif;color:var(--morkt);background:#9FD46A}\nbutton{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}\nh1,h2,h3{font-family:'Fredoka',sans-serif;font-weight:600}\nimg{display:block;pointer-events:none}\n\n/* ================= SCENE ================= */\n#scene{position:fixed;inset:0;overflow:hidden;touch-action:none;\n  background:radial-gradient(ellipse at 50% -10%,#CFEBF9 0%,#B7E3EE 22%,transparent 55%),\n             linear-gradient(#AEE0B4 0%,#8FCF63 45%,#79BE4E 100%)}\n#verden{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}\n\n/* gresstuster og småting */\n.dott{position:absolute;transform:translate(-50%,-50%);pointer-events:none}\n\n/* isometrisk flis */\n.flis{position:absolute;width:104px;height:52px;transform:translate(-50%,-50%);\n  cursor:pointer}\n.flis .plate{position:absolute;inset:0;\n  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);\n  background:linear-gradient(160deg,#C48B4E,#9A5A22);\n  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}\n.flis .plate::after{content:'';position:absolute;inset:0;\n  background:repeating-linear-gradient(63deg,rgba(0,0,0,.13) 0 2px,transparent 2px 11px)}\n.flis.tom .plate{background:linear-gradient(160deg,#CE9A5E,#A9682C)}\n.flis.klar .plate{background:linear-gradient(160deg,#D5A468,#B1712F)}\n.flis .kant{position:absolute;left:0;right:0;top:50%;height:9px;\n  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:#7A431A;z-index:-1}\n.flis.pekt .plate{filter:brightness(1.16) saturate(1.1)}\n.flis.klar{animation:flisPuls 1.6s ease-in-out infinite}\n@keyframes flisPuls{0%,100%{filter:none}50%{filter:brightness(1.09)}}\n\n.vekst{position:absolute;left:50%;bottom:16px;width:76px;height:76px;\n  transform:translateX(-50%);pointer-events:none}\n.vekst img{width:100%;height:100%;object-fit:contain;object-position:bottom}\n.vekst.liten{width:46px;height:46px;bottom:18px}\n.vekst.mid{width:60px;height:60px;bottom:17px}\n.groddu{animation:groddu .5s cubic-bezier(.2,1.7,.4,1)}\n@keyframes groddu{from{transform:translateX(-50%) scale(.35);opacity:0}}\n\n/* objekter på kartet */\n.obj{position:absolute;transform:translate(-50%,-100%);cursor:pointer;\n  transition:filter .12s}\n.obj img{width:100%;height:auto;filter:drop-shadow(0 5px 5px rgba(20,60,25,.28))}\n.obj:active{filter:brightness(1.1)}\n.obj.dyr img{filter:drop-shadow(0 4px 4px rgba(20,60,25,.3))}\n.obj.dyr{animation:beite 3.2s ease-in-out infinite}\n@keyframes beite{0%,100%{transform:translate(-50%,-100%)}\n  45%{transform:translate(-50%,-100%) translateY(-3px) rotate(-1.5deg)}}\n.obj.snudd img{transform:scaleX(-1)}\n\n/* bobler over objekter */\n.boble{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);\n  background:var(--papir);border-radius:14px;padding:5px 7px;\n  box-shadow:0 3px 8px rgba(20,60,25,.3);display:flex;align-items:center;gap:3px;\n  font-family:'Fredoka';font-weight:600;font-size:12px;white-space:nowrap;\n  animation:svev 1.9s ease-in-out infinite;pointer-events:none}\n.boble::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;\n  border:6px solid transparent;border-top-color:var(--papir);border-bottom:0}\n.boble img{width:22px;height:22px;object-fit:contain}\n.boble.klar{background:var(--korn)}\n.boble.klar::after{border-top-color:var(--korn)}\n.boble.sulten{background:#fff}\n.boble.sulten::after{border-top-color:#fff}\n@keyframes svev{0%,100%{transform:translate(-50%,-100%)}\n  50%{transform:translate(-50%,-100%) translateY(-5px)}}\n.mini-tid{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);\n  background:rgba(30,60,35,.72);color:#fff;font-family:'Fredoka';font-weight:600;\n  font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;\n  pointer-events:none;font-variant-numeric:tabular-nums}\n.mini-spor{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);\n  width:52px;height:8px;background:rgba(30,60,35,.55);border-radius:999px;\n  overflow:hidden;pointer-events:none}\n.mini-spor i{display:block;height:100%;background:linear-gradient(90deg,#8FD46A,#F4B942);\n  border-radius:999px}\n\n/* tidsring på åkerflis */\n.ring{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);\n  width:54px;height:54px;pointer-events:none}\n.ring svg{transform:rotate(-90deg);overflow:visible}\n.ring circle{fill:none;stroke-linecap:round}\n.ring .bane{stroke:rgba(0,0,0,.26);stroke-width:5}\n.ring .fyll{stroke:#FFE9A8;stroke-width:5;transition:stroke-dashoffset .9s linear}\n.ring b{position:absolute;inset:0;display:grid;place-items:center;\n  font-family:'Fredoka';font-size:11px;color:#fff;font-weight:600;\n  text-shadow:0 1px 3px rgba(0,0,0,.7);font-variant-numeric:tabular-nums}\n\n/* ================= HUD ================= */\n.hud{position:fixed;z-index:30;pointer-events:none}\n.hud > *{pointer-events:auto}\n#hudTopp{top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;\n  display:flex;align-items:flex-start;justify-content:space-between;gap:10px}\n.glasskort{background:rgba(28,58,34,.74);backdrop-filter:blur(7px);\n  box-shadow:0 4px 14px rgba(20,50,25,.28);border-radius:16px;color:#fff}\n\n/* nivå + xp i ett kort */\n.niva-blokk{display:flex;align-items:center;gap:9px;padding:6px 13px 6px 8px}\n.niva-blokk svg{width:26px;height:26px;flex:none}\n.niva-tekst{display:flex;flex-direction:column;gap:4px}\n.niva-tekst b{font-family:'Fredoka';font-weight:600;font-size:14px;line-height:1;\n  letter-spacing:.02em}\n.xp-spor{width:86px;height:6px;background:rgba(0,0,0,.32);border-radius:999px;\n  overflow:hidden}\n.xp-fyll{display:block;height:100%;background:linear-gradient(90deg,#FFD97A,var(--korn));\n  border-radius:999px;transition:width .5s cubic-bezier(.3,1.2,.5,1)}\n\n/* ressurser: mynt + silo i én stripe */\n.hud-hoyre-topp{display:flex;flex-direction:column;align-items:flex-end;gap:8px}\n.ressurser{display:flex;align-items:stretch;overflow:hidden}\n.ressurs{display:flex;align-items:center;gap:6px;padding:7px 13px;\n  font-family:'Fredoka';font-weight:600;font-size:15px;white-space:nowrap;\n  font-variant-numeric:tabular-nums;background:transparent;transition:background .2s}\n.ressurs svg{width:22px;height:22px;flex:none}\n.ressurs + .ressurs{box-shadow:inset 1.5px 0 0 rgba(255,255,255,.2)}\n#siloPille{cursor:pointer}\n#siloPille.full{background:rgba(198,62,48,.9)}\n\n/* små verktøyknapper */\n.verktoy{display:flex;gap:7px}\n.ikonknapp{width:38px;height:38px;border-radius:13px;background:rgba(255,253,246,.94);\n  box-shadow:0 3px 0 #C9B99A,0 5px 12px rgba(20,50,25,.2);\n  display:grid;place-items:center;transition:transform .1s,box-shadow .1s}\n.ikonknapp:active{transform:translateY(3px);box-shadow:0 0 0 #C9B99A}\n.ikonknapp svg{width:22px;height:22px}\n\n/* ================= HANDLINGSDOKK ================= */\n#hudDokk{left:0;right:0;bottom:0;display:flex;justify-content:center;\n  padding:0 10px calc(9px + env(safe-area-inset-bottom))}\n.dokk{display:flex;gap:6px;width:100%;max-width:430px;padding:7px;\n  background:rgba(255,253,246,.96);backdrop-filter:blur(7px);border-radius:22px;\n  box-shadow:0 4px 0 #D9CCAF,0 10px 24px rgba(20,50,25,.26)}\n.dokk button{flex:1;position:relative;display:flex;flex-direction:column;\n  align-items:center;gap:3px;padding:8px 2px 6px;border-radius:16px;\n  background:var(--krem);transition:transform .1s}\n.dokk button:active{transform:scale(.94)}\n.dokk button svg{width:26px;height:26px}\n.dokk button em{font-family:'Fredoka';font-style:normal;font-size:10.5px;\n  font-weight:600;color:var(--skog);line-height:1}\n.dokk .prim{background:#FFF0C4;box-shadow:inset 0 0 0 2.5px var(--korn)}\n.merke{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;padding:0 5px;\n  background:var(--rod);color:#fff;border-radius:999px;font-family:'Fredoka';\n  font-size:11.5px;font-weight:700;display:grid;place-items:center;\n  box-shadow:0 0 0 2.5px var(--papir)}\n\n/* ================= FRØLINJE ================= */\n#frolinje{position:fixed;left:0;right:0;bottom:0;z-index:35;\n  background:linear-gradient(180deg,rgba(255,253,246,.94),var(--papir));\n  box-shadow:0 -4px 18px rgba(20,50,25,.24);\n  padding:9px 10px calc(10px + env(safe-area-inset-bottom));\n  transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.9,.3,1)}\n#frolinje.vis{transform:none}\n.frolinje-topp{display:flex;align-items:center;gap:8px;margin-bottom:8px}\n.frolinje-topp h3{font-size:14px;flex:1;color:var(--skog-dyp)}\n.frolinje-topp span{font-size:11.5px;color:var(--grå);font-weight:800}\n.fro-rad{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}\n.fro-rad::-webkit-scrollbar{display:none}\n.fro{flex:none;width:74px;background:var(--krem);border-radius:15px;padding:7px 4px 6px;\n  text-align:center;position:relative;transition:transform .1s}\n.fro:active{transform:scale(.95)}\n.fro.valgt{background:#FFF0C4;box-shadow:inset 0 0 0 2.5px var(--korn)}\n.fro.laast{opacity:.45}\n.fro img{width:40px;height:40px;object-fit:contain;margin:0 auto}\n.fro b{display:block;font-family:'Fredoka';font-size:11.5px;font-weight:600;margin-top:2px}\n.fro i{display:block;font-style:normal;font-size:10.5px;color:var(--korn-dyp);\n  font-weight:800;margin-top:1px}\n.fro.laast i{color:var(--grå)}\n\n/* ================= PLANTEFELT PÅ PARSELLENE ================= */\n/* tomt felt: en liten oppgravd jordflekk med et pluss-tegn */\n.plantefelt{position:absolute;width:72px;height:36px;\n  transform:translate(-50%,-50%);cursor:pointer}\n.plantefelt .jord{position:absolute;inset:0;\n  clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);\n  background:linear-gradient(160deg,#BE8A55,#8C5322);\n  box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}\n.plantefelt .jord::after{content:'';position:absolute;inset:0;\n  background:repeating-linear-gradient(63deg,rgba(0,0,0,.13) 0 2px,transparent 2px 9px)}\n.plantefelt .pluss{position:absolute;left:50%;top:-2px;\n  transform:translate(-50%,-100%);width:24px;height:24px;border-radius:50%;\n  background:var(--korn);box-shadow:0 2px 5px rgba(20,60,25,.35);\n  display:grid;place-items:center;\n  font-family:'Fredoka';font-weight:600;font-size:17px;color:#6B4A05;line- },\n  eplesaft:{navn:'Eplesaft',pris:620,xp:26},\n  syltetoy:{navn:'Syltetøy',pris:520,xp:24},    eplepai:{navn:'Eplepai',pris:740,xp:32}\n};\n\n/* Alle motiva ligg no som PNG i SPR. Dei tolv som tidlegare var\n   teikna som SVG rett i koden, er bytta ut med genererte bilete\n   i same stil som resten. (august 2026) */\n\nconst XP_TRAPP = [0,20,55,120,230,400,650,1000,1500,2200,3000,4000,5200];\nconst LAPP_PRIS = [200,450,900,1800,3500,6500];\nconst LAPP_NIVA = [2,3,4,5,6,7];\nconst START_LAPPER = 6, MAKS_LAPPER = 12;\nconst SILO_START = 80, SILO_STEG = 40;\nconst KO_PLASSER = 3;\n\nconst KUNDER = [\n  ['Stjerne','#F4B942','#FFD97A'], ['Drage','#E8801F','#FFB25E'],\n  ['Bølge','#7FB6D9','#A8DCEF'],   ['Måne','#B9A8E0','#D6CBF0'],\n  ['Plomme','#C97A96','#E8A9BF'],  ['Bamse','#D9853B','#EFA968'],\n  ['Sky','#8FA8B8','#C3D4DE'],     ['Kvist','#6DBE45','#8FD46A'],\n  ['Sopp','#E0483C','#F08A80'],    ['Perle','#8FD4C6','#B8E8DE']\n];\n\n/* ===================== KART ===================== */\n\nconst TW = 104, TH = 52, OX = 960, OY = 440;\nconst VERDEN_B = 1930, VERDEN_H = 1090;\n\n/* tomta man starter med, innenfor muren */\nconst CMIN = -2.5, CMAX = 8.5, RMIN = -2, RMAX = 8;\nconst TOMT_MARG = 0.8;   // hvor nær muren man får bygge\n\n/* ---- parseller: åtte jordstykker som kjøpes ett om gangen ----\n   Rekkefølgen er fast, og hver parsell henger sammen med det man\n   allerede eier. Hver har egne plantefelt til busker og trær. */\nconst START_TOMT = {c0:CMIN, c1:CMAX, r0:RMIN, r1:RMAX};\n\nconst PARSELLER = [\n  {id:'ost1',  navn:'Solbakken',    pris:900,   niva:3,\n   c0:8.5,  c1:11.5, r0:-2,   r1:8,\n   spor:[{c:10,r:0.6},{c:10,r:3},{c:10,r:5.4}]},\n  {id:'nord1', navn:'Nordenga',     pris:1800,  niva:4,\n   c0:-2.5, c1:8.5,  r0:-4.5, r1:-2,\n   spor:[{c:0.4,r:-3.2},{c:3,r:-3.2},{c:5.6,r:-3.2}]},\n  {id:'vest1', navn:'Vestlia',      pris:3400,  niva:5,\n   c0:-5.5, c1:-2.5, r0:-2,   r1:8,\n   spor:[{c:-4,r:0.6},{c:-4,r:3},{c:-4,r:5.4}]},\n  {id:'sor1',  navn:'Sørjordet',    pris:5600,  niva:6,\n   c0:-2.5, c1:8.5,  r0:8,    r1:10.5,\n   spor:[{c:-0.4,r:9.2},{c:4,r:9.2},{c:6.6,r:9.2}]},\n  {id:'nordost', navn:'Morellhaugen', pris:8500, niva:7,\n   c0:8.5,  c1:11.5, r0:-4.5, r1:-2,\n   spor:[{c:9.5,r:-3.4},{c:10.6,r:-2.9}]},\n  {id:'nordvest', navn:'Bjørkekroken', pris:12500, niva:8,\n   c0:-5.5, c1:-2.5, r0:-4.5, r1:-2,\n   spor:[{c:-4.6,r:-3.4},{c:-3.5,r:-2.9}]},\n  {id:'sorvest', navn:'Bekkefaret',  pris:17500, niva:9,\n   c0:-5.5, c1:-2.5, r0:8,    r1:10.5,\n   spor:[{c:-4.6,r:8.8},{c:-3.5,r:9.6}]},\n  {id:'sorost',  navn:'Solsiden',    pris:24000, niva:10,\n   c0:8.5,  c1:11.5, r0:8,    r1:10.5,\n   spor:[{c:9.5,r:8.8},{c:10.6,r:9.6}]}\n];\n\nconst eideParseller = () => PARSELLER.slice(0, S.parseller || 0);\nconst områder       = () => [START_TOMT, ...eideParseller()];\nconst nesteParsell  = () => PARSELLER[S.parseller || 0] || null;\n\n/* Er punktet innenfor muren? Med marg > 0 krever vi at det er minst så\n   langt inn fra ytterkanten – men vi måler mot HELE tomta, ikke mot hver\n   enkelt parsell. Ellers ville skjøtene mellom parsellene blitt sperret. */\nfunction eier(c, r, marg = 0){\n  const omr = områder();\n  const inne = (x,y) => omr.some(o => x >= o.c0 && x <= o.c1 && y >= o.r0 && y <= o.r1);\n  if(!inne(c, r)) return false;\n  if(!marg) return true;\n  return inne(c-marg, r) && inne(c+marg, r) && inne(c, r-marg) && inne(c, r+marg) &&\n         inne(c-marg, r-marg) && inne(c+marg, r+marg) &&\n         inne(c-marg, r+marg) && inne(c+marg, r-marg);\n}\n/* ytterkantene av alt man eier */\nfunction grenser(){\n  const o = områder();\n  return {c0: Math.min(...o.map(x=>x.c0)), c1: Math.max(...o.map(x=>x.c1)),\n          r0: Math.min(...o.map(x=>x.r0)), r1: Math.max(...o.map(x=>x.r1))};\n}\n/* alle plantefelt som er tilgjengelige nå: [{id, c, r}] */\nfunction alleSpor(){\n  const ut = [];\n  eideParseller().forEach(p =>\n    p.spor.forEach((s,i)=> ut.push({id: p.id+':'+i, c:s.c, r:s.r, parsell:p.id})));\n  return ut;\n}\nconst midtenAv = p => ({c:(p.c0+p.c1)/2, r:(p.r0+p.r1)/2});\n\nconst iso = (c,r) => ({x: OX + (c-r)*TW/2, y: OY + (c+r)*TH/2});\n/* motsatt vei: fra punkt i verden til rutenett-koordinat */\nconst avIso = (x,y) => ({c:(x-OX)/TW + (y-OY)/TH, r:(y-OY)/TH - (x-OX)/TW});\n\n/* åkerlapper: 4 kolonner x 3 rader. FELT_C/FELT_R flytter hele åkeren i ett jafs. */\nconst FELT_C = -1, FELT_R = 1;\nconst LAPP_POS = Array.from({length:MAKS_LAPPER},\n  (_,i)=>({c: i%4 + FELT_C, r: Math.floor(i/4) + FELT_R}));\nconst FELT_MIDT = {c: FELT_C + 1.5, r: FELT_R + 1};\n/* sonen der ingenting annet får stå */\nconst iÅkeren = (c, r, m = 0.9) =>\n  c > FELT_C - m && c < FELT_C + 3 + m && r > FELT_R - m && r < FELT_R + 2 + m;\n\n/* bygninger som alltid står der – kan ikke flyttes */\nconst BYGNINGER = [\n  {id:'hus',        sprite:'hus',        c:6.3, r:0.1, b:150},\n  {id:'silo',       sprite:'silo',       c:4.2, r:0.8, b:112, klikk:'silo'},\n  {id:'laave',      sprite:'laave',      c:7.6, r:3.5, b:146},\n  {id:'bod',        sprite:'bod',        c:5.0, r:6.8, b:132, klikk:'bod'},\n  {id:'tavle',      sprite:'tavle',      c:3.2, r:7.2, b:112, klikk:'ordrer'},\n  {id:'tre1',       sprite:'tre',        c:-1.5,r:-0.5,b:104, tre:true},\n  {id:'tre2',       sprite:'tre',        c:8.3, r:-0.3,b:98,  tre:true},\n  {id:'tre3',       sprite:'tre',        c:-1.2,r:6.6, b:100, tre:true},\n  {id:'tre4',       sprite:'tre',        c:7.6, r:7.2, b:96,  tre:true},\n  {id:'tre5',       sprite:'tre',        c:4.6, r:-1.0,b:94,  tre:true}\n];\n\n/* bygninger spilleren plasserer selv når de låses opp */\nconst PLASSERBARE = {\n  honsehus:  {navn:'Hønsehuset', sprite:'honsehus',  b:118, h:143, klikk:'dyr:hone',\n              niva:2, pris:0,    slag:'dyr',  dyr:'hone', std:{c:5,r:2.5},\n              hva:'Her bor hønene. Trykk på huset for å kjøpe høner.'},\n  kufjos:    {navn:'Kufjøset',   sprite:'kufjos',    b:128, h:120, klikk:'dyr:ku',\n              niva:4, pris:0,    slag:'dyr',  dyr:'ku',   std:{c:5.5,r:5},\n              hva:'Her bor kyrne. Trykk på fjøset for å kjøpe kyr.'},\n  sauefjos:  {navn:'Sauefjøset', sprite:'sauefjos',  b:126, h:125, klikk:'dyr:sau',\n              niva:6, pris:0,    slag:'dyr',  dyr:'sau',  std:{c:0,r:5.5},\n              hva:'Her bor sauene. Trykk på fjøset for å kjøpe sauer.'},\n  bakeri:    {navn:'Bakeriet',   sprite:'bakeri',    b:130, h:139, klikk:'bygg:bakeri',\n              niva:3, pris:350,  slag:'bygg', bygg:'bakeri', std:{c:6.5,r:1.5},\n              hva:'Baker brød av hvete.'},\n  meieri:    {navn:'Meieriet',   sprite:'meieri',    b:130, h:132, klikk:'bygg:meieri',\n              niva:5, pris:900,  slag:'bygg', bygg:'meieri', std:{c:7,r:6},\n              hva:'Lager ost av melk.'},\n  saftpresse:{navn:'Saftpressa', sprite:'saftpresse',b:130, h:134, klikk:'bygg:saftpresse',\n              niva:7, pris:2000, slag:'bygg', bygg:'saftpresse', std:{c:2.5,r:6},\n              hva:'Presser saft av jordbær, gulrot og epler.'},\n  syltekjokken:{navn:'Syltekjøkkenet', sprite:'syltekjokken', b:132, h:138,\n              klikk:'bygg:syltekjokken',\n              niva:8, pris:4500, slag:'bygg', bygg:'syltekjokken', std:{c:9.8,r:2.2},\n              hva:'Koker syltetøy av bær og baker eplepai.'}\n};\n\n/* hvor dyra beiter – regnet ut fra huset sitt */\nconst BEITE = {\n  hone:[{c:-0.8,r:0.7},{c:0.4,r:1.0},{c:-0.4,r:1.4},{c:0.9,r:0.2}],\n  ku:  [{c:-0.8,r:0.8},{c:0.4,r:1.2},{c:-0.4,r:1.6}],\n  sau: [{c:-0.8,r:0.7},{c:0.4,r:1.0},{c:-0.4,r:1.4}]\n};\n\n/* småting på gresset */\n/* Vi strør pynt over hele det området gården KAN bli, og tegner bare\n   det som ligger innenfor muren akkurat nå. Da dukker det opp gress og\n   blomster på en ny parsell uten at resten av gården flytter på seg. */\nconst PYNT = [];\n(function(){\n  let s = 7;\n  const rnd = ()=> (s = (s*1103515245 + 12345) % 2147483648) / 2147483648;\n  const c0 = -5.5, c1 = 11.5, r0 = -4.5, r1 = 10.5;\n  for(let i=0;i<230;i++){\n    const c = c0+0.4 + rnd()*(c1-c0-0.8), r = r0+0.4 + rnd()*(r1-r0-0.8);\n    const t = rnd()<.78 ? 'gress' : 'blomst', f = rnd();\n    if(iÅkeren(c, r)) continue;\n    PYNT.push({c, r, t, f});\n  }\n})();\n\n/* ===================== TILSTAND ===================== */\n\nconst NØKKEL = 'akerland_v2';\n\nfunction nyttSpill(){\n  return {\n    mynter:150, xp:0, niva:1,\n    lapper: Array.from({length:START_LAPPER},()=>({sort:null, sådd:0})),\n    kjøpteLapper: START_LAPPER,\n    dyr: [],                 // {type, matet}\n    bygg: {},                // type -> {ko:[{gir,tid,startet}], ferdig:{vare:n}}\n    plassering: {},          // id -> {c,r} for bygninger spilleren har satt ut\n    parseller: 0,            // hvor mange jordstykker som er kjøpt\n    planter: {},             // spor-id -> {sort, plantet, sist}\n    lager: {},\n    siloMaks: SILO_START,\n    ordrer: [], ordreTeller: 0,\n    høstet:0, solgt:0, sett:false,\n    sist: Date.now()\n  };\n}\n\nlet S = nyttSpill();\nlet lagringVirker = true;\n\nfunction lagre(){\n  S.sist = Date.now();\n  try{ localStorage.setItem(NØKKEL, JSON.stringify(S)); }\n  catch(e){ lagringVirker = false; }\n}\nfunction laste(){\n  try{\n    const r = localStorage.getItem(NØKKEL);\n    if(r){ const d = JSON.parse(r); if(d && d.lapper){\n      S = Object.assign(nyttSpill(), d);\n      if(!S.plassering || typeof S.plassering !== 'object') S.plassering = {};\n      if(typeof S.parseller !== 'number') S.parseller = 0;\n      S.parseller = Math.max(0, Math.min(PARSELLER.length, S.parseller));\n      if(!S.planter || typeof S.planter !== 'object') S.planter = {};\n      /* planter som lå på en parsell man ikke eier lenger, ryddes bort */\n      const gyldige = new Set(alleSpor().map(s=>s.id));\n      Object.keys(S.planter).forEach(k=>{\n        if(!gyldige.has(k) || !PLANTER[S.planter[k].sort]) delete S.planter[k];\n      });\n      /* eldre lagringer: bygninger man alt eier settes tilbake på sin gamle plass */\n      Object.entries(PLASSERBARE).forEach(([id,p])=>{\n        if(S.plassering[id]) return;\n        const eier = p.slag === 'bygg' ? !!S.bygg[p.bygg] : S.dyr.some(x=>x.type===p.dyr);\n        if(eier) S.plassering[id] = {c:p.std.c, r:p.std.r};\n      });\n      return true; } }\n  }catch(e){ lagringVirker = false; }\n  return false;\n}\n\n/* ===================== HJELPERE ===================== */\n\nconst nå = () => Date.now();\nconst el = id => document.getElementById(id);\n/* Både PNG-spritene og de tegnede SVG-ene serveres som en <img>,\n   slik at all CSS som allerede finnes for bilder virker uendret. */\nconst bildeUrl = k => 'data:image/png;base64,' + SPR[k];\nconst bilde = (k, kl='') => `<img src=\"${bildeUrl(k)}\" class=\"${kl}\" alt=\"\">`;\n\nfunction tidTekst(sek){\n  sek = Math.max(0, Math.ceil(sek));\n  if(sek >= 3600){ const t=Math.floor(sek/3600), m=Math.floor((sek%3600)/60);\n    return m ? `${t}t ${m}m` : `${t}t`; }\n  if(sek >= 60){ const m=Math.floor(sek/60), s=sek%60;\n    return s ? `${m}m ${s}s` : `${m}m`; }\n  return `${sek}s`;\n}\n\nconst antall = v => S.lager[v] || 0;\nconst siloBrukt = () => Object.values(S.lager).reduce((a,b)=>a+b,0);\nconst siloLedig = () => Math.max(0, S.siloMaks - siloBrukt());\n\nfunction legg(vare, n=1){\n  const plass = siloLedig();\n  if(plass <= 0) return 0;\n  const lagt = Math.min(n, plass);\n  S.lager[vare] = antall(vare) + lagt;\n  return lagt;\n}\nfunction fjern(vare, n){\n  S.lager[vare] = Math.max(0, antall(vare) - n);\n  if(!S.lager[vare]) delete S.lager[vare];\n}\nconst harAlt = opp => Object.entries(opp).every(([v,n]) => antall(v) >= n);\nconst betal  = opp => Object.entries(opp).forEach(([v,n]) => fjern(v,n));\n\nconst nivaKrav = n => XP_TRAPP[n] ?? Infinity;\n\n/* --- flerårige planter ---\n   En plante er først \"ung\" mens den vokser til. Når den er voksen setter\n   den frukt om og om igjen: sist = da vi høstet forrige gang. */\nconst voksen = p => nå() - p.plantet >= PLANTER[p.sort].voksetid*1000;\nconst nesteKlar = p => p.sist\n  ? p.sist + PLANTER[p.sort].tid*1000\n  : p.plantet + PLANTER[p.sort].voksetid*1000;\nconst planteKlar = p => nå() >= nesteKlar(p);\n\nfunction girXp(n){\n  S.xp += n;\n  let steg = 0;\n  while(S.niva < XP_TRAPP.length-1 && S.xp >= nivaKrav(S.niva)){ S.niva++; steg++; }\n  if(steg){\n    const bonus = S.niva * 50;\n    S.mynter += bonus;\n    feiring(S.niva, bonus);\n  }\n}\n\nfunction nyttPåNiva(n){\n  const ut = [];\n  for(const [k,a] of Object.entries(AVLINGER)) if(a.niva === n) ut.push(a.navn);\n  for(const [k,d] of Object.entries(DYR))      if(d.niva === n) ut.push(d.husnavn);\n  for(const [k,b] of Object.entries(BYGG))     if(b.niva === n) ut.push(b.navn);\n  for(const [k,p] of Object.entries(PLANTER))  if(p.niva === n) ut.push(p.navn);\n  const i = LAPP_NIVA.indexOf(n);\n  if(i >= 0) ut.push('ny åkerlapp');\n  PARSELLER.forEach(p=>{ if(p.niva === n) ut.push('parsellen ' + p.navn); });\n  return ut;\n}\n\n/* alle oppskrifter et bygg kan lage */\nfunction byggData(type){ return BYGG[type]; }\nfunction byggTilstand(type){\n  if(!S.bygg[type]) S.bygg[type] = {ko:[], ferdig:{}};\n  const t = S.bygg[type];\n  if(!t.ko) t.ko = [];\n  if(!t.ferdig) t.ferdig = {};\n  return t;\n}\n<\u002Fscript>\n<script>\n/* ===================== KAMERA ===================== */\n\nlet skala = 1, tx = 0, ty = 0;\nconst verden = el('verden'), scene = el('scene');\n\nfunction settKamera(){\n  verden.style.transform = `translate3d(${tx}px,${ty}px,0) scale(${skala})`;\n}\n/* Verden er alltid like stor, men vi lar deg bare panorere over den delen\n   du faktisk eier. Kjøper du en parsell, blir kassa større av seg selv. */\nfunction eidRamme(){\n  const g = grenser();\n  const hj = [iso(g.c0,g.r0), iso(g.c1,g.r0), iso(g.c0,g.r1), iso(g.c1,g.r1)];\n  const xs = hj.map(p=>p.x), ys = hj.map(p=>p.y);\n  const n = nesteParsell();\n  if(n){    /* ta med skiltet på neste parsell, ellers ser man det aldri */\n    [iso(n.c0,n.r0), iso(n.c1,n.r0), iso(n.c0,n.r1), iso(n.c1,n.r1)]\n      .forEach(p=>{ xs.push(p.x); ys.push(p.y); });\n  }\n  return {x0: Math.min(...xs) - 185, x1: Math.max(...xs) + 185,\n          y0: Math.min(...ys) - 235, y1: Math.max(...ys) + 175};\n}\nfunction klemKamera(){\n  const sb = scene.clientWidth, sh = scene.clientHeight;\n  const R = eidRamme();\n  const x0 = R.x0*skala, x1 = R.x1*skala, y0 = R.y0*skala, y1 = R.y1*skala;\n  const bb = x1-x0, bh = y1-y0, slark = 70;\n  if(bb <= sb) tx = (sb-bb)/2 - x0;\n  else tx = Math.min(slark - x0, Math.max(sb - x1 - slark, tx));\n  if(bh <= sh) ty = (sh-bh)/2 - y0;\n  else ty = Math.min(90 - y0, Math.max(sh - y1 - 70, ty));\n}\nfunction sentrerPå(c, r){\n  const p = iso(c,r);\n  tx = scene.clientWidth/2 - p.x*skala;\n  ty = scene.clientHeight/2 - p.y*skala;\n  klemKamera(); settKamera();\n}\nfunction startKamera(){\n  const sb = scene.clientWidth, sh = scene.clientHeight;\n  skala = Math.max(.5, Math.min(1.15, Math.min(sb/700, sh/560)));\n  sentrerPå(FELT_MIDT.c + 0.1, FELT_MIDT.r + 0.4);\n}\n\n/* ===================== BYGG KARTET ===================== */\n\nconst flisEl = [], dyrEl = [], byggEl = {};\n\nfunction plasser(node, c, r, ekstra=0){\n  const p = iso(c,r);\n  node.style.left = p.x+'px';\n  node.style.top  = p.y+'px';\n  node.style.zIndex = Math.round(100 + (c+r)*10 + ekstra);\n}\n\nfunction byggPynt(){\n  const f = document.createDocumentFragment();\n  const spor = alleSpor();\n  PYNT.forEach(p=>{\n    if(!eier(p.c, p.r, 0.35)) return;                       // utenfor muren\n    if(spor.some(s=> Math.abs(s.c-p.c) < .5 && Math.abs(s.r-p.r) < .5)) return;\n    const d = document.createElement('div');\n    d.className = 'dott';\n    const st = 8 + p.f*7;\n    d.innerHTML = p.t === 'gress'\n      ? `<svg width=\"${st*2}\" height=\"${st}\" viewBox=\"0 0 24 12\"><path d=\"M4 12c0-4 1-6 2-8M8 12c0-5 1.5-8 3-10M13 12c0-4 1-7 2.5-9M18 12c0-3 .8-5 1.8-6.5\" stroke=\"#5FA83C\" stroke-width=\"1.9\" fill=\"none\" stroke-linecap=\"round\"/><\u002Fsvg>`\n      : `<svg width=\"14\" height=\"14\" viewBox=\"0 0 16 16\"><g fill=\"${p.f>.5?'#F4B942':'#E8A9BF'}\"><circle cx=\"8\" cy=\"4.5\" r=\"3\"/><circle cx=\"11.5\" cy=\"8\" r=\"3\"/><circle cx=\"8\" cy=\"11.5\" r=\"3\"/><circle cx=\"4.5\" cy=\"8\" r=\"3\"/><\u002Fg><circle cx=\"8\" cy=\"8\" r=\"2.2\" fill=\"#FFF6E3\"/><\u002Fsvg>`;\n    plasser(d, p.c, p.r, -5);\n    f.appendChild(d);\n  });\n  verden.appendChild(f);\n}\n\nfunction lagBygning(b, c, r){\n  const d = document.createElement('div');\n  d.className = 'obj';\n  d.style.width = b.b+'px';\n  d.innerHTML = bilde(b.sprite);\n  plasser(d, c, r);\n  if(b.klikk){\n    d.dataset.klikk = b.klikk;\n    const bo = document.createElement('div');\n    bo.className = 'boble skjul';\n    d.appendChild(bo);\n    byggEl[b.id] = {rot:d, boble:bo};\n  }\n  verden.appendChild(d);\n  return d;\n}\n\nfunction byggBygninger(){\n  for(const k in byggEl) delete byggEl[k];\n  BYGNINGER.forEach(b=> lagBygning(b, b.c, b.r));\n  /* bygninger spilleren har plassert selv */\n  Object.entries(PLASSERBARE).forEach(([id,p])=>{\n    const pos = S.plassering[id];\n    if(!pos) return;\n    lagBygning(Object.assign({id}, p), pos.c, pos.r);\n  });\n}\n\n/* ===================== MUR OG PORT ===================== */\n\nconst MUR_H = 34, MUR_KAPP = 7, PORT_FRA = 0.5, PORT_TIL = 2.5;\n\nfunction murBit(c, r, dir, len){\n  const A = iso(c, r);\n  const dx = (dir === 'c' ? 1 : -1) * len*TW/2, dy = len*TH/2;\n  const padd = 3;\n  const minX = Math.min(0, dx) - padd, maxX = Math.max(0, dx) + padd;\n  const minY = -MUR_H - MUR_KAPP - padd, maxY = dy + padd;\n  const w = maxX - minX, h = maxY - minY;\n  const ax = -minX, ay = -minY;\n  const P = (x,y) => `${(ax+x).toFixed(1)},${(ay+y).toFixed(1)}`;\n  const flate = dir === 'c' ? '#B3ADA3' : '#98928A';\n  const kapp  = dir === 'c' ? '#D2CDC3' : '#BDB7AD';\n  const fuge  = 'rgba(60,55,48,.28)';\n  /* steinfuger inne i flata */\n  let f = `<path d=\"M ${P(0,-MUR_H*0.55)} L ${P(dx,dy-MUR_H*0.55)}\"\n             stroke=\"${fuge}\" stroke-width=\"1.6\" fill=\"none\"/>`;\n  [0.5].forEach(t=>{ f += `<path d=\"M ${P(dx*t,dy*t)} L ${P(dx*t,dy*t-MUR_H*0.55)}\"\n             stroke=\"${fuge}\" stroke-width=\"1.6\" fill=\"none\"/>`; });\n  [0.25,0.75].forEach(t=>{ f += `<path d=\"M ${P(dx*t,dy*t-MUR_H*0.55)} L ${P(dx*t,dy*t-MUR_H)}\"\n             stroke=\"${fuge}\" stroke-width=\"1.6\" fill=\"none\"/>`; });\n\n  const d = document.createElement('div');\n  d.className = 'mur';\n  d.style.left = (A.x - ax)+'px';\n  d.style.top  = (A.y - ay)+'px';\n  d.style.zIndex = Math.round(100 + (c + r + len/2*(dir==='c'?1:0) + len/2*(dir==='r'?1:0))*10 + 3);\n  d.innerHTML = `<svg width=\"${w}\" height=\"${h}\" viewBox=\"0 0 ${w} ${h}\">\n    <polygon points=\"${P(0,0)} ${P(dx,dy)} ${P(dx,dy-MUR_H)} ${P(0,-MUR_H)}\" fill=\"${flate}\"/>\n    ${f}\n    <polygon points=\"${P(0,-MUR_H)} ${P(dx,dy-MUR_H)} ${P(dx,dy-MUR_H-MUR_KAPP)} ${P(0,-MUR_H-MUR_KAPP)}\"\n      fill=\"${kapp}\"/>\n    <path d=\"M ${P(0,0)} L ${P(dx,dy)}\" stroke=\"rgba(40,60,30,.28)\" stroke-width=\"2.5\" fill=\"none\"/>\n  <\u002Fsvg>`;\n  verden.appendChild(d);\n}\n\n/* Porten står alltid i den ytterste muren rett nedenfor tunet.\n   Kjøper du Sørjordet, flytter porten seg dit av seg selv. */\nfunction portLinje(){\n  let r = START_TOMT.r1;\n  const midt = (PORT_FRA + PORT_TIL)/2;\n  eideParseller().forEach(o=>{\n    if(midt > o.c0 && midt < o.c1 && o.r1 > r && o.r0 <= r + 1e-6) r = o.r1;\n  });\n  return r;\n}\n\nfunction byggPort(PORT_R){\n  const c0 = PORT_FRA, c1 = PORT_TIL, len = c1 - c0;\n  const A = iso(c0, PORT_R);\n  const dx = len*TW/2, dy = len*TH/2;\n  const GH = MUR_H + 14, padd = 14;\n  const minX = -padd, maxX = dx + padd;\n  const minY = -GH - 12 - padd, maxY = dy + padd;\n  const w = maxX - minX, h = maxY - minY;\n  const ax = -minX, ay = -minY;\n  const P = (x,y) => `${(ax+x).toFixed(1)},${(ay+y).toFixed(1)}`;\n  const yPå = x => x/dx*dy;\n\n  /* to steinstolper */\n  const stolpe = x0 => {\n    const y0 = yPå(x0);\n    return `<polygon points=\"${P(x0-10,y0+3)} ${P(x0+4,y0+3)} ${P(x0+4,y0-GH)} ${P(x0-10,y0-GH)}\" fill=\"#B3ADA3\"/>\n      <polygon points=\"${P(x0+4,y0+3)} ${P(x0+11,y0+6)} ${P(x0+11,y0-GH+3)} ${P(x0+4,y0-GH)}\" fill=\"#8F8981\"/>\n      <polygon points=\"${P(x0-12,y0-GH)} ${P(x0+6,y0-GH)} ${P(x0+13,y0-GH+3)} ${P(x0-5,y0-GH+3)}\" fill=\"#D2CDC3\"/>\n      <polygon points=\"${P(x0-12,y0-GH)} ${P(x0+6,y0-GH)} ${P(x0+6,y0-GH-6)} ${P(x0-12,y0-GH-6)}\" fill=\"#C6C0B6\"/>`;\n  };\n\n  /* portblad av planker mellom stolpene */\n  const px0 = 5, px1 = dx - 5, py0 = yPå(px0), py1 = yPå(px1);\n  let planker = '';\n  for(let k = 0; k < 5; k++){\n    const off = -GH + 6 + k*9;\n    planker += `<polygon points=\"${P(px0,py0+off)} ${P(px1,py1+off)} ${P(px1,py1+off+8)} ${P(px0,py0+off+8)}\"\n      fill=\"${k%2 ? '#A9713C' : '#BB8148'}\" stroke=\"rgba(70,40,15,.32)\" stroke-width=\"1\"/>`;\n  }\n  /* skrå avstivere, én i hvert portblad */\n  const mx = dx/2, my = yPå(mx);\n  const kryss = `<path d=\"M ${P(px0,py0-4)} L ${P(mx,my-GH+12)}\" stroke=\"#96652F\" stroke-width=\"6.5\" stroke-linecap=\"round\"/>\n    <path d=\"M ${P(px1,py1-4)} L ${P(mx,my-GH+12)}\" stroke=\"#96652F\" stroke-width=\"6.5\" stroke-linecap=\"round\"/>`;\n  /* midtskille og to ringhåndtak */\n  const midt = `<path d=\"M ${P(mx,my-GH+7)} L ${P(mx,my-2)}\" stroke=\"#7A4C1E\" stroke-width=\"2\" opacity=\".55\"/>\n    <circle cx=\"${(ax+mx-8).toFixed(1)}\" cy=\"${(ay+my-19).toFixed(1)}\" r=\"3.8\" fill=\"none\" stroke=\"#6E6A63\" stroke-width=\"2.2\"/>\n    <circle cx=\"${(ax+mx+8).toFixed(1)}\" cy=\"${(ay+my-19).toFixed(1)}\" r=\"3.8\" fill=\"none\" stroke=\"#6E6A63\" stroke-width=\"2.2\"/>`;\n\n  const d = document.createElement('div');\n  d.className = 'mur';\n  d.style.left = (A.x - ax)+'px';\n  d.style.top  = (A.y - ay)+'px';\n  d.style.zIndex = Math.round(100 + (c0 + len/2 + PORT_R)*10 + 4);\n  d.innerHTML = `<svg width=\"${w}\" height=\"${h}\" viewBox=\"0 0 ${w} ${h}\">\n    ${planker}${kryss}${midt}${stolpe(0)}${stolpe(dx)}<\u002Fsvg>`;\n  verden.appendChild(d);\n}\n\n/* Muren følger ytterkanten av alt du eier, uansett hvilken form gården har.\n   Vi går langs hver kantlinje i småbiter og setter opp en mur der jorda\n   slutter på den ene sida og villmarka begynner på den andre. */\nfunction byggMur(){\n  const steg = 0.5, eps = 0.02;\n  const omr = områder();\n  const inne = (c,r) => omr.some(o => c > o.c0 && c < o.c1 && r > o.r0 && r < o.r1);\n  const g = grenser();\n  const PORT_R = portLinje();\n\n  const cLinjer = [...new Set(omr.flatMap(o=>[o.c0, o.c1]))].sort((a,b)=>a-b);\n  const rLinjer = [...new Set(omr.flatMap(o=>[o.r0, o.r1]))].sort((a,b)=>a-b);\n\n  cLinjer.forEach(C=>{\n    for(let r = g.r0; r < g.r1 - 1e-6; r += steg){\n      const m = r + steg/2;\n      if(inne(C-eps, m) !== inne(C+eps, m)) murBit(C, r, 'r', steg);\n    }\n  });\n  rLinjer.forEach(R=>{\n    for(let c = g.c0; c < g.c1 - 1e-6; c += steg){\n      const m = c + steg/2;\n      if(inne(m, R-eps) === inne(m, R+eps)) continue;\n      /* hull til porten */\n      if(Math.abs(R - PORT_R) < 1e-6 && c + steg > PORT_FRA + 1e-6 && c < PORT_TIL - 1e-6) continue;\n      murBit(c, R, 'c', steg);\n    }\n  });\n  byggPort(PORT_R);\n}\n\nfunction byggFliser(){\n  flisEl.length = 0;\n  verden.querySelectorAll('.flis').forEach(n=>n.remove());\n  for(let i=0;i<MAKS_LAPPER;i++){\n    const p = LAPP_POS[i];\n    const d = document.createElement('div');\n    d.className = 'flis';\n    d.dataset.lapp = i;\n    d.innerHTML = `<div class=\"kant\"><\u002Fdiv><div class=\"plate\"><\u002Fdiv>\n      <div class=\"vekst\"><img alt=\"\"><\u002Fdiv>\n      <div class=\"ring skjul\"><svg viewBox=\"0 0 60 60\" width=\"54\" height=\"54\">\n        <circle class=\"bane\" cx=\"30\" cy=\"30\" r=\"25\"/>\n        <circle class=\"fyll\" cx=\"30\" cy=\"30\" r=\"25\" stroke-dasharray=\"157\" stroke-dashoffset=\"157\"/>\n      <\u002Fsvg><b><\u002Fb><\u002Fdiv>`;\n    plasser(d, p.c, p.r, -2);\n    verden.appendChild(d);\n    flisEl.push({\n      rot:d, plate:d.querySelector('.plate'), vekst:d.querySelector('.vekst'),\n      img:d.querySelector('.vekst img'), ring:d.querySelector('.ring'),\n      fyll:d.querySelector('.fyll'), tid:d.querySelector('.ring b')\n    });\n  }\n}\n\nfunction byggDyr(){\n  dyrEl.length = 0;\n  verden.querySelectorAll('.obj.dyr').forEach(n=>n.remove());\n  const teller = {};\n  S.dyr.forEach((dyr,i)=>{\n    const d = DYR[dyr.type];\n    const n = teller[dyr.type] = (teller[dyr.type]||0);\n    teller[dyr.type]++;\n    const hus = S.plassering[d.hus] || PLASSERBARE[d.hus].std;\n    const off = BEITE[dyr.type][n % BEITE[dyr.type].length];\n    const pos = {c: hus.c + off.c, r: hus.r + off.r};\n    const node = document.createElement('div');\n    node.className = 'obj dyr' + (n%2 ? ' snudd' : '');\n    node.style.width = (dyr.type==='hone' ? 54 : dyr.type==='ku' ? 82 : 74)+'px';\n    node.style.animationDelay = (n*.7)+'s';\n    node.dataset.klikk = 'dyrind:'+i;\n    node.innerHTML = bilde(dyr.type) + '<div class=\"boble skjul\"><\u002Fdiv>';\n    plasser(node, pos.c, pos.r);\n    verden.appendChild(node);\n    dyrEl.push({rot:node, boble:node.querySelector('.boble'), i});\n  });\n}\n\n/* ---- plantefelt på parsellene ---- */\nconst planteEl = {};\n\nfunction byggPlanter(){\n  for(const k in planteEl) delete planteEl[k];\n  verden.querySelectorAll('.plantefelt,.obj.plante').forEach(n=>n.remove());\n  alleSpor().forEach(s=>{\n    const p = S.planter[s.id];\n    if(!p){\n      /* tomt felt: en oppgravd jordflekk man kan trykke på */\n      const d = document.createElement('div');\n      d.className = 'plantefelt';\n      d.dataset.klikk = 'spor:'+s.id;\n      d.innerHTML = `<div class=\"jord\"><\u002Fdiv><span class=\"pluss\">+<\u002Fspan>`;\n      plasser(d, s.c, s.r, -3);\n      verden.appendChild(d);\n      return;\n    }\n    const pl = PLANTER[p.sort];\n    const ung = !voksen(p);\n    const node = document.createElement('div');\n    node.className = 'obj plante' + (ung ? ' ung' : '');\n    node.style.width = (ung ? Math.round(pl.b*0.42) : pl.b) + 'px';\n    node.dataset.klikk = 'spor:'+s.id;\n    node.innerHTML = bilde(ung ? 'spire' : pl.sprite) + '<div class=\"boble skjul\"><\u002Fdiv>';\n    plasser(node, s.c, s.r);\n    verden.appendChild(node);\n    planteEl[s.id] = {rot:node, boble:node.querySelector('.boble')};\n  });\n}\n\n/* skilt på den neste parsellen man kan kjøpe */\nfunction byggParsellskilt(){\n  const p = nesteParsell();\n  if(!p) return;\n  const m = midtenAv(p);\n  const d = document.createElement('div');\n  d.className = 'obj skilt';\n  d.style.width = '78px';\n  d.dataset.klikk = 'parsell';\n  const kan = S.niva >= p.niva;\n  if(!kan) d.classList.add('laast');\n  d.innerHTML = `${bilde('skilt')}\n    <div class=\"boble\">${kan ? '<span>Til salgs<\u002Fspan>' : '<span>Nivå '+p.niva+'<\u002Fspan>'}<\u002Fdiv>`;\n  plasser(d, m.c, m.r);\n  verden.appendChild(d);\n}\n\n/* ===================== VILLMARKA UTENFOR MUREN =====================\n   Utenfor gjerdet ligger det som ikke er gård: skog, kratt, steiner og\n   stubber, en grusvei som går forbi porten, og en bekk med bru over.\n\n   Alt sammen strøs ut EN gang, med fast «tilfeldighet», over hele\n   området kartet kan komme til å vise. Så tegner vi bare det som ligger\n   utenfor muren akkurat nå. Kjøper du en parsell, ryddes skogen der av\n   seg selv neste gang kartet bygges – på samme måte som gresset og\n   blomstene dukker opp innenfor muren. */\n\n/* så stor kan gården bli helt til slutt */\nconst MAKS_TOMT = {c0:-5.5, c1:11.5, r0:-4.5, r1:10.5};\n\n/* hvor stort område vi strør villmark over (litt utenfor det man kan se) */\nconst VILL_C0 = -10.5, VILL_C1 = 16.5, VILL_R0 = -9.5, VILL_R1 = 15.5;\n\n/* veien: hvor langt utenfor muren grusveien går */\nconst VEI_A = 0.70, VEI_B = 1.62;\nconst VEI_C0 = -18, VEI_C1 = 26;\nconst BRU_HALV = 1.16;          // halve brua, målt fra midten av bekken\n\n/* bekken slynger seg nedover vest for gården */\nconst BEKK_C  = r => -7.5 + Math.sin(r*0.42 + 0.6)*0.75 + Math.sin(r*0.19)*0.30;\nconst BEKK_BR = 0.86;                 // bredden på selve vannet\nconst BEKK_R0 = -15, BEKK_R1 = 19;\n\n/* Er punktet så nær gården at det ikke skal stå noe vilt der? */\nfunction nærGården(c, r, m = 0.75){\n  return områder().some(o => c > o.c0-m && c < o.c1+m && r > o.r0-m && r < o.r1+m);\n}\n/* midt på brua – der veien krysser bekken */\n/* 1 midt på strekket, 0 helt ute i enden – brukes til å tone ut */\nfunction utToning(i, n, mjuk = 6){\n  return Math.max(0, Math.min(1, Math.min(i, n-1-i) / mjuk));\n}\nfunction bruSenter(){\n  const r = portLinje() + (VEI_A + VEI_B)/2;\n  return {c: BEKK_C(r), r};\n}\n\n/* ---- selve utstrøingen ---------------------------------------------\n   Tett skog langt ute, spredt kratt på jorda gården en gang skal ta. */\nconst VILL = [];\n(function(){\n  let s = 20260806;\n  const rnd = ()=> (s = (s*1103515245 + 12345) % 2147483648) / 2147483648;\n  for(let i=0;i<1500;i++){\n    const c = VILL_C0 + rnd()*(VILL_C1-VILL_C0);\n    const r = VILL_R0 + rnd()*(VILL_R1-VILL_R0);\n    const slag = rnd(), sjanse = rnd(), form = rnd(), str = rnd();\n    /* hvor langt utenfor den største gården ligger punktet? */\n    const ut = Math.max(MAKS_TOMT.c0 - c, c - MAKS_TOMT.c1,\n                        MAKS_TOMT.r0 - r, r - MAKS_TOMT.r1, 0);\n    if(ut > 5.2) continue;                       // så langt ser man aldri\n    const tetthet = ut <= 0 ? 0.065 : Math.min(0.40, 0.115 + ut*0.085);\n    if(sjanse > tetthet) continue;\n    let t;\n    if(slag < (ut <= 0 ? 0.26 : 0.58)) t = 'tre';\n    else if(slag < 0.80) t = 'busk';\n    else if(slag < 0.91) t = 'strå';\n    else if(slag < 0.97) t = 'stein';\n    else t = 'stubbe';\n    VILL.push({c, r, t, f:form, s:0.62 + str*0.46});\n  }\n})();\n\n/* ---- en flat flate på bakken ---------------------------------------\n   Punktene oppgis i rutenett-koordinater. Vi lager ett element per rute\n   slik at trær og hus havner riktig foran og bak – samme triks som muren\n   bruker. Tredje tallet i P/L er høyde over bakken, brukt til rekkverk. */\nlet sisteBakke = null;\nfunction bakkeflate(ramme, ac, ar, tegn, ekstra = -6, toppRom = 0){\n  const pkt = ramme.map(([c,r]) => iso(c,r));\n  const pad = 5;\n  const x0 = Math.min(...pkt.map(p=>p.x)) - pad, x1 = Math.max(...pkt.map(p=>p.x)) + pad;\n  const y0 = Math.min(...pkt.map(p=>p.y)) - pad - toppRom, y1 = Math.max(...pkt.map(p=>p.y)) + pad;\n  const P = (c,r,h=0) => { const p = iso(c,r); return {x: p.x-x0, y: p.y-y0-h}; };\n  const L = (c,r,h=0) => { const p = P(c,r,h); return `${p.x.toFixed(1)},${p.y.toFixed(1)}`; };\n  const d = document.createElement('div');\n  d.className = 'bakke';\n  d.style.left = x0+'px';\n  d.style.top  = y0+'px';\n  d.style.zIndex = Math.round(100 + (ac+ar)*10 + ekstra);\n  d.innerHTML = `<svg width=\"${(x1-x0).toFixed(1)}\" height=\"${(y1-y0).toFixed(1)}\">${tegn(L,P)}<\u002Fsvg>`;\n  verden.appendChild(d);\n  sisteBakke = d;\n  return d;\n}\n\n/* ---- grusveien forbi porten ---------------------------------------- */\nfunction byggVei(){\n  const R = portLinje(), rA = R + VEI_A, rB = R + VEI_B;\n  const bru = bruSenter();\n  const b0 = bru.c - BRU_HALV, b1 = bru.c + BRU_HALV;\n  const biter = [];\n  for(let c = VEI_C0; c < VEI_C1; c++){\n    /* del ruta i det som ligger utenfor brua – da møtes vei og bru presis */\n    if(c + 1 <= b0 || c >= b1) biter.push([c, c+1]);\n    else {\n      if(c < b0 - 0.04) biter.push([c, b0]);\n      if(c + 1 > b1 + 0.04) biter.push([b1, c+1]);\n    }\n  }\n  biter.forEach(([c, c2], i)=>{\n    const gj = utToning(i, biter.length);\n    if(gj <= 0.02) return;\n    sisteBakke = null;\n    bakkeflate([[c,rA],[c2,rA],[c2,rB],[c,rB]], (c+c2)/2, (rA+rB)/2, (L,P)=>{\n      const st = (t, u, rr) => {\n        const p = P(c + (c2-c)*t, rr);\n        return `<ellipse cx=\"${p.x.toFixed(1)}\" cy=\"${p.y.toFixed(1)}\"\n          rx=\"${(3+u*2.4).toFixed(1)}\" ry=\"${(1.6+u*1.1).toFixed(1)}\"\n          fill=\"rgba(255,255,255,.30)\"/>`;\n      };\n      const u = ((Math.round(c*13)*7919)%100)/100;  // fast «tilfeldig» per bit\n      return `\n        <polygon points=\"${L(c,rA)} ${L(c2,rA)} ${L(c2,rB)} ${L(c,rB)}\" fill=\"#C9A470\"/>\n        <polygon points=\"${L(c,rA)} ${L(c2,rA)} ${L(c2,rA+.13)} ${L(c,rA+.13)}\"\n          fill=\"rgba(80,58,28,.20)\"/>\n        <polygon points=\"${L(c,rB-.13)} ${L(c2,rB-.13)} ${L(c2,rB)} ${L(c,rB)}\"\n          fill=\"rgba(80,58,28,.20)\"/>\n        <polygon points=\"${L(c,rA+.30)} ${L(c2,rA+.30)} ${L(c2,rA+.38)} ${L(c,rA+.38)}\"\n          fill=\"rgba(122,88,44,.32)\"/>\n        <polygon points=\"${L(c,rB-.38)} ${L(c2,rB-.38)} ${L(c2,rB-.30)} ${L(c,rB-.30)}\"\n          fill=\"rgba(122,88,44,.32)\"/>\n        ${c2-c > .5 ? st(0.25, u, rA+0.55)+st(0.72, 1-u, rB-0.28) : ''}`;\n    });\n    if(sisteBakke && gj < 1) sisteBakke.style.opacity = gj.toFixed(2);\n  })\n  /* stubben fra porten og ned på veien */\n  const pa = PORT_FRA + 0.30, pb = PORT_TIL - 0.30, pr = R - 0.12, pn = rA + 0.42;\n  bakkeflate([[pa,pr],[pb,pr],[pb,pn],[pa,pn]], (pa+pb)/2, R + VEI_A/2, L => `\n      <polygon points=\"${L(pa,pr)} ${L(pb,pr)} ${L(pb,pn)} ${L(pa,pn)}\" fill=\"#C9A470\"/>\n      <polygon points=\"${L(pa,pr)} ${L(pa+.10,pr)} ${L(pa+.10,pn)} ${L(pa,pn)}\"\n        fill=\"rgba(80,58,28,.16)\"/>\n      <polygon points=\"${L(pb-.10,pr)} ${L(pb,pr)} ${L(pb,pn)} ${L(pb-.10,pn)}\"\n        fill=\"rgba(80,58,28,.16)\"/>\n      <polygon points=\"${L(pa+.24,pr)} ${L(pa+.32,pr)} ${L(pa+.32,pn)} ${L(pa+.24,pn)}\"\n        fill=\"rgba(122,88,44,.30)\"/>\n      <polygon points=\"${L(pb-.32,pr)} ${L(pb-.24,pr)} ${L(pb-.24,pn)} ${L(pb-.32,pn)}\"\n        fill=\"rgba(122,88,44,.30)\"/>`, 14);\n}\n\n/* ---- bekken ---------------------------------------------------------\n   Ett stykke per rute nedover, med samme kant i begge ender, så det\n   henger sammen som ett slyngende vannløp. */\nfunction byggBekk(){\n  const v = BEKK_BR/2, b = v + 0.30;\n  for(let r = BEKK_R0; r < BEKK_R1; r++){\n    const gj = utToning(r - BEKK_R0, BEKK_R1 - BEKK_R0);\n    if(gj <= 0.02) continue;\n    const a = BEKK_C(r), d = BEKK_C(r+1);\n    sisteBakke = null;\n    bakkeflate([[a-b,r],[a+b,r],[d+b,r+1],[d-b,r+1]], (a+d)/2, r+0.5, (L,P)=>{\n      const g = P((a+d)/2 + 0.1, r + 0.45);\n      return `\n        <polygon points=\"${L(a-b,r)} ${L(a+b,r)} ${L(d+b,r+1)} ${L(d-b,r+1)}\" fill=\"#CDBE8E\"/>\n        <polygon points=\"${L(a-v,r)} ${L(a+v,r)} ${L(d+v,r+1)} ${L(d-v,r+1)}\" fill=\"#4E8CB8\"/>\n        <polygon points=\"${L(a-v*.62,r)} ${L(a+v*.62,r)} ${L(d+v*.62,r+1)} ${L(d-v*.62,r+1)}\"\n          fill=\"#7FB6D9\"/>\n        <ellipse class=\"glimt\" cx=\"${g.x.toFixed(1)}\" cy=\"${g.y.toFixed(1)}\"\n          rx=\"9\" ry=\"3.4\" fill=\"#FFFFFF\" style=\"animation-delay:${((r+9)%5)*0.9}s\"/>`;\n    }, -4);\n    if(sisteBakke && gj < 1) sisteBakke.style.opacity = gj.toFixed(2);\n  }\n}\n\n/* ---- brua der veien krysser bekken ---------------------------------- */\nfunction byggBru(){\n  const R = portLinje(), rA = R + VEI_A - 0.14, rB = R + VEI_B + 0.14;\n  const m = bruSenter(), c0 = m.c - BRU_HALV, c1 = m.c + BRU_HALV;\n  bakkeflate([[c0,rA],[c1,rA],[c1,rB],[c0,rB]], m.c, (rA+rB)/2, L => {\n    let h = `<polygon points=\"${L(c0,rA)} ${L(c1,rA)} ${L(c1,rB)} ${L(c0,rB)}\" fill=\"#B98B52\"/>`;\n    /* plankene på tvers */\n    for(let i=1;i<9;i++){\n      const t = c0 + (c1-c0)*i/9;\n      h += `<path d=\"M ${L(t,rA)} L ${L(t,rB)}\" stroke=\"rgba(90,58,26,.35)\" stroke-width=\"1.6\"/>`;\n    }\n    /* rekkverk: stolper og en overligger på hver side */\n    [rA, rB].forEach((rr, si)=>{\n      const farge = si ? '#8C5F32' : '#A87B47';\n      [0, 0.5, 1].forEach(t=>{\n        const c = c0 + (c1-c0)*t;\n        h += `<path d=\"M ${L(c,rr)} L ${L(c,rr,17)}\" stroke=\"${farge}\"\n                stroke-width=\"3.4\" stroke-linecap=\"round\"/>`;\n      });\n      h += `<polygon points=\"${L(c0,rr,13)} ${L(c1,rr,13)} ${L(c1,rr,17)} ${L(c0,rr,17)}\"\n              fill=\"${farge}\"/>`;\n    });\n    return h;\n  }, 6, 26);\n}\n\n/* ---- skog, kratt, steiner og stubber -------------------------------- */\nfunction byggVillmark(){\n  const f = document.createDocumentFragment();\n  const R = portLinje();\n  const n = nesteParsell(), nm = n ? midtenAv(n) : null;\n  VILL.forEach(v=>{\n    if(nærGården(v.c, v.r)) return;                              // innenfor muren\n    if(v.r > R + VEI_A - 0.50 && v.r < R + VEI_B + 0.50) return; // på veien\n    if(Math.abs(v.c - BEKK_C(v.r)) < BEKK_BR/2 + 0.55) return;   // i bekken\n    if(nm && Math.abs(nm.c - v.c) < 1.35 && Math.abs(nm.r - v.r) < 1.35) return; // foran skiltet\n\n    const d = document.createElement('div');\n    d.className = 'vill';\n    if(v.t === 'tre'){\n      const bredde = Math.round(84 * v.s);\n      const dreid = Math.round(-14 + v.f*26), lys = (0.86 + v.f*0.22).toFixed(2);\n      d.style.width = bredde+'px';\n      d.innerHTML = `<img src=\"${bildeUrl('tre')}\" alt=\"\" style=\"\n        filter:drop-shadow(0 5px 5px rgba(20,60,25,.26)) hue-rotate(${dreid}deg)\n               saturate(${(0.9+v.f*0.35).toFixed(2)}) brightness(${lys});\n        transform:scaleX(${v.f > 0.5 ? -1 : 1})\">`;\n    } else if(v.t === 'busk'){\n      d.style.width = Math.round(34 + v.s*20)+'px';\n      const m1 = v.f > .5 ? '#4C9639' : '#3F8A34', m2 = v.f > .5 ? '#63B84B' : '#57AC42';\n      d.innerHTML = `<svg viewBox=\"0 0 40 32\">\n        <ellipse cx=\"20\" cy=\"29\" rx=\"14\" ry=\"3.4\" fill=\"rgba(20,60,25,.20)\"/>\n        <circle cx=\"12\" cy=\"20\" r=\"9\" fill=\"${m1}\"/>\n        <circle cx=\"27\" cy=\"21\" r=\"8\" fill=\"${m1}\"/>\n        <circle cx=\"20\" cy=\"14\" r=\"9.5\" fill=\"${m2}\"/>\n        <circle cx=\"16\" cy=\"17\" r=\"3\" fill=\"rgba(255,255,255,.16)\"/><\u002Fsvg>`;\n    } else if(v.t === 'strå'){\n      d.style.width = Math.round(26 + v.s*16)+'px';\n      d.innerHTML = `<svg viewBox=\"0 0 30 24\">\n        <path d=\"M6 24C6 15 7 10 8.5 6M12 24C12 14 13.5 8 15.5 4M19 24C19 15 20 10 21.5 6.5\n                 M24 24C24 17 24.8 13 26 10\" stroke=\"#4F9B3C\" stroke-width=\"2.1\"\n              fill=\"none\" stroke-linecap=\"round\"/><\u002Fsvg>`;\n    } else if(v.t === 'stein'){\n      d.style.width = Math.round(22 + v.s*16)+'px';\n      d.innerHTML = `<svg viewBox=\"0 0 30 26\">\n        <ellipse cx=\"15\" cy=\"23\" rx=\"11\" ry=\"3\" fill=\"rgba(20,60,25,.20)\"/>\n        <path d=\"M4 23L6.5 11L15 6L24.5 12L26 23Z\" fill=\"#A19C93\"/>\n        <path d=\"M6.5 11L15 6L18.5 13.5L9.5 15.5Z\" fill=\"#C4C0B6\"/><\u002Fsvg>`;\n    } else {\n      d.style.width = Math.round(20 + v.s*12)+'px';\n      d.innerHTML = `<svg viewBox=\"0 0 26 24\">\n        <ellipse cx=\"13\" cy=\"21\" rx=\"9.5\" ry=\"2.8\" fill=\"rgba(20,60,25,.20)\"/>\n        <path d=\"M5 20V10Q13 7 21 10V20Q13 23 5 20Z\" fill=\"#8A5A32\"/>\n        <ellipse cx=\"13\" cy=\"10\" rx=\"8\" ry=\"3.2\" fill=\"#C08C55\"/>\n        <ellipse cx=\"13\" cy=\"10\" rx=\"3.6\" ry=\"1.4\" fill=\"#A9743F\"/><\u002Fsvg>`;\n    }\n    plasser(d, v.c, v.r, -1);\n    f.appendChild(d);\n  });\n  verden.appendChild(f);\n}\n\n/* ---- litt liv i lufta -----------------------------------------------\n   Tre fugler som seiler over gården, og to sommerfugler som svever\n   rundt på tunet. Bare fem ting som beveger seg – nok til at bildet\n   føles levende, lite nok til at gamle nettbrett henger med. */\nfunction byggLiv(){\n  const ram = eidRamme();\n  const len = Math.round(ram.x1 - ram.x0 + 260);\n  [[-130, ram.y0 + 40, 48, 1, 0],\n   [-130, ram.y0 + 96, 61, .78, -19],\n   [-130, ram.y0 + 18, 54, .62, -37]].forEach(([dx, y, tid, str, forsink])=>{\n    const d = document.createElement('div');\n    d.className = 'fugl';\n    d.style.left = (ram.x0 + dx)+'px';\n    d.style.top  = y+'px';\n    d.style.setProperty('--len', len+'px');\n    d.style.setProperty('--tid', tid+'s');\n    d.style.animationDelay = forsink+'s';\n    const b = Math.round(26*str);\n    d.innerHTML = `<i><svg width=\"${b}\" height=\"${Math.round(b*0.42)}\" viewBox=\"0 0 26 11\">\n      <path d=\"M1.5 9Q7 1 13 6.5Q19 1 24.5 9\" stroke=\"#3E5C46\" stroke-width=\"2.2\"\n            fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg><\u002Fi>`;\n    verden.appendChild(d);\n  });\n\n  [[0.0, 4.9, '#F4B942', 0], [6.6, 5.6, '#E8A9BF', -7]].forEach(([c, r, farge, forsink])=>{\n    const p = iso(c, r);\n    const d = document.createElement('div');\n    d.className = 'sommerfugl';\n    d.style.left = p.x+'px';\n    d.style.top  = (p.y - 46)+'px';\n    d.style.animationDelay = forsink+'s';\n    d.innerHTML = `<i><svg width=\"15\" height=\"13\" viewBox=\"0 0 15 13\">\n      <ellipse cx=\"4.4\" cy=\"6\" rx=\"3.6\" ry=\"4.8\" fill=\"${farge}\"/>\n      <ellipse cx=\"10.6\" cy=\"6\" rx=\"3.6\" ry=\"4.8\" fill=\"${farge}\"/>\n      <ellipse cx=\"4.4\" cy=\"4.4\" rx=\"1.6\" ry=\"1.8\" fill=\"rgba(255,255,255,.55)\"/>\n      <ellipse cx=\"10.6\" cy=\"4.4\" rx=\"1.6\" ry=\"1.8\" fill=\"rgba(255,255,255,.55)\"/>\n      <rect x=\"6.9\" y=\"2.6\" width=\"1.2\" height=\"7.6\" rx=\".6\" fill=\"#6B4A05\"/><\u002Fsvg><\u002Fi>`;\n    verden.appendChild(d);\n  });\n}\n\nfunction byggKart(){\n  verden.innerHTML = '';\n  verden.style.width = VERDEN_B+'px';\n  verden.style.height = VERDEN_H+'px';\n  byggVei();\n  byggBekk();\n  byggBru();\n  byggVillmark();\n  byggPynt();\n  byggMur();\n  byggFliser();\n  byggBygninger();\n  byggPlanter();\n  byggParsellskilt();\n  byggDyr();\n  byggLiv();\n}\n\n/* ===================== OPPDATER KARTET ===================== */\n\nfunction stadium(sort, andel){\n  if(andel >= 1) return sort;\n  if(andel >= .5) return 'mellom';\n  return 'spire';\n}\n\nfunction oppdaterFliser(){\n  const O = 157;\n  for(let i=0;i<MAKS_LAPPER;i++){\n    const e = flisEl[i];\n    if(i >= S.kjøpteLapper){\n      e.rot.dataset.tilstand = 'laast';\n      e.rot.className = 'flis laast';\n      e.plate.style.background = 'linear-gradient(160deg,#A9C69C,#7FA173)';\n      e.vekst.classList.add('skjul'); e.ring.classList.add('skjul');\n      continue;\n    }\n    e.plate.style.background = '';\n    const lapp = S.lapper[i];\n    if(!lapp || !lapp.sort){\n      e.rot.className = 'flis tom';\n      e.rot.dataset.tilstand = 'tom';\n      e.vekst.classList.add('skjul'); e.ring.classList.add('skjul');\n      continue;\n    }\n    const a = AVLINGER[lapp.sort];\n    const gått = (nå() - lapp.sådd)/1000;\n    const andel = Math.max(0, Math.min(1, gått/a.tid));\n    const klar = andel >= 1;\n    const st = stadium(lapp.sort, andel);\n    e.rot.className = 'flis ' + (klar ? 'klar' : 'vokser');\n    e.rot.dataset.tilstand = klar ? 'klar' : 'vokser';\n    e.vekst.classList.remove('skjul');\n    e.vekst.className = 'vekst' + (st==='spire' ? ' liten' : st==='mellom' ? ' mid' : '');\n    if(e.img.dataset.st !== st){\n      e.img.dataset.st = st;\n      e.img.src = 'data:image/png;base64,' + SPR[st];\n      e.vekst.classList.remove('groddu'); void e.vekst.offsetWidth;\n      e.vekst.classList.add('groddu');\n    }\n    if(klar){ e.ring.classList.add('skjul'); }\n    else{\n      e.ring.classList.remove('skjul');\n      e.fyll.style.strokeDashoffset = O*(1-andel);\n      e.tid.textContent = tidTekst(a.tid - gått);\n    }\n  }\n}\n\nfunction oppdaterDyr(){\n  dyrEl.forEach(e=>{\n    const dyr = S.dyr[e.i];\n    if(!dyr) return;\n    const d = DYR[dyr.type];\n    if(!dyr.matet){\n      e.boble.className = 'boble sulten';\n      e.boble.innerHTML = harAlt(d.for)\n        ? `${bilde(Object.keys(d.for)[0])}<span>Mat meg<\u002Fspan>`\n        : `<span>Trenger fôr<\u002Fspan>`;\n    }else{\n      const gått = (nå()-dyr.matet)/1000;\n      if(gått >= d.tid){\n        e.boble.className = 'boble klar';\n        e.boble.innerHTML = bilde(d.gir);\n      }else{\n        e.boble.className = 'boble';\n        e.boble.innerHTML = `<span>${tidTekst(d.tid-gått)}<\u002Fspan>`;\n      }\n    }\n  });\n}\n\nfunction oppdaterBygg(){\n  Object.entries(BYGG).forEach(([type, b])=>{\n    const e = byggEl[type];\n    if(!e) return;\n    e.rot.style.filter = '';\n    const t = byggTilstand(type);\n    const ferdig = Object.values(t.ferdig).reduce((a,x)=>a+x,0);\n    if(ferdig){\n      e.boble.className = 'boble klar';\n      e.boble.innerHTML = bilde(Object.keys(t.ferdig)[0]) +\n        (ferdig>1 ? `<span>${ferdig}<\u002Fspan>` : '');\n    }else if(t.ko.length){\n      const k = t.ko[0];\n      const rest = k.startet ? k.tid - (nå()-k.startet)/1000 : k.tid;\n      e.boble.className = 'boble';\n      e.boble.innerHTML = `<span>${tidTekst(rest)}<\u002Fspan>`;\n    }else{\n      e.boble.className = 'boble skjul';\n    }\n  });\n  Object.entries(DYR).forEach(([type,d])=>{\n    const e = byggEl[d.hus];\n    if(!e) return;\n    e.rot.style.filter = '';\n    if(!S.dyr.some(x=>x.type===type)){\n      e.boble.className = 'boble';\n      e.boble.innerHTML = `<span>Kjøp ${d.flertall}<\u002Fspan>`;\n    }else{\n      e.boble.className = 'boble skjul';\n    }\n  });\n}\n\nfunction tikkBygg(){\n  let endret = false;\n  Object.keys(BYGG).forEach(type=>{\n    if(!S.bygg[type]) return;\n    const t = byggTilstand(type);\n    while(t.ko.length){\n      const k = t.ko[0];\n      if(!k.startet){ k.startet = nå(); endret = true; }\n      if(nå() - k.startet >= k.tid*1000){\n        t.ko.shift();\n        t.ferdig[k.gir] = (t.ferdig[k.gir]||0) + 1;\n        endret = true;\n      }else break;\n    }\n  });\n  return endret;\n}\n\nfunction oppdaterHud(){\n  el('myntTall').textContent = S.mynter.toLocaleString('nb-NO');\n  el('nivaTall').textContent = S.niva;\n  const forrige = XP_TRAPP[S.niva-1] ?? 0, neste = nivaKrav(S.niva);\n  el('xpFyll').style.width = neste === Infinity ? '100%'\n    : Math.max(0, Math.min(100, (S.xp-forrige)/(neste-forrige)*100)) + '%';\n  const brukt = siloBrukt();\n  el('siloTall').textContent = brukt + '/' + S.siloMaks;\n  el('siloPille').classList.toggle('full', brukt >= S.siloMaks);\n  const klare = S.ordrer.filter(kanLevere).length;\n  const m = el('ordreMerke');\n  if(m){ m.textContent = klare; m.classList.toggle('skjul', !klare); }\n  const bm = el('byggMerke');\n  if(bm){ const n = venterPåPlass(); bm.textContent = n; bm.classList.toggle('skjul', !n); }\n}\n\nfunction oppdaterPlanter(){\n  let byggOm = false;\n  Object.entries(planteEl).forEach(([id,e])=>{\n    const p = S.planter[id];\n    if(!p) return;\n    const pl = PLANTER[p.sort];\n    /* nettopp blitt voksen? da må sprita byttes – vi bygger om kartet én gang */\n    if(e.rot.classList.contains('ung') && voksen(p)){ byggOm = true; return; }\n    if(planteKlar(p)){\n      e.boble.className = 'boble klar';\n      e.boble.innerHTML = bilde(pl.gir) + `<span>${pl.ant}<\u002Fspan>`;\n      e.rot.classList.add('moden');\n    }else{\n      e.boble.className = 'boble';\n      e.boble.innerHTML = `<span>${tidTekst((nesteKlar(p)-nå())/1000)}<\u002Fspan>`;\n      e.rot.classList.remove('moden');\n    }\n  });\n  if(byggOm){\n    byggKart();\n    oppdaterFliser(); oppdaterDyr(); oppdaterBygg(); oppdaterPlanter();\n  }\n}\n\nfunction oppdaterAlt(){\n  oppdaterFliser(); oppdaterDyr(); oppdaterBygg(); oppdaterPlanter(); oppdaterHud();\n}\n\n/* ===================== HANDLINGER ===================== */\n\nlet valgtFrø = null;\n\nfunction skjermPos(node){\n  const r = node.getBoundingClientRect();\n  return {x: r.left + r.width/2, y: r.top + r.height/2};\n}\n\nfunction flyTil(vare, fra){\n  const mål = el('siloPille').getBoundingClientRect();\n  const d = document.createElement('div');\n  d.className = 'flyvare';\n  d.innerHTML = bilde(vare);\n  d.style.left = (fra.x-19)+'px'; d.style.top = (fra.y-19)+'px';\n  el('effekter').appendChild(d);\n  requestAnimationFrame(()=>{\n    d.style.transition = 'transform .7s cubic-bezier(.5,0,.75,1), opacity .7s';\n    d.style.transform = `translate(${mål.left+mål.width/2-fra.x}px,${mål.top+mål.height/2-fra.y}px) scale(.4)`;\n    d.style.opacity = '.3';\n  });\n  setTimeout(()=>d.remove(), 780);\n}\n\nfunction plussTall(tekst, fra, farge){\n  const d = document.createElement('div');\n  d.className
