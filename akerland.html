= 'plusstall';\n  d.textContent = tekst;\n  d.style.left = (fra.x-20)+'px'; d.style.top = (fra.y-16)+'px';\n  if(farge) d.style.color = farge;\n  el('effekter').appendChild(d);\n  setTimeout(()=>d.remove(), 1000);\n}\n\nfunction høstLapp(i){\n  const lapp = S.lapper[i];\n  if(!lapp || !lapp.sort) return false;\n  const a = AVLINGER[lapp.sort];\n  if(nå() - lapp.sådd < a.tid*1000) return false;\n  if(siloLedig() <= 0){ varsel('Siloen er full!', 'feil'); return false; }\n  legg(lapp.sort, 1);\n  girXp(a.xp);\n  S.høstet++;\n  S.lapper[i] = {sort:null, sådd:0};\n  flyTil(lapp.sort, skjermPos(flisEl[i].rot));\n  spill('høst');\n  return true;\n}\n\nfunction såLapp(i, sort){\n  const lapp = S.lapper[i];\n  if(!lapp || lapp.sort) return false;\n  const a = AVLINGER[sort];\n  if(S.mynter < a.frø) return false;\n  S.mynter -= a.frø;\n  S.lapper[i] = {sort, sådd: nå()};\n  spill('så');\n  return true;\n}\n\nfunction trykkFlis(i){\n  if(i >= S.kjøpteLapper){ visKjøpLapp(); return; }\n  const lapp = S.lapper[i];\n  /* Har man frø i hånda gjelder det bare tomme ruter. Ruter med avling\n     håndteres nedenfor, slik at man kan høste uten å legge fra seg frøet. */\n  if(valgtFrø && !lapp.sort){\n    if(!såLapp(i, valgtFrø)){ varsel('Ikke nok mynter', 'feil'); avbrytFrø(); }\n    else { lagre(); oppdaterAlt(); tegnFrøRad(); }\n    return;\n  }\n  if(lapp.sort){\n    const a = AVLINGER[lapp.sort];\n    if(nå() - lapp.sådd >= a.tid*1000){\n      if(høstLapp(i)){ lagre(); oppdaterAlt(); tegnFrøRad(); }\n    }else{\n      const rest = a.tid - (nå()-lapp.sådd)/1000;\n      varsel(`${a.navn} er klar om ${tidTekst(rest)}`);\n    }\n  }else{\n    åpneFrøvalg();\n  }\n}\n\n/* --- frølinje --- */\nfunction åpneFrøvalg(){\n  const ledige = S.lapper.filter(l=>!l.sort).length;\n  let h = `<div class=\"panel-topp\">${bilde('hvete')}<div><h3>Såing<\u002Fh3>\n    <p>${ledige} ledige lapper på åkeren<\u002Fp><\u002Fdiv>\n    <button class=\"lukk\" onclick=\"lukkPanel()\">×<\u002Fbutton><\u002Fdiv>`;\n\n  const åpne = [], låste = [];\n  Object.entries(AVLINGER).forEach(e => (S.niva < e[1].niva ? låste : åpne).push(e));\n\n  åpne.forEach(([k,a])=>{\n    const råd = S.mynter >= a.frø;\n    h += `<div class=\"rad ${valgtFrø===k?'aktiv':''}\">${bilde(k)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">${a.navn}<\u002Fdiv>\n      <div class=\"rad-under\">${tidTekst(a.tid)} · selges for ${a.pris} mynt<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp gull\" ${råd?'':'disabled'} onclick=\"velgFrø('${k}')\">\n        ${a.frø} mynt<\u002Fbutton><\u002Fdiv>`;\n  });\n\n  låste.forEach(([k,a])=>{\n    h += `<div class=\"rad\" style=\"opacity:.55\">${bilde(k)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">${a.navn}<\u002Fdiv>\n      <div class=\"rad-under\">Åpnes på nivå ${a.niva}<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp rolig\" disabled>Låst<\u002Fbutton><\u002Fdiv>`;\n  });\n\n  visPanel(h);\n}\nfunction avbrytFrø(){\n  valgtFrø = null;\n  el('frolinje').classList.remove('vis');\n  tegnFrøRad();\n}\nfunction velgFrø(sort){\n  const a = AVLINGER[sort];\n  if(S.niva < a.niva){ varsel(`Åpnes på nivå ${a.niva}`, 'feil'); return; }\n  if(S.mynter < a.frø){ varsel('Ikke nok mynter', 'feil'); return; }\n  valgtFrø = sort;\n  lukkPanel();\n  el('frolinje').classList.add('vis');\n  el('froTittel').textContent = a.navn + ' valgt';\n  el('froHint').textContent = 'Dra over åkeren for å så';\n  tegnFrøRad();\n}\nfunction tegnFrøRad(){\n  const ledige = S.lapper.filter(l=>!l.sort).length;\n  if(!valgtFrø){\n    el('froTittel').textContent = 'Velg frø';\n    el('froHint').textContent = ledige + ' ledige lapper';\n  }\n  el('froRad').innerHTML = Object.entries(AVLINGER).map(([k,a])=>{\n    const låst = S.niva < a.niva, råd = S.mynter >= a.frø;\n    return `<button class=\"fro ${valgtFrø===k?'valgt':''} ${(låst||!råd)?'laast':''}\"\n      onclick=\"velgFrø('${k}')\">\n      ${bilde(k)}<b>${a.navn}<\u002Fb>\n      <i>${låst ? 'nivå '+a.niva : a.frø+' mynt'}<\u002Fi><\u002Fbutton>`;\n  }).join('');\n}\n\n/* --- dyr --- */\nfunction trykkDyr(i){\n  const dyr = S.dyr[i];\n  if(!dyr) return;\n  const d = DYR[dyr.type];\n  if(!dyr.matet){\n    if(!harAlt(d.for)){\n      const mangler = Object.entries(d.for)\n        .map(([v,n])=>`${n} ${VARER[v].navn.toLowerCase()}`).join(' og ');\n      varsel(`Trenger ${mangler}`, 'feil'); return;\n    }\n    betal(d.for);\n    dyr.matet = nå();\n    spill('trykk');\n    lagre(); oppdaterAlt();\n    return;\n  }\n  if(nå() - dyr.matet >= d.tid*1000){\n    if(siloLedig() <= 0){ varsel('Siloen er full!', 'feil'); return; }\n    legg(d.gir, 1);\n    girXp(Math.ceil(VARER[d.gir].xp/2));\n    dyr.matet = 0;\n    spill('ferdig');\n    flyTil(d.gir, skjermPos(dyrEl.find(e=>e.i===i).rot));\n    lagre(); oppdaterAlt();\n  }else{\n    varsel(`${VARER[d.gir].navn} om ${tidTekst(d.tid-(nå()-dyr.matet)/1000)}`);\n  }\n}\n\nfunction matAlle(){\n  let n = 0;\n  S.dyr.forEach(dyr=>{\n    const d = DYR[dyr.type];\n    if(!dyr.matet && harAlt(d.for)){ betal(d.for); dyr.matet = nå(); n++; }\n  });\n  varsel(n ? `Matet ${n} dyr` : 'Ingen kunne mates', n ? '' : 'feil');\n  lagre(); oppdaterAlt(); lukkPanel();\n}\n\n/* --- bygg --- */\nfunction hentFraBygg(type){\n  const t = byggTilstand(type);\n  const e = byggEl[type];\n  let n = 0;\n  for(const [vare, ant] of Object.entries(t.ferdig)){\n    const lagt = legg(vare, ant);\n    if(lagt < ant) varsel('Siloen er full!', 'feil');\n    if(lagt){\n      girXp(Math.ceil(VARER[vare].xp/2) * lagt);\n      flyTil(vare, skjermPos(e.rot));\n      n += lagt;\n    }\n    if(lagt) spill('ferdig');\n    if(lagt >= ant) delete t.ferdig[vare];\n    else t.ferdig[vare] = ant - lagt;\n  }\n  if(n) lagre(), oppdaterAlt();\n  return n;\n}\n\nfunction leggIKo(type, idx){\n  const b = BYGG[type], t = byggTilstand(type);\n  const opp = b.lager[idx];\n  if(t.ko.length >= KO_PLASSER){ varsel('Køen er full', 'feil'); return; }\n  if(!harAlt(opp.opp)){ varsel('Du mangler råvarer', 'feil'); return; }\n  betal(opp.opp);\n  t.ko.push({gir:opp.gir, tid:opp.tid, startet:0});\n  tikkBygg();\n  lagre(); oppdaterAlt(); visBygg(type);\n}\n\n/* ===================== PLASSERE BYGNINGER ===================== */\n\nlet plasserer = null, spøkeEl = null;\n\nconst erPlassert = id => !!S.plassering[id];\nconst låstOpp    = id => S.niva >= PLASSERBARE[id].niva;\n\n/* hvor mange bygninger venter på å bli satt ut? */\nfunction venterPåPlass(){\n  return Object.keys(PLASSERBARE).filter(id=>\n    !erPlassert(id) && låstOpp(id) && S.mynter >= PLASSERBARE[id].pris).length;\n}\n\n/* bygninger som allerede står på tomta */\nfunction opptatteFlekker(unntak){\n  const liste = [];\n  BYGNINGER.forEach(b=> liste.push({c:b.c, r:b.r, rad: b.tre ? 0.9 : 1.15}));\n  Object.entries(PLASSERBARE).forEach(([id,p])=>{\n    if(id === unntak) return;\n    const pos = S.plassering[id];\n    if(pos) liste.push({c:pos.c, r:pos.r, rad:1.15});\n  });\n  /* plantefeltene skal heller ikke bygges ned */\n  alleSpor().forEach(s=> liste.push({c:s.c, r:s.r, rad:0.85}));\n  return liste;\n}\n\n/* bygningen selv + beiteplassene som følger med et dyrehus */\nfunction egnePunkter(id, c, r){\n  const p = PLASSERBARE[id];\n  const punkter = [{c, r}];\n  if(p.slag === 'dyr') BEITE[p.dyr].forEach(o=> punkter.push({c:c+o.c, r:r+o.r}));\n  return punkter;\n}\n\n/* Bygninger tegnes oppover fra føttene sine, så en bygning som står nærmere\n   betrakteren enn en åkerlapp kan skjule den. Her sjekker vi det direkte:\n   overlapper sprite-boksen mer enn en femtedel av en lapp som ligger bakenfor? */\nconst SPRITE_LUFT = 14;      // gjennomsiktig kant rundt bildene\nconst MAKS_DEKKE  = 0.2;     // hvor mye av en lapp som får forsvinne\nfunction skjulerÅkeren(b, h, c, r){\n  const q = iso(c, r);\n  const x0 = q.x - b/2 + SPRITE_LUFT, x1 = q.x + b/2 - SPRITE_LUFT;\n  const y0 = q.y - h + SPRITE_LUFT,   y1 = q.y - SPRITE_LUFT;\n  return LAPP_POS.some(lp=>{\n    if(lp.c + lp.r >= c + r) return false;        // lappen ligger foran – trygt\n    const t = iso(lp.c, lp.r);\n    const bx = Math.min(x1, t.x+TW/2) - Math.max(x0, t.x-TW/2);\n    const by = Math.min(y1, t.y+TH/2) - Math.max(y0, t.y-TH/2);\n    return bx > 0 && by > 0 && (bx*by)/(TW*TH) > MAKS_DEKKE;\n  });\n}\n\nfunction kanPlassere(id, c, r){\n  const p = PLASSERBARE[id];\n  if(iÅkeren(c, r)) return {ok:false, grunn:'Kan ikke stå på åkeren'};\n  for(const q of egnePunkter(id, c, r)){\n    if(!eier(q.c, q.r, TOMT_MARG))\n      return {ok:false, grunn:'Må stå innenfor muren'};\n    if(iÅkeren(q.c, q.r, 0.5))\n      return {ok:false, grunn:'Dyra må ha beiteplass utenom åkeren'};\n  }\n  if(skjulerÅkeren(p.b, p.h, c, r))\n    return {ok:false, grunn:'Da skjuler den åkeren'};\n  for(const o of opptatteFlekker(id)){\n    const g = Math.max(1.15, o.rad);\n    if(Math.abs(c-o.c) < g && Math.abs(r-o.r) < g)\n      return {ok:false, grunn:'For nær noe annet'};\n  }\n  return {ok:true, grunn:'Ser bra ut her!'};\n}\n\nfunction startPlassering(id){\n  const p = PLASSERBARE[id];\n  if(!låstOpp(id)){ varsel(`Åpnes på nivå ${p.niva}`, 'feil'); return; }\n  if(!erPlassert(id) && S.mynter < p.pris){ varsel('Ikke nok mynter', 'feil'); return; }\n  lukkPanel(); avbrytFrø();\n  plasserer = {id, flytt: erPlassert(id), c: null, r: null, ok:false};\n\n  spøkeEl = document.createElement('div');\n  spøkeEl.className = 'obj spoke';\n  spøkeEl.style.width = p.b+'px';\n  let ekstra = '<div class=\"grunnflate\"><\u002Fdiv>';\n  if(p.slag === 'dyr') BEITE[p.dyr].forEach(o=>{\n    const dx = (o.c-o.r)*TW/2, dy = (o.c+o.r)*TH/2;\n    ekstra += `<div class=\"beitemerke\" style=\"left:calc(50% + ${dx}px);bottom:${-dy-8.5}px\"><\u002Fdiv>`;\n  });\n  spøkeEl.innerHTML = ekstra + bilde(p.sprite);\n  verden.appendChild(spøkeEl);\n\n  el('plasserBilde').src = bildeUrl(p.sprite);\n  el('plasserTittel').textContent = plasserer.flytt ? 'Flytt ' + p.navn.toLowerCase() : p.navn;\n  el('plasserlinje').classList.add('vis');\n\n  /* start midt på et ledig sted */\n  const start = S.plassering[id] || finnLedigPlass(id) || p.std;\n  settSpøkelse(start.c, start.r);\n  varsel('Trykk der du vil ha bygningen');\n}\n\n/* nærmeste ledige rute til bygningens naturlige plass */\nfunction finnLedigPlass(id){\n  const s = PLASSERBARE[id].std;\n  const g = grenser();\n  let best = null, bestAvst = Infinity;\n  for(let r = g.r0+1; r <= g.r1-1; r += 0.5)\n    for(let c = g.c0+1; c <= g.c1-1; c += 0.5){\n      if(!kanPlassere(id, c, r).ok) continue;\n      const d = (c-s.c)*(c-s.c) + (r-s.r)*(r-s.r);\n      if(d < bestAvst){ bestAvst = d; best = {c, r}; }\n    }\n  return best;\n}\n\nfunction settSpøkelse(c, r){\n  if(!plasserer) return;\n  c = Math.round(c*2)/2; r = Math.round(r*2)/2;\n  const svar = kanPlassere(plasserer.id, c, r);\n  plasserer.c = c; plasserer.r = r; plasserer.ok = svar.ok;\n  plasser(spøkeEl, c, r);\n  spøkeEl.classList.toggle('nei', !svar.ok);\n  el('plasserHint').textContent = svar.grunn;\n  el('plasserOk').disabled = !svar.ok;\n  el('plasserOk').classList.toggle('rolig', !svar.ok);\n}\n\nfunction bekreftPlassering(){\n  if(!plasserer || !plasserer.ok) return;\n  const {id, c, r, flytt} = plasserer;\n  const p = PLASSERBARE[id];\n  if(!flytt && p.pris > 0){\n    if(S.mynter < p.pris){ varsel('Ikke nok mynter', 'feil'); return; }\n    S.mynter -= p.pris;\n  }\n  S.plassering[id] = {c, r};\n  if(!flytt && p.slag === 'bygg') byggTilstand(p.bygg);\n  ryddSpøkelse();\n  byggKart(); oppdaterAlt(); lagre();\n  varsel(flytt ? p.navn + ' er flyttet' : p.navn + ' er ditt!', 'gull');\n  spill(flytt ? 'trykk' : 'mynt');\n}\n\nfunction avbrytPlassering(){ ryddSpøkelse(); }\n\nfunction ryddSpøkelse(){\n  plasserer = null;\n  if(spøkeEl){ spøkeEl.remove(); spøkeEl = null; }\n  el('plasserlinje').classList.remove('vis');\n}\n\nfunction visByggeliste(){\n  const kanSettes = [], venter = [], ute = [];\n  Object.entries(PLASSERBARE).forEach(([id,p])=>{\n    if(erPlassert(id)) ute.push([id,p]);\n    else if(låstOpp(id)) kanSettes.push([id,p]);\n    else venter.push([id,p]);\n  });\n\n  let h = `<div class=\"panel-topp\">${bilde('laave')}<div><h3>Byggeplassen<\u002Fh3>\n    <p>Sett bygningene der du vil ha dem<\u002Fp><\u002Fdiv>\n    <button class=\"lukk\" onclick=\"lukkPanel()\">×<\u002Fbutton><\u002Fdiv>`;\n\n  /* utvidelse av selve tomta ligger øverst */\n  const np = nesteParsell();\n  if(np){\n    const kan = S.niva >= np.niva && S.mynter >= np.pris;\n    h += `<div class=\"rad\">${bilde('tre')}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">Utvid gården: ${np.navn}<\u002Fdiv>\n      <div class=\"rad-under\">${S.niva < np.niva ? 'Åpnes på nivå '+np.niva\n        : np.spor.length+' nye plantefelt og mer plass'}<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp ${kan?'gull':'rolig'}\" onclick=\"visParsell()\">\n        ${np.pris.toLocaleString('nb-NO')} mynt<\u002Fbutton><\u002Fdiv>`;\n  }\n\n  if(!kanSettes.length && !ute.length)\n    h += `<p class=\"tom-tekst\">Ingen bygninger er låst opp ennå. Stig i nivå, så dukker de opp her.<\u002Fp>`;\n\n  kanSettes.forEach(([id,p])=>{\n    const råd = S.mynter >= p.pris;\n    h += `<div class=\"rad\">${bilde(p.sprite)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">${p.navn}<\u002Fdiv>\n      <div class=\"rad-under\">${p.hva}<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp gull\" ${råd?'':'disabled'} onclick=\"startPlassering('${id}')\">\n        ${p.pris ? p.pris+' mynt' : 'Plasser'}<\u002Fbutton><\u002Fdiv>`;\n  });\n\n  ute.forEach(([id,p])=>{\n    h += `<div class=\"rad\">${bilde(p.sprite)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">${p.navn}<\u002Fdiv>\n      <div class=\"rad-under\">Står på gården<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp rolig\" onclick=\"startPlassering('${id}')\">Flytt<\u002Fbutton><\u002Fdiv>`;\n  });\n\n  venter.forEach(([id,p])=>{\n    h += `<div class=\"rad\" style=\"opacity:.55\">${bilde(p.sprite)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">${p.navn}<\u002Fdiv>\n      <div class=\"rad-under\">Åpnes på nivå ${p.niva}<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp rolig\" disabled>Låst<\u002Fbutton><\u002Fdiv>`;\n  });\n\n  visPanel(h);\n}\n\nfunction kjøpBygg(type){\n  const id = Object.keys(PLASSERBARE).find(k=>PLASSERBARE[k].bygg === type);\n  if(id) startPlassering(id);\n}\n\nfunction kjøpDyr(type){\n  const d = DYR[type];\n  const har = S.dyr.filter(x=>x.type===type).length;\n  if(S.niva < d.niva){ varsel(`Krever nivå ${d.niva}`, 'feil'); return; }\n  if(!S.plassering[d.hus]){ varsel(`${DYR[type].husnavn} må plasseres først`, 'feil'); visByggeliste(); return; }\n  if(har >= d.maks){ varsel('Ikke plass til flere', 'feil'); return; }\n  if(S.mynter < d.pris){ varsel('Ikke nok mynter', 'feil'); return; }\n  S.mynter -= d.pris;\n  S.dyr.push({type, matet:0});\n  byggDyr();\n  varsel(`${d.navn} kjøpt!`, 'gull');\n  lagre(); oppdaterAlt(); visDyr(type);\n}\n\n/* --- flerårige planter --- */\nfunction trykkSpor(id){\n  const p = S.planter[id];\n  if(!p){ visPlantevalg(id); return; }\n  if(!voksen(p)) return visPlante(id);\n  if(!planteKlar(p)) return visPlante(id);\n  høstPlante(id);\n}\n\nfunction høstPlante(id){\n  const p = S.planter[id];\n  if(!p || !planteKlar(p)) return false;\n  const pl = PLANTER[p.sort];\n  if(siloLedig() <= 0){ varsel('Siloen er full!', 'feil'); return false; }\n  const lagt = legg(pl.gir, pl.ant);\n  if(lagt < pl.ant) varsel('Siloen er full!', 'feil');\n  girXp(VARER[pl.gir].xp * lagt);\n  S.høstet += lagt;\n  p.sist = nå();\n  const e = planteEl[id];\n  if(e) flyTil(pl.gir, skjermPos(e.rot));\n  spill('høst');\n  lagre(); oppdaterAlt();\n  return true;\n}\n\nfunction plant(id, sort){\n  if(S.planter[id]) return;\n  const pl = PLANTER[sort];\n  if(S.niva < pl.niva){ varsel(`Åpnes på nivå ${pl.niva}`, 'feil'); return; }\n  if(S.mynter < pl.pris){ varsel('Ikke nok mynter', 'feil'); return; }\n  S.mynter -= pl.pris;\n  S.planter[id] = {sort, plantet: nå(), sist: 0};\n  spill('så');\n  varsel(`${pl.navn} plantet!`, 'gull');\n  lagre(); byggKart(); oppdaterAlt(); lukkPanel();\n}\n\nfunction gravOpp(id){\n  const p = S.planter[id];\n  if(!p) return;\n  delete S.planter[id];\n  varsel('Planten er gravd opp');\n  lagre(); byggKart(); oppdaterAlt(); lukkPanel();\n}\n\n/* --- parseller --- */\nfunction kjøpParsell(){\n  const p = nesteParsell();\n  if(!p) return;\n  if(S.niva < p.niva){ varsel(`Krever nivå ${p.niva}`, 'feil'); return; }\n  if(S.mynter < p.pris){ varsel('Ikke nok mynter', 'feil'); return; }\n  S.mynter -= p.pris;\n  S.parseller++;\n  const m = midtenAv(p);\n  lagre(); byggKart(); oppdaterAlt(); lukkPanel();\n  sentrerPå(m.c, m.r);\n  varsel(`${p.navn} er din!`, 'gull');\n  spill('mynt');\n}\n\nfunction kjøpLapp(){\n  const i = S.kjøpteLapper - START_LAPPER;\n  if(i >= LAPP_PRIS.length) return;\n  if(S.niva < LAPP_NIVA[i]){ varsel(`Krever nivå ${LAPP_NIVA[i]}`, 'feil'); return; }\n  if(S.mynter < LAPP_PRIS[i]){ varsel('Ikke nok mynter', 'feil'); return; }\n  S.mynter -= LAPP_PRIS[i];\n  S.lapper.push({sort:null, sådd:0});\n  S.kjøpteLapper++;\n  varsel('Ny åkerlapp!', 'gull');\n  lagre(); oppdaterAlt(); lukkPanel();\n}\n\nfunction utvidSilo(){\n  const steg = (S.siloMaks - SILO_START)/SILO_STEG;\n  const pris = Math.round(250 * Math.pow(1.55, steg));\n  if(S.mynter < pris){ varsel('Ikke nok mynter', 'feil'); return; }\n  S.mynter -= pris;\n  S.siloMaks += SILO_STEG;\n  varsel(`Siloen rommer nå ${S.siloMaks}`, 'gull');\n  lagre(); oppdaterAlt(); visSilo();\n}\n\n/* --- salg --- */\nlet salgsValg = {};\nfunction endreSalg(vare, d){\n  salgsValg[vare] = Math.max(0, Math.min(antall(vare), (salgsValg[vare]||0)+d));\n  visBod();\n}\nfunction selg(vare){\n  const n = salgsValg[vare]||0;\n  if(n < 1) return;\n  const sum = VARER[vare].pris * n;\n  fjern(vare, n); S.mynter += sum; S.solgt += n;\n  salgsValg[vare] = 0;\n  varsel(`+${sum} mynter`, 'gull');\n  lagre(); oppdaterAlt(); visBod();\n}\nfunction selgAlt(){\n  let sum = 0, n = 0;\n  Object.entries(S.lager).forEach(([v,a])=>{ sum += VARER[v].pris*a; n += a; });\n  if(!n) return;\n  S.lager = {}; S.mynter += sum; S.solgt += n;\n  varsel(`+${sum} mynter for ${n} varer`, 'gull');\n  lagre(); oppdaterAlt(); visBod();\n}\n\n/* --- bestillinger --- */\nfunction tilgjengeligeVarer(){\n  const ut = [];\n  for(const [k,a] of Object.entries(AVLINGER)) if(S.niva >= a.niva) ut.push(k);\n  S.dyr.forEach(d=>{ if(!ut.includes(DYR[d.type].gir)) ut.push(DYR[d.type].gir); });\n  /* bær og frukt telles med så snart en plante er voksen */\n  Object.values(S.planter).forEach(p=>{\n    const g = PLANTER[p.sort].gir;\n    if(voksen(p) && !ut.includes(g)) ut.push(g);\n  });\n  Object.keys(S.bygg).forEach(b=>{\n    BYGG[b].lager.forEach(o=>{\n      /* bare oppskrifter man har råvarer til i det hele tatt */\n      if(!Object.keys(o.opp).every(v=>ut.includes(v) || antall(v))) return;\n      if(!ut.includes(o.gir)) ut.push(o.gir);\n    });\n  });\n  return ut;\n}\nfunction lagOrdre(){\n  const mulige = tilgjengeligeVarer();\n  if(!mulige.length) return null;\n  const antType = Math.min(mulige.length,\n    1 + (Math.random()<.45?1:0) + (Math.random()<.2?1:0));\n  const valgt = [...mulige].sort(()=>Math.random()-.5).slice(0, antType);\n  const varer = {}; let mynt = 0, xp = 0;\n  valgt.forEach(v=>{\n    const p = VARER[v].pris;\n    const tak = Math.max(1, Math.min(9, Math.round(80/p)));\n    const n = 1 + Math.floor(Math.random()*tak);\n    varer[v] = n; mynt += p*n; xp += VARER[v].xp*n;\n  });\n  const k = KUNDER[Math.floor(Math.random()*KUNDER.length)];\n  return {id:++S.ordreTeller, kunde:k[0], f1:k[1], f2:k[2], varer,\n          mynt: Math.round(mynt*1.35/5)*5, xp: Math.max(1, Math.round(xp*.9))};\n}\nfunction fyllOrdrer(){\n  let vakt = 0;\n  while(S.ordrer.length < 3 && vakt++ < 10){\n    const o = lagOrdre(); if(!o) break; S.ordrer.push(o);\n  }\n}\nconst kanLevere = o => harAlt(o.varer);\nfunction lever(id){\n  const i = S.ordrer.findIndex(o=>o.id===id);\n  if(i<0) return;\n  const o = S.ordrer[i];\n  if(!kanLevere(o)){ varsel('Du mangler varer', 'feil'); return; }\n  betal(o.varer); S.mynter += o.mynt; girXp(o.xp);\n  S.ordrer.splice(i,1); fyllOrdrer();\n  varsel(`${o.kunde} takker! +${o.mynt}`, 'gull');\n  lagre(); oppdaterAlt(); visOrdrer();\n}\nfunction byttOrdre(id){\n  const i = S.ordrer.findIndex(o=>o.id===id);\n  if(i<0) return;\n  S.ordrer.splice(i,1); fyllOrdrer();\n  lagre(); oppdaterAlt(); visOrdrer();\n}\n\n/* ===================== PANELER ===================== */\n\nfunction visPanel(html){\n  el('panel').dataset.auto = '';\n  el('panel').innerHTML = html;\n  el('slor').classList.add('vis');\n  el('panel').scrollTop = 0;\n}\nfunction lukkPanel(){ el('slor').classList.remove('vis'); }\nel('slor').addEventListener('click', e=>{ if(e.target.id==='slor') lukkPanel(); });\n\nconst topp = (sprite, tittel, under) =>\n  `<div class=\"panel-topp\">${bilde(sprite)}<div><h3>${tittel}<\u002Fh3>\n   <p>${under}<\u002Fp><\u002Fdiv><button class=\"lukk\" onclick=\"lukkPanel()\">×<\u002Fbutton><\u002Fdiv>`;\n\nfunction visSilo(){\n  const varer = Object.entries(S.lager).filter(([,n])=>n>0);\n  const steg = (S.siloMaks - SILO_START)/SILO_STEG;\n  const pris = Math.round(250 * Math.pow(1.55, steg));\n  let h = topp('silo','Siloen', `${siloBrukt()} av ${S.siloMaks} plasser i bruk`);\n  h += varer.length\n    ? `<div class=\"rutenett\">` + varer.map(([v,n])=>\n        `<div class=\"vare\">${bilde(v)}<b>${n}<\u002Fb><span>${VARER[v].navn}<\u002Fspan><\u002Fdiv>`).join('') + `<\u002Fdiv>`\n    : `<p class=\"tom-tekst\">Siloen er tom.<br>Så noe i åkeren, så fyller den seg opp.<\u002Fp>`;\n  h += `<div class=\"rad\" style=\"margin-top:12px\">\n      <div class=\"rad-tekst\"><div class=\"rad-navn\">Utvid siloen<\u002Fdiv>\n        <div class=\"rad-under\">+${SILO_STEG} plasser<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp gull\" ${S.mynter>=pris?'':'disabled'} onclick=\"utvidSilo()\">${pris} mynt<\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"rad\"><div class=\"rad-tekst\"><div class=\"rad-navn\">Gårdsboka<\u002Fdiv>\n      <div class=\"rad-under\">${S.høstet} avlinger høstet · ${S.solgt} varer solgt · ${S.xp} XP<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <button class=\"knapp rolig bred\" style=\"margin-top:4px\" onclick=\"spørNullstill()\">Start gården på nytt<\u002Fbutton>`;\n  visPanel(h);\n}\n\nfunction visBod(){\n  const varer = Object.entries(S.lager).filter(([,n])=>n>0);\n  let h = topp('bod','Salgsboden','Fast pris – bestillinger betaler bedre');\n  if(!varer.length){\n    h += `<p class=\"tom-tekst\">Ingenting å selge ennå.<br>Høst noe først!<\u002Fp>`;\n  }else{\n    h += varer.map(([v,n])=>{\n      const valgt = Math.min(salgsValg[v]||0, n);\n      return `<div class=\"salg\">${bilde(v)}\n        <div class=\"rad-tekst\"><div class=\"rad-navn\">${VARER[v].navn}<\u002Fdiv>\n          <div class=\"rad-under\">${VARER[v].pris} mynt per stk · har ${n}<\u002Fdiv><\u002Fdiv>\n        <div class=\"teller\">\n          <button class=\"steg\" ${valgt<1?'disabled':''} onclick=\"endreSalg('${v}',-1)\">−<\u002Fbutton>\n          <span class=\"antall\">${valgt}<\u002Fspan>\n          <button class=\"steg\" ${valgt>=n?'disabled':''} onclick=\"endreSalg('${v}',1)\">+<\u002Fbutton>\n        <\u002Fdiv>\n        <button class=\"knapp gull liten\" ${valgt<1?'disabled':''} onclick=\"selg('${v}')\">${valgt?VARER[v].pris*valgt:'Selg'}<\u002Fbutton>\n      <\u002Fdiv>`;\n    }).join('');\n    h += `<button class=\"knapp rolig bred\" style=\"margin-top:4px\" onclick=\"selgAlt()\">Selg hele siloen<\u002Fbutton>`;\n  }\n  visPanel(h);\n}\n\nfunction visOrdrer(){\n  let h = topp('tavle','Bestillinger','Kundene betaler over bodprisen');\n  if(!S.ordrer.length) h += `<p class=\"tom-tekst\">Ingen bestillinger akkurat nå.<\u002Fp>`;\n  S.ordrer.forEach(o=>{\n    const kan = kanLevere(o);\n    h += `<div class=\"ordre\"><div class=\"ordre-topp\">\n      <svg viewBox=\"0 0 40 40\"><path d=\"M20 4c8 0 13 5.5 13 13v9c0 6-5.5 10-13 10S7 32 7 26v-9C7 9.5 12 4 20 4z\" fill=\"${o.f1}\"/><path d=\"M20 4c8 0 13 5.5 13 13v3H7v-3C7 9.5 12 4 20 4z\" fill=\"${o.f2}\"/><circle cx=\"14.5\" cy=\"18\" r=\"3.4\" fill=\"#fff\"/><circle cx=\"25.5\" cy=\"18\" r=\"3.4\" fill=\"#fff\"/><circle cx=\"14.5\" cy=\"18.6\" r=\"1.7\" fill=\"#24402C\"/><circle cx=\"25.5\" cy=\"18.6\" r=\"1.7\" fill=\"#24402C\"/><path d=\"M16 26.5c2.4 2 5.6 2 8 0\" stroke=\"#24402C\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/><\u002Fsvg>\n      <b>${o.kunde} bestiller<\u002Fb><\u002Fdiv><div class=\"ordre-varer\">` +\n      Object.entries(o.varer).map(([v,n])=>{\n        const mangler = Math.max(0, n - antall(v));\n        return `<span class=\"ov ${mangler?'mangler':''}\">${bilde(v)}${n} ${VARER[v].navn.toLowerCase()}${\n          mangler ? ` – mangler ${mangler}` : ''}<\u002Fspan>`;\n      }).join('') +\n      `<\u002Fdiv><div class=\"ordre-bunn\"><div class=\"lonn\">\n        <span><svg viewBox=\"0 0 40 40\"><circle cx=\"20\" cy=\"20\" r=\"16\" fill=\"#D99A1E\"/><circle cx=\"20\" cy=\"18.5\" r=\"14.5\" fill=\"#F4B942\"/><path d=\"M20 11v15M15.5 15h9M15.5 22h9\" stroke=\"#D99A1E\" stroke-width=\"2.6\" stroke-linecap=\"round\"/><\u002Fsvg>${o.mynt}<\u002Fspan>\n        <span><svg viewBox=\"0 0 40 40\"><path d=\"M20 5l4.6 9.8 10.4 1.5-7.6 7.6 1.9 10.7L20 29.4l-9.3 5.2 1.9-10.7L5 16.3l10.4-1.5z\" fill=\"#8FD46A\" stroke=\"#4E9330\" stroke-width=\"2.4\" stroke-linejoin=\"round\"/><\u002Fsvg>${o.xp}<\u002Fspan>\n      <\u002Fdiv>\n      <button class=\"knapp rolig liten\" onclick=\"byttOrdre(${o.id})\">Bytt<\u002Fbutton>\n      <button class=\"knapp ${kan?'gull':''}\" ${kan?'':'disabled'} onclick=\"lever(${o.id})\">Lever<\u002Fbutton>\n      <\u002Fdiv><\u002Fdiv>`;\n  });\n  visPanel(h);\n}\n\nfunction visDyr(type){\n  const d = DYR[type];\n  const mine = S.dyr.map((x,i)=>({...x,i})).filter(x=>x.type===type);\n  const låst = S.niva < d.niva;\n  let h = topp(d.hus, d.husnavn, låst ? `Åpnes på nivå ${d.niva}`\n    : `${mine.length} av ${d.maks} ${d.flertall}`);\n  if(låst){\n    h += `<p class=\"tom-tekst\">Du trenger nivå ${d.niva} for å holde ${d.flertall}.<\u002Fp>`;\n    return visPanel(h);\n  }\n  const forTekst = Object.entries(d.for)\n    .map(([v,n])=>`${n} ${VARER[v].navn.toLowerCase()}`).join(' + ');\n  mine.forEach(dyr=>{\n    let under, knapp;\n    if(!dyr.matet){\n      under = `Sulten · trenger ${forTekst}`;\n      knapp = `<button class=\"knapp ${harAlt(d.for)?'':'rolig'}\" ${harAlt(d.for)?'':'disabled'}\n        onclick=\"trykkDyr(${dyr.i});visDyr('${type}')\">Mat<\u002Fbutton>`;\n    }else{\n      const rest = d.tid - (nå()-dyr.matet)/1000;\n      if(rest <= 0){\n        under = `${VARER[d.gir].navn} er klar!`;\n        knapp = `<button class=\"knapp gull\" onclick=\"trykkDyr(${dyr.i});visDyr('${type}')\">Hent<\u002Fbutton>`;\n      }else{\n        under = `${VARER[d.gir].navn} om ${tidTekst(rest)}`;\n        knapp = `<div style=\"width:38px\">${bilde(d.gir)}<\u002Fdiv>`;\n      }\n    }\n    h += `<div class=\"rad\">${bilde(type)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">${d.navn}<\u002Fdiv><div class=\"rad-under\">${under}<\u002Fdiv><\u002Fdiv>${knapp}<\u002Fdiv>`;\n  });\n  if(mine.some(x=>!x.matet && harAlt(d.for)))\n    h += `<button class=\"knapp bred\" style=\"margin-bottom:8px\" onclick=\"matAlle()\">Mat alle dyra<\u002Fbutton>`;\n  if(mine.length < d.maks){\n    h += `<div class=\"rad\">${bilde(type)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">Kjøp ${d.navn.toLowerCase()}<\u002Fdiv>\n      <div class=\"rad-under\">Gir ${VARER[d.gir].navn.toLowerCase()} hver ${tidTekst(d.tid)}<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp gull\" ${S.mynter>=d.pris?'':'disabled'} onclick=\"kjøpDyr('${type}')\">${d.pris} mynt<\u002Fbutton><\u002Fdiv>`;\n  }\n  visPanel(h);\n}\n\nfunction visBygg(type){\n  const b = BYGG[type];\n  if(S.niva < b.niva)\n    return visPanel(topp(type, b.navn, `Åpnes på nivå ${b.niva}`) +\n      `<p class=\"tom-tekst\">Du trenger nivå ${b.niva} for å bygge ${b.navn.toLowerCase()}.<\u002Fp>`);\n  if(!S.bygg[type])\n    return visPanel(topp(type, b.navn, 'Ikke bygget ennå') +\n      `<div class=\"rad\">${bilde(b.lager[0].gir)}<div class=\"rad-tekst\">\n        <div class=\"rad-navn\">Lager ${VARER[b.lager[0].gir].navn.toLowerCase()}<\u002Fdiv>\n        <div class=\"rad-under\">Foredling gir mye mer enn råvarene er verdt<\u002Fdiv><\u002Fdiv>\n        <button class=\"knapp gull\" ${S.mynter>=b.pris?'':'disabled'} onclick=\"kjøpBygg('${type}')\">${b.pris} mynt<\u002Fbutton><\u002Fdiv>\n      <p class=\"tom-tekst\" style=\"padding:8px 0 0\">Du velger selv hvor på gården den skal stå.<\u002Fp>`);\n\n  const t = byggTilstand(type);\n  const ferdig = Object.values(t.ferdig).reduce((a,x)=>a+x,0);\n  let h = topp(type, b.navn, `${t.ko.length} av ${KO_PLASSER} i kø`);\n\n  h += `<div class=\"ko\">`;\n  for(let i=0;i<KO_PLASSER;i++){\n    const k = t.ko[i];\n    if(!k){ h += `<div class=\"ko-plass laast\"><\u002Fdiv>`; continue; }\n    const rest = k.startet ? k.tid - (nå()-k.startet)/1000 : k.tid;\n    const andel = k.startet ? Math.min(1, (nå()-k.startet)/1000/k.tid) : 0;\n    h += `<div class=\"ko-plass\">${bilde(k.gir)}\n      <small>${tidTekst(rest)}<\u002Fsmall>\n      <span class=\"stolpe\" style=\"width:${andel*100}%\"><\u002Fspan><\u002Fdiv>`;\n  }\n  h += `<\u002Fdiv>`;\n\n  if(ferdig) h += `<button class=\"knapp gull bred\" style=\"margin-bottom:10px\"\n    onclick=\"hentFraBygg('${type}');visBygg('${type}')\">Hent ${ferdig} ferdig${ferdig>1?'e':''}<\u002Fbutton>`;\n\n  b.lager.forEach((o,i)=>{\n    const oppTekst = Object.entries(o.opp)\n      .map(([v,n])=>`${n} ${VARER[v].navn.toLowerCase()}`).join(' + ');\n    const kan = harAlt(o.opp) && t.ko.length < KO_PLASSER;\n    h += `<div class=\"rad\">${bilde(o.gir)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">${VARER[o.gir].navn}<\u002Fdiv>\n      <div class=\"rad-under\">${oppTekst} · ${tidTekst(o.tid)} · selges for ${VARER[o.gir].pris}<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp ${kan?'':'rolig'}\" ${kan?'':'disabled'} onclick=\"leggIKo('${type}',${i})\">Lag<\u002Fbutton><\u002Fdiv>`;\n  });\n  const forrigeRull = el('panel').scrollTop;\n  visPanel(h);\n  el('panel').dataset.auto = 'bygg';\n  el('panel').dataset.byggType = type;\n  el('panel').scrollTop = forrigeRull;\n}\n\nfunction visKjøpLapp(){\n  const i = S.kjøpteLapper - START_LAPPER;\n  if(i >= LAPP_PRIS.length)\n    return visPanel(topp('hvete','Åkeren','Alle lapper er dine') +\n      `<p class=\"tom-tekst\">Du har dyrket opp hele åkeren!<\u002Fp>`);\n  const pris = LAPP_PRIS[i], krav = LAPP_NIVA[i];\n  const kan = S.niva >= krav && S.mynter >= pris;\n  visPanel(topp('hvete','Ny åkerlapp', `Lapp nummer ${S.kjøpteLapper+1}`) +\n    `<div class=\"rad\">${bilde('spire')}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">Dyrk opp mer jord<\u002Fdiv>\n      <div class=\"rad-under\">${S.niva<krav ? 'Åpnes på nivå '+krav : 'Mer plass til å så'}<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp gull\" ${kan?'':'disabled'} onclick=\"kjøpLapp()\">${pris} mynt<\u002Fbutton><\u002Fdiv>`);\n}\n\n/* --- plantefelt --- */\nfunction visPlantevalg(id){\n  const ledige = alleSpor().filter(s=>!S.planter[s.id]).length;\n  let h = topp('spire','Plantefelt',\n    `${ledige} ledige plantefelt på parsellene`);\n  h += `<p class=\"tom-tekst\" style=\"padding:0 0 10px\">Busker og trær plantes\n    <b>én gang<\u002Fb>. Når de er voksne, gir de avling om og om igjen –\n    du slipper å så på nytt.<\u002Fp>`;\n\n  const åpne = [], låste = [];\n  Object.entries(PLANTER).forEach(e => (S.niva < e[1].niva ? låste : åpne).push(e));\n\n  åpne.forEach(([k,pl])=>{\n    const råd = S.mynter >= pl.pris;\n    h += `<div class=\"rad\">${bilde(pl.sprite)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">${pl.navn}<\u002Fdiv>\n      <div class=\"rad-under\">Voksen etter ${tidTekst(pl.voksetid)} · gir ${pl.ant}\n        ${VARER[pl.gir].navn.toLowerCase()} hver ${tidTekst(pl.tid)} ·\n        ${VARER[pl.gir].pris} mynt per stk<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp gull\" ${råd?'':'disabled'}\n        onclick=\"plant('${id}','${k}')\">${pl.pris} mynt<\u002Fbutton><\u002Fdiv>`;\n  });\n  låste.forEach(([k,pl])=>{\n    h += `<div class=\"rad\" style=\"opacity:.55\">${bilde(pl.sprite)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">${pl.navn}<\u002Fdiv>\n      <div class=\"rad-under\">Åpnes på nivå ${pl.niva}<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp rolig\" disabled>Låst<\u002Fbutton><\u002Fdiv>`;\n  });\n  visPanel(h);\n}\n\nfunction visPlante(id){\n  const p = S.planter[id];\n  if(!p) return visPlantevalg(id);\n  const pl = PLANTER[p.sort];\n  const ung = !voksen(p);\n  const rest = (nesteKlar(p) - nå())/1000;\n  let h = topp(pl.sprite, pl.navn, ung ? 'Vokser til' : 'Voksen og i full drift');\n  if(ung){\n    h += `<div class=\"rad\">${bilde('spire')}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">Første avling om ${tidTekst(rest)}<\u002Fdiv>\n      <div class=\"rad-under\">Så gir den ${pl.ant} ${VARER[pl.gir].navn.toLowerCase()}\n        hver ${tidTekst(pl.tid)} helt av seg selv.<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  }else if(rest > 0){\n    h += `<div class=\"rad\">${bilde(pl.gir)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">${pl.ant} ${VARER[pl.gir].navn.toLowerCase()} om ${tidTekst(rest)}<\u002Fdiv>\n      <div class=\"rad-under\">Trykk på planten når den er klar<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  }else{\n    h += `<div class=\"rad\">${bilde(pl.gir)}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">Klar til høsting!<\u002Fdiv>\n      <div class=\"rad-under\">${pl.ant} ${VARER[pl.gir].navn.toLowerCase()}<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp gull\" onclick=\"høstPlante('${id}');lukkPanel()\">Høst<\u002Fbutton><\u002Fdiv>`;\n  }\n  h += `<button class=\"knapp rolig bred\" style=\"margin-top:4px\"\n    onclick=\"spørGravOpp('${id}')\">Grav opp planten<\u002Fbutton>`;\n  visPanel(h);\n}\n\n/* En voksen plante er dyr, så vi spør én gang for mye heller enn én for lite */\nfunction spørGravOpp(id){\n  const p = S.planter[id];\n  if(!p) return;\n  const pl = PLANTER[p.sort];\n  visPanel(`<div class=\"panel-topp\">${bilde(pl.sprite)}<div>\n      <h3>Grave opp ${pl.navn.toLowerCase()}?<\u002Fh3>\n      <p>Du får ikke myntene tilbake<\u002Fp><\u002Fdiv>\n      <button class=\"lukk\" onclick=\"visPlante('${id}')\">×<\u002Fbutton><\u002Fdiv>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"knapp rolig\" style=\"flex:1\" onclick=\"visPlante('${id}')\">Nei, la den stå<\u002Fbutton>\n      <button class=\"knapp fare\" style=\"flex:1\" onclick=\"gravOpp('${id}')\">Ja, grav opp<\u002Fbutton>\n    <\u002Fdiv>`);\n}\n\n/* --- parseller --- */\nfunction visParsell(){\n  const p = nesteParsell();\n  if(!p)\n    return visPanel(topp('hus','Gården din','Hele dalen er din') +\n      `<p class=\"tom-tekst\">Du har kjøpt alle åtte parsellene.\n        Større blir det ikke!<\u002Fp>`);\n  const kan = S.niva >= p.niva && S.mynter >= p.pris;\n  const igjen = PARSELLER.length - S.parseller;\n  visPanel(topp('tre', p.navn,\n      `Parsell ${S.parseller+1} av ${PARSELLER.length}`) +\n    `<p class=\"tom-tekst\" style=\"padding:0 0 10px\">Muren flyttes utover, og du får\n      ${p.spor.length} nye plantefelt til busker og trær – og bedre plass til bygninger.<\u002Fp>\n    <div class=\"rad\">${bilde('laave')}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">Kjøp ${p.navn}<\u002Fdiv>\n      <div class=\"rad-under\">${S.niva < p.niva ? 'Åpnes på nivå '+p.niva\n        : (igjen-1 ? (igjen-1)+' parseller igjen etterpå' : 'Siste parsell!')}<\u002Fdiv><\u002Fdiv>\n      <button class=\"knapp gull\" ${kan?'':'disabled'}\n        onclick=\"kjøpParsell()\">${p.pris.toLocaleString('nb-NO')} mynt<\u002Fbutton><\u002Fdiv>`);\n}\n\nfunction spørNullstill(){\n  visPanel(`<div class=\"panel-topp\"><div><h3>Starte helt på nytt?<\u002Fh3>\n    <p>Alt du har bygd opp forsvinner<\u002Fp><\u002Fdiv>\n    <button class=\"lukk\" onclick=\"visSilo()\">×<\u002Fbutton><\u002Fdiv>\n    <div style=\"display:flex;gap:8px\">\n      <button class=\"knapp rolig\" style=\"flex:1\" onclick=\"visSilo()\">Nei, behold gården<\u002Fbutton>\n      <button class=\"knapp fare\" style=\"flex:1\" onclick=\"nullstill()\">Ja, start på nytt<\u002Fbutton>\n    <\u002Fdiv>`);\n}\nfunction nullstill(){\n  S = nyttSpill(); S.sett = true;\n  salgsValg = {}; valgtFrø = null;\n  ryddSpøkelse();\n  fyllOrdrer(); lukkPanel(); avbrytFrø();\n  byggKart(); oppdaterAlt(); startKamera();\n  varsel('Ny gård – lykke til!');\n  lagre();\n}\n\nfunction visIntro(){\n  visPanel(`<div class=\"panel-topp\">${bilde('hus')}<div><h3>Velkommen til Åkerland<\u002Fh3>\n    <p>Din egen gård<\u002Fp><\u002Fdiv><\u002Fdiv>\n    <div class=\"rad\">${bilde('hvete')}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">1. Så og høst<\u002Fdiv>\n      <div class=\"rad-under\">Trykk på en åkerlapp og velg frø. Dra fingeren over flere lapper for å så eller høste mange på én gang.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"rad\">${bilde('honsehus')}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">2. Bygg gården din<\u002Fdiv>\n      <div class=\"rad-under\">Nye bygninger låses opp når du stiger i nivå. Trykk på hus-knappen til høyre og velg selv hvor de skal stå.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"rad\">${bilde('hone')}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">3. Stell dyra<\u002Fdiv>\n      <div class=\"rad-under\">Dyra spiser det du dyrker og gir egg, melk og ull tilbake.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"rad\">${bilde('tavle')}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">4. Selg smart<\u002Fdiv>\n      <div class=\"rad-under\">Boden gir fast pris. Oppslagstavla har kunder som betaler mer.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div class=\"rad\">${bilde('epletre')}<div class=\"rad-tekst\">\n      <div class=\"rad-navn\">5. Utvid gården<\u002Fdiv>\n      <div class=\"rad-under\">Utenfor muren ligger åtte parseller til salgs. Hver av dem\n        gir plantefelt til bærbusker og frukttrær – de plantes én gang og gir avling\n        om og om igjen.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <button class=\"knapp gull bred\" style=\"margin-top:6px\" onclick=\"lukkPanel()\">Sett i gang<\u002Fbutton>`);\n}\n\n/* ===================== VARSLER ===================== */\n\nfunction varsel(tekst, type){\n  const d = document.createElement('div');\n  d.className = 'varsel' + (type ? ' '+type : '');\n  d.innerHTML = `<span>${tekst}<\u002Fspan>`;\n  el('varsler').appendChild(d);\n  if(type === 'feil') spill('feil'); else if(type === 'gull') spill('mynt');\n  setTimeout(()=>{ d.classList.add('ut'); setTimeout(()=>d.remove(),300); }, 1800);\n}\n\nfunction feiring(niva, bonus){\n  const nytt = nyttPåNiva(niva);\n  el('nivaFestTekst').innerHTML = `Nivå ${niva}!\n    <small>+${bonus} mynter${nytt.length ? ' · nytt: ' + nytt.join(', ') : ''}<\u002Fsmall>`;\n  const f = el('nivaFest');\n  f.classList.remove('vis'); void f.offsetWidth; f.classList.add('vis');\n  spill('niva');\n}\n\n/* ===================== LYD ===================== */\n\nlet AC = null, lydPå = true;\ntry{ lydPå = localStorage.getItem('akerland_lyd') !== 'av'; }catch(e){}\n\nfunction vekkLyd(){\n  if(!AC){\n    try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = false; }\n  }\n  if(AC && AC.state === 'suspended') AC.resume();\n}\n\nfunction tone(frek, start, lengde, type='sine', styrke=.16){\n  if(!AC || !lydPå) return;\n  const o = AC.createOscillator(), g = AC.createGain();\n  o.type = type; o.frequency.value = frek;\n  const t = AC.currentTime + start;\n  g.gain.setValueAtTime(0, t);\n  g.gain.linearRampToValueAtTime(styrke, t + .012);\n  g.gain.exponentialRampToValueAtTime(.0001, t + lengde);\n  o.connect(g); g.connect(AC.destination);\n  o.start(t); o.stop(t + lengde + .02);\n}\n\nfunction støy(start, lengde, styrke=.09){\n  if(!AC || !lydPå) return;\n  const n = Math.floor(AC.sampleRate * lengde);\n  const buf = AC.createBuffer(1, n, AC.sampleRate);\n  const d = buf.getChannelData(0);\n  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);\n  const s = AC.createBufferSource(); s.buffer = buf;\n  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1400;\n  const g = AC.createGain(); g.gain.value = styrke;\n  s.connect(f); f.connect(g); g.connect(AC.destination);\n  s.start(AC.currentTime + start);\n}\n\nconst LYD = {\n  så:    ()=>{ støy(0,.16,.07); tone(320,0,.1,'triangle',.07); },\n  høst:  ()=>{ const t = kjede();\n                tone(587*Math.pow(1.06,t),0,.11,'triangle',.13);\n                tone(880*Math.pow(1.06,t),.05,.13,'triangle',.08); støy(0,.1,.05); },\n  mynt:  ()=>{ tone(1180,0,.1,'square',.06); tone(1580,.06,.13,'square',.05); },\n  trykk: ()=>{ tone(520,0,.06,'sine',.08); },\n  feil:  ()=>{ tone(220,0,.13,'sawtooth',.07); tone(165,.07,.15,'sawtooth',.06); },\n  ferdig:()=>{ tone(784,0,.13,'triangle',.11); tone(1046,.09,.18,'triangle',.09); },\n  niva:  ()=>{ [523,659,784,1046].forEach((f,i)=>tone(f, i*.1, .3,'triangle',.12)); }\n};\nlet kjedeN = 0, kjedeTid = 0;\nfunction kjede(){\n  const t = nå();\n  kjedeN = (t - kjedeTid < 900) ? Math.min(kjedeN+1, 11) : 0;\n  kjedeTid = t;\n  return kjedeN;\n}\nfunction spill(navn){ vekkLyd(); (LYD[navn]||(()=>{}))(); }\n\nfunction vekslLyd(){\n  lydPå = !lydPå;\n  try{ localStorage.setItem('akerland_lyd', lydPå ? 'på' : 'av'); }catch(e){}\n  tegnLydknapp();\n  if(lydPå) spill('trykk');\n  varsel(lydPå ? 'Lyd på' : 'Lyd av');\n}\nfunction tegnLydknapp(){\n  const k = el('lydKnapp');\n  if(!k) return;\n  k.innerHTML = lydPå\n    ? `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2C6E49\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9h4l5-4v14l-5-4H4z\"/><path d=\"M17 8.5a5 5 0 0 1 0 7\"/><\u002Fsvg>`\n    : `<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9AA79C\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9h4l5-4v14l-5-4H4z\"/><path d=\"M17 9.5l4 5M21 9.5l-4 5\"/><\u002Fsvg>`;\n}\n\n/* ===================== INNDATA ===================== */\n\nlet peker = null, panner = false, verktøy = null, berørte = new Set();\nlet pinch = null, pektFlis = -1;\n\n/* Fra et punkt på skjermen til rutenett-koordinat.\n   Vi regner det ut i stedet for å la nettleseren gjette hvilket element\n   som ble truffet – da blir hele ruta trykkbar, ikke bare jordflekken. */\nfunction ruteKoord(sx, sy, nedIVerden = 0){\n  const wx = (sx - tx)/skala, wy = (sy - ty)/skala + nedIVerden;\n  return avIso(wx, wy);\n}\nfunction lappVed(c, r){\n  const cc = Math.round(c), rr = Math.round(r);\n  return LAPP_POS.findIndex(p=>p.c === cc && p.r === rr);\n}\nfunction modenLapp(i){\n  if(i < 0 || i >= S.kjøpteLapper) return false;\n  const l = S.lapper[i];\n  return !!(l && l.sort && nå() - l.sådd >= AVLINGER[l.sort].tid*1000);\n}\n/* Hvilken åkerlapp peker vi på? -1 = ingen.\n   Planten tegnes et stykke over ruta si, og dekker da naboruta over.\n   Derfor vinner en moden nabo hvis ruta man treffer ikke selv er moden. */\nfunction flisUnder(sx, sy, bareEksakt){\n  const a = ruteKoord(sx, sy);\n  const i = lappVed(a.c, a.r);\n  if(bareEksakt || valgtFrø) return i;      // når man sår gjelder ruta man peker på\n  const b = ruteKoord(sx, sy, 30);\n  const j = lappVed(b.c, b.r);\n  if(j >= 0 && j !== i && modenLapp(j) && !modenLapp(i)) return j;\n  return i;\n}\nfunction objUnder(x, y){\n  const n = document.elementFromPoint(x, y);\n  return n && n.closest ? n.closest('[data-klikk]') : null;\n}\nfunction merkFlis(i){\n  if(i === pektFlis) return;\n  if(pektFlis >= 0 && flisEl[pektFlis]) flisEl[pektFlis].rot.classList.remove('pekt');\n  pektFlis = i;\n  if(i >= 0 && flisEl[i]) flisEl[i].rot.classList.add('pekt');\n}\n\nscene.addEventListener('pointerdown', e=>{\n  if(e.pointerType === 'touch' && e.isPrimary === false) return;\n\n  if(plasserer){\n    peker = {x0:e.clientX, y0:e.clientY, flyttet:false, id:e.pointerId, plass:true};\n    const g = ruteKoord(e.clientX, e.clientY);\n    settSpøkelse(g.c, g.r);\n    scene.setPointerCapture(e.pointerId);\n    return;\n  }\n\n  /* rekkefølge: en rute man peker rett på vinner, så bygninger,\n     til slutt ruter der bare plantegrafikken ble truffet */\n  let i = flisUnder(e.clientX, e.clientY, true);\n  const obj = i < 0 ? objUnder(e.clientX, e.clientY) : null;\n  if(!obj) i = flisUnder(e.clientX, e.clientY);\n  peker = {x:e.clientX, y:e.clientY, x0:e.clientX, y0:e.clientY, flis:i, obj, flyttet:false,\n           tid:Date.now(), id:e.pointerId};\n  berørte.clear();\n  if(i >= 0 && i < S.kjøpteLapper){\n    /* moden avling vinner alltid – også når man har frø i hånda */\n    verktøy = flisEl[i].rot.dataset.tilstand === 'klar' ? 'høst'\n      : (valgtFrø ? 'så' : null);\n    panner = false;\n  }else{\n    verktøy = null; panner = !obj;\n  }\n  scene.setPointerCapture(e.pointerId);\n});\n\nscene.addEventListener('pointermove', e=>{\n  /* mus som bare svever over kartet */\n  if(!peker){\n    if(e.pointerType !== 'mouse') return;\n    if(plasserer){ const g = ruteKoord(e.clientX, e.clientY); settSpøkelse(g.c, g.r); }\n    else merkFlis(flisUnder(e.clientX, e.clientY));\n    return;\n  }\n  if(e.pointerId !== peker.id) return;\n  if(Math.abs(e.clientX-peker.x0) + Math.abs(e.clientY-peker.y0) > 8) peker.flyttet = true;\n\n  if(peker.plass){\n    const g = ruteKoord(e.clientX, e.clientY);\n    settSpøkelse(g.c, g.r);\n    return;\n  }\n\n  const dx = e.clientX - peker.x, dy = e.clientY - peker.y;\n  if(panner){\n    tx += dx; ty += dy;\n    klemKamera(); settKamera();\n  }else if(verktøy && peker.flyttet){\n    /* ta med ruta man startet på, ellers hopper draget over den første */\n    const traff = [];\n    if(peker.flis >= 0 && !berørte.has(peker.flis)) traff.push(peker.flis);\n    const i = flisUnder(e.clientX, e.clientY);\n    if(i >= 0 && !berørte.has(i) && i !== peker.flis) traff.push(i);\n    let gjort = false;\n    traff.forEach(k=>{\n      berørte.add(k);\n      if(verktøy === 'høst') gjort = høstLapp(k) || gjort;\n      else if(verktøy === 'så' && k < S.kjøpteLapper) gjort = såLapp(k, valgtFrø) || gjort;\n    });\n    if(gjort){ oppdaterFliser(); oppdaterHud(); }\n  }\n  peker.x = e.clientX; peker.y = e.clientY;\n});\n\nfunction avsluttPeker(e){\n  if(!peker) return;\n  if(peker.plass){\n    if(!peker.flyttet && plasserer && plasserer.ok) bekreftPlassering();\n    peker = null; return;\n  }\n  if(!peker.flyttet){\n    if(peker.flis >= 0) trykkFlis(peker.flis);\n    else if(peker.obj) håndterKlikk(peker.obj.dataset.klikk);\n  }else if(berørte.size){\n    lagre();\n    if(verktøy === 'så'){ tegnFrøRad(); if(S.mynter < AVLINGER[valgtFrø].frø) avbrytFrø(); }\n    else if(verktøy === 'høst' && valgtFrø) tegnFrøRad();\n  }\n  peker = null; panner = false; verktøy = null;\n}\nscene.addEventListener('pointerup', avsluttPeker);\nscene.addEventListener('pointercancel', avsluttPeker);\nscene.addEventListener('pointerleave', ()=> merkFlis(-1));\n\nfunction håndterKlikk(kode){\n  spill('trykk');\n  const [hva, arg] = kode.split(':');\n  if(hva === 'silo')   visSilo();\n  if(hva === 'bod')    { salgsValg = {}; visBod(); }\n  if(hva === 'ordrer') visOrdrer();\n  if(hva === 'dyr')    visDyr(arg);\n  if(hva === 'bygg'){\n    const t = S.bygg[arg];\n    if(t && Object.keys(t.ferdig).length) hentFraBygg(arg);\n    else visBygg(arg);\n  }\n  if(hva === 'dyrind') trykkDyr(+arg);\n  if(hva === 'spor')   trykkSpor(kode.slice(5));   // id-en kan selv ha kolon\n  if(hva === 'parsell') visParsell();\n}\n\n/* pinch-zoom */\nscene.addEventListener('touchstart', e=>{\n  if(e.touches.length === 2){\n    peker = null; panner = false; verktøy = null;\n    const [a,b] = e.touches;\n    pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), s: skala,\n             mx:(a.clientX+b.clientX)/2, my:(a.clientY+b.clientY)/2};\n  }\n}, {passive:true});\nscene.addEventListener('touchmove', e=>{\n  if(pinch && e.touches.length === 2){\n    const [a,b] = e.touches;\n    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);\n    const ny = Math.max(.45, Math.min(1.5, pinch.s * d/pinch.d));\n    const f = ny/skala;\n    tx = pinch.mx - (pinch.mx - tx)*f;\n    ty = pinch.my - (pinch.my - ty)*f;\n    skala = ny;\n    klemKamera(); settKamera();\n  }\n}, {passive:true});\nscene.addEventListener('touchend', e=>{ if(e.touches.length < 2) pinch = null; }, {passive:true});\n\nscene.addEventListener('wheel', e=>{\n  e.preventDefault();\n  const ny = Math.max(.45, Math.min(1.5, skala * (e.deltaY > 0 ? .92 : 1.08)));\n  const f = ny/skala;\n  tx = e.clientX - (e.clientX - tx)*f;\n  ty = e.clientY - (e.clientY - ty)*f;\n  skala = ny;\n  klemKamera(); settKamera();\n}, {passive:false});\n\nwindow.addEventListener('resize', ()=>{ klemKamera(); settKamera(); });\n\n/* ===================== HØYRE KNAPPERAD ===================== */\n\nel('dokkRad').innerHTML = `\n  <button class=\"prim\" onclick=\"åpneFrøvalg()\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2C6E49\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 21V11\"/><path d=\"M12 13c-4 0-6.5-2.4-6.5-6 4-.6 6.5 1.8 6.5 6z\"/><path d=\"M12 15c4.2-.5 6.6-3 6.3-6.6-4-.3-6.2 2.2-6.3 6.6z\"/><\u002Fsvg>\n    <em>Såing<\u002Fem><\u002Fbutton>\n  <button onclick=\"visByggeliste()\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2C6E49\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 21h18\"/><path d=\"M5 21V9l7-5 7 5v12\"/><path d=\"M10 21v-6h4v6\"/><\u002Fsvg>\n    <em>Bygg<\u002Fem>\n    <span class=\"merke skjul\" id=\"byggMerke\">0<\u002Fspan><\u002Fbutton>\n  <button onclick=\"salgsValg={};visBod()\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2C6E49\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 9h18l-1.5 11H4.5z\"/><path d=\"M8 9V6a4 4 0 0 1 8 0v3\"/><\u002Fsvg>\n    <em>Bod<\u002Fem><\u002Fbutton>\n  <button onclick=\"visOrdrer()\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2C6E49\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 3h12v18l-6-4-6 4z\"/><path d=\"M9 8h6M9 12h6\"/><\u002Fsvg>\n    <em>Ordrer<\u002Fem>\n    <span class=\"merke skjul\" id=\"ordreMerke\">0<\u002Fspan><\u002Fbutton>`;\n\n/* ===================== OPPSTART ===================== */\n\ntegnLydknapp();\nscene.addEventListener('pointerdown', vekkLyd, {once:true});\n\nlaste();\nfyllOrdrer();\ntikkBygg();\nbyggKart();\noppdaterAlt();\ntegnFrøRad();\nstartKamera();\nif(!S.sett){ S.sett = true; visIntro(); }\nlagre();\n\nsetInterval(()=>{\n  const endret = tikkBygg();\n  oppdaterAlt();\n  if(endret) lagre();\n  const p = el('panel');\n  if(el('slor').classList.contains('vis') && p.dataset.auto === 'bygg') visBygg(p.dataset.byggType);\n}, 1000);\n\nsetInterval(lagre, 15000);\ndocument.addEventListener('visibilitychange', ()=>{\n  if(document.hidden) lagre(); else { tikkBygg(); oppdaterAlt(); }\n});\nwindow.addEventListener('pagehide', lagre);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
