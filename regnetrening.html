document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

mp(12px,2vh,20px) clamp(14px,1.6vw,20px); cursor:pointer; box-shadow:0 6px 0 rgba(42,31,61,.22);\">\n          <h3 style=\"margin:0; font-size:clamp(17px,2.7vh,28px); font-weight:700; color:#2a1f3d;\">🏃 Mosjonsmodus<\u002Fh3>\n          <p style=\"margin:.35em 0 0; font-size:clamp(12px,1.8vh,17px); font-weight:500; color:#4a3c63; line-height:1.35;\">Fire spillfelt. Hver elev trykker ➕ og regner i sitt eget felt, i sitt eget tempo. Ingen taper.<\u002Fp>\n        <\u002Fdiv>\n        <div data-modus=\"konkurranse\" role=\"button\" tabindex=\"0\" style=\"background:#fffaf0; border:4px solid #2a1f3d; border-radius:22px; padding:clamp(12px,2vh,20px) clamp(14px,1.6vw,20px); cursor:pointer; box-shadow:0 6px 0 rgba(42,31,61,.22);\">\n          <h3 style=\"margin:0; font-size:clamp(17px,2.7vh,28px); font-weight:700; color:#2a1f3d;\">🪢 Tautrekking<\u002Fh3>\n          <p style=\"margin:.35em 0 0; font-size:clamp(12px,1.8vh,17px); font-weight:500; color:#4a3c63; line-height:1.35;\">1 mot 1 eller 2 mot 2. Begge lag får sin egen oppgave – riktig og raskt gir trekkraft, og tauet glir.<\u002Fp>\n        <\u002Fdiv>\n        <div data-modus=\"katapult\" role=\"button\" tabindex=\"0\" style=\"background:#fffaf0; border:4px solid #2a1f3d; border-radius:22px; padding:clamp(12px,2vh,20px) clamp(14px,1.6vw,20px); cursor:pointer; box-shadow:0 6px 0 rgba(42,31,61,.22);\">\n          <h3 style=\"margin:0; font-size:clamp(17px,2.7vh,28px); font-weight:700; color:#2a1f3d;\">🏰 Katapultkamp<\u002Fh3>\n          <p style=\"margin:.35em 0 0; font-size:clamp(12px,1.8vh,17px); font-weight:500; color:#4a3c63; line-height:1.35;\">Ett regnefelt per spiller. Riktige svar strammer lagets katapult – så sikter laget selv og skyter ned borgen.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fbf2d6; border:4px solid #2a1f3d; border-radius:26px; box-shadow:0 10px 0 rgba(42,31,61,.18), 0 16px 30px rgba(42,31,61,.16); padding:clamp(14px,2.2vh,26px) clamp(14px,2.4vw,30px); ma DEEP='#5d9417';\n    this.C = { INK:INK, INK_SOFT:INK_SOFT, CREAM:CREAM, PAPER:PAPER, GOLD:GOLD, GOLD_DEEP:GOLD_DEEP, RED:RED, GREEN:GREEN, GREEN_DEEP:GREEN_DEEP };\n\n    /* ---------- innstillinger fra tweaks ---------- */\n    this.VINNERKRAFT = Math.round(this.props.vinnerkraft ?? 30);\n    this.LADEKRAV = Math.round(this.props.ladekrav ?? 4);\n    this.BORG_HP = Math.round(this.props.borgHp ?? 4);\n\n    /* ---------- ren logikk ---------- */\n    var NIVAER = {\n      lett:      { navn:'Lett',      trinn:'1.–2. trinn', vindu:20, merke:'Lett',       under:'0–20' },\n      middels:   { navn:'Middels',   trinn:'3.–4. trinn', vindu:16, merke:'Middels',    under:'0–100' },\n      vanskelig: { navn:'Vanskelig', trinn:'5.–7. trinn', vindu:14, merke:'Vanskelig',  under:'0–1000' }\n    };\n    var ARTNAVN = { add:'Addisjon', sub:'Subtraksjon', mul:'Multiplikasjon', div:'Divisjon' };\n    var ARTTEGN = { add:'+', sub:'−', mul:'·', div:':' };\n    var GRUNNKRAFT = 10, MAKSBONUS = 10, STRAFFKRAFT = 5, MAKSOPPGAVER = 20;\n    var KALLENAVN = ['Skog','Sol','Tang','Plonne'];\n    this.NIVAER = NIVAER; this.ARTNAVN = ARTNAVN;\n\n    var SLAG = {\n      bakke: 88, etasje: 8.5, armlengde: 20, gravitasjon: 200, maksfart: 260, makstrekk: 48,\n      midt: 100,\n      borg: { v:{ x0:-16, x1:18 }, h:{ x0:182, x1:216 } },\n      kat:  { v:{ x:51, y:76 },  h:{ x:149, y:76 } }\n    };\n\n    function motsatt(s){ return s === 'v' ? 'h' : 'v'; }\n    function suffiks(s){ return s === 'v' ? 'V' : 'H'; }\n    function armHvile(lad){ return -22 - (lad / ladekrav()) * 48; }\n    function bucketLokal(side, vinkel){\n      var p = SLAG.kat[side], r = vinkel * Math.PI / 180, L = SLAG.armlengde;\n      return { x: p.x + Math.sin(r) * L, y: p.y - Math.cos(r) * L };\n    }\n    function tilVerden(side, pt){\n      return side === 'v' ? { x:pt.x, y:pt.y } : { x: 2 * SLAG.kat.h.x - pt.x, y: pt.y };\n    }\n    function borgRekt(side, hp){\n      var b = SLAG.borg[side];\n      return { x0:b.x0, x1:b.x1, y0: SLAG.bakke - hp * SLAG.etasje, y1: SLAG.bakke };\n    }\n    function simulerKast(x, y, vx, vy, malRekt){\n      var dt = 1/90, punkter = [], i;\n      for (i = 0; i < 800; i++){\n        punkter.push({ x:x, y:y });\n        x += vx * dt; y += vy * dt; vy += SLAG.gravitasjon * dt;\n        if (malRekt && x >= malRekt.x0 && x <= malRekt.x1 && y >= malRekt.y0 && y <= malRekt.y1){\n          punkter.push({ x:x, y:y });\n          return { punkter:punkter, traff:'borg', x:x, y:y };\n        }\n        if (y >= SLAG.bakke){ punkter.push({ x:x, y:SLAG.bakke }); return { punkter:punkter, traff:'bakke', x:x, y:SLAG.bakke }; }\n        if (x < -70 || x > 270){ return { punkter:punkter, traff:'ut', x:x, y:y }; }\n      }\n      return { punkter:punkter, traff:'ut', x:x, y:y };\n    }\n    function dragTilFart(dx, dy){\n      var len = Math.sqrt(dx*dx + dy*dy);\n      if (len < 0.0001) return null;\n      var f = Math.min(1, len / SLAG.makstrekk), fart = f * SLAG.maksfart;\n      return { kraft:f, vx: dx/len * fart, vy: dy/len * fart };\n    }\n    function erKonkurranseModus(m){ return m === 'konkurranse' || m === 'katapult'; }\n    function lovligAntall(modus, n){\n      if (!erKonkurranseModus(modus)) return n;\n      return (n === 2 || n === 4) ? n : 2;\n    }\n    function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }\n    function velg(arr){ return arr[Math.floor(Math.random() * arr.length)]; }\n    function stokk(arr){\n      var a = arr.slice(), i, j, t;\n      for (i = a.length - 1; i > 0; i--){ j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }\n      return a;\n    }\n    function lagOppgave(arter, niva){\n      var art = velg(arter), a, b, svar, tekst;\n      if (art === 'add'){\n        if (niva === 'lett'){ a = rnd(1,10); b = rnd(1,10); }\n        else if (niva === 'middels'){ a = rnd(10,60); b = rnd(5,40); }\n        else { a = rnd(50,600); b = rnd(30,399); }\n        svar = a + b; tekst = a + ' + ' + b;\n      } else if (art === 'sub'){\n        if (niva === 'lett'){ a = rnd(6,20); b = rnd(1, a-1); }\n        else if (niva === 'middels'){ a = rnd(25,100); b = rnd(2, a-2); }\n        else { a = rnd(120,950); b = rnd(15, a-10); }\n        svar = a - b; tekst = a + ' − ' + b;\n      } else if (art === 'mul'){\n        if (niva === 'lett'){ a = velg([2,3,4,5,10]); b = rnd(2,5); }\n        else if (niva === 'middels'){ a = rnd(2,10); b = rnd(2,10); }\n        else { a = velg([rnd(3,12), rnd(11,25)]); b = rnd(3,12); }\n        svar = a * b; tekst = a + ' · ' + b;\n      } else {\n        if (niva === 'lett'){ b = velg([2,3,4,5,10]); svar = rnd(2,5); }\n        else if (niva === 'middels'){ b = rnd(2,10); svar = rnd(2,10); }\n        else { b = rnd(3,12); svar = rnd(4,25); }\n        a = b * svar; tekst = a + ' : ' + b;\n      }\n      return { art:art, a:a, b:b, svar:svar, tekst:tekst };\n    }\n    function lagAlternativer(o){\n      var kand;\n      if (o.art === 'mul') kand = [o.svar+o.a, o.svar-o.a, o.svar+o.b, o.svar-o.b, o.svar+1, o.svar-1, o.svar+10];\n      else if (o.art === 'div') kand = [o.svar+1, o.svar-1, o.svar+2, o.svar-2, o.svar+o.b, o.svar*2, o.b];\n      else kand = [o.svar+1, o.svar-1, o.svar+2, o.svar-2, o.svar+10, o.svar-10, o.svar+9, o.svar+11, o.svar+100, o.svar-100];\n      var brukt = {}, feil = [], i, k;\n      brukt[o.svar] = true;\n      var blandet = stokk(kand);\n      for (i = 0; i < blandet.length && feil.length < 3; i++){\n        k = blandet[i];\n        if (k >= 0 && !brukt[k]){ brukt[k] = true; feil.push(k); }\n      }\n      k = o.svar + 3;\n      while (feil.length < 3){ if (k >= 0 && !brukt[k]){ brukt[k] = true; feil.push(k); } k++; }\n      return stokk([o.svar].concat(feil));\n    }\n    function beregnKraft(sek, vindu){\n      var bonus = Math.max(0, Math.round(MAKSBONUS * (1 - sek / vindu)));\n      if (bonus > MAKSBONUS) bonus = MAKSBONUS;\n      return { grunn:GRUNNKRAFT, bonus:bonus, total:GRUNNKRAFT + bonus };\n    }\n    function knuteProsent(kv, kh){\n      var d = (kv - kh) / self.VINNERKRAFT;\n      if (d > 1) d = 1; if (d < -1) d = -1;\n      return 50 - d * 42;\n    }\n    function sjekkVinner(kv, kh, ov, oh, maks){\n      if (kv - kh >= self.VINNERKRAFT) return 'v';\n      if (kh - kv >= self.VINNERKRAFT) return 'h';\n      if (ov >= maks && oh >= maks){\n        if (kv > kh) return 'v';\n        if (kh > kv) return 'h';\n        return 'uavgjort';\n      }\n      return null;\n    }\n    function fordelLag(antall){\n      var v = [], h = [], i;\n      for (i = 0; i < antall; i++){ (i % 2 === 0 ? v : h).push(i); }\n      return { v:v, h:h };\n    }\n    /* Hvert lag har ett regnefelt (spor) per spiller: v0/h0 i 1 mot 1, v0/v1/h0/h1 i 2 mot 2. */\n    function sporPerSide(){ return O.antall === 4 ? 2 : 1; }\n    function sporNokler(side){ return sporPerSide() === 2 ? [side + '0', side + '1'] : [side + '0']; }\n    function alleSpor(){ return sporNokler('v').concat(sporNokler('h')); }\n    function sideAvSpor(k){ return k.charAt(0); }\n    function sporSpiller(lag, k){ return lag[sideAvSpor(k)][+k.charAt(1)]; }\n    function ladekrav(){ return self.LADEKRAV * sporPerSide(); }\n\n    /* ---------- monstre ----------\n       Spillermonstrene er de samme bildene som Ordkafeen bruker (Restaurantmonstre/).\n       Tommel-varianten brukes på vinnerskjermene. Om et bilde ikke finnes, tegnes\n       et enkelt SVG-monster i stedet, slik at spillet virker uansett. */\n    var HEIAMAPPE = 'Restaurantmonstre/', HEIAMAPPE2 = 'Bilder/Restaurantmonstre/';\n    var TOMMELMAPPE = 'Restaurantmonstre/Tommel/', TOMMELMAPPE2 = 'Bilder/Restaurantmonstre/Tommel/';\n    var HEIAMONSTRE = [\n      { navn:'Bjørk',   fil:'groennhaar'  }, { navn:'Glød',    fil:'appelsin'    },\n      { navn:'Rosa',    fil:'rosa'        }, { navn:'Måne',    fil:'graa'        },\n      { navn:'Skygge',  fil:'moerkelilla' }, { navn:'Bølge',   fil:'indigo'      },\n      { navn:'Natt',    fil:'marineblaa'  }, { navn:'Plonne',  fil:'v (side, bucketLokal(side, S.armMaal));\n      var sim = simulerKast(b.x, b.y, fart.vx, fart.vy, borgRekt(motsatt(side), KP.hp[motsatt(side)]));\n      settSiktbane(side, sim.punkter);\n      visSiktmelding(side, '🎯 Kraft ' + Math.round(fart.kraft * 100) + ' %',\n        sim.traff === 'borg' ? 'Denne banen treffer borgen — slipp!' : 'Juster retning og kraft …');\n    }\n    function kpDragSlutt(ev){\n      if (!KP || KP.ferdig) return;\n      var side = sideForPeker(ev.pointerId); if (!side) return;\n      var S = KP.side[side], SF = suffiks(side);\n      S.dragId = null;\n      settSiktbane(side, null);\n      if (!S.retn || S.kraft < 0.1){\n        S.armMaal = armHvile(S.lad); S.kraft = 0; S.retn = null;\n        visSiktmelding(side, '🪨 Katapulten er klar!', 'For kort drag — dra lenger bakover og slipp.');\n        return;\n      }\n      S.arm = S.armMaal;\n      var b = tilVerden(side, bucketLokal(side, S.armMaal));\n      S.bane = simulerKast(b.x, b.y, S.retn.vx, S.retn.vy, borgRekt(motsatt(side), KP.hp[motsatt(side)]));\n      S.baneIdx = 0; S.tilstand = 'flyr'; S.armMaal = 42; S.retn = null; S.kraft = 0;\n      self.$('halv' + SF).style.animation = 'none';\n      self.$('halv' + SF).style.opacity = '0';\n      self.$('lastStein' + SF).setAttribute('r', 0);\n      visSiktmelding(side, '🪨 Steinen flyr …', '');\n      lydSkudd();\n    }\n    this.$('slagmark').addEventListener('pointerdown', kpDragStart);\n    window.addEventListener('pointermove', kpDragFlytt);\n    window.addEventListener('pointerup', kpDragSlutt);\n    window.addEventListener('pointercancel', kpDragSlutt);\n\n    function kpNedslag(side){\n      var S = KP.side[side], SF = suffiks(side), mot = motsatt(side);\n      S.tilstand = 'pause'; S.lad = 0; S.armMaal = armHvile(0);\n      sporNokler(side).forEach(tegnLadning);\n      self.$('stein' + SF).setAttribute('r', 0);\n      if (S.bane.traff === 'borg'){\n        KP.hp[mot] = Math.max(0, KP.hp[mot] - 1);\n        KP.treff[side]++; KP.rist[mot] = 1;\n        tegnBorg(mot); tegnKpHp();\n        stovsky(mot, S.bane.x, S.bane.y);\n        lydSmell();\n        visSiktmelding(side, '💥 Fullt treff!',\n          KP.hp[mot] > 0 ? 'Borgen mistet en etasje — ' + KP.hp[mot] + ' igjen. Lad opp på nytt!' : 'Borgen er jevnet med jorda!');\n        if (KP.hp[mot] === 0){ avsluttKatapult(side); return; }\n      } else {\n        KP.bom[side]++;\n        stovsky(side, S.bane.x, Math.min(SLAG.bakke - 1, S.bane.y));\n        lydBom();\n        visSiktmelding(side, 'Bom!', 'Steinen landet utenfor. Lad katapulten på nytt — ' + KP.krav + ' riktige svar.');\n      }\n      setTimeout(function(){\n        if (!KP || KP.ferdig) return;\n        S.tilstand = 'regner';\n        sporNokler(side).forEach(nyKpOppgave);\n      }, 1700);\n    }\n    function kpRamme(){\n      if (!KP || self.$('katapult').style.display === 'none') return;\n      ['v','h'].forEach(function(side){\n        var S = KP.side[side], SF = suffiks(side), p = SLAG.kat[side];\n        S.arm += (S.armMaal - S.arm) * 0.3;\n        var arm = self.$('arm' + SF);\n        if (arm) arm.setAttribute('transform', 'rotate(' + S.arm.toFixed(2) + ',' + p.x + ',' + p.y + ')');\n        var b = bucketLokal(side, S.arm), tau = self.$('katTau' + SF);\n        if (tau){ tau.setAttribute('x2', b.x.toFixed(2)); tau.setAttribute('y2', b.y.toFixed(2)); }\n        var last = self.$('lastStein' + SF);\n        if (last){\n          var synlig = (S.tilstand === 'sikt') || (S.tilstand === 'regner' && S.lad > 0);\n          last.setAttribute('r', synlig ? (1.4 + 1.4 * (S.lad / KP.krav)).toFixed(2) : 0);\n        }\n        if (S.tilstand === 'flyr' && S.bane){\n          S.baneIdx += 1.5;\n          var i = Math.floor(S.baneIdx), siste = S.bane.punkter.length - 1;\n          var pk = S.bane.punkter[Math.min(i, siste)], st = self.$('stein' + SF);\n          st.setAttribute('cx', pk.x.toFixed(2)); st.setAttribute('cy', pk.y.toFixed(2)); st.setAttribute('r', 2.6);\n          if (i >= siste) kpNedslag(side);\n        }\n        if (KP.rist[side] > 0){\n          KP.rist[side] = Math.max(0, KP.rist[side] - 0.05);\n          var dx = Math.sin(KP.rist[side] * 42) * KP.rist[side] * 2.4;\n          self.$('borg' + SF).setAttribute('transform', 'translate(' + dx.toFixed(2) + ',0)');\n        }\n      });\n      requestAnimationFrame(kpRamme);\n    }\n    this.$('kpFull').addEventListener('click', fullskjerm);\n    this.$('kpLyd').addEventListener('click', function(){ lydPa = !lydPa; oppdaterLydknapper(); });\n    this.$('kpSlutt').addEventListener('click', function(){\n      if (!KP || KP.ferdig) return;\n      avsluttKatapult(KP.hp.v > KP.hp.h ? 'v' : KP.hp.h > KP.hp.v ? 'h' : 'uavgjort');\n    });\n    function avsluttKatapult(vinner){\n      KP.ferdig = true; lydSeier();\n      setTimeout(function(){ visKatapultResultat(vinner); }, 1200);\n    }\n    function visKatapultResultat(vinner){\n      var uavgjort = (vinner === 'uavgjort');\n      var tittel = vinner === 'v' ? 'Lag Grønn vinner!' : 'Lag Gull vinner!';\n      var boks = function(side, navn){\n        return resBoks(KP.treff[side] + ' 💥', navn + ' · ' + KP.riktige[side] + '/' + KP.oppgaver[side] + ' riktige · ' + KP.bom[side] + ' bom');\n      };\n      self.$('resInner').innerHTML = '<div style=\"' + PANEL + '\">' +\n        '<div style=\"font-size:clamp(34px,9vh,80px);line-height:1\">' + (uavgjort ? '🤝' : '🏆') + '<\u002Fdiv>' +\n        '<h1 style=\"' + STICKER + '\">' + (uavgjort ? 'UAVGJORT' : 'BORGEN FALT!') + '<\u002Fh1>' +\n        vinnerBoks(vinner, uavgjort, tittel, uavgjort ? 'Begge borgene står — kjør en omkamp 🏰' : 'Borgen står med ' + KP.hp[vinner] + '/' + self.BORG_HP + ' etasjer') +\n        '<div style=\"display:flex;flex-wrap:wrap;gap:clamp(8px,1.4vw,16px);justify-content:center;margin-bottom:clamp(8px,1.4vh,14px)\">' + boks('v','Lag Grønn') + boks('h','Lag Gull') + '<\u002Fdiv>' +\n        '<div style=\"display:flex;flex-wrap:wrap;gap:clamp(8px,1.4vw,16px);justify-content:center;margin-bottom:clamp(8px,1.6vh,16px)\">' +\n          resBoks('🏰 ' + KP.hp.v + '/' + self.BORG_HP, 'Grønn borg') + resBoks('🏰 ' + KP.hp.h + '/' + self.BORG_HP, 'Gull borg') + '<\u002Fdiv>' +\n        '<p style=\"' + SERIF + 'margin:0;font-size:clamp(13px,2vh,22px);color:' + INK_SOFT + '\">' + artListe() + ' · ' + NIVAER[O.niva].navn + ' (' + NIVAER[O.niva].trinn + ')<\u002Fp>' +\n        resKnapper() + '<\u002Fdiv>';\n      vis('resultat');\n      koblResKnapper(startKatapult);\n      if (!uavgjort) konfetti(vinner === 'v' ? [GREEN, '#c3e582', GREEN_DEEP, GOLD] : [GOLD, '#ffe6a8', GOLD_DEEP, GREEN]);\n    }\n\n    /* ---------- fysisk tastatur ---------- */\n    document.addEventListener('keydown', function(e){\n      if (self.$('mosjon').style.display === 'none') return;\n      if (O.svarmate !== 'tast' || !M) return;\n      /* Fysisk tastatur styrer bare når nøyaktig ett felt er i bruk. */\n      var aktive = [];\n      M.felt.forEach(function(f){ if (f.aktiv) aktive.push(f); });\n      if (aktive.length !== 1) return;\n      var f = aktive[0];\n      if (f.laast) return;\n      if (/^[0-9]$/.test(e.key)){ if (f.inntastet.length < 5){ f.inntastet += e.key; tegnFeltSvar(f.idx); } }\n      else if (e.key === 'Backspace'){ f.inntastet = f.inntastet.slice(0,-1); tegnFeltSvar(f.idx); }\n      else if (e.key === 'Enter' && f.inntastet !== ''){ feltSvar(f.idx, +f.inntastet, null); }\n    });\n    document.addEventListener('gesturestart', function(e){ e.preventDefault(); });\n\n    if ((this.props.visLandskap ?? true) === false) this.$('tauLandskap').style.display = 'none';\n    oppdaterLydknapper();\n    tegnOppsett();\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
