document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

shadow:7px 7px 0 var(--sel)}\n.turnflash.hit span{background:var(--hit);color:#fff;box-shadow:7px 7px 0 var(--ink)}\n.turnflash.go{animation:tf 1.15s cubic-bezier(.2,.9,.3,1) forwards}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"wrap\">\n  <header class=\"top\">\n    <a class=\"brand\" href=\"index.html\" title=\"Tilbake til Mykje spill\">SLAGSKIP<\u002Fa>\n    <div class=\"top-actions\">\n      <button class=\"tbtn\" id=\"soundBtn\" type=\"button\">Lyd: på<\u002Fbutton>\n      <button class=\"tbtn\" id=\"homeBtn\" type=\"button\" hidden=\"\">Meny<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <p class=\"banner\" id=\"mpBanner\" hidden=\"\"><\u002Fp>\n\n  <main>\n    <!-- START -->\n    <section id=\"scr-start\" class=\"stack\">\n      <div class=\"hero\">\n        <span class=\"kicker\"><i><\u002Fi>Klar til kamp<\u002Fspan>\n        <h1>Slagskip<\u002Fh1>\n        <p>Skriv inn koordinater, trykk på den røde knappen og senk hele flåten til motstanderen.<\u002Fp>\n      <\u002Fdiv>\n\n      <button class=\"btn btn-resume\" id=\"resumeBtn\" type=\"button\" hidden=\"\"><\u002Fbutton>\n\n      <div class=\"field\">\n        <span class=\"eyebrow\">Motstander<\u002Fspan>\n        <div class=\"modes\">\n          <button class=\"mode\" id=\"modeBot\" type=\"button\" aria-pressed=\"true\"><b>Mot boten<\u002Fb><small>Spill alene på én skjerm.<\u002Fsmall><\u002Fbutton>\n          <button class=\"mode\" id=\"modeFriend\" type=\"button\" aria-pressed=\"false\"><b>Mot en venn<\u002Fb><small>To skjermer. Den ene lager spillet og deler en kode.<\u002Fsmall><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"field\" id=\"joinField\" hidden=\"\">\n        <span class=\"eyebrow\">Har du fått en kode?<\u002Fspan>\n        <form class=\"join\" id=\"joinForm\" autocomplete=\"off\">\n          <input id=\"joinCode\" class=\"join-input\" inputmode=\"text\" maxlength=\"4\" placeholder=\"KODE\" aria-label=\"Kode fra vennen din\" autocapitalize=\"characters\" spellcheck=\"false\">\n          <button class=\"btn btn-join\" id=\"joinBtn\" type=\"submit\">Bli med<\u002Fbutton>\n        <\u002Fform>\n        <p class=\"note\" id=\"friendNote\" aria-live=\"polite\"><\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"field\">\n        <span class=\"eyebrow\">Brett<\u002Fspan>\n        <div class=\"themes\" id=\"themes\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"field\">\n        <span class=\"eyebrow\" id=\"sizeLabel\">Størrelse<\u002Fspan>\n        <div class=\"seg\" id=\"sizes\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"field\" id=\"levelField\">\n        <span class=\"eyebrow\">Boten<\u002Fspan>\n        <div class=\"seg\" id=\"levels\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <button class=\"btn btn-primary\" id=\"toPlace\" type=\"button\">Plasser skipene<\u002Fbutton>\n      <button class=\"btn btn-primary\" id=\"hostBtn\" type=\"button\" hidden=\"\">Lag nytt spill<\u002Fbutton>\n    <\u002Fsection>\n\n    <!-- LOBBY -->\n    <section id=\"scr-lobby\" class=\"stack\" hidden=\"\">\n      <div class=\"sec-head\">\n        <h2>Inviter en venn<\u002Fh2>\n        <p>Vennen skanner QR-koden, eller velger «Mot en venn» og skriver inn koden.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"lobby\">\n        <div class=\"qr\" id=\"qr\" aria-label=\"QR-kode som åpner spillet\"><\u002Fdiv>\n        <div class=\"lobby-code\">\n          <span class=\"eyebrow\">Kode<\u002Fspan>\n          <div class=\"code\" id=\"lobbyCode\">····<\u002Fdiv>\n          <button class=\"tbtn\" id=\"copyBtn\" type=\"button\">Kopier lenke<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"waiting\"><i><\u002Fi><span id=\"lobbyStatus\">Venter på at en venn blir med …<\u002Fspan><\u002Fp>\n      <button class=\"btn\" id=\"cancelLobby\" type=\"button\">Avbryt<\u002Fbutton>\n    <\u002Fsection>\n\n    <!-- PLACEMENT -->\n    <section id=\"scr-place\" class=\"stack\" hidden=\"\">\n      <div class=\"sec-head\">\n        <h2>Plasser flåten<\u002Fh2>\n        <p>Trykk i vannet for å legge ut et skip. Trykk på et skip for å velge det, og trykk på det igjen for å snu det.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"chips\" id=\"shipChips\"><\u002Fdiv>\n      <p class=\"note\" id=\"placeNote\" aria-live=\"polite\"><\u002Fp>\n      <div id=\"placeBoard\"><\u002Fdiv>\n      <div class=\"row\">\n        <button class=\"btn\" id=\"rotateBtn\" type=\"button\">Snu ↻<\u002Fbutton>\n        <button class=\"btn\" id=\"randomBtn\" type=\"button\">Tilfeldig<\u002Fbutton>\n        <button class=\"btn\" id=\"clearBtn\" type=\"button\">Tøm<\u002Fbutton>\n      <\u002Fdiv>\n      <button class=\"btn btn-primary\" id=\"startBtn\" type=\"button\" disabled=\"\">Start kampen<\u002Fbutton>\n    <\u002Fsection>\n\n    <!-- BATTLE -->\n    <section id=\"scr-battle\" hidden=\"\">\n      <div class=\"btop\">\n        <div class=\"bstat\">\n          <span class=\"pill\" id=\"turnPill\"><i><\u002Fi><span id=\"turnTxt\">Din tur<\u002Fspan><\u002Fspan>\n          <div>\n            <div class=\"eyebrow\">Fiendens flåte<\u002Fdiv>\n            <div class=\"fleet\" id=\"enemyFleet\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"mine\">\n          <div id=\"mineBoard\"><\u002Fdiv>\n          <span class=\"eyebrow\">Din flåte<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"enemy-wrap\">\n        <div id=\"enemyBoard\"><\u002Fdiv>\n        <div class=\"keyrow\"><span class=\"ico\" title=\"Bokstav: bortover\">↔<\u002Fspan><div class=\"keys\" id=\"letterKeys\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"keyrow\"><span class=\"ico\" title=\"Tall: nedover\">↕<\u002Fspan><div class=\"keys\" id=\"numberKeys\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"fire\">\n        <div class=\"target\">\n          <span class=\"eyebrow\">Mål<\u002Fspan>\n          <div class=\"coord\" id=\"coord\"><span class=\"empty\">_<\u002Fspan><span class=\"empty\">_<\u002Fspan><\u002Fdiv>\n          <small>Bokstav bortover, tall nedover<\u002Fsmall>\n        <\u002Fdiv>\n        <div class=\"launch-wrap\"><button class=\"launch\" id=\"launch\" type=\"button\" aria-label=\"Skyt\">SKYT<\u002Fbutton><\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"msg\" id=\"msg\" aria-live=\"polite\"><\u002Fp>\n\n      <details class=\"log\" open=\"\">\n        <summary>Skuddlogg<\u002Fsummary>\n        <ol id=\"log\"><\u002Fol>\n      <\u002Fdetails>\n    <\u002Fsection>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<div class=\"overlay\" id=\"endOverlay\" hidden=\"\">\n  <div class=\"card\">\n    <h2 id=\"endTitle\">Du vant!<\u002Fh2>\n    <p id=\"endSub\"><\u002Fp>\n    <div class=\"stats\">\n      <div><b id=\"stShots\">0<\u002Fb><small>Skudd<\u002Fsmall><\u002Fdiv>\n      <div><b id=\"stHits\">0<\u002Fb><small>Treff<\u002Fsmall><\u002Fdiv>\n      <div><b id=\"stPct\">0 %<\u002Fb><small>Treffprosent<\u002Fsmall><\u002Fdiv>\n    <\u002Fdiv>\n    <p id=\"endPctTxt\"><\u002Fp>\n    <button class=\"btn btn-primary\" id=\"againBtn\" type=\"button\">Spill igjen<\u002Fbutton>\n    <button class=\"btn\" id=\"menuBtn\" type=\"button\">Til menyen<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"turnflash\" id=\"turnFlash\" aria-hidden=\"true\"><span><\u002Fspan><\u002Fdiv>\n<canvas id=\"fx\" aria-hidden=\"true\"><\u002Fcanvas>\n\n<script>\n(() => {\n/* =======================================================================\n   SPILL MOT EN VENN – Firebase-oppsett\n   Lim inn web-konfigurasjonen fra Firebase-konsollen her\n   (Prosjektinnstillinger → Dine apper → Konfig). Må ha databaseURL.\n   Står den som null, er «Mot en venn» skrudd av.\n   ======================================================================= */\nconst FIREBASE_CONFIG = {\n  apiKey: \"AIzaSyCGa-sqmEBetgY4qJIpzJDf92rMSFn3cwc\",\n  authDomain: \"mykje-spill.firebaseapp.com\",\n  databaseURL: \"https://mykje-spill-default-rtdb.europe-west1.firebasedatabase.app\",\n  projectId: \"mykje-spill\",\n  appId: \"1:248771795084:web:9839ce54c5bb4d5cfc03a9\"\n};\nconst FB_VER = '10.12.2';\nconst QR_LIB = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';\n\nconst $ = s => document.querySelector(s);\nconst LETTERS = 'ABCDEFGHIJ';\nconst SHIPSETS = {\n  6:  [{n:'Krysser',d:'krysseren',l:3},{n:'Jager',d:'jageren',l:2},{n:'Patruljebåt',d:'patruljebåten',l:2}],\n  8:  [{n:'Slagskip',d:'slagskipet',l:4},{n:'Krysser',d:'krysseren',l:3},{n:'Ubåt',d:'ubåten',l:3},{n:'Jager',d:'jageren',l:2}],\n  10: [{n:'Hangarskip',d:'hangarskipet',l:5},{n:'Slagskip',d:'slagskipet',l:4},{n:'Krysser',d:'krysseren',l:3},{n:'Ubåt',d:'ubåten',l:3},{n:'Jager',d:'jageren',l:2}]\n};\nconst THEMES = [\n  {id:'hav',name:'Åpent hav'},{id:'tropisk',name:'Tropisk'},{id:'arktisk',name:'Arktisk'},\n  {id:'fjord',name:'Fjord'},{id:'natt',name:'Nattsjø'},{id:'radar',name:'Radar'},{id:'ruteark',name:'Ruteark'}\n];\nconst SIZES = [{v:6,t:'6 × 6',s:'1.–2. trinn'},{v:8,t:'8 × 8',s:'3.–4. trinn'},{v:10,t:'10 × 10',s:'5.–7. trinn'}];\nconst LEVELS = [{v:'lett',t:'Lett',s:'Skyter tilfeldig'},{v:'middels',t:'Middels',s:'Jakter etter treff'},{v:'vanskelig',t:'Vanskelig',s:'Regner ut sjanser'}];\nconst CODE_CHARS = 'ABDEFGHJKLMNPRSTUVXYZ';\n\nlet settings = {theme:'hav', size:10, level:'middels', sound:true, mode:'bot'};\ntry { const s = JSON.parse(localStorage.getItem('slagskip') || '{}'); delete s.aim; Object.assign(settings, s); } catch(e) {}\nconst save = () => { try { localStorage.setItem('slagskip', JSON.stringify(settings)); } catch(e) {} };\nconst store = {\n  get() { try { return JSON.parse(localStorage.getItem('slagskip-mp') || 'null'); } catch(e) { return null; } },\n  set(v) { try { localStorage.setItem('slagskip-mp', JSON.stringify(v)); } catch(e) {} },\n  clear() { try { localStorage.removeItem('slagskip-mp'); } catch(e) {} }\n};\n\nconst el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };\nconst rand = n => Math.floor(Math.random() * n);\nconst pick = a => a[rand(a.length)];\nconst wait = ms => new Promise(r => setTimeout(r, ms));\nconst K = (r, c) => r + ',' + c;\nconst name = (r, c) => LETTERS[c] + (r + 1);\nconst cellsFor = (L, r, c, h) => Array.from({length:L}, (_, i) => h ? [r, c + i] : [r + i, c]);\nconst inB = (n, [r, c]) => r >= 0 && c >= 0 && r < n && c < n;\nconst reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;\nconst lenDots = L => { const s = el('span', 'len'); for (let i = 0; i < L; i++) s.append(el('i')); return s; };\n\nfunction applyTheme() { document.body.dataset.board = settings.theme; }\nfunction show(id) {\n  ['start','lobby','place','battle'].forEach(s => $('#scr-' + s).hidden = s !== id);\n  $('#homeBtn').hidden = id === 'start';\n  window.scrollTo(0, 0);\n}\n\n/* ---------- Network (Firebase Realtime Database) ---------- */\nfunction loadScript(src) {\n  return new Promise((res, rej) => {\n    const s = document.createElement('script'); s.src = src;\n    s.onload = res; s.onerror = () => rej(new Error('Kunne ikke laste ' + src));\n    document.head.append(s);\n  });\n}\nlet NET = null;\nasync function getNet() {\n  if (NET) return NET;\n  if (window.SLAGSKIP_TEST_NET) return (NET = window.SLAGSKIP_TEST_NET);\n  if (!FIREBASE_CONFIG) throw new Error('oppsett');\n  await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-app-compat.js`);\n  await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database-compat.js`);\n  const fb = window.firebase;\n  const app = fb.apps.length ? fb.app() : fb.initializeApp(FIREBASE_CONFIG);\n  const db = fb.database(app);\n  const R = code => db.ref('slagskip/' + code);\n  NET = {\n    async create(code, data) { const r = await R(code).transaction(cur => cur === null ? data : undefined); return r.committed; },\n    async get(code) { return (await R(code).get()).val(); },\n    update(code, patch) { return R(code).update(patch); },\n    remove(code) { return R(code).remove(); },\n    watch(code, cb) { const ref = R(code), h = s => cb(s.val()); ref.on('value', h); return () => ref.off('value', h); },\n    presence(code, role) {\n      const p = R(code).child('online/' + role), c = db.ref('.info/connected');\n      const h = s => { if (s.val()) { p.onDisconnect().remove(); p.set(true); } };\n      c.on('value', h);\n      return () => { c.off('value', h); p.onDisconnect().cancel(); p.remove(); };\n    },\n    now() { return fb.database.ServerValue.TIMESTAMP; }\n  };\n  return NET;\n}\nconst mpAvailable = () => !!(FIREBASE_CONFIG || window.SLAGSKIP_TEST_NET);\nconst joinUrl = code => location.href.split(/[?#]/)[0] + '?rom=' + code;\n\n/* ---------- Boards ---------- */\nfunction buildBoard(host, n, opt = {}) {\n  host.innerHTML = '';\n  host.className = 'board' + (opt.mini ? ' mini' : '');\n  host.style.setProperty('--n', n);\n  const cells = [], cols = [], rows = [];\n  if (!opt.mini) {\n    const lt = el('div', 'lt'), ll = el('div', 'll');\n    for (let i = 0; i < n; i++) {\n      const a = el('div', 'lbl', LETTERS[i]); lt.append(a); cols.push(a);\n      const b = el('div', 'lbl', String(i + 1)); ll.append(b); rows.push(b);\n    }\n    host.append(el('div', 'corner'), lt, ll);\n  }\n  const sea = el('div', 'sea' + (opt.cls ? ' ' + opt.cls : ''));\n  sea.style.setProperty('--n', n);\n  /* Each cell gets its own listeners. Touch taps act on pointerup, so they never depend on\n     the browser turning the tap into a click (some in-app web views drop those). */\n  let lastTouch = 0;\n  for (let r = 0; r < n; r++) {\n    cells.push([]);\n    for (let c = 0; c < n; c++) {\n      const d = el(opt.buttons ? 'button' : 'div', 'cell'); d.dataset.r = r; d.dataset.c = c;\n      if (opt.buttons) { d.type = 'button'; d.setAttribute('aria-label', name(r, c)); }\n      d.style.gridRow = r + 1; d.style.gridColumn = c + 1;\n      if (opt.onCell) {\n        d.addEventListener('pointerup', e => {\n          if (e.pointerType === 'mouse') return;\n          lastTouch = Date.now(); opt.onCell(r, c);\n        });\n        d.addEventListener('click', () => { if (Date.now() - lastTouch > 700) opt.onCell(r, c); });\n      }\n      sea.append(d); cells[r].push(d);\n    }\n  }\n  host.append(sea);\n  if (opt.onHover) {\n    const at = e => { const d = e.target.closest && e.target.closest('.cell'); return d ? [+d.dataset.r, +d.dataset.c] : [-1, -1]; };\n    sea.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') opt.onHover(...at(e)); });\n    sea.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') opt.onHover(-1, -1); });\n  }\n  return {host, sea, cells, cols, rows, n};\n}\n\n\nconst SHIPTYPE = {Hangarskip:'carrier', Slagskip:'battleship', Krysser:'cruiser', 'Ubåt':'sub', Jager:'destroyer', 'Patruljebåt':'destroyer'};\nfunction hullPath(W, t, b) {\n  const m = (t + b) / 2;\n  return `<path class=\"sh-hull\" d=\"M12 ${t + 5} Q12 ${t} 19 ${t} L${W - 75} ${t} Q${W - 24} ${t + 2} ${W - 6} ${m} Q${W - 24} ${b - 2} ${W - 75} ${b} L19 ${b} Q12 ${b} 12 ${b - 5} Z\"/>`;\n}\nfunction turret(x, y, r, dir) {\n  const len = r * 2.4, bx = dir > 0 ? x : x - len;\n  return `<rect class=\"sh-det\" x=\"${bx}\" y=\"${y - 2.5}\" width=\"${len}\" height=\"5\" rx=\"2\"/><circle class=\"sh-det\" cx=\"${x}\" cy=\"${y}\" r=\"${r}\"/>`;\n}\nfunction shipBody(type, W) {\n  switch (type) {\n    case 'carrier': return hullPath(W, 12, 88) +\n      `<rect class=\"sh-deck\" x=\"24\" y=\"20\" width=\"${W - 105}\" height=\"60\" rx=\"7\"/>` +\n      `<line class=\"sh-dash\" x1=\"44\" y1=\"50\" x2=\"${W - 100}\" y2=\"50\"/>` +\n      `<rect class=\"sh-det\" x=\"${W - 220}\" y=\"8\" width=\"70\" height=\"24\" rx=\"5\"/>`;\n    case 'battleship': return hullPath(W, 16, 84) +\n      `<rect class=\"sh-deck\" x=\"28\" y=\"26\" width=\"${W - 105}\" height=\"48\" rx=\"12\"/>` +\n      `<rect class=\"sh-det\" x=\"${W / 2 - 60}\" y=\"33\" width=\"100\" height=\"34\" rx=\"6\"/><rect class=\"sh-hull\" x=\"${W / 2 - 38}\" y=\"40\" width=\"26\" height=\"20\" rx=\"5\"/>` +\n      turret(W - 100, 50, 15, 1) + turret(W - 152, 50, 15, 1) + turret(76, 50, 15, -1);\n    case 'cruiser': return hullPath(W, 18, 82) +\n      `<rect class=\"sh-deck\" x=\"28\" y=\"28\" width=\"${W - 105}\" height=\"44\" rx=\"11\"/>` +\n      `<rect class=\"sh-det\" x=\"${W / 2 - 42}\" y=\"35\" width=\"74\" height=\"30\" rx=\"6\"/>` +\n      turret(W - 92, 50, 14, 1) + turret(70, 50, 14, -1);\n    case 'sub': return `<rect class=\"sh-hull\" x=\"10\" y=\"26\" width=\"${W - 20}\" height=\"48\" rx=\"24\"/>` +\n      `<rect class=\"sh-det\" x=\"${W / 2 - 12}\" y=\"35\" width=\"52\" height=\"30\" rx=\"11\"/>` +\n      `<rect class=\"sh-det\" x=\"20\" y=\"44\" width=\"26\" height=\"12\" rx=\"4\"/>`;\n    default: return hullPath(W, 22, 78) +\n      `<rect class=\"sh-deck\" x=\"26\" y=\"31\" width=\"${W - 95}\" height=\"38\" rx=\"10\"/>` +\n      `<rect class=\"sh-det\" x=\"${W / 2 - 32}\" y=\"37\" width=\"42\" height=\"26\" rx=\"5\"/>` +\n      turret(W - 64, 50, 12, 1);\n  }\n}\nfunction shipSVG(type, L, h) {\n  const W = L * 100, body = shipBody(type, W);\n  return h ? `<svg viewBox=\"0 0 ${W} 100\" preserveAspectRatio=\"none\" aria-hidden=\"true\">${body}<\u002Fsvg>`\n           : `<svg viewBox=\"0 0 100 ${W}\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><g transform=\"translate(100,0) rotate(90)\">${body}<\u002Fg><\u002Fsvg>`;\n}\nfunction shipEl(s, extra) {\n  const g = el('div', 'ship-g' + (extra ? ' ' + extra : ''));\n  const [r, c] = s.cells[0];\n  g.style.gridRow = s.horiz ? `${r + 1}` : `${r + 1} / span ${s.len}`;\n  g.style.gridColumn = s.horiz ? `${c + 1} / span ${s.len}` : `${c + 1}`;\n  g.innerHTML = shipSVG(SHIPTYPE[s.name] || 'destroyer', s.len, s.horiz);\n  return g;\n}\nfunction render(board, fleet, showShips, fresh, picked) {\n  const n = fleet.size, info = {};\n  board.sea.querySelectorAll('.ship-g').forEach(x => x.remove());\n  fleet.ships.forEach(s => {\n    const sunk , 'cell ' + (map[K(r, c)] || '')); d.style.gridRow = r + 1; d.style.gridColumn = c + 1; s.append(d);\n  }\n  s.append(shipEl({name:'Krysser', len:3, horiz:true, cells:[[0,0],[0,1],[0,2]]}));\n  wrap.append(s); return wrap;\n}\nfunction seg(sel, items, cur, set) {\n  const w = $(sel); w.innerHTML = '';\n  items.forEach(it => {\n    const b = el('button', 'opt'); b.type = 'button';\n    b.setAttribute('aria-pressed', it.v === cur);\n    b.append(el('b', null, it.t), el('small', null, it.s));\n    b.onclick = () => { set(it.v); save(); w.querySelectorAll('.opt').forEach(x => x.setAttribute('aria-pressed', x === b)); };\n    w.append(b);\n  });\n}\nfunction buildStart() {\n  const tw = $('#themes'); tw.innerHTML = '';\n  THEMES.forEach(t => {\n    const b = el('button', 'sw'); b.type = 'button';\n    b.setAttribute('aria-pressed', settings.theme === t.id);\n    b.append(miniSea(t.id), el('span', 'sw-name', t.name));\n    b.onclick = () => {\n      settings.theme = t.id; applyTheme(); save();\n      tw.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', x === b));\n    };\n    tw.append(b);\n  });\n  seg('#sizes', SIZES, settings.size, v => settings.size = v);\n  seg('#levels', LEVELS, settings.level, v => settings.level = v);\n  setMode(settings.mode === 'friend' ? 'friend' : 'bot');\n}\nfunction friendNote(t, warn) { const n = $('#friendNote'); n.textContent = t; n.className = 'note' + (warn ? ' warn' : ''); }\nfunction setMode(m) {\n  settings.mode = m; save();\n  const f = m === 'friend';\n  $('#modeBot').setAttribute('aria-pressed', !f);\n  $('#modeFriend').setAttribute('aria-pressed', f);\n  $('#levelField').hidden = f; $('#toPlace').hidden = f;\n  $('#joinField').hidden = !f; $('#hostBtn').hidden = !f;\n  $('#sizeLabel').textContent = f ? 'Størrelse (den som lager spillet, bestemmer)' : 'Størrelse';\n  const off = f && !mpAvailable();\n  $('#hostBtn').disabled = off; $('#joinBtn').disabled = off; $('#joinCode').disabled = off;\n  friendNote(off ? ' null, String(r + 1)));\n  $('#launch').classList.toggle('ready', G.turn === 'you' && r != null && c != null);\n}\nfunction renderBattle(freshAi, freshMe) {\n  render(G.enemy, G.ai, false, freshAi);\n  render(G.mine, G.me, true, freshMe);\n  updateAim();\n  const f = $('#enemyFleet'); f.innerHTML = '';\n  G.spec.forEach(sp => {\n    const gone = G.ai.ships.some(s => s.name === sp.n && s.hits.size === s.len);\n    const span = el('span', gone ? 'gone' : null);\n    span.append(el('span', null, sp.n), lenDots(sp.l)); f.append(span);\n  });\n}\nfunction setTurn(t) {\n  const prev = G.turn; G.turn = t;\n  if (t === 'you' && prev !== 'you' && !G.over) flash('Din tur');\n  const you = t === 'you';\n  $('#turnPill').classList.toggle('bot', !you);\n  $('#turnTxt').textContent = you ? 'Din tur' : t === 'bot' ? 'Boten sikter …' : t === 'wait' ? 'Motstanderen sikter …' : 'Rakett i lufta …';\n  $('#launch').disabled = !you;\n  document.querySelectorAll('.key').forEach(k => k.disabled = !you);\n  updateAim();\n}\nfunction setMsg(t, hit) { const m = $('#msg'); m.textContent = t; m.className = 'msg' + (hit ? ' hit' : ''); if (t) { void m.offsetWidth; m.classList.add('pop'); } }\nfunction flash(t, hit) { if (reduced) return; const f = $('#turnFlash'); f.firstElementChild.textContent = t; f.className = 'turnflash' + (hit ? ' hit' : ''); void f.offsetWidth; f.classList.add('go'); }\nfunction countUp(e, to, suf = '') { if (reduced || !to) { e.textContent = to + suf; return; } const t0 = performance.now(); const step = t => { const k = Math.min(1, (t - t0) / 800); e.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))) + suf; if (k < 1) requestAnimationFrame(step); }; e.textContent = '0' + suf; setTimeout(() => requestAnimationFrame(step), 450); }\nfunction logShot(who, r, c, res, hit) {\n  const li = el('li');\n  li.append(el('span', null, who), el('b', null, name(r, c)), el('span', hit ? 'r-hit' : null, res));\n  $('#log').prepend(li);\n}\nfunction aimProblem() {\n  const {r, c} = G.aim;\n  if (c == null && r == null) return 'Velg en bokstav (bortover) og et tall (nedover).';\n  if (c == null) return 'Velg en bokstav også. Den viser hvor langt bortover.';\n  if (r == null) return 'Velg et tall også. Det viser hvor langt nedover.';\n  if (G.ai.shots.has(K(r, c))) return `Du har allerede skutt på ${name(r, c)}. Velg en ny rute.`;\n  return '';\n}\nfunction myResultMsg(r, c, hit, sunk) {\n  if (sunk) { flash('Senket!', true); setMsg(`Treff! Du senket ${sunk.def}.`, true); logShot('Du', r, c, `senket ${sunk.def}`, true); }\n  else if (hit) { setMsg(`Treff på ${name(r, c)}!`, true); logShot('Du', r, c, 'treff', true); }\n  else { setMsg(`Bom på ${name(r, c)}. Bare vann der.`); logShot('Du', r, c, 'bom'); }\n}\nfunction theirResultMsg(who, r, c, res) {\n  if (res.sunk) { setMsg(`${who} senket ${res.sunk.def} din!`, true); logShot(who, r, c, `senket ${res.sunk.def}`, true); }\n  else if (res.hit) { setMsg(`${who} traff ${name(r, c)}.`, true); logShot(who, r, c, 'treff', true); }\n  else { setMsg(`${who} bommet på ${name(r, c)}. Din tur!`); logShot(who, r, c, 'bom'); }\n}\n\nasync function playerFire() {\n  if (!G || G.turn !== 'you' || G.over) return;\n  const problem = aimProblem();\n  if (problem) { setMsg(problem); return; }\n  if (G.remote) return mpFire();\n  const {r, c} = G.aim;\n  setTurn('busy'); setMsg(`Skyter mot ${name(r, c)} …`);\n  sfx.launch();\n  await rocketTo(G.enemy.cells[r][c], false);\n  const res = shoot(G.ai, r, c);\n  G.stats.shots++;\n  impact(G.enemy, r, c, res.hit);\n  if (res.hit) G.stats.hits++;\n  G.aim = {r: null, c: null};\n  renderBattle(K(r, c));\n  myResultMsg(r, c, res.hit, res.sunk);\n  if (res.all) { await wait(900); return endGame(true); }\n  await wait(1000);\n  botTurn();\n}\n\nasync function botTurn() {\n  setTurn('bot');\n  await wait(650);\n  const [r, c] = botPick();\n  $('#turnTxt').textContent = `Boten skyter på ${name(r, c)}`;\n  sfx.launch();\n  await rocketTo(G.mine.cells[r][c], true);\n  const res =  room = await net.get(code); } catch (e) { friendNote(netErr(e), true); return; }\n  if (!room) { friendNote(`Fant ikke noe spill med koden ${code}. Sjekk at du har skrevet riktig.`, true); return; }\n  const saved = store.get();\n  if (saved && saved.code === code && room.state !== 'over') { friendNote(''); return mpResume(saved); }\n  if (room.state !== 'lobby' || (room.guest && room.guest.joined)) { friendNote('Det spillet har allerede to spillere. Be om en ny kode.', true); return; }\n  try { await net.update(code, {'guest/joined': true, state: 'placing'}); }\n  catch (e) { friendNote(netErr(e), true); return; }\n  friendNote('');\n  mpConnect(code, 'guest');\n}\n\nfunction mpConnect(code, role, keepSaved) {\n  mpLeave(false);\n  MP = {code, role, opp: role === 'host' ? 'guest' : 'host', room: null, round: null, phase: 'connecting',\n    handled: new Set(), seen: new Set(), pending: null, myShips: null, anim: Promise.resolve(), offTimer: 0};\n  if (!keepSaved) store.set({code, role});\n  MP.unpresence = NET.presence(code, role);\n  MP.unwatch = NET.watch(code, room => onRoom(room));\n  $('#resumeBtn').hidden = true;\n}\n\nfunction mpLeave(tellOpponent) {\n  if (!MP) return;\n  const m = MP; MP = null;\n  clearTimeout(m.offTimer);\n  if (tellOpponent && m.room && m.room.state !== 'lobby') NET.update(m.code, {[`${m.role}/left`]: true}).catch(() => {});\n  try { m.unwatch && m.unwatch(); } catch (e) {}\n  try { m.unpresence && m.unpresence(); } catch (e) {}\n  if (m.role === 'host' && m.room && m.room.state === 'lobby') NET.remove(m.code).catch(() => {});\n  if (tellOpponent !== false) store.clear();\n  banner('');\n}\n\nfunction mpGone(text) {\n  mpLeave(true);\n  G = null; $('#endOverlay').hidden = true;\n  show('start'); setMode('friend'); friendNote(text, true);\n}\n\nasync function showLobby(code) {\n  MP.phase = 'lobby';\n  show('lobby');\n  $('#lobbyCode').textContent = code;\n  const qr = $('#qr'); qr.textContent = 'Laster QR-kode …';\n  try {\n    if (!win t.ready && room.guest && room.guest.ready)\n      NET.update(MP.code, {state: 'battle', turn: room.starter || 'host'}).catch(() => {});\n    return;\n  }\n  if (room.state === 'battle' || room.state === 'over') {\n    if (MP.phase !== 'battle' || MP.round !== room.round) { if (!enterBattle(room)) return; }\n    syncBattle(room);\n  }\n}\n\nfunction enterPlacing(room) {\n  MP.phase = 'placing'; MP.round = room.round;\n  MP.handled = new Set(); MP.seen = new Set(); MP.myShips = null; MP.pending = null;\n  $('#endOverlay').hidden = true; G = null;\n  const saved = store.get() || {};\n  const restore = saved.round === room.round ? unpackShips(room.size, saved.ships) : null;\n  const meReady = room[MP.role] && room[MP.role].ready;\n  startPlacement(room.size, restore);\n  if (meReady && restore) { P.locked = true; MP.myShips = restore; renderPlace(); hint(); }\n  else if (meReady) NET.update(MP.code, {[`${MP.role}/ready`]: false}).catch(() => {});\n  if (!restore) store.set({code: MP.code, role: MP.role, round: room.round});\n}\n\nasync function mpReady() {\n  if (!P || P.locked || P.placed.some(s => !s)) return;\n  ac();\n  P.locked = true; MP.myShips = P.placed;\n  store.set({code: MP.code, role: MP.role, round: MP.round, ships: packShips(P.placed)});\n  renderPlace(); hint();\n  try { await NET.update(MP.code, {[`${MP.role}/ready`]: true}); }\n  catch (e) { P.locked = false; renderPlace(); note('Fikk ikke kontakt. Sjekk nettet og trykk på nytt.', true); }\n}\n\nfunction enterBattle(room) {\n  const saved = store.get() || {};\n  const ships = MP.myShips && MP.round === room.round ? MP.myShips\n    : saved.round === room.round ? unpackShips(room.size, saved.ships) : null;\n  if (!ships) { mpGone('Skipene dine er ikke lagret på denne enheten, så spillet kan ikke fortsette.'); return false; }\n  MP.phase = 'battle'; MP.round = room.round; MP.myShips = ships;\n  MP.handled = new Set(); MP.seen = new Set();\n  startBattle(room.size, ships);\n  const shots = room.shots ? Object.keys(room.shots).length : 0;\n  if (!shots) setMsg(room.turn === MP.role ? 'Du starter! Velg en bokstav og et tall.' : 'Motstanderen starter. Følg med på flåten din.');\n  return true;\n}\n\nfunction syncBattle(room) {\n  const shots = room.shots || {};\n  for (const k of Object.keys(shots).sort()) {\n    const s = shots[k];\n    if (s.by === MP.opp) {\n      if (MP.handled.has(k)) continue;\n      MP.handled.add(k);\n      if (s.res == null) resolveIncoming(k, s);\n      else { /* already answered earlier, e.g. after reloading the page */\n        const res = shoot(G.me, s.r, s.c);\n        theirResultMsg('Motstanderen', s.r, s.c, res); renderBattle();\n      }\n    } else if (s.by === MP.role) {\n      if (s.res == null || MP.seen.has(k)) continue;\n      MP.seen.add(k);\n      if (MP.pending && MP.pending.key === k) MP.pending.resolve(s);\n      else applyMine(s, false);\n    }\n  }\n  queue(async () => {\n    refreshTurn();\n    if (MP && G && !G.over && MP.room.state === 'over') { await wait(500); endGame(MP.room.winner === MP.role); }\n  });\n}\n\nfunction resolveIncoming(k, s) {\n  const res = shoot(G.me, s.r, s.c);\n  const patch = {[`shots/${k}/res`]: res.hit ? 'hit' : 'miss'};\n  if (res.sunk) patch[`shots/${k}/sunk`] = {n: res.sunk.name, r: res.sunk.cells[0][0], c: res.sunk.cells[0][1], h: res.sunk.horiz};\n  if (res.all) { patch.state = 'over'; patch.winner = MP.opp; } else patch.turn = MP.role;\n  NET.update(MP.code, patch).catch(() => banner('Fikk ikke sendt svaret. Sjekk nettet.'));\n  queue(async () => {\n    setTurn('wait'); $('#turnTxt').textContent = `Motstanderen skyter på ${name(s.r, s.c)}`;\n    sfx.launch();\n    await rocketTo(G.mine.cells[s.r][s.c], true);\n    impact(G.mine, s.r, s.c, res.hit, true);\n    renderBattle(null, K(s.r, s.c));\n    theirResultMsg('Motstanderen', s.r, s.c, res);\n    await wait(550);\n  });\n}\n\nfunction applyMine(s, live) {\n  const {r, c} = s, hit = s.res === 'hit';\n  G.ai.shots.set(K(r, c), hit ? 'hit' : 'miss');\n  G.stats.shots++; if (hit) G.stats.hits++;\n  let sunk = null;\n  if (s.sunk) {\n    const sp = G.spec.find(x => x.n === s.sunk.n);\n    if (sp) {\n      sunk = mkShip(sp, cellsFor(sp.l, s.sunk.r, s.sunk.c, s.sunk.h), s.sunk.h);\n      sunk.cells.forEach(([a, b]) => sunk.hits.add(K(a, b)));\n      G.ai.ships.push(sunk);\n    }\n  }\n  if (live) { impact(G.enemy, r, c, hit); G.aim = {r: null, c: null}; }\n  renderBattle(live ? K(r, c) : null);\n  myResultMsg(r, c, hit, sunk);\n}\n\nasync function mpFire() {\n  const room = MP.room;\n  if (!room || room.state !== 'battle' || room.turn !== MP.role || G.firing) return;\n  const {r, c} = G.aim;\n  const key = 's' + String(Object.keys(room.shots || {}).length).padStart(3, '0');\n  G.firing = true; setTurn('busy'); setMsg(`Skyter mot ${name(r, c)} …`);\n  const result = new Promise(res => { MP.pending = {key, resolve: res}; });\n  try { await NET.update(MP.code, {[`shots/${key}`]: {by: MP.role, r, c}}); }\n  catch (e) { MP.pending = null; G.firing = false; setMsg('Fikk ikke sendt skuddet. Sjekk nettet og prøv igjen.'); refreshTurn(); return; }\n  const m = MP;\n  queue(async () => {\n    sfx.launch();\n    const [s] = await Promise.all([result, rocketTo(G.enemy.cells[r][c], false)]);\n    if (MP !== m || !G) return;\n    MP.pending = null;\n    applyMine(s, true);\n    G.firing = false;\n    await wait(700);\n  });\n}\n\nfunction refreshTurn() {\n  if (!MP || !G || G.over || !MP.room || MP.room.state !== 'battle') return;\n  const room = MP.room;\n  const waitingAnswer = Object.values(room.shots || {}).some(s => s.res == null);\n  if (room.turn === MP.role && !waitingAnswer && !G.firing) setTurn('you');\n  else setTurn(room.turn === MP.role ? 'busy' : 'wait');\n}\n\nasync function mpRematch() {\n  const room = MP && MP.room; if (!room) return;\n  const starter = room.starter === 'host' ? 'guest' : 'host';\n  $('#againBtn').disabled = true;\n  try {\n    await NET.update(MP.code, {state: 'placing', round: (room.round || 1) + 1, shots: null, winner: null,\n      starter, turn: starter, 'host/ready': false, 'guest/ready': false});\n  } catch (e) { $('#againBtn').disabled = false; $('#endPctTxt').textContent = 'Fikk ikke kontakt. Prøv igjen.'; }\n}\n\nasync function mpResume(saved) {\n  if (!saved || !saved.code) return;\n  ac();\n  let net; try { net = await getNet(); } catch (e) { friendNote(netErr(e), true); return; }\n  let room; try { room = await net.get(saved.code); } catch (e) { setMode('friend'); friendNote(netErr(e), true); return; }\n  if (!room || room.state === 'over' || (room[saved.role] || {}).left || ((room[saved.role === 'host' ? 'guest' : 'host'] || {}).left)) {\n    store.clear(); $('#resumeBtn').hidden = true; setMode('friend'); friendNote(`Spillet ${saved.code} er avsluttet.`, true); return;\n  }\n  mpConnect(saved.code, saved.role, true);\n  if (room.state === 'lobby' && saved.role === 'host') showLobby(saved.code);\n}\n$('#resumeBtn').onclick = () => mpResume(store.get());\n\n/* ---------- Bot brain ---------- */\nfunction botPick() {\n  const n = G.n, shots = G.me.shots, free = [];\n  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (!shots.has(K(r, c))) free.push([r, c]);\n  if (settings.level === 'lett') return pick(free);\n  if (settings.level === 'middels') {\n    const t = targetCands(); if (t.length) return pick(t);\n    const par = free.filter(([r, c]) => (r + c) % 2 === 0);\n    return pick(par.length ? par : free);\n  }\n  return densityPick() || pick(free);\n}\nfunction targetCands() {\n  const n = G.n, shots = G.me.shots, U = G.unres;\n  const has = (r, c) => U.some(([a, b]) => a === r && b === c);\n  const ok = (r, c) => inB(n, [r, c]) && !shots.has(K(r, c));\n  const line = [];\n  for (const [r, c] of U) for (const [dr, dc] of [[0, 1], [1, 0]]) {\n    if (!(has(r + dr, c + dc) || has(r - dr, c - dc))) continue;\n    let a = r, b = c; while (has(a, b)) { a += dr; b += dc; } if (ok(a, b)) line.push([a, b]);\n    a = r; b = c; while (has(a, b)) { a -= dr; b -= dc; } if (ok(a, b)) line.push([a, b]);\n  }\n  if (line.length) return line;\n  const nb = [];\n  for (const [r, c] of U) for (const [dr, dc] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) if (ok(r + dr, c + dc)) nb.push([r + dr, c + dc]);\n  return nb;\n}\nfunction densityPick() {\n  const n = G.n, shots = G.me.shots, U = G.unres;\n  const isU = (r, c) => U.some(([a, b]) => a === r && b === c);\n  const blocked = (r, c) => shots.has(K(r, c)) && !isU(r, c);\n  const lens = G.me.ships.filter(s => s.hits.size < s.len).map(s => s.len);\n  const score = Array.from({length: n}, () => Array(n).fill(0));\n  for (const L of lens) for (const h of [true, false]) for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {\n    const cells = cellsFor(L, r, c, h);\n    if (!cells.every(p => inB(n, p)) || cells.some(([a, b]) => blocked(a, b))) continue;\n    const hc = cells.filter(([a, b]) => isU(a, b)).length;\n    const w = U.length ? (hc ? hc * hc * 10 : 0) : 1;\n    if (!w) continue;\n    for (const [a, b] of cells) if (!shots.has(K(a, b))) score[a][b] += w;\n  }\n  let best = 0, opts = [];\n  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {\n    if (score[r][c] > best) { best = score[r][c]; opts = [[r, c]]; }\n    else if (score[r][c] === best && best > 0) opts.push([r, c]);\n  }\n  if (opts.length) return pick(opts);\n  const t = targetCands(); return t.length ? pick(t) : null;\n}\n\n/* ---------- End ---------- */\nfunction endGame(won) {\n  G.over = true; setTurn('busy');\n  $('#turnTxt').textContent = won ? 'Seier!' : 'Kampen er over';\n  const {shots, hits} = G.stats, pct = shots ? Math.round(hits / shots * 100) : 0;\n  const foe = G.remote ? 'Motstanderen' : 'Boten';\n  $('#endTitle').textContent = won ? 'Du vant!' : `${foe} vant`;\n  $('#endSub').textContent = won ? 'Hele fiendens flåte ligger på havbunnen.' : `${foe} senket flåten din. Prøv igjen!`;\n  countUp($('#stShots'), shots); countUp($('#stHits'), hits); countUp($('#stPct'), pct, ' %');\n  $('#endOverlay').dataset.won = won;\n  $('#endPctTxt').textContent = `${hits} treff av ${shots} skudd er ${pct} prosent.`;\n  const left = G.remote && MP && MP.room && (MP.room[MP.opp] || {}).left;\n  $('#againBtn').disabled = !!left;\n  $('#againBtn').textContent = G.remote ? 'Spill igjen mot samme venn' : 'Spill igjen';\n  $('#endOverlay').hidden = false;\n  won ? sfx.win() : sfx.lose();\n  if (won) for (let i = 0; i < 4; i++) setTimeout(() => {\n    explosion(innerWidth * (.2 + Math.random() * .6), innerHeight * (.2 + Math.random() * .3), 40);\n  }, i * 260);\n}\n$('#againBtn').onclick = () => {\n  if (G && G.remote) { mpRematch(); return; }\n  const n = G ? G.n : settings.size;\n  $('#endOverlay').hidden = true; startPlacement(n);\n};\n$('#menuBtn').onclick = () => { if (MP) mpLeave(true); $('#endOverlay').hidden = true; G = null; show('start'); };\n$('#launch').onclick = () => playerFire();\n\nlet homeArm = 0;\n$('#homeBtn').onclick = () => {\n  const busy = (!$('#scr-battle').hidden && G && !G.over) || (MP && !$('#scr-place').hidden);\n  if (busy && Date.now() - homeArm > 3000) {\n    homeArm = Date.now(); $('#homeBtn').textContent = 'Avslutte? Trykk igjen';\n    setTimeout(() => $('#homeBtn').textContent = 'Meny', 3000); return;\n  }\n  $('#homeBtn').textContent = 'Meny';\n  if (MP) mpLeave(true);\n  G = null; show('start');\n};\n\n/* Physical keyboard */\ndocument.addEventListener('keydown', e => {\n  if (!G || $('#scr-battle').hidden || G.turn !== 'you' || e.metaKey || e.ctrlKey || e.altKey) return;\n  const k = e.key;\n  if (k === 'Enter') { e.preventDefault(); playerFire(); return; }\n  if (k === 'Backspace' || k === 'Escape') { G.aim = {r: null, c: null}; updateAim(); return; }\n  if (/^[a-zæøå]$/i.test(k)) {\n    const i = LETTERS.indexOf(k.toUpperCase());\n    if (i < 0 || i >= G.n) { setMsg(`${k.toUpperCase()} er ikke på brettet. Bokstavene går fra A til ${LETTERS[G.n - 1]}.`); return; }\n    G.aim.c = i; sfx.tick(); updateAim(); return;\n  }\n  if (/^[0-9]$/.test(k)) {\n    if (k === '0' && G.n >= 10 && G.aim.r === 0) { G.aim.r = 9; updateAim(); return; }\n    const d = +k;\n    if (d < 1 || d > G.n) { setMsg(`Tallene går fra 1 til ${G.n}.`); return; }\n    G.aim.r = d - 1; sfx.tick(); updateAim();\n  }\n});\n\n/* ---------- Effects ---------- */\nconst cv = $('#fx'), cx = cv.getContext('2d');\nlet parts = [], rockets = [], raf = 0, last = 0;\nfunction fit() { const d = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * d; cv.height = innerHeight * d; cx.setTransform(d, 0, 0, d, 0, 0); }\naddEventListener('resize', fit); fit();\nconst cssVar = v => getComputedStyle(document.body).getPropertyValue(v).trim() || '#fff';\nfunction kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }\nconst ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;\n\nfunction rocketTo(target, fromTop) {\n  return new Promise(done => {\n    if (reduced) { setTimeout(done, 150); return; }\n    const b = target.getBoundingClientRect();\n    const tx = b.left + b.width / 2, ty = b.top + b.height / 2;\n    const sx = fromTop ? innerWidth + 40 : -40, sy = fromTop ? -40 : innerHeight * .9;\n    const cxp = (sx + tx) / 2 + (fromTop ? 0 : innerWidth * .1), cyp = Math.min(sy, ty) - innerHeight * (fromTop ? .05 : .35);\n    let fin = false; const once = () => { if (!fin) { fin = true; done(); } };\n    setTimeout(once, 1300);\n    rockets.push({t0: performance.now(), dur: 850, p: [sx, sy, cxp, cyp, tx, ty], done: once, s: Math.max(.8, Math.min(1.35, innerWidth / 600))});\n    kick();\n  });\n}\nfunction drawRocket(x, y, ang, s, t) {\n  cx.save(); cx.translate(x, y); cx.rotate(ang); cx.scale(s, s);\n  const fl = 10 + Math.sin(t / 30) * 4;\n  cx.fillStyle = '#ffb02e'; cx.beginPath(); cx.moveTo(-12, -4); cx.lineTo(-12 - fl, 0); cx.lineTo(-12, 4); cx.fill();\n  cx.fillStyle = '#fff3b0'; cx.beginPath(); cx.moveTo(-12, -2); cx.lineTo(-12 - fl * .55, 0); cx.lineTo(-12, 2); cx.fill();\n  cx.fillStyle = '#e0282e';\n  cx.beginPath(); cx.moveTo(-12, -4); cx.lineTo(-17, -9); cx.lineTo(-6, -4); cx.fill();\n  cx.beginPath(); cx.moveTo(-12, 4); cx.lineTo(-17, 9); cx.lineTo(-6, 4); cx.fill();\n  cx.fillStyle = '#f4f6f8'; cx.strokeStyle = 'rgba(0,0,0,.35)'; cx.lineWidth = 1;\n  cx.beginPath(); cx.moveTo(-12, -4.5); cx.lineTo(8, -4.5); cx.quadraticCurveTo(18, 0, 8, 4.5); cx.lineTo(-12, 4.5); cx.closePath(); cx.fill(); cx.stroke();\n  cx.fillStyle = '#e0282e'; cx.beginPath(); cx.moveTo(8, -4.5); cx.quadraticCurveTo(18, 0, 8, 4.5); cx.closePath(); cx.fill();\n  cx.restore();\n}\nfunction loop(t) {\n  const dt = Math.min(48, t - last) / 16.67; last = t;\n  cx.clearRect(0, 0, innerWidth, innerHeight);\n  rockets = rockets.filter(rk => {\n    const k = Math.min(1, (t - rk.t0) / rk.dur), e = ease(k), [x0, y0, x1, y1, x2, y2] = rk.p, u = 1 - e;\n    const x = u * u * x0 + 2 * u * e * x1 + e * e * x2, y = u * u * y0 + 2 * u * e * y1 + e * e * y2;\n    const dx = 2 * u * (x1 - x0) + 2 * e * (x2 - x1), dy = 2 * u * (y1 - y0) + 2 * e * (y2 - y1);\n    const ang = Math.atan2(dy, dx);\n    parts.push({type: 'smoke', x: x - Math.cos(ang) * 16 * rk.s, y: y - Math.sin(ang) * 16 * rk.s, vx: (Math.random() - .5) * .4, vy: (Math.random() - .5) * .4, r: 3 * rk.s, gr: .25, life: 26, age: 0, col: 'rgba(190,196,206,.55)'});\n    drawRocket(x, y, ang, rk.s, t);\n    if (k >= 1) { rk.done(); return false; }\n    return true;\n  });\n  parts = parts.filter(p => {\n    if (p.delay > 0) { p.delay -= dt; return true; }\n    p.age += dt; if (p.age >= p.life) return false;\n    const a = 1 - p.age / p.life;\n    p.x += (p.vx || 0) * dt; p.y += (p.vy || 0) * dt; p.vy = (p.vy || 0) + (p.g || 0) * dt;\n    cx.globalAlpha = Math.max(0, a);\n    if (p.type === 'ring') {\n      const r = p.r0 + (p.r1 - p.r0) * (1 - Math.pow(a, 2));\n      cx.strokeStyle = p.col; cx.lineWidth = p.w * a + .5; cx.beginPath(); cx.arc(p.x, p.y, r, 0, Math.PI * 2); cx.stroke();\n    } else {\n      if (p.gr) p.r += p.gr * dt;\n      cx.fillStyle = p.col; cx.beginPath(); cx.arc(p.x, p.y, Math.max(.5, p.r), 0, Math.PI * 2); cx.fill();\n    }\n    cx.globalAlpha = 1;\n    return true;\n  });\n  if (rockets.length || parts.length) raf = requestAnimationFrame(loop);\n  else { raf = 0; cx.clearRect(0, 0, innerWidth, innerHeight); }\n}\nfunction splash(x, y, s) {\n  const col = cssVar('--splash'), k = s / 30;\n  parts.push({type: 'ring', x, y, r0: s * .15, r1: s * 1.1, w: 3, life: 30, age: 0, col});\n  parts.push({type: 'ring', x, y, r0: s * .1, r1: s * .8, w: 2, life: 28, age: 0, delay: 7, col});\n  if (reduced) return kick();\n  for (let i = 0; i < 16; i++) {\n    const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, sp = (1.5 + Math.random() * 3.2) * k;\n    parts.push({type: 'dot', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 1.4, g: .2 * k, r: (1.2 + Math.random() * 2) * k * 1.2, life: 34 + rand(14), age: 0, col});\n  }\n  for (let i = 0; i < 5; i++) parts.push({type: 'dot', x: x + (Math.random() - .5) * 6 * k, y, vx: 0, vy: -(4 + Math.random() * 2) * k, g: .24 * k, r: 2.6 * k, life: 32, age: 0, col});\n  kick();\n}\nfunction explosion(x, y, s) {\n  const k = s / 30;\n  parts.push({type: 'dot', x, y, r: s * .55, gr: 1.2 * k, life: 12, age: 0, col: '#fff3c4'});\n  parts.push({type: 'ring', x, y, r0: s * .2, r1: s * 1.5, w: 4, life: 22, age: 0, col: '#ff8a1f'});\n  if (reduced) return kick();\n  const cols = ['#ffd23f', '#ff8a1f', '#e8392b', '#fff3c4'];\n  for (let i = 0; i < 26; i++) {\n    const a = Math.random() * Math.PI * 2, sp = (1.5 + Math.random() * 4.5) * k;\n    parts.push({type: 'dot', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1 * k, g: .09 * k, r: (1 + Math.random() * 2.4) * k * 1.2, life: 26 + rand(18), age: 0, col: pick(cols)});\n  }\n  for (let i = 0; i < 8; i++) parts.push({type: 'smoke', x: x + (Math.random() - .5) * 10 * k, y, vx: (Math.random() - .5) * .8 * k, vy: -(.4 + Math.random() * .8) * k, r: 4 * k, gr: .35 * k, life: 50 + rand(20), age: 0, col: 'rgba(90,94,104,.45)'});\n  kick();\n}\nfunction impact(board, r, c, hit, small) {\n  const b = board.cells[r][c].getBoundingClientRect();\n  const x = b.left + b.width / 2, y = b.top + b.height / 2, s = Math.max(small ? 18 : 26, b.width * (small ? 1.6 : 1.2));\n  if (hit) {\n    explosion(x, y, s); sfx.boom();\n    if (!reduced) { board.sea.classList.remove('shake'); void board.sea.offsetWidth; board.sea.classList.add('shake'); }\n  } else { splash(x, y, s); sfx.splash(); }\n}\n\n/* ---------- Sound (generated, no files) ---------- */\nlet AC = null;\nfunction ac() {\n  if (!settings.sound) return null;\n  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume().catch(() => {}); return AC; } catch (e) { return null; }\n}\nfunction noise(ctx, dur) {\n  const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate), d = b.getChannelData(0);\n  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;\n  const s = ctx.createBufferSource(); s.buffer = b; return s;\n}\nfunction env(g, t, a, peak, dec) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + dec); }\nfunction tone(ctx, type, f0, f1, t, dur, vol) {\n  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;\n  o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);\n  env(g, t, .01, vol, dur); chain(o, g, ctx.destination); o.start(t); o.stop(t + dur + .05);\n}\nfunction chain(...nodes) { for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]); }\nconst sfx = {\n  tick() { const c = ac(); if (c) tone(c, 'sine', 880, 0, c.currentTime, .05, .05); },\n  launch() {\n    const c = ac(); if (!c) return; const t = c.currentTime, n = noise(c, .9), f = c.createBiquadFilter(), g = c.createGain();\n    f.type = 'bandpass'; f.Q.value = 1.4; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2400, t + .8);\n    env(g, t, .08, .22, .75); chain(n, f, g, c.destination); n.start(t);\n  },\n  splash() {\n    const c = ac(); if (!c) return; const t = c.currentTime, n = noise(c, .7), f = c.createBiquadFilter(), g = c.createGain();\n    f.type = 'lowpass'; f.frequency.setValueAtTime(1800, t); f.frequency.exponentialRampToValueAtTime(400, t + .6);\n    env(g, t, .01, .45, .55); chain(n, f, g, c.destination); n.start(t);\n    tone(c, 'sine', 650, 180, t, .16, .18);\n  },\n  boom() {\n    const c = ac(); if (!c) return; const t = c.currentTime, n = noise(c, 1.3), f = c.createBiquadFilter(), g = c.createGain();\n    f.type = 'lowpass'; f.frequency.setValueAtTime(1100, t); f.frequency.exponentialRampToValueAtTime(110, t + 1.1);\n    env(g, t, .005, .9, 1.1); chain(n, f, g, c.destination); n.start(t);\n    tone(c, 'sine', 120, 35, t, .7, .6);\n  },\n  win() { const c = ac(); if (!c) return; [523, 659, 784, 1047].forEach((f, i) => tone(c, 'triangle', f, 0, c.currentTime + i * .13, .25, .18)); },\n  lose() { const c = ac(); if (!c) return; [392, 330, 262].forEach((f, i) => tone(c, 'triangle', f, 0, c.currentTime + i * .18, .3, .16)); }\n};\nfor (const k of Object.keys(sfx)) { const fn = sfx[k]; sfx[k] = () => { try { fn(); } catch (e) { settings.sound = false; soundLabel(); } }; }\nfunction soundLabel() { $('#soundBtn').textContent = settings.sound ? 'Lyd: på' : 'Lyd: av'; }\n$('#soundBtn').onclick = () => { settings.sound = !settings.sound; save(); soundLabel(); if (settings.sound) sfx.tick(); };\n\n/* ---------- Boot ---------- */\napplyTheme(); soundLabel(); buildStart(); show('start');\n(() => {\n  let code = null;\n  try { code = new URLSearchParams(location.search).get('rom'); } catch (e) {}\n  if (!code) { const m = location.hash.match(/^#([A-Za-z]{4})$/); if (m) code = m[1]; }\n  const saved = store.get();\n  if (code) {\n    try { history.replaceState(null, '', location.pathname); } catch (e) {}\n    setMode('friend'); $('#joinCode').value = code.toUpperCase();\n    if (mpAvailable()) mpJoin(code);\n  } else if (saved && saved.code && mpAvailable()) {\n    $('#resumeBtn').textContent = `Fortsett spillet ${saved.code} →`;\n    $('#resumeBtn').hidden = false;\n  }\n})();\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
