/* ---------- Liste over hestene ---------- */
function openHorses(){
  const rows = S.horses.map(h=>{ const b=E.behov(h); return `<button class="hrow" data-h="${h.id}"><img src="${IMG(h.breed)}" alt=""><div class="t"><b>${esc(h.name)}</b> <span class="small">${E.B[h.breed].navn}${h.egen?'':' · pensjonær'}</span>
    <div class="mini"><span>🌾${Math.round(h.mett)}</span><span>💧${Math.round(h.vann)}</span><span>🪮${Math.round(h.ren)}</span><span>😊${Math.round(h.glad)}</span><span>⚡${Math.round(h.energi)}</span><span>📍${E.stedNavn(h.loc)}</span></div></div>
    <span style="font-size:26px">${b?b.ikon:'✅'}</span></button>`; }).join('');
  openPanel(`<h2>🐴 Hestene dine</h2><p class="sub">${S.horses.length} av ${E.bokser(S)} bokser er i bruk. Trykk på en hest for å stelle den.</p>
    <div class="row" style="margin-bottom:10px"><button class="btn" data-all="hoy">🌾 Gi alle høy</button><button class="btn blue" data-all="vann">💧 Gi alle vann</button><button class="btn ghost" data-all="ut">🪵 Alle ut</button><button class="btn ghost" data-all="inn">🏠 Alle inn</button></div>
    <div class="hlist">${rows}</div>`, openHorses);
  on('[data-h]', d=>openHorse(d.h));
  on('[data-all]', d=>{
    let ok=0, msgs=[];
    for (const h of S.horses){
      const r = d.all==='ut' ? (h.loc==='stall'?E.act(S,h.id,'flytt','luft'):null) : d.all==='inn' ? (h.loc!=='stall'?E.act(S,h.id,'flytt','stall'):null) : E.act(S,h.id,d.all);
      if (r&&r.ok) ok++; else if (r) msgs.push(r.msg);
      if (r&&r.tip) setTimeout(()=>tipToast(r.tip),600);
    }
    toast(ok? `Ferdig! (${ok} ${ok===1?'hest':'hester'})` : (msgs[0]||'Ingenting å gjøre.'), ok?'good':'bad');
    if (d.all==='ut' && S.horses.filter(E.erUte).length>=2) setTimeout(()=>tipToast(null),0);
    after({ok:true,msg:'',noToast:true}); refresh();
  });
}
// liten justering: «after» skal ikke vise tom toast
const _after = after; after = function(res){ if(res && res.noToast){ const nye=E.sjekkMal(S); nye.forEach(g=>toast(`🎯 Mål nådd: ${g.txt}! +${kr(g.kr)}`,'gold',4500)); syncHorses(); updateHud(); save(); if (S.min>=E.DAG_SLUTT && !nightAsked){ nightAsked=true; setTimeout(()=>openNight(true),700);} return; } _after(res); };

/* ---------- Ridetimer ---------- */
function openBookings(onlyHorse){
  const open = S.bookings.filter(b=>!b.done), done = S.bookings.filter(b=>b.done);
  const horses = S.horses.filter(h=>h.egen && (!onlyHorse || h.id===onlyHorse));
  const cards = open.map(b=>{ const T=E.TIMETYPER[b.type];
    const btns = horses.map(h=>{ const k=E.kanTa(S,h,b); return `<button class="act${k.ok?'':' dim'}" data-b="${b.id}" data-h="${h.id}"><img src="${IMG(h.breed)}" style="width:34px;height:34px;border-radius:8px;object-fit:cover"><span>${esc(h.name)}<small>${k.ok?'Kan ta timen':esc(k.msg)}</small></span></button>`; }).join('');
    return `<div class="card" style="margin-bottom:10px"><div class="row" style="justify-content:space-between"><b style="font-size:17px">${T.ikon} ${T.navn} – ${esc(b.elev)}</b><span class="chip good">${kr(b.pris)}</span></div><p class="small" style="margin:4px 0 8px">${T.besk} Tar ${b.type==='tur'?'2 timer':b.type==='kos'?'1 time':'1 time'}.</p><div class="acts">${btns||'<span class="small">Ingen hester.</span>'}</div></div>`; }).join('');
  openPanel(`<h2>🧒 Ridetimer i dag</h2><p class="sub">Velg en hest som passer til hver elev. Glade og rene hester gir fornøyde elever – og bedre rykte!</p>
    ${cards || '<div class="card">Ingen flere elever i dag. Flere kommer i morgen! Rideskolen og ridelærer gir flere elever.</div>'}
    ${done.length?`<h3>Ferdige timer</h3><p class="small">${done.map(b=>`${E.TIMETYPER[b.type].ikon} ${E.TIMETYPER[b.type].navn} med ${esc(b.hest)}`).join(' · ')}</p>`:''}`, ()=>openBookings(onlyHorse));
  on('[data-b]', d=>{ after(E.act(S,d.h,'time',d.b)); refresh(); });
}

/* ---------- Stevne og trav ---------- */
let stevneValg = {disc:'sprang', niva:'klubb'};
function openStevne(hid){
  const egne = S.horses.filter(h=>h.egen);
  const h = egne.find(x=>x.id===hid) || egne[0];
  const lv = Object.entries(E.STEVNE).map(([k,L])=>`<button class="act" data-niva="${k}" style="${stevneValg.niva===k?'border-color:#e8a628;background:#fff7e0':''}"><span class="i">${k==='klubb'?'🥉':k==='region'?'🥈':'🥇'}</span><span>${L.navn}<small>Avgift ${kr(L.avgift)} · 1. premie ${kr(L.premier[0])}</small></span></button>`).join('');
  openPanel(`<h2>🏆 Stevneplassen</h2><p class="sub">Konkurrer mot fem andre hester. De tre beste får premie. Hesten må være frisk, uthvilt og kan starte én gang per dag.</p>
    <h3>1. Velg hest</h3><div class="acts">${egne.map(x=>`<button class="act" data-hs="${x.id}" style="${x.id===h.id?'border-color:#3f8a3a;background:#eef8ea':''}"><img src="${IMG(x.breed)}" style="width:34px;height:34px;border-radius:8px;object-fit:cover"><span>${esc(x.name)}<small>🎀 ${x.skill.dressur} · 🚧 ${x.skill.sprang} · ⚡ ${Math.round(x.energi)}</small></span></button>`).join('')}</div>
    <h3>2. Velg gren</h3><div class="acts">${act('🚧','Sprang',`${h.name}: ${h.skill.sprang} poeng`,{disc:'sprang'},stevneValg.disc!=='sprang')}${act('🎀','Dressur',`${h.name}: ${h.skill.dressur} poeng`,{disc:'dressur'},stevneValg.disc!=='dressur')}</div>
    <h3>3. Velg stevne</h3><div class="acts">${lv}</div>
    <p style="margin-top:16px"><button class="btn gold big" data-go="1">Start! 🏁</button></p>
    <p class="small">Tips: Klubbstevne passer for hester med rundt 30 poeng. Regionstevne trenger rundt 50, Norgescup over 70.</p>`, ()=>openStevne(h.id));
  on('[data-hs]', d=>openStevne(d.hs));
  on('[data-disc]', d=>{ stevneValg.disc=d.disc; refresh(); });
  on('[data-niva]', d=>{ stevneValg.niva=d.niva; refresh(); });
  on('[data-go]', ()=>{ const r=E.act(S,h.id,'stevne',{...stevneValg}); showResult(r); });
}
let travValg='lokal';
function openTrav(hid){
  const egne = S.horses.filter(h=>h.egen && E.B[h.breed].trav);
  if (!egne.length){ openPanel(`<h2>🏁 Travbanen</h2><p>Du har ingen travere ennå. Bare <b>norsk kaldblodstraver</b> og <b>varmblodstraver</b> kan løpe travløp. Se etter dem på hestemarkedet!</p><p class="small">I et travløp drar hesten en lett vogn som heter sulky, og må holde seg i trav hele veien.</p>`); return; }
  const h = egne.find(x=>x.id===hid)||egne[0];
  openPanel(`<h2>🏁 Travbanen</h2><p class="sub">Husk: hesten må være vaksinert for å få starte i travløp.</p>
    <h3>1. Velg traver</h3><div class="acts">${egne.map(x=>`<button class="act" data-hs="${x.id}" style="${x.id===h.id?'border-color:#3f8a3a;background:#eef8ea':''}"><img src="${IMG(x.breed)}" style="width:34px;height:34px;border-radius:8px;object-fit:cover"><span>${esc(x.name)}<small>💨 ${x.skill.fart} · ⚡ ${Math.round(x.energi)} · 💉 ${x.vacc>0?'ok':'mangler'}</small></span></button>`).join('')}</div>
    <h3>2. Velg løp</h3><div class="acts">${Object.entries(E.TRAV).map(([k,L])=>`<button class="act" data-niva="${k}" style="${travValg===k?'border-color:#e8a628;background:#fff7e0':''}"><span class="i">${k==='lokal'?'🏁':'🏆'}</span><span>${L.navn}<small>Avgift ${kr(L.avgift)} · 1. premie ${kr(L.premier[0])}</small></span></button>`).join('')}</div>
    <p style="margin-top:16px"><button class="btn gold big" data-go="1">Start! 🏁</button></p>`, ()=>openTrav(h.id));
  on('[data-hs]', d=>openTrav(d.hs)); on('[data-niva]', d=>{ travValg=d.niva; refresh(); });
  on('[data-go]', ()=>showResult(E.act(S,h.id,'trav',travValg)));
}
function showResult(r){
  if (!r.ok){ after(r); return; }
  const medal = r.plass===1?'🥇':r.plass===2?'🥈':r.plass===3?'🥉':'🎗️';
  if (r.plass<=3) confetti(r.plass===1?70:36);
  after({...r, msg: r.win?'Seier!':'Løpet er ferdig'});
  openPanel(`<div class="res-big">${medal}</div><h2 class="center">${r.plass}. plass!</h2><p class="center">${esc(r.msg)}</p><p class="center"><button class="btn" data-x="1">Fint!</button></p>`);
  on('[data-x]', closePanel);
}

/* ---------- Områdepaneler ---------- */
function upgBtn(id){
  const U=D.UPGRADES[id]; if (S.upg[id]) return `<div class="card">✅ <b>${U.navn}</b> – ${U.besk}</div>`;
  return `<button class="act" data-upg="${id}"><span class="i">🛠️</span><span>${U.navn} – ${kr(U.pris)}<small>${U.besk}</small></span></button>`;
}
function areaBuy(id){
  const A=D.AREAS[id], lvl=S.areas[id];
  if (lvl>=A.maks) return '';
  const pris=A.lvlCost[lvl];
  return `<p><button class="btn gold" data-buy="${id}">${lvl?'Oppgrader':'Kjøp'} ${A.navn.toLowerCase()} – ${kr(pris)}</button>${A.niva&&lvl?` <span class="small">Neste nivå: ${A.niva[lvl+1]}</span>`:''}</p>`;
}
function openArea(id){
  const A = D.AREAS[id];
  if (id==='bibliotek') return openLibrary();
  if (id==='marked') return openMarket();
  if (A && !S.areas[id]){
    openPanel(`<h2>${A.ikon} ${A.navn}</h2><p>${A.besk}</p>${areaBuy(id)}<p class="small">Du har ${kr(S.money)}.</p>`, ()=>openArea(id));
    on('[data-buy]', d=>{ const r=E.kjopOmrade(S,d.buy); after(r); if(r.ok){ buildWorld(); refresh(); } });
    return;
  }
  let html = `<h2>${A.ikon} ${A.navn}</h2><p class="sub">${A.besk}${A.niva?` <b>${A.niva[S.areas[id]]}</b>`:''}</p>`;
  if (id==='stall'){
    html += `<p>Bokser: <b>${S.horses.length} av ${E.bokser(S)}</b> i bruk.</p>${areaBuy('stall')}<h3>Utstyr</h3><div class="acts">${upgBtn('vanning')}</div>
      <h3>Boksene</h3><div class="hlist">${S.horses.map(h=>`<button class="hrow" data-h="${h.id}"><img src="${IMG(h.breed)}"><div class="t"><b>${esc(h.name)}</b><div class="mini">${h.mokk?`🧹 Skitten boks (${h.mokk} d)`:'🧹 Ren boks'} · 📍 ${E.stedNavn(h.loc)}</div></div></button>`).join('')}</div>
      <p><button class="btn" data-mokkall="1">🧹 Møkk alle bokser (${kr(E.PRIS.flis)} per boks)</button></p>
      <h3>👷 Ansatte</h3><div class="acts">${Object.entries(D.STAFF).map(([k,St])=>`<button class="act" data-staff="${k}"><span class="i">${k==='stallhjelp'?'👷':'🧑‍🏫'}</span><span>${St.navn} – ${S.staff[k]?'ansatt ✅':'ledig'}<small>${St.besk} Lønn ${kr(St.lonn)}/dag. Trykk for å ${S.staff[k]?'si opp':'ansette'}.</small></span></button>`).join('')}</div>`;
  }
  if (id==='hoyloft'){
    const plass = Math.floor(E.lager(S)-S.hay), pr=E.hoyPris(S);
    const forbruk = S.horses.reduce((a,h)=>a+E.hoyDag(S,h),0);
    html += `<div class="card"><b>🌾 Høy: ${E.fmtKg(S.hay)} av ${E.lager(S)} kg</b><div class="progress"><i style="width:${S.hay/E.lager(S)*100}%"></i></div>
      Hestene dine spiser ca. <b>${E.fmtKg(forbruk)}</b> høy per dag. Det du har, holder i ca. <b>${forbruk?Math.floor(S.hay/forbruk):'–'} dager</b>.<br>Pris: ${kr(pr).replace(' kr','')} kr per kg${S.areas.hoyloft>=3?' (mengderabatt!)':''}.</div>
      <h3>Kjøp høy</h3><div class="acts">${[25,50,100].map(k=>act('🌾',`${k} kg`,kr(Math.round(Math.min(k,plass)*pr)),{hay:k},plass<=0)).join('')}${act('📦','Fyll lageret',`${plass} kg · ${kr(Math.round(plass*pr))}`,{hay:plass},plass<=0)}</div>
      <h3>Annet fôr</h3><div class="acts">${act('🥣','5 kg kraftfôr',kr(5*E.PRIS.kraft)+` · har ${S.kraft} kg`,{vare:'kraft',ant:5})}${act('🥕','10 gulrøtter',kr(10*E.PRIS.gulrot)+` · har ${S.gulrot}`,{vare:'gulrot',ant:10})}</div>
      ${areaBuy('hoyloft')}
      <p class="small">Regnestykke: Hvis en hest spiser 9 kg høy om dagen og høyet koster ${String(pr).replace('.',',')} kr per kg, hva koster høyet for én hest i en uke?</p>`;
  }
  if (id==='luft'){
    const ute = S.horses.filter(h=>h.loc==='luft');
    html += `<p>Ute nå: <b>${ute.map(h=>esc(h.name)).join(', ')||'ingen'}</b></p>
      <p class="small">Hester er flokkdyr. De blir mye gladere når de er ute <b>sammen</b> med andre hester. Ute har de alltid vann fra vannkaret.</p>
      <div class="row"><button class="btn" data-ut="1">🪵 Slipp alle ut</button><button class="btn ghost" data-inn="1">🏠 Ta alle inn</button></div><h3>Utstyr</h3><div class="acts">${upgBtn('leskur')}</div>`;
  }
  if (id==='beite'){
    const ute = S.horses.filter(h=>h.loc==='beite');
    html += `<p>På beitet nå: <b>${ute.map(h=>esc(h.name)).join(', ')||'ingen'}</b></p><p class="small">På beitet spiser hestene gress, så de blir ikke like fort sultne. Om vinteren er beitet dekket av snø.</p>
      <div class="row"><button class="btn" data-beite="1">🌿 Slipp alle på beite</button><button class="btn ghost" data-inn="1">🏠 Ta alle inn</button></div>`;
  }
  if (id==='ridebane' || id==='rideskole'){
    const open = S.bookings.filter(b=>!b.done).length;
    html += `<p><b>${open}</b> ${open===1?'elev venter':'elever venter'} på ridetime i dag.</p><p><button class="btn big" data-timer="1">🧒 Se ridetimene</button></p>`;
    if (id==='ridebane') html += `<h3>Utstyr</h3><div class="acts">${upgBtn('hinder')}${upgBtn('underlag')}</div>${S.areas.rideskole?'':`<p class="small">Tips: Kjøp rideskolen for å få flere elever som betaler mer.</p>`}`;
    else html += areaBuy('rideskole');
  }
  if (id==='vet'){
    const syke = S.horses.filter(h=>h.syk);
    html += `<p>${syke.length?`Syke hester: <b>${syke.map(h=>esc(h.name)+' ('+E.sykNavn(h.syk.type)+')').join(', ')}</b>`:'Alle hestene er friske! 🎉'}</p><p class="small">Med veterinærstallen er alle veterinærbesøk og vaksiner 30 % billigere, og syke hester blir raskere friske.</p>
      <div class="hlist">${S.horses.map(h=>`<button class="hrow" data-h="${h.id}"><img src="${IMG(h.breed)}"><div class="t"><b>${esc(h.name)}</b><div class="mini">❤️ ${Math.round(h.helse)} · 💉 ${h.vacc>0?h.vacc+' d':'mangler'} · 🧲 ${h.hoof>=7?'trenger hovslager':'ok'}</div></div></button>`).join('')}</div>`;
  }
  if (id==='stevne') return openStevne();
  if (id==='trav') return openTrav();
  openPanel(html, ()=>openArea(id));
  on('[data-buy]', d=>{ const r=E.kjopOmrade(S,d.buy); after(r); if(r.ok){ buildWorld(); syncHorses(); refresh(); } });
  on('[data-upg]', d=>{ const r=E.kjopUpg(S,d.upg); after(r); if(r.ok){ buildWorld(); refresh(); } });
  on('[data-h]', d=>openHorse(d.h));
  on('[data-hay]', d=>{ after(E.kjopHoy(S,+d.hay)); buildWorld(); refresh(); });
  on('[data-vare]', d=>{ after(E.kjopVare(S,d.vare,+d.ant)); refresh(); });
  on('[data-staff]', d=>{ after(E.ansett(S,d.staff)); refresh(); });
  on('[data-timer]', ()=>openBookings());
  on('[data-mokkall]', ()=>{ let n=0; for(const h of S.horses){ const r=E.act(S,h.id,'mokk'); if(r.ok)n++; } toast(n?`${n} bokser møkket.`:'Alle boksene er rene.', n?'good':'info'); after({noToast:true}); refresh(); });
  const flyttAlle = til=>{ let n=0; for(const h of S.horses){ if(h.loc!==til){ const r=E.act(S,h.id,'flytt',til); if(r.ok) n++; else { toast(r.msg,'bad'); break; } } } if(n) toast(`${n} ${n===1?'hest':'hester'} flyttet.`); if(til!=='stall' && S.horses.filter(E.erUte).length>=2){ const t=null; } after({noToast:true}); refresh(); };
  on('[data-ut]', ()=>flyttAlle('luft')); on('[data-inn]', ()=>flyttAlle('stall')); on('[data-beite]', ()=>flyttAlle('beite'));
}

/* ---------- Marked ---------- */
function openMarket(){
  const fri = E.bokser(S)-S.horses.length;
  const offers = S.market.map((o,i)=>{ const R=E.B[o.breed]; return `<div class="card"><div class="hhead"><img src="${IMG(o.breed)}" style="width:86px;height:86px"><div><b style="font-size:18px">${esc(o.name)}</b><div class="small">${R.navn} · ${o.age} år${R.ikkeRidbar?' · kan ikke ris':''}</div>
    <div class="small">🎀 ${o.skill.dressur} · 🚧 ${o.skill.sprang} · 💨 ${o.skill.fart} · 😌 lynne ${R.lynne}/10 · 💉 ${o.vacc?'vaksinert':'ikke vaksinert'}</div>
    <div class="row" style="margin-top:6px"><button class="btn gold" data-kjop="${i}">Kjøp – ${kr(o.pris)}</button><button class="btn ghost" data-info="${o.breed}">Om rasen</button></div></div></div></div>`; }).join('');
  const p = S.pensjonar;
  openPanel(`<h2>🏪 Hestemarkedet</h2><p class="sub">Nye hester kommer hver dag. Du har <b>${fri}</b> ${fri===1?'ledig boks':'ledige bokser'}.</p>
    <div class="grid2" style="grid-template-columns:1fr">${offers||'<div class="card">Ingen hester til salgs i dag.</div>'}</div>
    <h3>🏡 Pensjonærplass</h3>${p?`<div class="card"><div class="hhead"><img src="${IMG(p.breed)}" style="width:76px;height:76px"><div><b>${esc(p.eier)}</b> spør om hesten <b>${esc(p.name)}</b> (${E.B[p.breed].navn}) kan bo hos deg.<br>Hun/han betaler <b>${kr(p.betaling)} per dag</b>. Du må stelle hesten godt!<div class="row" style="margin-top:6px"><button class="btn" data-pens="1">Si ja</button></div></div></div></div>`:'<div class="card small">Ingen spør om plass akkurat nå. Kanskje i morgen!</div>'}
    <p class="small">Husk: Hester er flokkdyr. Flere hester gjør hestene gladere – men hver hest koster penger hver dag.</p>`, openMarket);
  on('[data-kjop]', d=>{ const o=S.market[+d.kjop]; if(!o) return; const n=prompt(`Hva skal ${E.B[o.breed].navn.toLowerCase()}en hete?`, o.name); if(n===null) return; const r=E.kjopHest(S,+d.kjop,(n||o.name).trim().slice(0,16)); after(r); if(r.ok){ syncHorses(); openHorse(r.id); } else refresh(); });
  on('[data-info]', d=>openBreed(d.info, openMarket));
  on('[data-pens]', ()=>{ const r=E.taPensjonar(S); after(r); refresh(); });
}

/* ---------- Bibliotek ---------- */
let libTab='raser';
function typeKey(t){ t=t.toLowerCase(); return t.includes('mini')?'mini':t.includes('ponni')?'ponni':t.includes('kald')?'kald':t.includes('varm')?'varm':t.includes('full')?'full':'vill'; }
function typeNavn(t){ return {mini:'Minihest',ponni:'Ponni',kald:'Kaldblod',varm:'Varmblod',full:'Fullblod',vill:'Villhest'}[typeKey(t)]; }
function openLibrary(){
  let html = `<h2>📚 Hestebiblioteket</h2><div class="tabs"><button data-tab="raser" class="${libTab==='raser'?'on':''}">Hesteraser (${D.BREEDS.length})</button><button data-tab="bok" class="${libTab==='bok'?'on':''}">Hestehåndboka</button></div>`;
  if (libTab==='raser'){
    html += `<p class="sub">Du har hatt ${S.stats.raser.length} av ${D.BREEDS.length} raser på gården.</p><div class="lib">${D.BREEDS.map(b=>`<button class="libc t-${typeKey(b.type)}" data-type="${typeNavn(b.type)}" data-b="${b.id}"><img src="${IMG(b.id)}" alt="">${S.stats.raser.includes(b.id)?'<span class="own">Din!</span>':''}<div>${b.navn}</div><div class="small">${b.land}</div></button>`).join('')}</div>`;
  } else {
    html += `<p class="sub">Alt du trenger å vite for å ta godt vare på hester.</p>${D.HANDBOK.map(t=>`<div class="fact"><b>${t.ikon} ${t.tittel}</b><br>${t.tekst}</div>`).join('')}
      <p class="small">Kilder: Mattilsynet (hold av hest), Det Norske Travselskap, Store norske leksikon, Eurofins (grovfôr til hest). Tallene i spillet er forenklet.</p>`;
  }
  openPanel(html, openLibrary);
  on('[data-tab]', d=>{ libTab=d.tab; refresh(); });
  on('[data-b]', d=>openBreed(d.b, openLibrary));
}
function dots(n){ return `<div class="dots">${Array.from({length:10},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`; }
function openBreed(id, back){

    <p class="small">${b.trav?'🏁 Denne rasen kan løpe travløp. ':''}${b.ikkeRidbar?'🚫 For liten til å bli ridd. ':''}${b.lynne>=7?'🧒 Passer for nybegynnere.':'⚠️ For nervøs for nybegynnere.'} En hest på ${b.vekt} kg trenger ca. ${E.fmtKg(Math.round(b.vekt/100*1.8*2)/2)} høy om dagen.</p>`, ()=>openBreed(id,back));

/* ---------- Mål ---------- */
function openGoals(){
  const done = D.GOALS.filter(g=>S.goalsDone[g.id]).length, next = E.nesteMal(S);
  const idx = next ? D.GOALS.indexOf(next) : 99;
  openPanel(`<h2>🎯 Mål</h2><p class="sub">${done} av ${D.GOALS.length} mål nådd. Hvert mål gir en pengebelønning.</p><div class="progress"><i style="width:${done/D.GOALS.length*100}%"></i></div>
    <div class="goals">${D.GOALS.map((g,i)=>`<div class="goal ${S.goalsDone[g.id]?'done':g===next?'next':i>idx+4?'far':''}">${g===next?'▶ Neste<br>':''}${g.txt}<small>Belønning: ${kr(g.kr)}</small></div>`).join('')}</div>`, openGoals);
}

/* ---------- Regnskap ---------- */
function openLedger(){
  const inn = S.ledger.filter(l=>l.t==='inn'), ut = S.ledger.filter(l=>l.t==='ut');
  const si = inn.reduce((a,l)=>a+l.kr,0), su = ut.reduce((a,l)=>a+l.kr,0);
  const hist = S.history.slice(-14); const mx = Math.max(1,...hist.map(h=>Math.max(h.inn,h.ut)));
  const bw = 100/Math.max(hist.length,1);
  const svg = hist.length ? `<svg class="svgchart" viewBox="0 0 100 50" preserveAspectRatio="none">${hist.map((h,i)=>`<rect x="${i*bw+bw*.12}" y="${50-h.inn/mx*46}" width="${bw*.36}" height="${h.inn/mx*46}" fill="#3f8a3a" rx=".6"/><rect x="${i*bw+bw*.52}" y="${50-h.ut/mx*46}" width="${bw*.36}" height="${h.ut/mx*46}" fill="#c8553d" rx=".6"/>`).join('')}</svg><p class="small center">Grønn = inntekter, rød = utgifter. De siste ${hist.length} dagene.</p>` : '<p class="small">Grafen kommer etter første dag.</p>';
  const egne = S.horses.filter(h=>h.egen);
  const dag = egne.reduce((a,h)=>a+E.hoyDag(S,h)*E.hoyPris(S),0)/Math.max(egne.length,1);
  openPanel(`<h2>📊 Regnskap</h2><p class="sub">Dag ${S.day}. Inntekter er penger inn, utgifter er penger ut.</p>
    <table class="ledger">${inn.map(l=>`<tr><td>${esc(l.txt)}</td><td class="inn">+${kr(l.kr)}</td></tr>`).join('')}${ut.map(l=>`<tr><td>${esc(l.txt)}</td><td class="ut">−${kr(l.kr)}</td></tr>`).join('')}
    <tr><td class="sum">Resultat i dag så langt</td><td class="sum ${si-su>=0?'inn':'ut'}">${si-su>=0?'+':'−'}${kr(Math.abs(si-su))}</td></tr></table>
    <h3>Siste dager</h3>${svg}
    <h3>💰 Hva koster en hest?</h3><div class="card small">
      Høy: ca. ${kr(Math.round(dag))} per hest per dag<br>Flis til boksen: ${kr(E.PRIS.flis)} per dag<br>Strøm, salt og forsikring: ${kr(E.PRIS.fast)} per dag<br>
      Hovslager: ${kr(E.PRIS.hovslager)} hver 7. dag (i virkeligheten hver 6.–8. uke)<br>Vaksine: ${kr(E.PRIS.vaksine)} én gang i året (28 spilldager)<br>Veterinær når hesten blir syk: ${kr(E.PRIS.syk.hoste)}–${kr(E.PRIS.syk.kolikk)}<br><br>
      I virkeligheten bruker mange hesteeiere flere tusen kroner i måneden på én hest.</div>`, openLedger);
}

/* ---------- Kveld og natt ---------- */
function openNight(tvunget){
  const warn = [];
  for (const h of S.horses){
    if (h.mett<45) warn.push(`🌾 ${esc(h.name)} er sulten – gi kveldsmat!`);
    if (h.vann<45 && !S.upg.vanning) warn.push(`💧 ${esc(h.name)} er tørst.`);
    if (h.syk && !h.syk.behandlet) warn.push(`🤒 ${esc(h.name)} er syk og trenger veterinær.`);
    if (h.mokk>=1) warn.push(`🧹 Boksen til ${esc(h.name)} er skitten.`);
    if (h.glad<35) warn.push(`💔 ${esc(h.name)} er lei seg. Har hesten vært ute med de andre?`);
  }
  openPanel(`<h2>🌙 ${tvunget?'Klokka er 22 – dagen er over':'Vil du avslutte dagen?'}</h2>
    ${warn.length?`<p class="sub">Sjekkliste før natta:</p><div class="card">${warn.map(w=>`<div>${w}</div>`).join('')}</div>`:`<p class="sub">Alle hestene har det fint. Godt jobbet! ✨</p>`}
    <p class="small">Om natta står alle hestene inne i stallen.${tvunget?'':' Hvis du sover nå, hopper klokka til 22:00 – og hestene blir sultnere i mellomtiden.'}</p>
    <div class="row">${tvunget?'':`<button class="btn ghost" data-back="1">Gå tilbake</button>`}<button class="btn big" data-sleep="1" style="background:#2c3557;box-shadow:0 3px 0 #1a2038">😴 Sov godt</button></div>`);
  on('[data-back]', closePanel);
  on('[data-sleep]', ()=>{
    const rep = E.avsluttDag(S); nightAsked=false; buildWorld(); syncHorses(); save();
    const inn = rep.poster.filter(p=>p.t==='inn'), ut = rep.poster.filter(p=>p.t==='ut');
    openPanel(`<h2>☀️ God morgen! Dag ${S.day}</h2><p class="sub">Slik gikk dag ${rep.dag}:</p>
      <table class="ledger">${inn.map(l=>`<tr><td>${esc(l.txt)}</td><td class="inn">+${kr(l.kr)}</td></tr>`).join('')}${ut.map(l=>`<tr><td>${esc(l.txt)}</td><td class="ut">−${kr(l.kr)}</td></tr>`).join('')}
      <tr><td class="sum">Inntekter − utgifter</td><td class="sum ${rep.resultat>=0?'inn':'ut'}">${rep.resultat>=0?'+':'−'}${kr(Math.abs(rep.resultat))}</td></tr></table>
      ${rep.hendelser.length?`<h3>I natt</h3><div class="card">${rep.hendelser.map(e=>`<div>${esc(e)}</div>`).join('')}</div>`:''}
      <p>Vær i dag: <b>${VAER[S.weather]} ${{sol:'Sol',sky:'Overskyet',regn:'Regn',sno:'Snø'}[S.weather]}</b> · ${E.sesong(S)} · ${S.bookings.length} elever har bestilt ridetime.</p>
      <p><button class="btn big" data-ok="1">Start dagen!</button></p>`);
    on('[data-ok]', ()=>{ closePanel(); if(rep.tip) tipToast(rep.tip); });
  });
}

/* ======================= MINISPILL ======================= */
let miniDone = null;
function closeMini(){ $('#mini').classList.add('hidden'); miniDone=null; }
$('#miniCancel').onclick = closeMini;
function miniStrigle(h){
  if (h.ren>=95){ toast(`${h.name} er allerede ren og fin!`,'info'); return; }
  if (E.igjen(S)<E.TID.strigle){ toast('Det er for sent i dag.','bad'); return; }
  $('#miniTitle').textContent = `🪮 Strigle ${h.name}`;
  $('#miniHelp').textContent = 'Dra fingeren over møkkflekkene til pelsen er ren!';
  const st = $('#miniStage'); st.innerHTML = `<img src="${IMG(h.breed)}"><canvas></canvas>`;
  $('#mini').classList.remove('hidden');
  const cv = st.querySelector('canvas'), r = st.getBoundingClientRect();
  cv.width = 400; cv.height = 400; const x = cv.getContext('2d');
  const spots = Math.round(8 + (100-h.ren)/6);
  for (let i=0;i<spots;i++){
    const cx = 120+Math.random()*190, cy = 140+Math.random()*130, rr = 14+Math.random()*16;
    x.fillStyle = ['#6b4a2e','#7d5a3a','#5a3f28'][i%3]; x.globalAlpha=.85;
    x.beginPath(); for(let k=0;k<9;k++){ const a=k/9*Math.PI*2, d=rr*(.7+Math.random()*.5); k?x.lineTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d):x.moveTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d);} x.fill();
  }
  x.globalAlpha=1;
  const total = countDirt(x); let finished=false;
  const brush = e=>{
    const b = cv.getBoundingClientRect(); const px=(e.clientX-b.left)/b.width*400, py=(e.clientY-b.top)/b.height*400;
    x.globalCompositeOperation='destination-out'; x.beginPath(); x.arc(px,py,26,0,Math.PI*2); x.fill(); x.globalCompositeOperation='source-over';
  };
  let down=false, n=0;
  cv.onpointerdown = e=>{ down=true; cv.setPointerCapture(e.pointerId); brush(e); };
  cv.onpointermove = e=>{ if(!down) return; brush(e); if(++n%6===0) check(); };
  cv.onpointerup = ()=>{ down=false; check(); };
  function check(){
    const left = countDirt(x), p = total? 1-left/total : 1;
    $('#miniProg').style.width = Math.min(100,p/0.9*100)+'%';
    if (p>=0.9 && !finished){ finished=true; setTimeout(()=>{ closeMini(); after(E.act(S,h.id,'strigle')); refresh(); }, 250); }
  }
  $('#miniProg').style.width='0%';
}
function countDirt(x){ const d=x.getImageData(0,0,400,400).data; let n=0; for(let i=3;i<d.length;i+=16) if(d[i]>40) n++; return n; }
function miniHover(h){
  if (E.igjen(S)<E.TID.hover){ toast('Det er for sent i dag.','bad'); return; }
  $('#miniTitle').textContent = `🪨 Rens hovene til ${h.name}`;
  $('#miniHelp').textContent = 'Trykk på hver hov til alle steinene er borte. Løft hoven forsiktig!';
  const navn = ['Venstre fram','Høyre fram','Venstre bak','Høyre bak'];
  const left = navn.map(()=>1+Math.floor(Math.random()*3));
  const st=$('#miniStage'); st.innerHTML = `<div class="hooves">${navn.map((n,i)=>`<button class="hoof" data-i="${i}"><span class="st">${'🪨'.repeat(left[i])}</span>${n}</button>`).join('')}</div>`;
  $('#mini').classList.remove('hidden'); $('#miniProg').style.width='0%';
  const tot = left.reduce((a,b)=>a+b,0);
  st.querySelectorAll('.hoof').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i; if(left[i]<=0) return; left[i]--;
    b.querySelector('.st').textContent = left[i]? '🪨'.repeat(left[i]) : '✨'; if(!left[i]) b.classList.add('ok');
    const rest = left.reduce((a,b)=>a+b,0); $('#miniProg').style.width = (1-rest/tot)*100+'%';
    if (!rest) setTimeout(()=>{ closeMini(); after(E.act(S,h.id,'hover')); refresh(); }, 300);
  });
}

/* ======================= START ======================= */
const STARTERE = ['fjordhest','nordlandshest','dolahest','shetland','haflinger','islandshest'];
function startScreen(){
  const har = load();
  const card = $('#startCard');
  card.innerHTML = `<h1 class="logo">Mykje <span>Hester</span></h1><p class="sub" style="margin-top:6px">Bygg din egen hestegård! Stell hestene, hold ridetimer og bli den beste gården i fjorden.</p>
    ${har?`<p><button class="btn big" data-cont="1">▶ Fortsett ${esc(har.farm)} (dag ${har.day})</button></p><p><button class="btn ghost" data-new="1">Ny gård</button></p>`:`<p><button class="btn big" data-new="1">Start en ny gård</button></p>`}`;
  card.querySelector('[data-cont]')?.addEventListener('click', ()=>begin(har));
  card.querySelector('[data-new]').addEventListener('click', ()=>{ if(har && !confirm('Den gamle gården blir slettet. Vil du starte på nytt?')) return; newGameForm(); });
}
function newGameForm(){
  const valgt = ['fjordhest','nordlandshest'];
  const card = $('#startCard');
  const draw = ()=>{
    card.innerHTML = `<h1 class="logo" style="font-size:32px">Ny <span>hestegård</span></h1>
      <p style="text-align:left;margin:14px 0 4px"><b>Hva skal gården hete?</b></p><input id="nf" value="Mykje Hestegård" maxlength="28">
      <p style="text-align:left;margin:14px 0 0"><b>Velg to hester å starte med</b> <span class="small">(hester trenger selskap!)</span></p>
      <div class="pickh">${STARTERE.map(id=>`<button data-p="${id}" class="${valgt.includes(id)?'on':''}"><img src="${IMG(id)}" alt="">${E.B[id].navn.replace('/lyngshest','')}</button>`).join('')}</div>
      <div class="row" style="justify-content:center">${valgt.map((id,i)=>`<label style="flex:1;min-width:140px;text-align:left"><span class="small">Navn på ${E.B[id].navn.replace('/lyngshest','').toLowerCase()}en</span><input id="nn${i}" value="${['Bris','Tussi'][i]}" maxlength="16"></label>`).join('')}</div>
      <p style="margin-top:16px"><button class="btn big" data-go="1">Bygg gården! 🐴</button></p>`;
    card.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{ const id=b.dataset.p; if(valgt.includes(id)) return; valgt.shift(); valgt.push(id); draw(); });
    card.querySelector('[data-go]').onclick=()=>{
      const farm = $('#nf').value.trim()||'Mykje Hestegård';
      const horses = valgt.map((id,i)=>({breed:id, name:($('#nn'+i).value.trim()||['Bris','Tussi'][i]).slice(0,16)}));
      localStorage.removeItem(SAVE);
      const s = E.nyttSpill({farm, horses}); begin(s, true);
    };
  };
  draw();
}
function begin(state, fresh){
  S = state; H3.forEach(o=>scene.remove(o.g)); H3.clear();
  $('#start').classList.add('hidden'); $('#hud').classList.remove('hidden'); $('#dock').classList.remove('hidden');
  buildWorld(); syncHorses(); updateHud(); updateSky(); save();
  if (fresh){
    openPanel(`<h2>Velkommen til ${esc(S.farm)}! 🐴</h2>
      <p>Du har to hester, en stall, et høyloft, en luftegård og en ridebane. Og ${kr(S.money)} i kassa.</p>
      <div class="card">
        <b>Slik tar du vare på hestene:</b><br>
        🌾 Gi høy morgen og kveld<br>💧 Sørg for at de har vann<br>🪵 Slipp dem ut sammen – hester er flokkdyr<br>🪮 Strigle dem og hold boksen ren<br>🧲 Husk hovslager og 💉 vaksine
      </div>
      <p class="small">Tjen penger på ridetimer: trykk på ridebanen. Trykk på en hest for å se hvordan den har det.</p>
      <p><button class="btn big" data-ok="1">La oss begynne!</button></p>`);
    on('[data-ok]', closePanel);
  }
}
startScreen();
requestAnimationFrame(loop);
window.__mh = { get S(){return S;}, E, openHorse, openArea, openLibrary, openMarket, openBookings, openNight, openLedger, openGoals, closePanel, buildWorld, syncHorses, camera, controls };
