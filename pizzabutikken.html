<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pizzabutikken</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbeedb;--card:#fffaf2;--ink:#3b2415;--muted:#7a5b47;--red:#d4452a;--redd:#a93421;--green:#2f8a45;--greend:#1f6331;--gold:#e89a0c;--line:#ecd6b8;--blue:#2d6fb3}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:16px;line-height:1.4;min-height:100vh}
h1,h2,h3,.brand,button,.tab{font-family:'Baloo 2','Atkinson Hyperlegible',system-ui,sans-serif}
h2{margin:0 0 6px;font-size:26px}
h3{margin:0 0 8px;font-size:20px}
.cloth{height:14px;background:repeating-conic-gradient(var(--red) 0 25%,#fff 0 50%) 0 0/28px 28px}
header{background:var(--card);border-bottom:3px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.brand{font-size:28px;font-weight:800;color:var(--red);line-height:1}
.brand small{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-top:2px}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-weight:700;white-space:nowrap}
.stat.neg{color:#fff;background:var(--red);border-color:var(--redd)}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
button{cursor:pointer;border:none;border-radius:12px;padding:8px 14px;font-size:16px;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line),inset 0 0 0 2px var(--line);transition:transform .05s;touch-action:manipulation}
button:active{transform:translateY(2px)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--red);color:#fff;box-shadow:0 3px 0 var(--redd)}
button.go{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--greend)}
button.small{padding:4px 10px;font-size:14px}
button.on{background:var(--gold);color:#fff;box-shadow:0 3px 0 #b87a08}
button.big{font-size:24px;padding:14px 28px;border-radius:18px}
nav{display:flex;gap:6px;padding:10px 16px 0;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:12px 12px 0 0;background:#f1dbbb;font-weight:700;box-shadow:none;position:relative}
.tab.act{background:var(--card)}
.badge{position:absolute;top:-7px;right:-5px;background:var(--red);color:#fff;border-radius:999px;font-size:12px;padding:0 6px;line-height:18px}
main{padding:0 16px 40px}
.view{background:var(--card);border-radius:0 16px 16px 16px;padding:16px;min-height:60vh}
.lead{color:var(--muted);margin:0 0 12px}
.hint{background:#fff3c9;border-left:5px solid var(--gold);padding:8px 12px;border-radius:8px;margin:8px 0}
.warn{background:#fde2dc;border-left:5px solid var(--red);padding:8px 12px;border-radius:8px;margin:8px 0}
.small{font-size:14px;color:var(--muted)}
.play{display:grid;grid-template-columns:minmax(230px,1fr) minmax(300px,1.35fr) minmax(230px,1fr);gap:14px}
@media(max-width:920px){.play{grid-template-columns:1fr}}
.col{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.cust{display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;border:2px solid var(--line);margin-bottom:8px;cursor:pointer;background:var(--card);user-select:none;animation:pop .25s}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.cust.act{border-color:var(--blue);box-shadow:0 0 0 3px #bcd6f2}
.cust.waiting{background:#fff3c9}
.cust.leaving{opacity:.75;cursor:default}
.cust.done{background:#e6f5e9}
.cemoji{font-size:34px;line-height:1}
.cimg{width:56px;height:64px;object-fit:contain;flex:none}
.simg{width:72px;height:84px;object-fit:contain;flex:none}
.bimg{width:150px;height:150px;object-fit:contain}
.scene{background:url(pizzabutikken/bakgrunn.webp) center/cover;border-radius:18px;padding:14px}
.scene .col{background:rgba(255,255,255,.93)}
.hero{background:url(pizzabutikken/bakgrunn.webp) center/cover;border-radius:18px;padding:18px 12px 8px;margin-bottom:12px}
.hero img{width:220px;height:200px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.brandrow{display:flex;align-items:center;gap:8px}
.brandrow img{width:46px;height:46px;object-fit:contain}
.lvlrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.cinfo{flex:1;min-width:0}
.pbar{height:8px;background:#eee;border-radius:9px;overflow:hidden;margin-top:5px}
.pbar i{display:block;height:100%;width:100%;background:var(--green);border-radius:9px}
.ticket{display:inline-block;background:#fff;border:1px dashed var(--muted);border-radius:6px;padding:0 6px;font-weight:700;font-size:14px}
.tag{display:inline-block;background:var(--gold);color:#fff;border-radius:6px;padding:0 6px;font-weight:700;font-size:14px}
.bubble{font-weight:700;font-size:14px}
.empty{color:var(--muted);text-align:center;padding:20px 8px}
.orderbox{border:2px dashed var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;min-height:54px}
.chk{display:inline-block;margin:2px 4px 2px 0;padding:1px 7px;border-radius:999px;background:#f3eadf;font-size:14px}
.chk.ok{background:#d6f0dc;color:var(--greend);font-weight:700}
.chk.bad{background:#fde2dc;color:var(--redd);font-weight:700}
.pizzawrap{display:flex;justify-content:center;margin:4px 0}
.kitchenrow{display:flex;gap:14px;align-items:center;justify-content:center}
.kitchenrow .acts{display:flex;flex-direction:column;gap:8px}
@media (min-width:921px){
 .play{height:var(--playH,auto)}
 .play .col{display:flex;flex-direction:column;min-height:0;overflow:hidden}
 .play .scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-right:2px}
 .play .ingbtns{align-content:start}
}
@media (max-width:1100px){
 header{padding:6px 12px;gap:6px 10px}
 .brand{font-size:22px}.brand small{font-size:12px}.brandrow img{width:36px;height:36px}
 .stats{flex-wrap:nowrap;gap:4px}.stat{padding:2px 8px;font-size:14px}
 .ctrl{flex-wrap:nowrap;gap:4px}.ctrl button.small{padding:4px 8px}
 nav{padding:6px 12px 0}.tab{padding:6px 10px;font-size:15px}
 main{padding:0 12px 24px}.view{padding:10px}
 .scene{padding:10px}
 .play{grid-template-columns:minmax(200px,1fr) minmax(290px,1.45fr) minmax(190px,.9fr);gap:10px}
 .col{padding:10px}
}
@media (max-height:860px) and (min-width:921px){
 .pizzawrap svg{width:130px;height:130px}
 .orderbox{min-height:0;padding:6px 8px}
 .ingbtns{grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:5px}
 .ingbtns button{padding:4px 3px}.ingbtns button .e{font-size:20px}
 .cimg{width:46px;height:52px}.cust{padding:6px;margin-bottom:6px}
 .col h3{margin-bottom:6px}
}
.ingbtns{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin:8px 0}
.ingbtns button{padding:6px 4px;font-size:14px;line-height:1.1}
.ingbtns button .e{font-size:24px;display:block}
.ingbtns button .n{font-size:12px;color:var(--muted);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.slot{border:2px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px;display:flex;gap:8px;align-items:center;background:var(--card)}
.slot.emptyslot{justify-content:center;color:var(--muted);border-style:dashed;min-height:74px}
.slot.done{border-color:var(--green);background:#e6f5e9}
.slot.burnt{border-color:#555;background:#e7e2de}
.slot .info{flex:1;min-width:0}
.obar{height:8px;background:#eee;border-radius:9px;overflow:hidden;margin:4px 0}
.obar i{display:block;height:100%;width:0;background:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px}
.card .ie{font-size:34px;line-height:1}
.low{color:var(--red);font-weight:700}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:#f7e8d2;font-size:14px}
td.num,th.num{text-align:right;white-space:nowrap}
input[type=number]{width:90px;font-size:16px;padding:6px 8px;border-radius:8px;border:2px solid var(--line);font-family:inherit}
.stars{color:var(--gold);letter-spacing:1px}
.goal{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.goal.done{background:#e6f5e9;border-color:#b6dfc0}
.goal .gi{font-size:22px}
.goal .gt{flex:1}
.gbar{height:8px;background:#eee;border-radius:9px;overflow:hidden;margin-top:4px}
.gbar i{display:block;height:100%;background:var(--green)}
.chart{display:flex;align-items:flex-end;gap:4px;height:160px;border-bottom:2px solid var(--line);padding:6px 0;position:relative}
.chart .b{flex:1;min-width:8px;border-radius:4px 4px 0 0;position:relative}
.chart .b.pos{background:var(--green)}
.chart .b.neg{background:var(--red)}
.prep{max-width:760px;margin:0 auto;text-align:center}
.prep .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;text-align:left;margin:16px 0}
.overlay{position:fixed;inset:0;background:rgba(59,36,21,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border-radius:20px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal table td{padding:5px 8px}
#toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;align-items:center;pointer-events:none;width:min(92vw,480px)}
.toast{background:var(--ink);color:#fff;padding:8px 16px;border-radius:12px;font-weight:700;animation:tin .25s;text-align:center}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
textarea{width:100%;min-height:90px;font-family:monospace;font-size:13px;border-radius:8px;border:2px solid var(--line);padding:8px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;background:#f3eadf;font-size:13px;font-weight:700}
footer{text-align:center;padding:12px;color:var(--muted);font-size:14px}
footer button{margin:3px}
</style>
</head>
<body>
<div class="cloth"></div>
<header id="hdr"></header>
<nav id="nav"></nav>
<main><div class="view" id="view"></div></main>
<footer>
  <button class="small" data-act="help">❓ Slik spiller du</button>
  <button class="small" data-act="export">💾 Lagre-kode</button>
  <button class="small" data-act="import">📂 Last inn kode</button>
  <button class="small" data-act="reset">🗑️ Start helt på nytt</button>
  <div style="margin-top:6px">Pizzabutikken · fremgangen lagres i denne nettleseren</div>
</footer>
<div id="modal"></div>
<div id="toasts"></div>

<script>
/* ================= DATA ================= */
const ING = {
  deig:{n:'Deig',e:'🫓',c:8}, saus:{n:'Tomatsaus',e:'🍅',c:4}, ost:{n:'Ost',e:'🧀',c:12},
  basilikum:{n:'Basilikum',e:'🌿',c:3}, pepperoni:{n:'Pepperoni',e:'🔴',c:10}, skinke:{n:'Skinke',e:'🍖',c:9},
  sopp:{n:'Sopp',e:'🍄',c:5}, ananas:{n:'Ananas',e:'🍍',c:6}, paprika:{n:'Paprika',e:'🫑',c:4},
  lok:{n:'Løk',e:'🧅',c:3}, oliven:{n:'Oliven',e:'🫒',c:6}, kylling:{n:'Kylling',e:'🍗',c:14},
  kjottdeig:{n:'Kjøttdeig',e:'🥩',c:12}, jalapeno:{n:'Jalapeño',e:'🌶️',c:5}, bacon:{n:'Bacon',e:'🥓',c:11},
  troffel:{n:'Trøffel',e:'⚫',c:45}
};
const RECIPES = [
  {id:'margherita',n:'Margherita',ings:['deig','saus','ost','basilikum'],cost:0,pop:3},
  {id:'pepperoni',n:'Pepperoni',ings:['deig','saus','ost','pepperoni'],cost:0,pop:4},
  {id:'skinkesopp',n:'Skinke & sopp',ings:['deig','saus','ost','skinke','sopp'],cost:0,pop:3},
  {id:'hawaii',n:'Hawaii',ings:['deig','saus','ost','skinke','ananas'],cost:500,pop:3},
  {id:'vegetar',n:'Vegetar',ings:['deig','saus','ost','paprika','lok','sopp','oliven'],cost:1200,pop:2},
  {id:'kylling',n:'Kylling deluxe',ings:['deig','saus','ost','kylling','paprika','lok'],cost:2500,pop:3},
  {id:'meksikansk',n:'Meksikaneren',ings:['deig','saus','ost','kjottdeig','jalapeno','lok','paprika'],cost:5000,pop:3},
  {id:'kjotteter',n:'Kjøtteteren',ings:['deig','saus','ost','bacon','pepperoni','skinke','kjottdeig'],cost:9000,pop:3},
  {id:'troffel',n:'Hvit trøffel',ings:['deig','ost','sopp','troffel','basilikum'],cost:20000,pop:1.5,lux:1.6}
];
const REC = Object.fromEntries(RECIPES.map(r=>[r.id,r]));
const LEVELS = [
  {n:'Pizzavogn',e:'🚚',c:0,rent:30,staff:1,queue:3,spawn:9.5},
  {n:'Liten pizzeria',e:'🏠',c:2500,rent:120,staff:2,queue:4,spawn:7.5},
  {n:'Familierestaurant',e:'🏡',c:10000,rent:300,staff:4,queue:6,spawn:6},
  {n:'Pizzapalass',e:'🏰',c:35000,rent:700,staff:6,queue:8,spawn:4.8},
  {n:'Pizzakjede-flaggskip',e:'🏙️',c:100000,rent:1500,staff:8,queue:10,spawn:3.8}
];
const Q = [
  {n:'Standard',buy:1,fair:1,rep:1,cap:4.6},
  {n:'Premium',buy:1.5,fair:1.4,rep:1.3,cap:4.85},
  {n:'Gourmet',buy:2.2,fair:1.95,rep:1.7,cap:5}
];
const UPG = {
  ovn:{n:'Pizzaovn',e:'🔥',d:'Raskere steking.',lv:[{n:'Enkel ovn',c:0,v:10},{n:'Steinovn',c:700,v:8},{n:'Vedovn',c:2500,v:6},{n:'Italiensk vedovn',c:9000,v:4.5},{n:'Turbo-ovn',c:30000,v:3}],f:v=>v.toString().replace('.',',')+' sek steketid'},
  slots:{n:'Ovnsplasser',e:'🍕',d:'Flere pizzaer i ovnen samtidig.',lv:[{c:0,v:1},{c:500,v:2},{c:2000,v:3},{c:6000,v:4},{c:15000,v:5},{c:40000,v:6}],f:v=>v+(v===1?' plass':' plasser')},
  alarm:{n:'Steketimer',e:'⏰',d:'Lengre tid før en ferdig pizza brenner.',lv:[{c:0,v:6},{c:400,v:12},{c:2000,v:25}],f:v=>v+' sek før den brenner'},
  fridge:{n:'Kjølerom',e:'❄️',d:'Mindre svinn av ingredienser over natten.',lv:[{c:0,v:.25},{c:500,v:.15},{c:1800,v:.08},{c:6000,v:.03},{c:15000,v:0}],f:v=>Math.round(v*100)+' % svinn per natt'},
  decor:{n:'Interiør',e:'🪴',d:'Gjestene betaler mer og venter lenger.',lv:[{c:0,v:0},{c:600,v:1},{c:2000,v:2},{c:6000,v:3},{c:15000,v:4},{c:40000,v:5}],f:v=>'+'+v*8+' % betalingsvilje'},
  ads:{n:'Reklame',e:'📣',d:'Flere gjester hver dag.',lv:[{n:'Ingen',c:0,v:0},{n:'Plakater',c:400,v:1},{n:'Avisannonse',c:1500,v:2},{n:'Radioreklame',c:5000,v:3},{n:'Sosiale medier',c:14000,v:4},{n:'TV-reklame',c:40000,v:5}],f:v=>'+'+v*15+' % flere gjester'},
  quality:{n:'Ingredienskvalitet',e:'✨',d:'Dyrere innkjøp, men gjestene betaler mer og blir gladere. Bedre kvalitet trengs for de høyeste stjernene.',lv:[{n:'Standard',c:0,v:0},{n:'Premium',c:3000,v:1},{n:'Gourmet',c:12000,v:2}],f:v=>Q[v].n+' (maks '+String(Q[v].cap).replace('.',',')+' stjerner)'}
};
const ROLES = {
  kasserer:{n:'Kasserer',e:'🧾',w:90,d:'Tar imot bestillinger automatisk.'},
  kokk:{n:'Kokk',e:'👨‍🍳',w:150,d:'Lager pizza til ventende gjester og setter dem i ovnen. Kan gjøre feil.'},
  servitor:{n:'Servitør',e:'🛎️',w:100,d:'Serverer ferdige pizzaer. Gjestene venter også litt lenger.'},
  innkjoper:{n:'Innkjøper',e:'📦',w:110,d:'Fyller lageret opp hver morgen og gir rabatt på varer.'},
  marked:{n:'Markedsfører',e:'📊',w:130,d:'Lokker flere gjester og forteller hva gjestene synes om prisene.'}
};
const PERKS = [
  {id:'kapital',n:'Gründerkapital',d:'+1 000 kr i startpenger',max:10},
  {id:'navn',n:'Kjent navn',d:'+0,3 stjerner i startomdømme',max:5},
  {id:'effektiv',n:'Gode leverandøravtaler',d:'−5 % pris på ingredienser',max:8},
  {id:'baker',n:'Mesterbaker',d:'−8 % steketid',max:5},
  {id:'talmodig',n:'Tålmodige gjester',d:'+10 % tålmodighet',max:5},
  {id:'gull',n:'Gullkasse',d:'+5 % betalt per pizza',max:10},
  {id:'oppskrift',n:'Familieoppskrifter',d:'Starter med én ekstra pizzaoppskrift',max:3}
];
const GOALS = [
  {n:'Server din første pizza',t:1,g:()=>S.stats.served,r:100},
  {n:'Server 25 pizzaer',t:25,sc:1,g:()=>S.stats.served,r:300},
  {n:'Ansett din første medarbeider',t:1,g:()=>S.stats.hired,r:200},
  {n:'Få 500 kr i resultat på én dag',t:500,sc:1,kr:1,g:()=>S.stats.bestProfit,r:400},
  {n:'Lås opp 2 nye pizzaoppskrifter',t:2,g:()=>S.stats.unlocks,r:600},
  {n:'Flytt fra pizzavognen til Liten pizzeria',t:1,g:()=>S.level,r:800,lvl:1},
  {n:'Nå 4 stjerner i omdømme',t:4,g:()=>S.rep,r:1000,dec:1},
  {n:'Send en ansatt på kurs',t:1,g:()=>S.stats.courses,r:600},
  {n:'Ha 3 ansatte samtidig',t:3,g:()=>S.staff.length,r:1500},
  {n:'Selg for 50 000 kr totalt',t:50000,sc:1,kr:1,g:()=>S.stats.revenue,r:3000},
  {n:'Kjøp Premium-ingredienser',t:1,g:()=>S.upg.quality,r:2000,lvl:1},
  {n:'Få 3 000 kr i resultat på én dag',t:3000,sc:1,kr:1,g:()=>S.stats.bestProfit,r:4000},
  {n:'Server 500 pizzaer',t:500,sc:1,g:()=>S.stats.served,r:5000},
  {n:'Flytt inn i Pizzapalasset',t:3,g:()=>S.level,r:6000,lvl:1},
  {n:'Kjøp Gourmet-ingredienser',t:2,g:()=>S.upg.quality,r:6000,lvl:1},
  {n:'Lås opp alle pizzaoppskriftene',t:RECIPES.length-3,g:()=>S.unlocked.length-3,r:8000},
  {n:'Selg for 500 000 kr totalt',t:500000,sc:1,kr:1,g:()=>S.stats.revenue,r:20000},
  {n:'Nå 5 stjerner i omdømme',t:4.9,g:()=>S.rep,r:15000,dec:1},
  {n:'Åpne Pizzakjede-flaggskipet',t:4,g:()=>S.level,r:25000,lvl:1}
];
const ANIMALS = ['🐻','🐰','🦊','🐼','🐸','🐱','🐶','🐨','🦁','🐷','🐮','🐵','🐔','🐧','🦉','🐹','🦝','🦦','🐯','🐭','🦔','🐺','🦒','🐙'];
const NAMES = ['Aksel','Ingrid','Mohammed','Sofie','Jonas','Nora','Emil','Leah','Filip','Amina','Oskar','Maja','Liam','Ella','Noah','Selma','Isak','Hedda','Ali','Frida','Theo','Sara','Mathias','Tuva','Olav','Astrid','Yusuf','Live','Sander','Iben','Viktor','Mia','Elias','Hanna','Tobias','Ronja'];
const IMG='pizzabutikken/';
const CUSTS=['bjorn','kanin','katt','hund','panda','frosk','gris','ugle','pingvin','love','pinnsvin','vaskebjorn','elefant'];
const roleImg=r=>`<img class="simg" src="${IMG}ansatt-${r}.webp" alt="${ROLES[r].n}">`;
const lvlImg=(i,cls)=>`<img class="${cls||'bimg'}" src="${IMG}bygg-${i}.webp" alt="${LEVELS[i].n}">`;
const DAY_LEN = 120;
const SAVE_KEY = 'pizzabutikken_v1';

/* ================= HJELPERE ================= */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const roundTo=(v,s)=>Math.round(v/s)*s;
const fmt=n=>Math.round(n).toLocaleString('nb-NO')+' kr';
const fmt1=n=>(Math.round(n*10)/10).toLocaleString('nb-NO',{minimumFractionDigits:1,maximumFractionDigits:1})+' kr';
const pct=v=>Math.round(v*100)+' %';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let S, META, D=null, dirty=true;
const UI={tab:'play',paused:false,speed:1};

function perk(id){return META.perks[id]||0;}
function staffOf(role){return S.staff.filter(s=>s.role===role);}
function maxSkill(role){return staffOf(role).reduce((m,s)=>Math.max(m,s.skill),0);}
function sumSkill(role){return staffOf(role).reduce((m,s)=>m+s.skill,0);}
function qual(){return Q[S.upg.quality];}
function portionCost(k){return ING[k].c*qual().buy*(1-0.05*perk('effektiv'))*(1-0.02*maxSkill('innkjoper'));}
function recipeCost(r){return r.ings.reduce((s,k)=>s+portionCost(k),0);}
function baseCost(r){return r.ings.reduce((s,k)=>s+ING[k].c,0);}
function fairPrice(r){return baseCost(r)*3.3*qual().fair*(1+0.08*UPG.decor.lv[S.upg.decor].v)*(1+0.05*S.level)*(0.75+0.1*S.rep)*(r.lux||1);}
function bakeTime(){return UPG.ovn.lv[S.upg.ovn].v*(1-0.08*perk('baker'));}
function burnGrace(){return UPG.alarm.lv[S.upg.alarm].v;}
function slots(){return UPG.slots.lv[S.upg.slots].v;}
function spoil(){return UPG.fridge.lv[S.upg.fridge].v;}
function usedIngs(){const set=new Set();S.unlocked.forEach(id=>REC[id].ings.forEach(i=>set.add(i)));return Object.keys(ING).filter(k=>set.has(k));}
function matchRecipe(ings){const key=[...ings].sort().join(',');const r=RECIPES.find(r=>[...r.ings].sort().join(',')===key);return r?r.id:null;}
function addRep(v){S.rep=clamp(S.rep+v,0,5);}
function wagesTotal(){return S.staff.reduce((s,x)=>s+x.wage,0);}
function scaleM(){return 1+0.5*META.rebirths;}
function goalTarget(g){return g.sc?Math.round(g.t*scaleM()):g.t;}
function goalReward(g){return Math.round(g.r*scaleM());}
function starsHTML(r){const f=Math.round(r);return '<span class="stars">'+'★'.repeat(f)+'<span style="opacity:.3">'+'★'.repeat(5-f)+'</span></span>';}
function canMake(id){return REC[id].ings.every(k=>S.stock[k]>=1);}
function howMany(id){return Math.min(...REC[id].ings.map(k=>S.stock[k]));}
function feel(ratio){
  if(ratio<0.8)return['😀','Billig'];
  if(ratio<1.0)return['🙂','Passe'];
  if(ratio<1.2)return['😐','Litt dyr'];
  if(ratio<1.45)return['😬','Dyr'];
  return['😡','Altfor dyr'];
}
function acceptProb(ratio){if(ratio<=0.95)return 1;return clamp(1-(ratio-0.95)/0.6,0,1);}

/* ================= LYD ================= */
let AC=null;
function tone(f,d,type='sine',vol=.07,delay=0){
  if(!META||!META.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime+delay;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}
}
function sfx(k){
  if(k==='cash'){tone(880,.12,'triangle');tone(1320,.2,'triangle',.07,.1);}
  else if(k==='ding')tone(1046,.25,'sine',.05);
  else if(k==='bad')tone(170,.3,'sawtooth',.04);
  else if(k==='pop')tone(560,.05,'square',.025);
  else if(k==='bell'){tone(660,.12,'sine',.04);tone(990,.18,'sine',.04,.1);}
  else if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.06,i*.1));}
}

/* ================= LAGRING ================= */
function defaultMeta(){return {rebirths:0,lp:0,perks:{},lifetime:0,sound:true,intro:false};}
function newRun(){
  const unlocked=['margherita','pepperoni','skinkesopp'];
  for(let i=0;i<perk('oppskrift');i++){const r=RECIPES.find(r=>!unlocked.includes(r.id));if(r)unlocked.push(r.id);}
  const s={money:800+1000*perk('kapital'),day:1,rep:clamp(2.5+0.3*perk('navn'),0,4.5),stock:{},target:{},prices:{},unlocked,
    upg:{ovn:0,slots:0,alarm:0,fridge:0,decor:0,ads:0,quality:0},level:0,staff:[],pool:[],goals:{},nextId:1,
    stats:{served:0,revenue:0,bestProfit:0,hired:0,courses:0,unlocks:0,wrong:0,angry:0},
    history:[],loan:null,phase:'prep',lastReport:null,lastRec:{},todaySpent:0,restockNote:''};
  for(const k in ING){s.stock[k]=0;s.target[k]=15;}
  ['deig','saus','ost'].forEach(k=>s.stock[k]=15);
  ['basilikum','pepperoni','skinke','sopp'].forEach(k=>s.stock[k]=8);
  RECIPES.forEach(r=>s.prices[r.id]=roundTo(baseCost(r)*3,5));
  return s;
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({S,META}));}catch(e){}}
function load(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const o=JSON.parse(raw);if(o&&o.S&&o.META){META=Object.assign(defaultMeta(),o.META);S=o.S;return true;}}}catch(e){}
  return false;
}

/* ================= DAGEN ================= */
function genCand(){
  const role=pick(Object.keys(ROLES));
  const maxSk=Math.min(5,2+S.level);
  const sk=1+Math.floor(Math.pow(Math.random(),1.3)*maxSk);
  const wage=roundTo(ROLES[role].w*(0.6+0.35*sk)*rnd(.9,1.15)*(1+0.15*S.level),5);
  return {id:S.nextId++,name:pick(NAMES),e:pick(ANIMALS),role,skill:clamp(sk,1,5),wage};
}
function genPool(){S.pool=[genCand(),genCand(),genCand()];}

function restock(){
  S.restockNote='';
  if(!staffOf('innkjoper').length)return;
  let spent=0,items=0;
  for(const k of usedIngs()){
    const need=S.target[k]-S.stock[k];
    if(need<=0)continue;
    const pc=portionCost(k);
    const n=Math.min(need,Math.floor(Math.max(0,S.money)/pc));
    if(n<=0)continue;
    S.money-=n*pc;S.todaySpent+=n*pc;S.stock[k]+=n;spent+=n*pc;items+=n;
  }
  if(items)S.restockNote=`📦 Innkjøperen kjøpte ${items} porsjoner for ${fmt(spent)} i morges.`;
}

function openDay(){
  if(S.phase!=='prep')return;
  S.phase='open';
  D={t:0,customers:[],oven:[],build:null,activeCust:null,nextSpawn:1.5,uid:0,money0:S.money,
     today:{revenue:0,tips:0,cogs:0,served:0,angry:0,pricey:0,empty:0,full:0,wrong:0,burnt:0},rec:{},warned:{}};
  S.staff.forEach(s=>s.cd=rnd(0.5,2));
  UI.paused=false;UI.tab='play';
  sfx('bell');dirty=true;renderAll();
}
function spawnInterval(){
  const base=LEVELS[S.level].spawn;
  const boost=1+0.15*UPG.ads.lv[S.upg.ads].v+0.08*sumSkill('marked')+0.12*(S.rep-2.5);
  return base/Math.max(0.5,boost);
}
function maxPatience(){
  return 50*(1+0.06*UPG.decor.lv[S.upg.decor].v)*(1+0.1*perk('talmodig'))*(1+0.06*maxSkill('servitor'));
}
function activeCusts(){return D.customers.filter(c=>c.state!=='leaving');}
function spawnCustomer(){
  if(activeCusts().length>=LEVELS[S.level].queue){D.today.full++;return;}
  const mp=maxPatience();
  const c={id:++D.uid,name:pick(NAMES),e:pick(ANIMALS),state:'waiting',img:pick(CUSTS),pat:mp,max:mp,order:null,price:0,hasPizza:false,bubble:'',ratio:1};
  D.customers.push(c);sfx('pop');dirty=true;
}
function rec(id){return D.rec[id]||(D.rec[id]={sold:0,pricey:0});}
function weightedPick(ids){const tot=ids.reduce((s,id)=>s+REC[id].pop,0);let x=Math.random()*tot;for(const id of ids){x-=REC[id].pop;if(x<=0)return id;}return ids[ids.length-1];}
function takeOrder(c){
  if(c.state!=='waiting')return;
  let avail=S.unlocked.filter(canMake);
  if(!avail.length){leave(c,'😕 Dere har ikke ingredienser til noe!');addRep(-0.04);D.today.empty++;return;}
  let chosen=null;
  for(let a=0;a<2&&avail.length;a++){
    const id=weightedPick(avail);
    const ratio=S.prices[id]/fairPrice(REC[id]);
    if(Math.random()<acceptProb(ratio)){chosen=id;c.ratio=ratio;break;}
    rec(id).pricey++;avail=avail.filter(x=>x!==id);
  }
  if(!chosen){leave(c,'💸 Altfor dyrt for meg!');addRep(-0.01);D.today.pricey++;return;}
  c.state='ordered';c.order=chosen;c.price=S.prices[chosen];
  c.pat=Math.min(c.max,c.pat+0.25*c.max);
  if(D.activeCust==null)D.activeCust=c.id;
  sfx('pop');dirty=true;
}
function leave(c,text){
  c.state='leaving';c.leaveT=2.2;c.bubble=text;
  if(D.activeCust===c.id)D.activeCust=nextFreeCust();
  D.oven.forEach(p=>{if(p.custId===c.id)p.custId=null;});
  dirty=true;
}
function nextFreeCust(){const c=D.customers.find(c=>c.state==='ordered'&&!c.hasPizza&&c.id!==D.activeCust);return c?c.id:null;}
function clickCust(id){
  const c=D.customers.find(c=>c.id===id);if(!c)return;
  if(c.state==='waiting'){takeOrder(c);return;}
  if(c.state==='ordered'&&!c.hasPizza){D.activeCust=(D.activeCust===id?null:id);dirty=true;}
  else if(c.state==='ordered'&&c.hasPizza){toast('Pizzaen til '+c.name+' er allerede i ovnen 🔥');}
}
function addIng(k){
  if(!D)return;
  if(S.stock[k]<1){toast('Tomt for '+ING[k].n.toLowerCase()+'! Kjøp mer under Innkjøp.');sfx('bad');return;}
  if(!D.build)D.build={ings:[]};
  if(k!=='deig'&&!D.build.ings.includes('deig')){toast('Start med deig 🫓');return;}
  if(D.build.ings.includes(k)){toast(ING[k].n+' er allerede på pizzaen');return;}
  S.stock[k]--;D.today.cogs+=portionCost(k);D.build.ings.push(k);sfx('pop');dirty=true;
}
function trashBuild(){if(!D||!D.build)return;D.build=null;toast('🗑️ Pizzaen ble kastet');dirty=true;}
function toOven(){
  if(!D||!D.build||!D.build.ings.includes('deig')){toast('Lag en pizza først – start med deig');return;}
  if(D.oven.length>=slots()){toast('Ovnen er full! Server eller kast en pizza først.');sfx('bad');return;}
  const p={id:++D.uid,ings:D.build.ings,rid:matchRecipe(D.build.ings),t:0,state:'baking',custId:null,by:'deg'};
  const c=D.customers.find(c=>c.id===D.activeCust);
  if(c&&c.state==='ordered'&&!c.hasPizza){p.custId=c.id;c.hasPizza=true;}
  D.oven.push(p);D.build=null;D.activeCust=nextFreeCust();sfx('pop');dirty=true;
}
function findTarget(p){
  if(p.custId){const c=D.customers.find(c=>c.id===p.custId&&c.state==='ordered');if(c)return c;}
  const c=D.customers.find(c=>c.state==='ordered'&&!c.hasPizza&&c.order===p.rid);
  return c||null;
}
function servePizza(pid){
  const p=D.oven.find(p=>p.id===pid);if(!p||p.state!=='done')return false;
  const c=findTarget(p);
  if(!c){toast('Ingen gjest venter på akkurat denne pizzaen. Kast den eller vent på en bestilling.');return false;}
  D.oven=D.oven.filter(x=>x!==p);deliver(c,p);return true;
}
function tossPizza(pid){const p=D.oven.find(p=>p.id===pid);if(!p)return;D.oven=D.oven.filter(x=>x!==p);if(p.custId){const c=D.customers.find(c=>c.id===p.custId);if(c)c.hasPizza=false;}dirty=true;}
function deliver(c,p){
  const correct=p.rid===c.order;
  if(correct){
    const pay=c.price*(1+0.05*perk('gull'));
    const tip=c.price*0.25*(c.pat/c.max)*(c.ratio<0.8?1.3:1)*(1+0.05*maxSkill('servitor'));
    S.money+=pay+tip;D.today.revenue+=pay;D.today.tips+=tip;S.stats.revenue+=pay+tip;S.stats.served++;D.today.served++;
    rec(c.order).sold++;
    if(S.rep<qual().cap)addRep((0.025*qual().rep*(c.pat/c.max>0.5?1:0.5)+(c.ratio<0.8?0.005:0))*Math.max(0.05,(5.2-S.rep)/2.7));
    leave(c,'😋 Nydelig! +'+fmt(tip)+' i tips');sfx('cash');
  }else{
    const pay=c.price*0.5;
    S.money+=pay;D.today.revenue+=pay;S.stats.revenue+=pay;D.today.wrong++;S.stats.wrong++;
    addRep(-0.06);leave(c,'😒 Dette bestilte jeg ikke! (betalte halv pris)');sfx('bad');
  }
  checkGoals();dirty=true;
}
function staffTick(dt){
  for(const s of S.staff){
    if(s.role==='innkjoper'||s.role==='marked')continue;
    s.cd=(s.cd||0)-dt;if(s.cd>0)continue;
    let did=false;
    if(s.role==='kasserer'){
      const c=D.customers.find(c=>c.state==='waiting');
      if(c){takeOrder(c);did=true;}
      s.cd=did?7-1.1*s.skill:0.4;
    }else if(s.role==='kokk'){
      if(D.oven.length<slots()){
        const c=D.customers.find(c=>c.state==='ordered'&&!c.hasPizza&&c.id!==D.activeCust);
        if(c){
          const r=REC[c.order];
          const miss=r.ings.find(k=>S.stock[k]<1);
          if(miss){if(!D.warned[miss]){D.warned[miss]=1;toast(s.e+' '+s.name+': Vi er tomme for '+ING[miss].n.toLowerCase()+'!');}}
          else{
            let ings=[...r.ings];
            ings.forEach(k=>{S.stock[k]--;D.today.cogs+=portionCost(k);});
            if(Math.random()<0.18-0.035*s.skill){const i=1+Math.floor(Math.random()*(ings.length-1));ings.splice(i,1);}
            D.oven.push({id:++D.uid,ings,rid:matchRecipe(ings),t:0,state:'baking',custId:c.id,by:s.name});
            c.hasPizza=true;did=true;dirty=true;
          }
        }
      }
      s.cd=did?11-1.6*s.skill:0.5;
    }else if(s.role==='servitor'){
      const burnt=D.oven.find(p=>p.state==='burnt');
      if(burnt){tossPizza(burnt.id);did=true;}
      else{for(const p of D.oven){if(p.state==='done'&&findTarget(p)){servePizza(p.id);did=true;break;}}}
      s.cd=did?6-0.9*s.skill:0.4;
    }
  }
}
function tick(dt){
  D.t+=dt;
  if(D.t<DAY_LEN){D.nextSpawn-=dt;if(D.nextSpawn<=0){spawnCustomer();D.nextSpawn=spawnInterval()*rnd(0.6,1.4);}}
  for(const c of D.customers){
    if(c.state==='leaving'){c.leaveT-=dt;continue;}
    c.pat-=dt;
    if(c.pat<=0){leave(c,'😠 Jeg gidder ikke vente mer!');addRep(-0.08);D.today.angry++;S.stats.angry++;sfx('bad');}
  }
  const before=D.customers.length;
  D.customers=D.customers.filter(c=>!(c.state==='leaving'&&c.leaveT<=0));
  if(D.customers.length!==before)dirty=true;
  const bt=bakeTime(),bg=burnGrace();
  for(const p of D.oven){
    p.t+=dt;
    const st=p.t>=bt+bg?'burnt':p.t>=bt?'done':'baking';
    if(st!==p.state){p.state=st;dirty=true;
      if(st==='done')sfx('ding');
      if(st==='burnt'){sfx('bad');toast('🔥 En pizza ble brent!');D.today.burnt++;if(p.custId){const c=D.customers.find(c=>c.id===p.custId);if(c)c.hasPizza=false;p.custId=null;}}}
  }
  staffTick(dt);
  if(D.t>=DAY_LEN){
    if(!activeCusts().length&&!D.customers.length){endDay();return;}
    if(D.t>=DAY_LEN+45){activeCusts().forEach(c=>leave(c,'🌙 Dere stenger, jeg går hjem.'));if(D.t>=DAY_LEN+48){endDay();return;}}
  }
}
function endDay(){
  if(S.phase!=='open')return;
  const t=D.today;
  const wages=wagesTotal(),rent=LEVELS[S.level].rent;
  let loanPay=0,interest=0;
  if(S.loan){loanPay=S.loan.pay;interest=S.loan.interest;S.loan.left--;if(S.loan.left<=0){S.loan=null;toast('🎉 Lånet er nedbetalt!');}}
  S.money-=wages+rent+loanPay;
  let spoilVal=0,spoilN=0;const f=spoil();
  if(f>0){for(const k in S.stock){const lost=Math.round(S.stock[k]*f);if(lost>0){S.stock[k]-=lost;spoilVal+=lost*portionCost(k);spoilN+=lost;}}}
  const income=t.revenue+t.tips;
  const profit=income-t.cogs-spoilVal-wages-rent-interest;
  const r={day:S.day,revenue:t.revenue,tips:t.tips,cogs:t.cogs,spoilVal,spoilN,wages,rent,interest,loanPay,profit,
    served:t.served,angry:t.angry,pricey:t.pricey,empty:t.empty,full:t.full,wrong:t.wrong,burnt:t.burnt,spent:S.todaySpent,cash0:D.money0,cash1:S.money};
  S.stats.bestProfit=Math.max(S.stats.bestProfit,profit);
  S.history.push({day:S.day,profit:Math.round(profit),income:Math.round(income)});
  if(S.history.length>30)S.history.shift();
  S.lastReport=r;S.lastRec=D.rec;
  S.phase='report';D=null;
  checkGoals();save();
  showModal(reportHTML(r,true));
  dirty=true;renderAll();
}
function nextDay(){
  if(S.phase!=='report')return;
  S.day++;S.phase='prep';S.todaySpent=0;
  genPool();restock();
  save();closeModal();UI.tab='play';dirty=true;renderAll();
}

/* ================= KJØP OG HANDLINGER ================= */
function spend(cost){
  if(S.money<cost){toast('Du har ikke nok penger 💸');sfx('bad');return false;}
  S.money-=cost;return true;
}
function afterAction(){checkGoals();if(S.phase==='prep')save();dirty=true;}
function buy(k,n){const cost=portionCost(k)*n;if(!spend(cost))return;S.stock[k]+=n;S.todaySpent+=cost;sfx('pop');afterAction();}
function unlockRecipe(id){
  const r=REC[id];if(S.unlocked.includes(id))return;
  if(!spend(r.cost))return;
  S.unlocked.push(id);S.stats.unlocks++;sfx('win');
  const missing=r.ings.filter(k=>S.stock[k]<1).map(k=>ING[k].n.toLowerCase());
  toast('🍕 '+r.n+' er på menyen!'+(missing.length?' Husk å kjøpe '+missing.join(', ')+'.':''));
  afterAction();
}
function buyUpg(key){
  const u=UPG[key],cur=S.upg[key];if(cur>=u.lv.length-1)return;
  const nx=u.lv[cur+1];if(!spend(nx.c))return;
  S.upg[key]++;sfx('win');toast(u.e+' '+u.n+' oppgradert!');afterAction();
}
function buyLevel(){
  if(S.level>=LEVELS.length-1)return;
  const nx=LEVELS[S.level+1];if(!spend(nx.c))return;
  S.level++;sfx('win');toast(nx.e+' Gratulerer med '+nx.n+'!');afterAction();
}
function hire(id){
  if(S.staff.length>=LEVELS[S.level].staff){toast('Det er ikke plass til flere ansatte. Oppgrader restauranten!');return;}
  const c=S.pool.find(p=>p.id===id);if(!c)return;
  S.pool=S.pool.filter(p=>p.id!==id);c.cd=1;S.staff.push(c);S.stats.hired++;
  sfx('bell');toast(c.e+' '+c.name+' er ansatt som '+ROLES[c.role].n.toLowerCase()+'!');
  if(c.role==='innkjoper'&&S.phase==='prep')toast('Tips: sett mål for lageret under Innkjøp.');
  afterAction();
}
function fire(id){
  const s=S.staff.find(x=>x.id===id);if(!s)return;
  showModal(`<h2>Si opp ${esc(s.name)}?</h2><p>${s.e} ${esc(s.name)} (${ROLES[s.role].n}) slutter med en gang. Du sparer ${fmt(s.wage)} i lønn per dag.</p><div class="row"><button class="primary" data-act="fireok" data-id="${id}">Ja, si opp</button><button data-act="close">Avbryt</button></div>`);
}
function fireOk(id){S.staff=S.staff.filter(x=>x.id!==id);closeModal();toast('Ansatt sagt opp');afterAction();}
function courseCost(s){return 300*s.skill*(1+0.3*S.level);}
function course(id){
  const s=S.staff.find(x=>x.id===id);if(!s||s.skill>=5)return;
  if(!spend(courseCost(s)))return;
  s.skill++;s.wage=roundTo(s.wage*1.18,5);S.stats.courses++;sfx('win');
  toast('🎓 '+s.name+' er nå '+s.skill+'-stjerners '+ROLES[s.role].n.toLowerCase()+'!');afterAction();
}
function takeLoan(){
  if(S.loan)return;
  S.money+=1500;S.loan={left:12,pay:150,interest:25};
  toast('🏦 Du lånte 1 500 kr');afterAction();
}
function allGoalsDone(){return GOALS.every((g,i)=>S.goals[i]);}
function checkGoals(){
  GOALS.forEach((g,i)=>{
    if(S.goals[i])return;
    if(g.g()>=goalTarget(g)){S.goals[i]=true;const rw=goalReward(g);S.money+=rw;sfx('win');toast('🏆 Mål nådd: '+g.n+' (+'+fmt(rw)+')');dirty=true;}
  });
}
function lpGain(){return 5+Math.floor(Math.sqrt(S.stats.revenue/2000))+META.rebirths*2;}
function askRebirth(){
  if(!allGoalsDone())return;
  showModal(`<h2>🌟 Åpne en ny filial?</h2><p>Du har klart alle målene! Nå kan du selge denne restauranten og starte en ny filial fra en pizzavogn.</p>

function doRebirth(){
  if(!allGoalsDone())return;
  META.lp+=lpGain();META.rebirths++;META.lifetime+=S.stats.revenue;
  S=newRun();genPool();save();closeModal();UI.tab='goals';sfx('win');
  toast('🌟 Filial #'+(META.rebirths+1)+' er åpnet! Bruk LP på bonuser.');dirty=true;renderAll();
}
function perkCost(p){return (perk(p.id)+1)*3;}
function buyPerk(id){
  const p=PERKS.find(x=>x.id===id);if(!p||perk(id)>=p.max)return;
  const c=perkCost(p);if(META.lp<c){toast('Ikke nok legendepoeng');return;}
  META.lp-=c;META.perks[id]=perk(id)+1;
  if(id==='kapital'&&S.day===1&&S.phase==='prep')S.money+=1000;
  if(id==='navn'&&S.day===1&&S.phase==='prep')addRep(0.3);
  if(id==='oppskrift'&&S.day===1&&S.phase==='prep'){const r=RECIPES.find(r=>!S.unlocked.includes(r.id));if(r)S.unlocked.push(r.id);}

}

function pizzaSVG(ings,size){
  size=size||170;
  let s=`<svg viewBox="0 0 200 200" width="${size}" height="${size}" role="img" aria-label="Pizza">`;
  s+=`<circle cx="100" cy="100" r="96" fill="#ffffff" stroke="#ecd6b8" stroke-width="4"/>`;
  if(!ings||!ings.includes('deig')){s+=`<text x="100" y="108" text-anchor="middle" font-size="16" fill="#b59a84">Tom tallerken</text></svg>`;return s;}
  s+=`<circle cx="100" cy="100" r="84" fill="#dca560"/><circle cx="100" cy="100" r="74" fill="#f1cd8c"/>`;
  if(ings.includes('saus'))s+=`<circle cx="100" cy="100" r="70" fill="#c9362a"/>`;
  if(ings.includes('ost')){s+=`<circle cx="100" cy="100" r="64" fill="#f7d65a" opacity=".92"/>`;
    [[70,80,16],[128,78,14],[92,128,17],[132,122,12],[100,98,14]].forEach(([x,y,r])=>s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fbe58f"/>`);}
  const tops=ings.filter(k=>!['deig','saus','ost'].includes(k));
  tops.forEach((k,j)=>{
    for(let i=0;i<5;i++){
      const a=(i*72+j*31)*Math.PI/180,rad=i%2?50:28;
      const x=100+Math.cos(a)*rad,y=100+Math.sin(a)*rad;
      if(k==='pepperoni')s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="10" fill="#a8321f"/><circle cx="${(x-3).toFixed(1)}" cy="${(y-3).toFixed(1)}" r="3" fill="#c9533b"/>`;
      else s+=`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="20" text-anchor="middle" dominant-baseline="central">${ING[k].e}</text>`;
    }
  });
  return s+'</svg>';
}
function clockStr(){

  }
  const bt=bakeTime(),bg=burnGrace();
  for(const p of D.oven){
    const el=document.getElementById('ob'+p.id);if(!el)continue;
    if(p.t<bt){el.style.width=(p.t/bt*100)+'%';el.style.background='var(--gold)';}

  }

  if(N)h+=`<p><b>Neste: ${N.e} ${N.n}</b> – husleie ${fmt(N.rent)}/dag, ${N.staff} ansatte, ${N.queue} gjester og flere gjester per dag.</p><button class="primary" data-act="level" ${S.money<N.c?'disabled':''}>Flytt dit: ${fmt(N.c)}</button>`;
  else h+=`<p>Du har den største restauranten! 🎉</p>`;
  h+='</div><div class="grid">';
  for(const key in UPG){
    const u=UPG[key],cur=S.upg[key],L1=u.lv[cur],N1=u.lv[cur+1];
    h+=`<div class="card"><div class="row"><span class="ie">${u.e}</span><div><b>${u.n}</b><div class="small">${u.d}</div></div></div><div style="margin:6px 0">Nå: ${L1.n?'<b>'+L1.n+'</b> – ':''}${u.f(L1.v)}</div>`;
    if(N1)h+=`<div class="small">Neste: ${N1.n?N1.n+' – ':''}${u.f(N1.v)}</div><button class="primary small" style="margin-top:6px" data-act="upg" data-k="${key}" ${S.money<N1.c?'disabled':''}>Kjøp: ${fmt(N1.c)}</button>`;
    else h+=`<span class="pill">Maks nivå</span>`;
    h+='</div>';
  }
  return h+'</div>';
}
function renderGoals(){
  const done=GOALS.filter((g,i)=>S.goals[i]).length;
  let h=`<h2>🏆 Mål</h2><p class="lead">Fullfør alle målene for å kunne åpne en ny filial (rebirth). Du har klart <b>${done} av ${GOALS.length}</b>.</p>`;
  if(allGoalsDone())h+=`<div class="hint" style="text-align:center"><b>Alle mål er nådd!</b> Du kan spille videre så lenge du vil, eller åpne en ny filial.<br><button class="go big" style="margin-top:8px" data-act="rebirth">🌟 Åpne ny filial (+${lpGain()} LP)</button></div>`;
  GOALS.forEach((g,i)=>{
    const tgt=goalTarget(g),cur=g.g(),ok=S.goals[i];
    let prog;
    if(g.lvl)prog='';
    else if(g.dec)prog=`${Math.min(cur,tgt).toFixed(1).replace('.',',')} / ${String(tgt).replace('.',',')}`;
    else if(g.kr)prog=`${fmt(Math.min(cur,tgt))} / ${fmt(tgt)}`;
    else prog=`${Math.min(cur,tgt)} / ${tgt}`;
    h+=`<div class="goal ${ok?'done':''}"><span class="gi">${ok?'✅':'⬜'}</span><div class="gt"><b>${g.n.replace(/[0-9][0-9 ]*[0-9]|[0-9]/,m=>g.sc?Math.round(parseInt(m.replace(/ /g,''))*scaleM()).toLocaleString('nb-NO'):m)}</b>${!ok&&prog?`<div class="small">${prog}</div><div class="gbar"><i style="width:${clamp(cur/tgt,0,1)*100}%"></i></div>`:''}</div><span class="pill">+${fmt(goalReward(g))}</span></div>`;
  });
  h+=`<h3 style="margin-top:18px">🌟 Legendebonuser <span class="small">– du har ${META.lp} LP · filial nr. ${META.rebirths+1}</span></h3><p class="small">Legendepoeng får du når du åpner en ny filial. Bonusene varer for alltid.</p><div class="grid">`;
  PERKS.forEach(p=>{
    const lv=perk(p.id);
    h+=`<div class="card"><b>${p.n}</b> <span class="pill">${lv}/${p.max}</span><div class="small">${p.d}</div>${lv<p.max?`<button class="small" style="margin-top:6px" data-act="perk" data-id="${p.id}" ${META.lp<perkCost(p)?'disabled':''}>Kjøp: ${perkCost(p)} LP</button>`:'<span class="pill">Maks</span>'}</div>`;
  });
  return h+'</div>';
}
function reportHTML(r,withBtn){
  const income=r.revenue+r.tips;
  let h=`<h2>📒 Regnskap for dag ${r.day}</h2><table>
  <tr><th colspan="2">Inntekter</th></tr>
  <tr><td>Salg av pizza (${r.served} stk.)</td><td class="num">${fmt(r.revenue)}</td></tr>
  <tr><td>Tips</td><td class="num">${fmt(r.tips)}</td></tr>
  <tr><td><b>Sum inntekter</b></td><td class="num"><b>${fmt(income)}</b></td></tr>
  <tr><th colspan="2">Kostnader</th></tr>
  <tr><td>Ingredienser brukt</td><td class="num">−${fmt(r.cogs)}</td></tr>
  <tr><td>Svinn i natt (${r.spoilN} porsjoner)</td><td class="num">−${fmt(r.spoilVal)}</td></tr>
  <tr><td>Lønn</td><td class="num">−${fmt(r.wages)}</td></tr>
  <tr><td>Husleie</td><td class="num">−${fmt(r.rent)}</td></tr>
  ${r.interest?`<tr><td>Renter på lån</td><td class="num">−${fmt(r.interest)}</td></tr>`:''}
  <tr><td><b>Dagens resultat</b></td><td class="num" style="color:${r.profit<0?'var(--red)':'var(--greend)'}"><b>${r.profit<0?'':'+'}${fmt(r.profit)}</b></td></tr></table>`;
  h+=`<p class="small">Kassen: ${fmt(r.cash0)} ved åpning → ${fmt(r.cash1)} nå.${r.loanPay?' Inkludert avdrag på lån.':''} Varer du har kjøpt, men ikke brukt, ligger fortsatt på lageret.</p>`;
  const tips=[];
  if(r.angry)tips.push(`😠 ${r.angry} gjester ble lei av å vente. Ansett hjelp, eller oppgrader ovnen.`);
  if(r.pricey)tips.push(`💸 ${r.pricey} gjester syntes prisen var for høy.`);
  if(r.empty)tips.push(`😕 ${r.empty} gjester gikk fordi du var tom for ingredienser.`);
  if(r.full)tips.push(`🚪 ${r.full} gjester snudde i døra fordi det var fullt. Større restaurant gir plass til flere.`);
  if(r.wrong)tips.push(`😒 ${r.wrong} gjester fikk feil pizza.`);
  if(r.burnt)tips.push(`🔥 ${r.burnt} pizzaer ble brent.`);
  if(r.profit<0)tips.push('📉 Du tapte penger i dag. Se på priser, lønn og husleie.');
  if(tips.length)h+=`<div class="hint">${tips.join('<br>')}</div>`;
  if(withBtn)h+=`<div style="text-align:center;margin-top:10px"><button class="go big" data-act="nextday">Neste dag ☀️</button></div>`;
  return h;
}
function renderBooks(){
  let h=`<h2>📒 Regnskap</h2>`;
  if(D){const t=D.today;h+=`<div class="card" style="margin-bottom:12px"><b>I dag så langt:</b> ${t.served} pizzaer solgt, inntekt ${fmt(t.revenue+t.tips)}, ingredienser brukt ${fmt(t.cogs)}.</div>`;}
  if(S.lastReport)h+=`<div class="card" style="margin-bottom:12px">${reportHTML(S.lastReport,false)}</div>`;
  else h+=`<p class="lead">Regnskapet for første dag kommer når du stenger.</p>`;
  if(S.history.length){
    const mx=Math.max(1,...S.history.map(x=>Math.abs(x.profit)));
    h+=`<h3>Resultat per dag</h3><div class="chart">`+S.history.map(x=>`<div class="b ${x.profit<0?'neg':'pos'}" style="height:${Math.max(3,Math.abs(x.profit)/mx*100)}%" title="Dag ${x.day}: ${fmt(x.profit)}"></div>`).join('')+`</div><div class="small">Grønn = overskudd, rød = underskudd. Hold musen over en søyle for å se tallet.</div>`;
  }
  h+=`<h3 style="margin-top:16px">🏦 Banken</h3>`;
  if(S.loan)h+=`<div class="card">Du har et lån. Du betaler ${fmt(S.loan.pay)} hver dag i ${S.loan.left} dager til.</div>`;
  else h+=`<div class="card"><b>Nødlån:</b> Få 1 500 kr nå. Du betaler tilbake 150 kr hver dag i 12 dager – det blir 1 800 kr totalt. De 300 ekstra kronene er <b>renter</b>, prisen for å låne penger.<br><button class="small" style="margin-top:6px" data-act="loan">Ta opp lån</button></div>`;
  h+=`<p class="small" style="margin-top:12px">Totalt solgt denne filialen: ${fmt(S.stats.revenue)} · ${S.stats.served} pizzaer servert${META.lifetime?` · Alle filialer: ${fmt(META.lifetime+S.stats.revenue)}`:''}</p>`;
  return h;
}

/* ================= MODAL / TOAST ================= */
function showModal(html){document.getElementById('modal').innerHTML=`<div class="overlay"><div class="modal">${html}</div></div>`;}
function closeModal(){document.getElementById('modal').innerHTML='';}
function toast(msg){
  const box=document.getElementById('toasts');const el=document.createElement('div');el.className='toast';el.textContent=msg;box.appendChild(el);
  while(box.children.length>4)box.removeChild(box.firstChild);
  setTimeout(()=>el.remove(),3200);
}
function helpHTML(){
  return `<div style="text-align:center">${roleImg('kokk')}</div><h2>🍕 Velkommen til Pizzabutikken!</h2><p>Du starter med en liten pizzavogn. Kan du bygge et pizzaimperium – uten å gå konkurs?</p>
  <ol><li><b>Før dagen:</b> Kjøp ingredienser under <b>Innkjøp</b> og sett priser under <b>Meny og priser</b>.</li>
  <li>Trykk <b>Åpne dørene</b>. Gjestene kommer til disken.</li>
  <li><b>Klikk på en gjest</b> for å ta bestillingen.</li>
  <li>Bygg pizzaen i kjøkkenet: <b>deig først</b>, så resten av ingrediensene på lappen.</li>
  <li><b>Sett den i ovnen</b>, og trykk <b>Server</b> når den er ferdig – før den brenner!</li>
  <li>Etter stengetid får du <b>regnskapet</b>. Husleie og lønn må betales hver dag.</li>
  <li>Oppgrader, ansett folk og fullfør alle <b>mål</b>. Da kan du åpne en <b>ny filial</b> og få bonuser som varer for alltid.</li></ol>
  <p class="small">Tips: Gjestene går hvis de venter for lenge eller synes prisen er for høy. Fornøyde gjester gir tips og bedre omdømme ⭐.</p>
  <div style="text-align:center"><button class="go big" data-act="close">La oss bake!</button></div>`;
}

/* ================= HENDELSER ================= */
function handle(act,ds){
  switch(act){
    case 'tab':UI.tab=ds.v;break;
    case 'open':openDay();return;
    case 'cust':if(D)clickCust(+ds.id);break;
    case 'ing':addIng(ds.k);break;
    case 'oven':toOven();break;
    case 'trash':trashBuild();break;
    case 'serve':if(D&&servePizza(+ds.id))dirty=true;break;
    case 'toss':if(D)tossPizza(+ds.id);break;
    case 'buy':buy(ds.k,+ds.n);break;
    case 'unlock':unlockRecipe(ds.id);break;
    case 'hire':hire(+ds.id);break;
    case 'fire':fire(+ds.id);return;
    case 'fireok':fireOk(+ds.id);break;
    case 'course':course(+ds.id);break;
    case 'upg':buyUpg(ds.k);break;
    case 'level':buyLevel();break;
    case 'rebirth':askRebirth();return;
    case 'rebirthok':doRebirth();return;
    case 'perk':buyPerk(ds.id);break;
    case 'pause':UI.paused=!UI.paused;break;
    case 'speed':UI.speed=+ds.v;break;
    case 'sound':META.sound=!META.sound;save();break;
    case 'loan':takeLoan();break;
    case 'nextday':nextDay();return;
    case 'showreport':if(S.lastReport)showModal(reportHTML(S.lastReport,true));return;
    case 'close':closeModal();if(!META.intro){META.intro=true;save();}return;
    case 'help':showModal(helpHTML());return;
    case 'export':{let code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify({S,META}))));}catch(e){}
      showModal(`<h2>💾 Lagre-kode</h2><p>Kopier koden og ta vare på den. Da kan du fortsette på en annen maskin eller nettleser.</p><textarea readonly onclick="this.select()">${code}</textarea><div class="row" style="margin-top:8px"><button data-act="close">Lukk</button></div>`);return;}
    case 'import':showModal(`<h2>📂 Last inn kode</h2><p>Lim inn en lagre-kode. Det du har nå blir erstattet.</p><textarea id="imp"></textarea><div class="row" style="margin-top:8px"><button class="go" data-act="importok">Last inn</button><button data-act="close">Avbryt</button></div>`);return;
    case 'importok':{try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('imp').value.trim()))));if(!o.S||!o.META)throw 0;S=o.S;META=Object.assign(defaultMeta(),o.META);D=null;if(S.phase!=='prep'){S.phase='report';nextDayFromLoad();}save();closeModal();toast('✅ Spillet er lastet inn');}catch(e){toast('Koden fungerte ikke');}break;}
    case 'reset':showModal(`<h2>🗑️ Start helt på nytt?</h2><p>Alt blir slettet – også legendepoeng og bonuser. Dette kan ikke angres.</p><div class="row"><button class="primary" data-act="resetok">Ja, slett alt</button><button data-act="close">Avbryt</button></div>`);return;
    case 'resetok':META=defaultMeta();META.intro=true;S=newRun();genPool();D=null;save();closeModal();UI.tab='play';break;
  }
  dirty=true;
}
function nextDayFromLoad(){S.day++;S.phase='prep';S.todaySpent=0;genPool();restock();}
let tap=null;
document.addEventListener('pointerdown',e=>{
  if(e.button&&e.button!==0)return;
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(e.pointerType==='mouse'){e.preventDefault();handle(el.dataset.act,el.dataset);return;}
  tap={act:el.dataset.act,ds:{...el.dataset},x:e.clientX,y:e.clientY,id:e.pointerId};
});
document.addEventListener('pointerup',e=>{
  if(!tap||e.pointerId!==tap.id)return;
  const t=tap;tap=null;
  if(Math.hypot(e.clientX-t.x,e.clientY-t.y)<12)handle(t.act,t.ds);
});
document.addEventListener('pointercancel',()=>{tap=null;});
document.addEventListener('click',e=>{
  if(e.detail!==0)return; // tastatur
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  handle(el.dataset.act,el.dataset);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.price){S.prices[t.dataset.price]=clamp(Math.round(+t.value||0),0,9999);if(S.phase==='prep')save();dirty=true;}
  if(t.dataset.target){S.target[t.dataset.target]=clamp(Math.round(+t.value||0),0,999);if(S.phase==='prep')save();}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('input[data-price],input[data-target]'))e.target.blur();});

/* ================= LØKKE ================= */
let last=performance.now(),hdrT=0;
function loop(now){
  const real=Math.min(0.25,(now-last)/1000);last=now;
  if(S.phase==='open'&&D&&!UI.paused){
    let dt=real*UI.speed;
    while(dt>0&&S.phase==='open'){const s=Math.min(dt,0.1);tick(s);dt-=s;}
  }
  hdrT+=real;if(hdrT>0.25){hdrT=0;renderHeader();}
  if(dirty){
    const ae=document.activeElement;
    const typing=ae&&ae.tagName==='INPUT'&&document.getElementById('view').contains(ae);
    if(!typing){dirty=false;renderNav();renderView();}
  }
  if(S.phase==='open'&&UI.tab==='play')updateBars();
  requestAnimationFrame(loop);
}

/* ================= START ================= */
if(!load()){META=defaultMeta();S=newRun();genPool();}
else{if(S.phase==='open'){S.phase='prep';}else if(S.phase==='report'){nextDayFromLoad();}if(!S.pool)genPool();}
renderAll();
if(!META.intro)showModal(helpHTML());
requestAnimationFrame(loop);
</script>
</body>
</html>
