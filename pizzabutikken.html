document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r(--r-m);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;background:var(--card);user-select:none;animation:pop .3s cubic-bezier(.3,1.5,.6,1);transition:border-color .15s,box-shadow .15s,transform .12s,background .2s}\n.cust:hover{transform:translateX(2px);border-color:var(--lined)}\n@keyframes pop{from{transform:scale(.85) translateY(6px);opacity:0}to{transform:none;opacity:1}}\n.cust.act{border-color:var(--blue);background:#f5f9fe;box-shadow:0 0 0 3px var(--bluel)}\n.cust.waiting{background:var(--goldl);border-color:#f3d995}\n.cust.leaving{opacity:.7;cursor:default;transform:none}\n.cust.done{background:var(--greenl);border-color:#bfe2c7}\n.cemoji{font-size:34px;line-height:1}\n.cimg{width:56px;height:64px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 3px rgba(58,35,20,.18))}\n.simg{width:72px;height:84px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 4px rgba(58,35,20,.18))}\n.bimg{width:150px;height:150px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(58,35,20,.2))}\n.scene{background:url(pizzabutikken/bakgrunn.webp) center/cover,linear-gradient(160deg,#f3d9b3,#e9c795);border-radius:24px;padding:14px;box-shadow:inset 0 0 0 1px rgba(58,35,20,.08)}\n.scene .col{background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-color:rgba(236,214,184,.8)}\n.hero{background:url(pizzabutikken/bakgrunn.webp) center/cover,linear-gradient(160deg,#f3d9b3,#e9c795);border-radius:24px;padding:22px 12px 10px;margin-bottom:18px;box-shadow:inset 0 0 0 1px rgba(58,35,20,.08),var(--sh1)}\n.hero img{width:220px;height:200px;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(0,0,0,.28));animation:bob 4s ease-in-out infinite}\n@keyframes bob{50%{transform:translateY(-4px)}}\n.brandrow{display:flex;align-items:center;gap:10px}\n.brandrow img{width:46px;height:46px;object-fit:contain}\n.lvlrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap}\n.lvlrow h3{margin-bottom:2px}\n.cinfo{flex:1;min-width:0}\n.pbar ift',n:'Familieoppskrifter',d:'Starter med én ekstra pizzaoppskrift',max:3}\n];\nconst GOALS = [\n  {n:'Server din første pizza',t:1,g:()=>S.stats.served,r:100},\n  {n:'Server 25 pizzaer',t:25,sc:1,g:()=>S.stats.served,r:300},\n  {n:'Ansett din første medarbeider',t:1,g:()=>S.stats.hired,r:200},\n  {n:'Få 500 kr i resultat på én dag',t:500,sc:1,kr:1,g:()=>S.stats.bestProfit,r:400},\n  {n:'Lås opp 2 nye pizzaoppskrifter',t:2,g:()=>S.stats.unlocks,r:600},\n  {n:'Flytt fra pizzavognen til Liten pizzeria',t:1,g:()=>S.level,r:800,lvl:1},\n  {n:'Nå 4 stjerner i omdømme',t:4,g:()=>S.rep,r:1000,dec:1},\n  {n:'Send en ansatt på kurs',t:1,g:()=>S.stats.courses,r:600},\n  {n:'Ha 3 ansatte samtidig',t:3,g:()=>S.staff.length,r:1500},\n  {n:'Selg for 50 000 kr totalt',t:50000,sc:1,kr:1,g:()=>S.stats.revenue,r:3000},\n  {n:'Kjøp Premium-ingredienser',t:1,g:()=>S.upg.quality,r:2000,lvl:1},\n  {n:'Få 3 000 kr i resultat på én dag',t:3000,sc:1,kr:1,g:()=>S.stats.bestProfit,r:4000},\n  {n:'Server 500 pizzaer',t:500,sc:1,g:()=>S.stats.served,r:5000},\n  {n:'Flytt inn i Pizzapalasset',t:3,g:()=>S.level,r:6000,lvl:1},\n  {n:'Kjøp Gourmet-ingredienser',t:2,g:()=>S.upg.quality,r:6000,lvl:1},\n  {n:'Lås opp alle pizzaoppskriftene',t:RECIPES.length-3,g:()=>S.unlocked.length-3,r:8000},\n  {n:'Selg for 500 000 kr totalt',t:500000,sc:1,kr:1,g:()=>S.stats.revenue,r:20000},\n  {n:'Nå 5 stjerner i omdømme',t:4.9,g:()=>S.rep,r:15000,dec:1},\n  {n:'Åpne Pizzakjede-flaggskipet',t:4,g:()=>S.level,r:25000,lvl:1}\n];\nconst ANIMALS = ['🐻','🐰','🦊','🐼','🐸','🐱','🐶','🐨','🦁','🐷','🐮','🐵','🐔','🐧','🦉','🐹','🦝','🦦','🐯','🐭','🦔','🐺','🦒','🐙'];\nconst NAMES = ['Aksel','Ingrid','Mohammed','Sofie','Jonas','Nora','Emil','Leah','Filip','Amina','Oskar','Maja','Liam','Ella','Noah','Selma','Isak','Hedda','Ali','Frida','Theo','Sara','Mathias','Tuva','Olav','Astrid','Yusuf','Live','Sander','Iben','Viktor','Mia','Elias','Hanna','Tobias','Ronja'];\nconst IMG='pizzabutikken/';\nconst CUSTS=['bjorn','kanin','katt','hund','panda','frosk','gris','ugle','pingvin','love','pinnsvin','vaskebjorn','elefant'];\nconst roleImg=r=>`<img class=\"simg\" src=\"${IMG}ansatt-${r}.webp\" alt=\"${ROLES[r].n}\">`;\nconst lvlImg=(i,cls)=>`<img class=\"${cls||'bimg'}\" src=\"${IMG}bygg-${i}.webp\" alt=\"${LEVELS[i].n}\">`;\nconst DAY_LEN = 120;\nconst SAVE_KEY = 'pizzabutikken_v1';\n\n/* ================= HJELPERE ================= */\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nconst pick=a=>a[Math.floor(Math.random()*a.length)];\nconst roundTo=(v,s)=>Math.round(v/s)*s;\nconst fmt=n=>Math.round(n).toLocaleString('nb-NO')+' kr';\nconst fmt1=n=>(Math.round(n*10)/10).toLocaleString('nb-NO',{minimumFractionDigits:1,maximumFractionDigits:1})+' kr';\nconst pct=v=>Math.round(v*100)+' %';\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n\nlet S, META, D=null, dirty=true;\nconst UI={tab:'play',paused:false,speed:1};\n\nfunction perk(id){return META.perks[id]||0;}\nfunction staffOf(role){return S.staff.filter(s=>s.role===role);}\nfunction maxSkill(role){return staffOf(role).reduce((m,s)=>Math.max(m,s.skill),0);}\nfunction sumSkill(role){return staffOf(role).reduce((m,s)=>m+s.skill,0);}\nfunction qual(){return Q[S.upg.quality];}\nfunction portionCost(k){return ING[k].c*qual().buy*(1-0.05*perk('effektiv'))*(1-0.02*maxSkill('innkjoper'));}\nfunction recipeCost(r){return r.ings.reduce((s,k)=>s+portionCost(k),0);}\nfunction baseCost(r){return r.ings.reduce((s,k)=>s+ING[k].c,0);}\nfunction fairPrice(r){return baseCost(r)*3.3*qual().fair*(1+0.08*UPG.decor.lv[S.upg.decor].v)*(1+0.05*S.level)*(0.75+0.1*S.rep)*(r.lux||1);}\nfunction bakeTime(){return UPG.ovn.lv[S.upg.ovn].v*(1-0.08*perk('baker'));}\nfunction burnGrace(){return UPG.alarm.lv[S.upg.alarm].v;}\nfunction slots(){return UPG.slots.lv[S.upg.slots].v;}\nfunction spoil(){return UPG.fridge.lv[S.upg.fridge].v;}\nfunction usedIngs(){const set=new Set();S.unlocked.forEach(id=>REC[id].ings.forEach(i=>set.add(i)));return Object.keys(ING).filter(k=>set.has(k));}\nfunction matchRecipe(ings){const key=[...ings].sort().join(',');const r=RECIPES.find(r=>[...r.ings].sort().join(',')===key);return r?r.id:null;}\nfunction addRep(v){S.rep=clamp(S.rep+v,0,5);}\nfunction wagesTotal(){return S.staff.reduce((s,x)=>s+x.wage,0);}\nfunction scaleM(){return 1+0.5*META.rebirths;}\nfunction goalTarget(g){return g.sc?Math.round(g.t*scaleM()):g.t;}\nfunction goalReward(g){return Math.round(g.r*scaleM());}\nfunction starsHTML(r){const f=Math.round(r);return '<span class=\"stars\">'+'★'.repeat(f)+'<span style=\"opacity:.3\">'+'★'.repeat(5-f)+'<\u002Fspan><\u002Fspan>';}\nfunction canMake(id){return REC[id].ings.every(k=>S.stock[k]>=1);}\nfunction howMany(id){return Math.min(...REC[id].ings.map(k=>S.stock[k]));}\nfunction feel(ratio){\n  if(ratio<0.8)return['😀','Billig'];\n  if(ratio<1.0)return['🙂','Passe'];\n  if(ratio<1.2)return['😐','Litt dyr'];\n  if(ratio<1.45)return['😬','Dyr'];\n  return['😡','Altfor dyr'];\n}\nfunction acceptProb(ratio){if(ratio<=0.95)return 1;return clamp(1-(ratio-0.95)/0.6,0,1);}\n\n/* ================= LYD ================= */\nlet AC=null;\nfunction tone(f,d,type='sine',vol=.07,delay=0){\n  if(!META||!META.sound)return;\n  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime+delay;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}catch(e){}\n}\nfunction sfx(k){\n  if(k==='cash'){tone(880,.12,'triangle');tone(1320,.2,'triangle',.07,.1);}\n  else if(k==='ding')tone(1046,.25,'sine',.05);\n  else if(k==='bad')tone(170,.3,'sawtooth',.04);\n  else if(k==='pop')tone(560,.05,'square',.025);\n  else if(k==='bell'){tone(660,.12,'sine',.04);tone(990,.18,'sine',.04,.1);}\n  else if(k==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.2,'triangle',.06,i*.1));}\n}\n\n/* ================= LAGRING ================= */\nfunction defaultMeta(){return {rebirths:0,lp:0,perks:{},lifetime:0,sound:true,intro:false};}\nfunction newRun(){\n  const unlocked=['margherita','pepperoni','skinkesopp'];\n  for(let i=0;i<perk('oppskrift');i++){const r=RECIPES.find(r=>!unlocked.includes(r.id));if(r)unlocked.push(r.id);}\n  const s={money:800+1000*perk('kapital'),day:1,rep:clamp(2.5+0.3*perk('navn'),0,4.5),stock:{},target:{},prices:{},unlocked,\n    upg:{ovn:0,slots:0,alarm:0,fridge:0,decor:0,ads:0,quality:0},level:0,staff:[],pool:[],goals:{},nextId:1,\n    stats:{served:0,revenue:0,bestProfit:0,hired:0,courses:0,unlocks:0,wrong:0,angry:0},\n    history:[],loan:null,phase:'prep',lastReport:null,lastRec:{},todaySpent:0,restockNote:''};\n  for(const k in ING){s.stock[k]=0;s.target[k]=15;}\n  ['deig','saus','ost'].forEach(k=>s.stock[k]=15);\n  ['basilikum','pepperoni','skinke','sopp'].forEach(k=>s.stock[k]=8);\n  RECIPES.forEach(r=>s.prices[r.id]=roundTo(baseCost(r)*3,5));\n  return s;\n}\nfunction save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({S,META}));}catch(e){}}\nfunction load(){\n  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const o=JSON.parse(raw);if(o&&o.S&&o.META){META=Object.assign(defaultMeta(),o.META);S=o.S;return true;}}}catch(e){}\n  return false;\n}\n\n/* ================= DAGEN ================= */\nfunction genCand(){\n  const role=pick(Object.keys(ROLES));\n  const maxSk=Math.min(5,2+S.level);\n  const sk=1+Math.floor(Math.pow(Math.random(),1.3)*maxSk);\n  const wage=roundTo(ROLES[role].w*(0.6+0.35*sk)*rnd(.9,1.15)*(1+0.15*S.level),5);\n  return {id:S.nextId++,name:pick(NAMES),e:pick(ANIMALS),role,skill:clamp(sk,1,5),wage};\n}\nfunction genPool(){S.pool=[genCand(),genCand(),genCand()];}\n\nfunction restock(){\n  S.restockNote='';\n  if(!staffOf('innkjoper').length)return;\n  let spent=0,items=0;\n  for(const k of usedIngs()){\n    const need=S.target[k]-S.stock[k];\n    if(need<=0)continue;\n    const pc=portionCost(k);\n    const n=Math.min(need,Math.floor(Math.max(0,S.money)/pc));\n    if(n<=0)continue;\n    S.money-=n*pc;S.todaySpent+=n*pc;S.stock[k]+=n;spent+=n*pc;items+=n;\n  }\n  if(items)S.restockNote=`📦 Innkjøperen kjøpte ${items} porsjoner for ${fmt(spent)} i morges.`;\n}\n\nfunction openDay(){\n  if(S.phase!=='prep')return;\n  S.phase='open';\n  D={t:0,customers:[],oven:[],build:null,activeCust:null,nextSpawn:1.5,uid:0,money0:S.money,\n     today:{revenue:0,tips:0,cogs:0,served:0,angry:0,pricey:0,empty:0,full:0,wrong:0,burnt:0},rec:{},warned:{}};\n  S.staff.forEach(s=>s.cd=rnd(0.5,2));\n  UI.paused=false;UI.tab='play';\n  sfx('bell');dirty=true;renderAll();\n}\nfunction spawnInterval(){\n  const base=LEVELS[S.level].spawn;\n  const boost=1+0.15*UPG.ads.lv[S.upg.ads].v+0.08*sumSkill('marked')+0.12*(S.rep-2.5);\n  return base/Math.max(0.5,boost);\n}\nfunction maxPatience(){\n  return 50*(1+0.06*UPG.decor.lv[S.upg.decor].v)*(1+0.1*perk('talmodig'))*(1+0.06*maxSkill('servitor'));\n}\nfunction activeCusts(){return D.customers.filter(c=>c.state!=='leaving');}\nfunction spawnCustomer(){\n  if(activeCusts().length>=LEVELS[S.level].queue){D.today.full++;return;}\n  const mp=maxPatience();\n  const c={id:++D.uid,name:pick(NAMES),e:pick(ANIMALS),state:'waiting',img:pick(CUSTS),pat:mp,max:mp,order:null,price:0,hasPizza:false,bubble:'',ratio:1};\n  D.customers.push(c);sfx('pop');dirty=true;\n}\nfunction rec(id){return D.rec[id]||(D.rec[id]={sold:0,pricey:0});}\nfunction weightedPick(ids){const tot=ids.reduce((s,id)=>s+REC[id].pop,0);let x=Math.random()*tot;for(const id of ids){x-=REC[id].pop;if(x<=0)return id;}return ids[ids.length-1];}\nfunction takeOrder(c){\n  if(c.state!=='waiting')return;\n  let avail=S.unlocked.filter(canMake);\n  if(!avail.length){leave(c,'😕 Dere har ikke ingredienser til noe!');addRep(-0.04);D.today.empty++;return;}\n  let chosen=null;\n  for(let a=0;a<2&&avail.length;a++){\n    const id=weightedPick(avail);\n    const ratio=S.prices[id]/fairPrice(REC[id]);\n    if(Math.random()<acceptProb(ratio)){chosen=id;c.ratio=ratio;break;}\n    rec(id).pricey++;avail=avail.filter(x=>x!==id);\n  }\n  if(!chosen){leave(c,'💸 Altfor dyrt for meg!');addRep(-0.01);D.today.pricey++;return;}\n  c.state='ordered';c.order=chosen;c.price=S.prices[chosen];\n  c.pat=Math.min(c.max,c.pat+0.25*c.max);\n  if(D.activeCust==null)D.activeCust=c.id;\n  sfx('pop');dirty=true;\n}\nfunction leave(c,text){\n  c.state='leaving';c.leaveT=2.2;c.bubble=text;\n  if(D.activeCust===c.id)D.activeCust=nextFreeCust();\n  D.oven.forEach(p=>{if(p.custId===c.id)p.custId=null;});\n  dirty=true;\n}\nfunction nextFreeCust(){const c=D.customers.find(c=>c.state==='ordered'&&!c.hasPizza&&c.id!==D.activeCust);return c?c.id:null;}\nfunction clickCust(id){\n  const c=D.customers.find(c=>c.id===id);if(!c)return;\n  if(c.state==='waiting'){takeOrder(c);return;}\n  if(c.state==='ordered'&&!c.hasPizza){D.activeCust=(D.activeCust===id?null:id);dirty=true;}\n  else if(c.state==='ordered'&&c.hasPizza){toast('Pizzaen til '+c.name+' er allerede i ovnen 🔥');}\n}\nfunction addIng(k){\n  if(!D)return;\n  if(S.stock[k]<1){toast('Tomt for '+ING[k].n.toLowerCase()+'! Kjøp mer under Innkjøp.');sfx('bad');return;}\n  if(!D.build)D.build={ings:[]};\n  if(k!=='deig'&&!D.build.ings.includes('deig')){toast('Start med deig 🫓');return;}\n  if(D.build.ings.includes(k)){toast(ING[k].n+' er allerede på pizzaen');return;}\n  S.stock[k]--;D.today.cogs+=portionCost(k);D.build.ings.push(k);sfx('pop');dirty=true;\n}\nfunction trashBuild(){if(!D||!D.build)return;D.build=null;toast('🗑️ Pizzaen ble kastet');dirty=true;}\nfunction toOven(){\n  if(!D||!D.build||!D.build.ings.includes('deig')){toast('Lag en pizza først – start med deig');return;}\n  if(D.oven.length>=slots()){toast('Ovnen er full! Server eller kast en pizza først.');sfx('bad');return;}\n  const p={id:++D.uid,ings:D.build.ings,rid:matchRecipe(D.build.ings),t:0,state:'baking',custId:null,by:'deg'};\n  const c=D.customers.find(c=>c.id===D.activeCust);\n  if(c&&c.state==='ordered'&&!c.hasPizza){p.custId=c.id;c.hasPizza=true;}\n  D.oven.push(p);D.build=null;D.activeCust=nextFreeCust();sfx('pop');dirty=true;\n}\nfunction findTarget(p){\n  if(p.custId){const c=D.customers.find(c=>c.id===p.custId&&c.state==='ordered');if(c)return c;}\n  const c=D.customers.find(c=>c.state==='ordered'&&!c.hasPizza&&c.order===p.rid);\n  return c||null;\n}\nfunction servePizza(pid){\n  const p=D.oven.find(p=>p.id===pid);if(!p||p.state!=='done')return false;\n  const c=findTarget(p);\n  if(!c){toast('Ingen gjest venter på akkurat denne pizzaen. Kast den eller vent på en bestilling.');return false;}\n  D.oven=D.oven.filter(x=>x!==p);deliver(c,p);return true;\n}\nfunction tossPizza(pid){const p=D.oven.find(p=>p.id===pid);if(!p)return;D.oven=D.oven.filter(x=>x!==p);if(p.custId){const c=D.customers.find(c=>c.id===p.custId);if(c)c.hasPizza=false;}dirty=true;}\nfunction deliver(c,p){\n  const correct=p.rid===c.order;\n  if(correct){\n    const pay=c.price*(1+0.05*perk('gull'));\n    const tip=c.price*0.25*(c.pat/c.max)*(c.ratio<0.8?1.3:1)*(1+0.05*maxSkill('servitor'));\n    S.money+=pay+tip;D.today.revenue+=pay;D.today.tips+=tip;S.stats.revenue+=pay+tip;S.stats.served++;D.today.served++;\n    rec(c.order).sold++;\n    if(S.rep<qual().cap)addRep((0.025*qual().rep*(c.pat/c.max>0.5?1:0.5)+(c.ratio<0.8?0.005:0))*Math.max(0.05,(5.2-S.rep)/2.7));\n    leave(c,'😋 Nydelig! +'+fmt(tip)+' i tips');sfx('cash');\n  }else{\n    const pay=c.price*0.5;\n    S.money+=pay;D.today.revenue+=pay;S.stats.revenue+=pay;D.today.wrong++;S.stats.wrong++;\n    addRep(-0.06);leave(c,'😒 Dette bestilte jeg ikke! (betalte halv pris)');sfx('bad');\n  }\n  checkGoals();dirty=true;\n}\nfunction staffTick(dt){\n  for(const s of S.staff){\n    if(s.role==='innkjoper'||s.role==='marked')continue;\n    s.cd=(s.cd||0)-dt;if(s.cd>0)continue;\n    let did=false;\n    if(s.role==='kasserer'){\n      const c=D.customers.find(c=>c.state==='waiting');\n      if(c){takeOrder(c);did=true;}\n      s.cd=did?7-1.1*s.skill:0.4;\n    }else if(s.role==='kokk'){\n      if(D.oven.length<slots()){\n        const c=D.customers.find(c=>c.state==='ordered'&&!c.hasPizza&&c.id!==D.activeCust);\n        if(c){\n          const r=REC[c.order];\n          const miss=r.ings.find(k=>S.stock[k]<1);\n          if(miss){if(!D.warned[miss]){D.warned[miss]=1;toast(s.e+' '+s.name+': Vi er tomme for '+ING[miss].n.toLowerCase()+'!');}}\n          else{\n            let ings=[...r.ings];\n            ings.forEach(k=>{S.stock[k]--;D.today.cogs+=portionCost(k);});\n            if(Math.random()<0.18-0.035*s.skill){const i=1+Math.floor(Math.random()*(ings.length-1));ings.splice(i,1);}\n            D.oven.push({id:++D.uid,ings,rid:matchRecipe(ings),t:0,state:'baking',custId:c.id,by:s.name});\n            c.hasPizza=true;did=true;dirty=true;\n          }\n        }\n      }\n      s.cd=did?11-1.6*s.skill:0.5;\n    }else if(s.role==='servitor'){\n      const burnt=D.oven.find(p=>p.state==='burnt');\n      if(burnt){tossPizza(burnt.id);did=true;}\n      else{for(const p of D.oven){if(p.state==='done'&&findTarget(p)){servePizza(p.id);did=true;break;}}}\n      s.cd=did?6-0.9*s.skill:0.4;\n    }\n  }\n}\nfunction tick(dt){\n  D.t+=dt;\n  if(D.t<DAY_LEN){D.nextSpawn-=dt;if(D.nextSpawn<=0){spawnCustomer();D.nextSpawn=spawnInterval()*rnd(0.6,1.4);}}\n  for(const c of D.customers){\n    if(c.state==='leaving'){c.leaveT-=dt;continue;}\n    c.pat-=dt;\n    if(c.pat<=0){leave(c,'😠 Jeg gidder ikke vente mer!');addRep(-0.08);D.today.angry++;S.stats.angry++;sfx('bad');}\n  }\n  const before=D.customers.length;\n  D.customers=D.customers.filter(c=>!(c.state==='leaving'&&c.leaveT<=0));\n  if(D.customers.length!==before)dirty=true;\n  const bt=bakeTime(),bg=burnGrace();\n  for(const p of D.oven){\n    p.t+=dt;\n    const st=p.t>=bt+bg?'burnt':p.t>=bt?'done':'baking';\n    if(st!==p.state){p.state=st;dirty=true;\n      if(st==='done')sfx('ding');\n      if(st==='burnt'){sfx('bad');toast('🔥 En pizza ble brent!');D.today.burnt++;if(p.custId){const c=D.customers.find(c=>c.id===p.custId);if(c)c.hasPizza=false;p.custId=null;}}}\n  }\n  staffTick(dt);\n  if(D.t>=DAY_LEN){\n    if(!activeCusts().length&&!D.customers.length){endDay();return;}\n    if(D.t>=DAY_LEN+45){activeCusts().forEach(c=>leave(c,'🌙 Dere stenger, jeg går hjem.'));if(D.t>=DAY_LEN+48){endDay();return;}}\n  }\n}\nfunction endDay(){\n  if(S.phase!=='open')return;\n  const t=D.today;\n  const wages=wagesTotal(),rent=LEVELS[S.level].rent;\n  let loanPay=0,interest=0;\n  if(S.loan){loanPay=S.loan.pay;interest=S.loan.interest;S.loan.left--;if(S.loan.left<=0){S.loan=null;toast('🎉 Lånet er nedbetalt!');}}\n  S.money-=wages+rent+loanPay;\n  let spoilVal=0,spoilN=0;const f=spoil();\n  if(f>0){for(const k in S.stock){const lost=Math.round(S.stock[k]*f);if(lost>0){S.stock[k]-=lost;spoilVal+=lost*portionCost(k);spoilN+=lost;}}}\n  const income=t.revenue+t.tips;\n  const profit=income-t.cogs-spoilVal-wages-rent-interest;\n  const r={day:S.day,revenue:t.revenue,tips:t.tips,cogs:t.cogs,spoilVal,spoilN,wages,rent,interest,loanPay,profit,\n    served:t.served,angry:t.angry,pricey:t.pricey,empty:t.empty,full:t.full,wrong:t.wrong,burnt:t.burnt,spent:S.todaySpent,cash0:D.money0,cash1:S.money};\n  S.stats.bestProfit=Math.max(S.stats.bestProfit,profit);\n  S.history.push({day:S.day,profit:Math.round(profit),income:Math.round(income)});\n  if(S.history.length>30)S.history.shift();\n  S.lastReport=r;S.lastRec=D.rec;\n  S.phase='report';D=null;\n  checkGoals();save();\n  showModal(reportHTML(r,true));\n  dirty=true;renderAll();\n}\nfunction nextDay(){\n  if(S.phase!=='report')return;\n  S.day++;S.phase='prep';S.todaySpent=0;\n  genPool();restock();\n  save();closeModal();UI.tab='play';dirty=true;renderAll();\n}\n\n/* ================= KJØP OG HANDLINGER ================= */\nfunction spend(cost){\n  if(S.money<cost){toast('Du har ikke nok penger 💸');sfx('bad');return false;}\n  S.money-=cost;return true;\n}\nfunction afterAction(){checkGoals();if(S.phase==='prep')save();dirty=true;}\nfunction buy(k,n){const cost=portionCost(k)*n;if(!spend(cost))return;S.stock[k]+=n;S.todaySpent+=cost;sfx('pop');afterAction();}\nfunction unlockRecipe(id){\n  const r=REC[id];if(S.unlocked.includes(id))return;\n  if(!spend(r.cost))return;\n  S.unlocked.push(id);S.stats.unlocks++;sfx('win');\n  const missing=r.ings.filter(k=>S.stock[k]<1).map(k=>ING[k].n.toLowerCase());\n  toast('🍕 '+r.n+' er på menyen!'+(missing.length?' Husk å kjøpe '+missing.join(', ')+'.':''));\n  afterAction();\n}\nfunction buyUpg(key){\n  const u=UPG[key],cur=S.upg[key];if(cur>=u.lv.length-1)return;\n  const nx=u.lv[cur+1];if(!spend(nx.c))return;\n  S.upg[key]++;sfx('win');toast(u.e+' '+u.n+' oppgradert!');afterAction();\n}\nfunction buyLevel(){\n  if(S.level>=LEVELS.length-1)return;\n  const nx=LEVELS[S.level+1];if(!spend(nx.c))return;\n  S.level++;sfx('win');toast(nx.e+' Gratulerer med '+nx.n+'!');afterAction();\n}\nfunction hire(id){\n  if(S.staff.length>=LEVELS[S.level].staff){toast('Det er ikke plass til flere ansatte. Oppgrader restauranten!');return;}\n  const c=S.pool.find(p=>p.id===id);if(!c)return;\n  S.pool=S.pool.filter(p=>p.id!==id);c.cd=1;S.staff.push(c);S.stats.hired++;\n  sfx('bell');toast(c.e+' '+c.name+' er ansatt som '+ROLES[c.role].n.toLowerCase()+'!');\n  if(c.role==='innkjoper'&&S.phase==='prep')toast('Tips: sett mål for lageret under Innkjøp.');\n  afterAction();\n}\nfunction fire(id){\n  const s=S.staff.find(x=>x.id===id);if(!s)return;\n  showModal(`<h2>Si opp ${esc(s.name)}?<\u002Fh2><p>${s.e} ${esc(s.name)} (${ROLES[s.role].n}) slutter med en gang. Du sparer ${fmt(s.wage)} i lønn per dag.<\u002Fp><div class=\"row\"><button class=\"primary\" data-act=\"fireok\" data-id=\"${id}\">Ja, si opp<\u002Fbutton><button data-act=\"close\">Avbryt<\u002Fbutton><\u002Fdiv>`);\n}\nfunction fireOk(id){S.staff=S.staff.filter(x=>x.id!==id);closeModal();toast('Ansatt sagt opp');afterAction();}\nfunction courseCost(s){return 300*s.skill*(1+0.3*S.level);}\nfunction course(id){\n  const s=S.staff.find(x=>x.id===id);if(!s||s.skill>=5)return;\n  if(!spend(courseCost(s)))return;\n  s.skill++;s.wage=roundTo(s.wage*1.18,5);S.stats.courses++;sfx('win');\n  toast('🎓 '+s.name+' er nå '+s.skill+'-stjerners '+ROLES[s.role].n.toLowerCase()+'!');afterAction();\n}\nfunction takeLoan(){\n  if(S.loan)return;\n  S.money+=1500;S.loan={left:12,pay:150,interest:25};\n  toast('🏦 Du lånte 1 500 kr');afterAction();\n}\nfunction allGoalsDone(){return GOALS.every((g,i)=>S.goals[i]);}\nfunction checkGoals(){\n  GOALS.forEach((g,i)=>{\n    if(S.goals[i])return;\n    if(g.g()>=goalTarget(g)){S.goals[i]=true;const rw=goalReward(g);S.money+=rw;sfx('win');toast('🏆 Mål nådd: '+g.n+' (+'+fmt(rw)+')');dirty=true;}\n  });\n}\nfunction lpGain(){return 5+Math.floor(Math.sqrt(S.stats.revenue/2000))+META.rebirths*2;}\nfunction askRebirth(){\n  if(!allGoalsDone())return;\n  showModal(`<h2>🌟 Åpne en ny filial?<\u002Fh2><p>Du har klart alle målene! Nå kan du selge denne restauranten og starte en ny filial fra en pizzavogn.<\u002Fp>\n  <p><b>Du mister:<\u002Fb> penger, oppgraderinger, oppskrifter og ansatte.<br><b>Du får:<\u002Fb> ${lpGain()} legendepoeng (LP) til permanente bonuser som varer for alltid.<\u002Fp>\n  <p class=\"small\">Neste filial får litt vanskeligere mål, men også større belønninger.<\u002Fp>\n  <div class=\"row\"><button class=\"go\" data-act=\"rebirthok\">Ja, åpne ny filial!<\u002Fbutton><button data-act=\"close\">Ikke ennå<\u002Fbutton><\u002Fdiv>`);\n}\nfunction doRebirth(){\n  if(!allGoalsDone())return;\n  META.lp+=lpGain();META.rebirths++;META.lifetime+=S.stats.revenue;\n  S=newRun();genPool();save();closeModal();UI.tab='goals';sfx('win');\n  toast('🌟 Filial #'+(META.rebirths+1)+' er åpnet! Bruk LP på bonuser.');dirty=true;renderAll();\n}\nfunction perkCost(p){return (perk(p.id)+1)*3;}\nfunction buyPerk(id){\n  const p=PERKS.find(x=>x.id===id);if(!p||perk(id)>=p.max)return;\n  const c=perkCost(p);if(META.lp<c){toast('Ikke nok legendepoeng');return;}\n  META.lp-=c;META.perks[id]=perk(id)+1;\n  if(id==='kapital'&&S.day===1&&S.phase==='prep')S.money+=1000;\n  if(id==='navn'&&S.day===1&&S.phase==='prep')addRep(0.3);\n  if(id==='oppskrift'&&S.day===1&&S.phase==='prep'){const r=RECIPES.find(r=>!S.unlocked.includes(r.id));if(r)S.unlocked.push(r.id);}\n  sfx('win');save();dirty=true;\n}\n\n/* ================= TEGNING ================= */\nfunction pizzaSVG(ings,size){\n  size=size||170;\n  let s=`<svg viewBox=\"0 0 200 200\" width=\"${size}\" height=\"${size}\" role=\"img\" aria-label=\"Pizza\">`;\n  s+=`<circle cx=\"100\" cy=\"100\" r=\"96\" fill=\"#ffffff\" stroke=\"#ecd6b8\" stroke-width=\"4\"/>`;\n  if(!ings||!ings.includes('deig')){s+=`<text x=\"100\" y=\"108\" text-anchor=\"middle\" font-size=\"16\" fill=\"#b59a84\">Tom tallerken<\u002Ftext><\u002Fsvg>`;return s;}\n  s+=`<circle cx=\"100\" cy=\"100\" r=\"84\" fill=\"#dca560\"/><circle cx=\"100\" cy=\"100\" r=\"74\" fill=\"#f1cd8c\"/>`;\n  if(ings.includes('saus'))s+=`<circle cx=\"100\" cy=\"100\" r=\"70\" fill=\"#c9362a\"/>`;\n  if(ings.includes('ost')){s+=`<circle cx=\"100\" cy=\"100\" r=\"64\" fill=\"#f7d65a\" opacity=\".92\"/>`;\n    [[70,80,16],[128,78,14],[92,128,17],[132,122,12],[100,98,14]].forEach(([x,y,r])=>s+=`<circle cx=\"${x}\" cy=\"${y}\" r=\"${r}\" fill=\"#fbe58f\"/>`);}\n  const tops=ings.filter(k=>!['deig','saus','ost'].includes(k));\n  tops.forEach((k,j)=>{\n    for(let i=0;i<5;i++){\n      const a=(i*72+j*31)*Math.PI/180,rad=i%2?50:28;\n      const x=100+Math.cos(a)*rad,y=100+Math.sin(a)*rad;\n      if(k==='pepperoni')s+=`<circle cx=\"${x.toFixed(1)}\" cy=\"${y.toFixed(1)}\" r=\"10\" fill=\"#a8321f\"/><circle cx=\"${(x-3).toFixed(1)}\" cy=\"${(y-3).toFixed(1)}\" r=\"3\" fill=\"#c9533b\"/>`;\n      else s+=`<text x=\"${x.toFixed(1)}\" y=\"${y.toFixed(1)}\" font-size=\"20\" text-anchor=\"middle\" dominant-baseline=\"central\">${ING[k].e}<\u002Ftext>`;\n    }\n  });\n  return s+'<\u002Fsvg>';\n}\nfunction clockStr(){\n  if(!D)return S.phase==='prep'?'Stengt':'Stengt';\n  if(D.t>=DAY_LEN)return 'Stengetid';\n  const mins=11*60+Math.floor(D.t/DAY_LEN*11*60);\n  return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');\n}\nfunction renderHeader(){\n  const L=LEVELS[S.level];\n  let h=`<div class=\"brandrow\">${lvlImg(S.level,'')}<div class=\"brand\">🍕 Pizzabutikken<small>${L.e} ${L.n}${META.rebirths?' · Filial #'+(META.rebirths+1):''}<\u002Fsmall><\u002Fdiv><\u002Fdiv>`;\n  h+=`<div class=\"stats\"><span class=\"stat ${S.money<0?'neg':''}\" title=\"Penger\">💰 ${fmt(S.money)}<\u002Fspan><span class=\"stat\">📅 Dag ${S.day}<\u002Fspan><span class=\"stat\">🕐 ${clockStr()}<\u002Fspan><span class=\"stat\" title=\"Omdømme\">${starsHTML(S.rep)} ${S.rep.toFixed(1).replace('.',',')}<\u002Fspan>${META.rebirths||META.lp?`<span class=\"stat\" title=\"Legendepoeng\">🏆 ${META.lp} LP<\u002Fspan>`:''}<\u002Fdiv>`;\n  h+=`<div class=\"ctrl\">`;\n  if(S.phase==='open'){\n    h+=`<button class=\"small ${UI.paused?'on':''}\" data-act=\"pause\">${UI.paused?'▶ Fortsett':'⏸ Pause'}<\u002Fbutton>`;\n    [1,2,3].forEach(v=>h+=`<button class=\"small ${UI.speed===v?'on':''}\" data-act=\"speed\" data-v=\"${v}\">${v}×<\u002Fbutton>`);\n  }\n  h+=`<button class=\"small\" data-act=\"sound\" title=\"Lyd\">${META.sound?'🔊':'🔇'}<\u002Fbutton><\u002Fdiv>`;\n  document.getElementById('hdr').innerHTML=h;\n}\nconst TABS=[['play','🍕 Restaurant'],['shop','📦 Innkjøp'],['menu','📋 Meny og priser'],['staff','👥 Ansatte'],['upg','🛠️ Oppgrader'],['goals','🏆 Mål'],['books','📒 Regnskap']];\nfunction renderNav(){\n  document.getElementById('nav').innerHTML=TABS.map(([id,n])=>`<button class=\"tab ${UI.tab===id?'act':''}\" data-act=\"tab\" data-v=\"${id}\">${(([i,...r])=>`<span class=\"ti\">${i}<\u002Fspan><span class=\"tl\">${r.join(' ')}<\u002Fspan>`)(n.split(' '))}${id==='goals'&&allGoalsDone()?'<span class=\"badge\">!<\u002Fspan>':''}<\u002Fbutton>`).join('');\n}\nfunction renderView(){\n  const v=document.getElementById('view');\n  const f={play:renderPlay,shop:renderShop,menu:renderMenu,staff:renderStaff,upg:renderUpg,goals:renderGoals,books:renderBooks}[UI.tab];\n  const keep={};v.querySelectorAll('[data-sk]').forEach(e=>keep[e.dataset.sk]=e.scrollTop);\n  v.innerHTML=f();\n  v.querySelectorAll('[data-sk]').forEach(e=>{if(keep[e.dataset.sk])e.scrollTop=keep[e.dataset.sk];});\n  fitPlay();\n}\nfunction fitPlay(){\n  const pl=document.querySelector('.play');if(!pl)return;\n  const top=pl.getBoundingClientRect().top+window.scrollY;\n  const hgt=Math.max(380,Math.floor(window.innerHeight-top-22));\n  document.documentElement.style.setProperty('--playH',hgt+'px');\n}\nwindow.addEventListener('resize',fitPlay);\nfunction renderAll(){renderHeader();renderNav();renderView();dirty=false;}\n\nfunction renderPrep(){\n  const L=LEVELS[S.level],rent=L.rent,wages=wagesTotal(),loan=S.loan?S.loan.pay:0,fixed=rent+wages+loan;\n  const counts=S.unlocked.map(id=>[id,howMany(id)]);\n  const mx=Math.max(20,...counts.map(c=>c[1]));\n  const first=S.day===1&&!META.rebirths;\n  let h=`<div class=\"pv\"><div class=\"pv-main\"><div class=\"pv-hero\">${lvlImg(S.level,'')}<span class=\"pv-day\">Dag ${S.day}<\u002Fspan><span class=\"pv-closed\">🔒 Stengt<\u002Fspan><\u002Fdiv>\n  <h2>Klar for å åpne?<\u002Fh2><p class=\"lead\">${L.e} ${L.n} · gjør klar før du slipper inn gjestene.<\u002Fp>`;\n  if(S.money<0)h+=`<div class=\"warn\">⚠️ Du er i minus! Prøv å heve prisene litt, si opp en ansatt, eller ta et nødlån under Regnskap.<\u002Fdiv>`;\n  if(S.restockNote)h+=`<div class=\"hint\">${S.restockNote}<\u002Fdiv>`;\n  if(first)h+=`<ol class=\"pv-steps\"><li><span>1<\u002Fspan>Åpne dørene<\u002Fli><li><span>2<\u002Fspan>Klikk på en gjest<\u002Fli><li><span>3<\u002Fspan>Bygg pizzaen<\u002Fli><li><span>4<\u002Fspan>Stek og server<\u002Fli><\u002Fol>`;\n  h+=`<button class=\"go big pv-open\" data-act=\"open\">🍕 Åpne dørene!<\u002Fbutton><\u002Fdiv><div class=\"pv-side\">`;\n  h+=`<section class=\"pv-panel\"><div class=\"pv-head\"><h3>🍕 Pizzaer du kan lage<\u002Fh3><button class=\"small\" data-act=\"tab\" data-v=\"shop\">📦 Innkjøp<\u002Fbutton><\u002Fdiv>`;\n  counts.forEach(([id,n])=>{const lo=n<5;h+=`<div class=\"pv-stock ${lo?'lo':''}\"><span class=\"pv-n\">${REC[id].n}<\u002Fspan><span class=\"pv-bar\"><i style=\"width:${Math.max(2,n/mx*100)}%\"><\u002Fi><\u002Fspan><b>${n}<\u002Fb><\u002Fdiv>`;});\n  if(counts.some(c=>c[1]<5))h+=`<div class=\"pv-note low\">Lite på lager – kjøp mer før du åpner.<\u002Fdiv>`;\n  h+=`<\u002Fsection><section class=\"pv-panel\"><div class=\"pv-head\"><h3>💸 Faste kostnader i dag<\u002Fh3><\u002Fdiv><div class=\"pv-rc\"><span>Husleie<\u002Fspan><i><\u002Fi><span>${fmt(rent)}<\u002Fspan><\u002Fdiv><div class=\"pv-rc\"><span>Lønn<\u002Fspan><i><\u002Fi><span>${fmt(wages)}<\u002Fspan><\u002Fdiv>${loan?`<div class=\"pv-rc\"><span>Lån<\u002Fspan><i><\u002Fi><span>${fmt(loan)}<\u002Fspan><\u002Fdiv>`:''}<div class=\"pv-rc tot\"><span>Totalt<\u002Fspan><i><\u002Fi><span>${fmt(fixed)}<\u002Fspan><\u002Fdiv><div class=\"pv-note\">Du må selge nok pizza til å dekke dette.<\u002Fdiv><\u002Fsection>`;\n  h+=`<section class=\"pv-panel\"><div class=\"pv-head\"><h3>👥 På jobb i dag<\u002Fh3><span class=\"pill\">${S.staff.length+1} / ${L.staff+1}<\u002Fspan><\u002Fdiv><div class=\"pv-crew\"><span class=\"pv-chip me\">🙋 Deg<\u002Fspan>${S.staff.map(s=>`<span class=\"pv-chip\">${ROLES[s.role].e} ${esc(s.name)}<small>${ROLES[s.role].n}<\u002Fsmall><\u002Fspan>`).join('')}<\u002Fdiv>${S.staff.length?'':'<div class=\"pv-note\">Du kan ansette hjelp under <b>Ansatte<\u002Fb>.<\u002Fdiv>'}<\u002Fsection><\u002Fdiv><\u002Fdiv>`;\n  return h;\n}\nfunction renderPlay(){\n  if(S.phase==='prep')return renderPrep();\n  if(S.phase==='report')return `<div class=\"prep\"><h2>Dagen er over<\u002Fh2><button class=\"go big\" data-act=\"showreport\">Se dagens regnskap<\u002Fbutton><\u002Fdiv>`;\n  let h='<div class=\"scene\"><div class=\"play\">';\n  // gjester\n  h+=`<div class=\"col\"><h3>🚪 Disken <span class=\"small\">(${activeCusts().length}/${LEVELS[S.level].queue})<\u002Fspan><\u002Fh3><div class=\"scroll\" data-sk=\"cust\">`;\n  if(!D.customers.length)h+=`<div class=\"empty\">${D.t<DAY_LEN?'Venter på gjester …':'Alle gjestene er gått. Dagen avsluttes!'}<\u002Fdiv>`;\n  for(const c of D.customers){\n    const act=D.activeCust===c.id?'act':'';\n    let inner;\n    if(c.state==='waiting')inner=`<span class=\"tag\">Klikk for å ta bestilling<\u002Fspan>`;\n    else if(c.state==='ordered')inner=`<span class=\"ticket\">${REC[c.order].n} · ${fmt(c.price)}<\u002Fspan><div class=\"small\">${c.hasPizza?'🔥 Pizzaen er i ovnen':REC[c.order].ings.map(k=>ING[k].e).join(' ')}<\u002Fdiv>`;\n    else inner=`<span class=\"bubble\">${c.bubble}<\u002Fspan>`;\n    h+=`<div class=\"cust ${c.state} ${c.hasPizza?'done':''} ${act}\" data-act=\"cust\" data-id=\"${c.id}\">${c.img?`<img class=\"cimg\" src=\"${IMG}gjest-${c.img}.webp\" alt=\"\">`:`<div class=\"cemoji\">${c.e}<\u002Fdiv>`}<div class=\"cinfo\"><b>${esc(c.name)}<\u002Fb><br>${inner}${c.state!=='leaving'?`<div class=\"pbar\"><i id=\"pb${c.id}\"><\u002Fi><\u002Fdiv>`:''}<\u002Fdiv><\u002Fdiv>`;\n  }\n  h+='<\u002Fdiv><\u002Fdiv>';\n  // kjøkken\n  const b=D.build?D.build.ings:[];\n  const ac=D.customers.find(c=>c.id===D.activeCust);\n  h+=`<div class=\"col\"><h3>👩‍🍳 Kjøkkenet<\u002Fh3><div class=\"orderbox\">`;\n  if(ac&&ac.state==='ordered'){\n    const r=REC[ac.order];\n    h+=`<b>Lager til ${esc(ac.name)}: ${r.n}<\u002Fb><div>`+r.ings.map(k=>`<span class=\"chk ${b.includes(k)?'ok':''}\">${b.includes(k)?'✓ ':''}${ING[k].e} ${ING[k].n}<\u002Fspan>`).join('');\n    b.filter(k=>!r.ings.includes(k)).forEach(k=>h+=`<span class=\"chk bad\">✗ ${ING[k].e} ${ING[k].n}<\u002Fspan>`);\n    h+='<\u002Fdiv>';\n  }else h+=`<span class=\"small\">Klikk på en gjest med bestilling for å se oppskriften. Du kan også lage pizza på lager.<\u002Fspan>`;\n  h+=`<\u002Fdiv><div class=\"kitchenrow\"><div class=\"pizzawrap\">${pizzaSVG(b,170)}<\u002Fdiv><div class=\"acts\"><button class=\"primary\" data-act=\"oven\" ${b.includes('deig')&&D.oven.length<slots()?'':'disabled'}>🔥 Sett i ovnen<\u002Fbutton><button data-act=\"trash\" ${b.length?'':'disabled'}>🗑️ Kast<\u002Fbutton><\u002Fdiv><\u002Fdiv><div class=\"ingbtns scroll\" data-sk=\"ing\">`;\n  for(const k of usedIngs())h+=`<button data-act=\"ing\" data-k=\"${k}\" ${S.stock[k]<1?'disabled':''}><span class=\"e\">${ING[k].e}<\u002Fspan>${ING[k].n}<span class=\"n\">${S.stock[k]} igjen<\u002Fspan><\u002Fbutton>`;\n  h+=`<\u002Fdiv><\u002Fdiv>`;\n  // ovn\n  h+=`<div class=\"col\"><h3>🔥 Ovnen <span class=\"small\">(${UPG.ovn.lv[S.upg.ovn].n||'Ovn'})<\u002Fspan><\u002Fh3><div class=\"scroll\" data-sk=\"oven\">`;\n  for(let i=0;i<slots();i++){\n    const p=D.oven[i];\n    if(!p){h+=`<div class=\"slot emptyslot\">Ledig plass<\u002Fdiv>`;continue;}\n    const c=p.custId?D.customers.find(c=>c.id===p.custId):null;\n    const name=p.rid?REC[p.rid].n:'Ukjent pizza';\n    const filt=p.state==='burnt'?'filter:grayscale(1) brightness(.35)':p.state==='done'?'filter:saturate(1.2) brightness(.95)':'filter:brightness(1.08) saturate(.7)';\n    h+=`<div class=\"slot ${p.state}\"><div style=\"${filt}\">${pizzaSVG(p.ings,60)}<\u002Fdiv><div class=\"info\"><b>${name}<\u002Fb><div class=\"small\">${c?'Til '+esc(c.name):'Ingen bestemt gjest'}${p.by!=='deg'?' · laget av '+esc(p.by):''}<\u002Fdiv><div class=\"obar\"><i id=\"ob${p.id}\"><\u002Fi><\u002Fdiv>`;\n    if(p.state==='done')h+=`<button class=\"go small\" data-act=\"serve\" data-id=\"${p.id}\">🛎️ Server<\u002Fbutton> `;\n    if(p.state!=='baking')h+=`<button class=\"small\" data-act=\"toss\" data-id=\"${p.id}\">🗑️<\u002Fbutton>`;\n    if(p.state==='baking')h+=`<span class=\"small\">Stekes …<\u002Fspan>`;\n    h+=`<\u002Fdiv><\u002Fdiv>`;\n  }\n  const t=D.today;\n  h+=`<div class=\"card\" style=\"margin-top:8px\"><b>I dag så langt<\u002Fb><div class=\"small\">Solgt: ${t.served} pizzaer · Inntekt: ${fmt(t.revenue+t.tips)}<\u002Fdiv><div class=\"small\">Sure gjester: ${t.angry} · For dyrt: ${t.pricey} · Fullt: ${t.full}<\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n  h+='<\u002Fdiv><\u002Fdiv><\u002Fdiv>';\n  return h;\n}\nfunction updateBars(){\n  if(!D)return;\n  for(const c of D.customers){\n    const el=document.getElementById('pb'+c.id);if(!el)continue;\n    const r=clamp(c.pat/c.max,0,1);el.style.width=(r*100)+'%';\n    el.style.background=r>0.5?'var(--green)':r>0.25?'var(--gold)':'var(--red)';\n  }\n  const bt=bakeTime(),bg=burnGrace();\n  for(const p of D.oven){\n    const el=document.getElementById('ob'+p.id);if(!el)continue;\n    if(p.t<bt){el.style.width=(p.t/bt*100)+'%';el.style.background='var(--gold)';}\n    else{el.style.width=(clamp((p.t-bt)/bg,0,1)*100)+'%';el.style.background='var(--red)';}\n  }\n}\nfunction renderShop(){\n  let h=`<h2>📦 Innkjøp<\u002Fh2><p class=\"lead\">Ingrediensene kjøpes i porsjoner (én porsjon = nok til én pizza). Kvalitet: <b>${qual().n}<\u002Fb>. Svinn per natt: <b>${pct(spoil())}<\u002Fb> – et kjølerom gir mindre svinn.<\u002Fp>`;\n  if(!staffOf('innkjoper').length)h+=`<div class=\"hint\">💡 Ansetter du en innkjøper, fylles lageret opp automatisk hver morgen – og du får rabatt.<\u002Fdiv>`;\n  else h+=`<div class=\"hint\">📦 Innkjøperen fyller opp til målene du setter her, hver morgen (så langt pengene rekker).<\u002Fdiv>`;\n  h+='<div class=\"grid\">';\n  for(const k of usedIngs()){\n    const pc=portionCost(k);\n    h+=`<div class=\"card\"><div class=\"row\"><span class=\"ie\">${ING[k].e}<\u002Fspan><div><b>${ING[k].n}<\u002Fb><div class=\"small\">${fmt1(pc)} per porsjon<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n    <div style=\"margin:6px 0\" class=\"${S.stock[k]<5?'low':''}\">På lager: <b>${S.stock[k]}<\u002Fb><\u002Fdiv>\n    <div class=\"row\"><button class=\"small\" data-act=\"buy\" data-k=\"${k}\" data-n=\"10\">+10 (${fmt(pc*10)})<\u002Fbutton><button class=\"small\" data-act=\"buy\" data-k=\"${k}\" data-n=\"50\">+50 (${fmt(pc*50)})<\u002Fbutton><\u002Fdiv>\n    ${staffOf('innkjoper').length?`<label class=\"small\" style=\"display:block;margin-top:6px\">Lagermål: <input type=\"number\" min=\"0\" max=\"999\" step=\"5\" data-target=\"${k}\" value=\"${S.target[k]}\"><\u002Flabel>`:''}<\u002Fdiv>`;\n  }\n  h+='<\u002Fdiv><h3 style=\"margin-top:16px\">Hvor mange pizzaer kan du lage nå?<\u002Fh3><div class=\"row\">';\n  S.unlocked.forEach(id=>h+=`<span class=\"pill\">${REC[id].n}: ${howMany(id)}<\u002Fspan>`);\n  return h+'<\u002Fdiv>';\n}\nfunction renderMenu(){\n  const hasM=staffOf('marked').length>0;\n  let h=`<h2>📋 Meny og priser<\u002Fh2><p class=\"lead\">Råvarekostnad er hva ingrediensene til én pizza koster deg. Fortjenesten er det du sitter igjen med per pizza – før husleie og lønn.<\u002Fp>`;\n  h+=`<div class=\"hint\">💡 Mange pizzeriaer tar omtrent 3 ganger råvarekostnaden. For høy pris gjør at gjester går. For lav pris gir lite fortjeneste. Bedre omdømme, interiør og kvalitet gjør at gjestene godtar høyere priser.<\u002Fdiv>`;\n  if(!hasM)h+=`<p class=\"small\">Ansett en markedsfører for å se hva gjestene synes om prisene.<\u002Fp>`;\n  h+=`<div style=\"overflow-x:auto\"><table><tr><th>Pizza<\u002Fth><th>Ingredienser<\u002Fth><th class=\"num\">Råvarer<\u002Fth><th class=\"num\">Din pris<\u002Fth><th class=\"num\">Fortjeneste<\u002Fth>${hasM?'<th>Gjestene synes<\u002Fth>':''}<th>Sist<\u002Fth><\u002Ftr>`;\n  const stats=D?D.rec:S.lastRec||{};\n  for(const id of S.unlocked){\n    const r=REC[id],cost=recipeCost(r),price=S.prices[id],prof=price-cost;\n    const st=stats[id]||{sold:0,pricey:0};\n    const fe=feel(price/fairPrice(r));\n    h+=`<tr><td><b>${r.n}<\u002Fb><\u002Ftd><td>${r.ings.map(k=>ING[k].e).join(' ')}<\u002Ftd><td class=\"num\">${fmt1(cost)}<\u002Ftd>\n    <td class=\"num\"><input type=\"number\" min=\"0\" max=\"9999\" step=\"5\" data-price=\"${id}\" value=\"${price}\" aria-label=\"Pris for ${r.n}\"><\u002Ftd>\n    <td class=\"num\" style=\"color:${prof<0?'var(--red)':'var(--greend)'}\"><b>${fmt(prof)}<\u002Fb><div class=\"small\">${price>0?pct(prof/price):'–'} av prisen<\u002Fdiv><\u002Ftd>\n    ${hasM?`<td>${fe[0]} ${fe[1]}<\u002Ftd>`:''}<td class=\"small\">${D?'I dag':'I går'}: solgt ${st.sold}${st.pricey?`, ${st.pricey} syntes den var for dyr`:''}<\u002Ftd><\u002Ftr>`;\n  }\n  h+='<\u002Ftable><\u002Fdiv><h3 style=\"margin-top:18px\">🔒 Nye oppskrifter<\u002Fh3><div class=\"grid\">';\n  RECIPES.filter(r=>!S.unlocked.includes(r.id)).forEach(r=>{\n    h+=`<div class=\"card\"><b>${r.n}<\u002Fb><div style=\"font-size:22px;margin:4px 0\">${r.ings.map(k=>ING[k].e).join(' ')}<\u002Fdiv><div class=\"small\">Råvarer ca. ${fmt(recipeCost(r))} per pizza${r.lux?' · Luksuspizza – gjestene betaler ekstra':''}<\u002Fdiv><button class=\"primary small\" style=\"margin-top:6px\" data-act=\"unlock\" data-id=\"${r.id}\" ${S.money<r.cost?'disabled':''}>Lås opp: ${fmt(r.cost)}<\u002Fbutton><\u002Fdiv>`;\n  });\n  if(S.unlocked.length===RECIPES.length)h+=`<p class=\"small\">Du har alle oppskriftene! 🎉<\u002Fp>`;\n  return h+'<\u002Fdiv>';\n}\nfunction skillStars(n){return '<span class=\"stars\">'+'★'.repeat(n)+'<span style=\"opacity:.25\">'+'★'.repeat(5-n)+'<\u002Fspan><\u002Fspan>';}\nfunction renderStaff(){\n  const cap=LEVELS[S.level].staff;\n  let h=`<h2>👥 Ansatte<\u002Fh2><p class=\"lead\">Du har plass til <b>${cap}<\u002Fb> ansatte i ${LEVELS[S.level].n.toLowerCase()}. Lønn betales ved stengetid hver dag: <b>${fmt(wagesTotal())}<\u002Fb> totalt.<\u002Fp>`;\n  h+='<div class=\"grid\">';\n  if(!S.staff.length)h+=`<div class=\"card small\">Ingen ansatte ennå. Velg blant søkerne under.<\u002Fdiv>`;\n  S.staff.forEach(s=>{\n    h+=`<div class=\"card\"><div class=\"row\">${roleImg(s.role)}<div><b>${esc(s.name)}<\u002Fb><div>${ROLES[s.role].e} ${ROLES[s.role].n}<\u002Fdiv>${skillStars(s.skill)}<\u002Fdiv><\u002Fdiv><div class=\"small\" style=\"margin:6px 0\">${ROLES[s.role].d}<\u002Fdiv><div>Lønn: <b>${fmt(s.wage)}<\u002Fb>/dag<\u002Fdiv><div class=\"row\" style=\"margin-top:6px\">${s.skill<5?`<button class=\"small\" data-act=\"course\" data-id=\"${s.id}\" ${S.money<courseCost(s)?'disabled':''}>🎓 Kurs (${fmt(courseCost(s))})<\u002Fbutton>`:'<span class=\"pill\">Maks nivå<\u002Fspan>'}<button class=\"small\" data-act=\"fire\" data-id=\"${s.id}\">Si opp<\u002Fbutton><\u002Fdiv><\u002Fdiv>`;\n  });\n  h+=`<\u002Fdiv><h3 style=\"margin-top:18px\">📨 Søkere <span class=\"small\">– nye søkere kommer hver morgen<\u002Fspan><\u002Fh3><div class=\"grid\">`;\n  S.pool.forEach(c=>{\n    h+=`<div class=\"card\"><div class=\"row\">${roleImg(c.role)}<div><b>${esc(c.name)}<\u002Fb><div>${ROLES[c.role].e} ${ROLES[c.role].n}<\u002Fdiv>${skillStars(c.skill)}<\u002Fdiv><\u002Fdiv><div class=\"small\" style=\"margin:6px 0\">${ROLES[c.role].d}<\u002Fdiv><div>Ønsket lønn: <b>${fmt(c.wage)}<\u002Fb>/dag<\u002Fdiv><button class=\"go small\" style=\"margin-top:6px\" data-act=\"hire\" data-id=\"${c.id}\" ${S.staff.length>=cap?'disabled':''}>Ansett<\u002Fbutton><\u002Fdiv>`;\n  });\n  if(!S.pool.length)h+=`<div class=\"card small\">Ingen flere søkere i dag.<\u002Fdiv>`;\n  h+='<\u002Fdiv><div class=\"hint\" style=\"margin-top:12px\">💡 Flere stjerner betyr at personen jobber raskere og gjør færre feil – men vil ha høyere lønn. Tenk over om den ansatte tjener inn mer enn lønnen!<\u002Fdiv>';\n  return h;\n}\nfunction renderUpg(){\n  let h=`<h2>🛠️ Oppgrader<\u002Fh2><p class=\"lead\">Oppgraderinger koster penger nå, men kan gi mer inntekt senere. Det kalles en <b>investering<\u002Fb>.<\u002Fp>`;\n  const L=LEVELS[S.level],N=LEVELS[S.level+1];\n  h+=`<div class=\"card\" style=\"margin-bottom:12px\"><div class=\"lvlrow\">${lvlImg(S.level)}<div><h3>${L.e} Restauranten: ${L.n}<\u002Fh3><div class=\"small\">Husleie ${fmt(L.rent)}/dag · plass til ${L.staff} ansatte og ${L.queue} gjester om gangen<\u002Fdiv><\u002Fdiv>${N?`<div style=\"font-size:30px\">➜<\u002Fdiv>${lvlImg(S.level+1)}`:''}<\u002Fdiv>`;\n  if(N)h+=`<p><b>Neste: ${N.e} ${N.n}<\u002Fb> – husleie ${fmt(N.rent)}/dag, ${N.staff} ansatte, ${N.queue} gjester og flere gjester per dag.<\u002Fp><button class=\"primary\" data-act=\"level\" ${S.money<N.c?'disabled':''}>Flytt dit: ${fmt(N.c)}<\u002Fbutton>`;\n  else h+=`<p>Du har den største restauranten! 🎉<\u002Fp>`;\n  h+='<\u002Fdiv><div class=\"grid\">';\n  for(const key in UPG){\n    const u=UPG[key],cur=S.upg[key],L1=u.lv[cur],N1=u.lv[cur+1];\n    h+=`<div class=\"card\"><div class=\"row\"><span class=\"ie\">${u.e}<\u002Fspan><div><b>${u.n}<\u002Fb><div class=\"small\">${u.d}<\u002Fdiv><\u002Fdiv><\u002Fdiv><div style=\"margin:6px 0\">Nå: ${L1.n?'<b>'+L1.n+'<\u002Fb> – ':''}${u.f(L1.v)}<\u002Fdiv>`;\n    if(N1)h+=`<div class=\"small\">Neste: ${N1.n?N1.n+' – ':''}${u.f(N1.v)}<\u002Fdiv><button class=\"primary small\" style=\"margin-top:6px\" data-act=\"upg\" data-k=\"${key}\" ${S.money<N1.c?'disabled':''}>Kjøp: ${fmt(N1.c)}<\u002Fbutton>`;\n    else h+=`<span class=\"pill\">Maks nivå<\u002Fspan>`;\n    h+='<\u002Fdiv>';\n  }\n  return h+'<\u002Fdiv>';\n}\nfunction renderGoals(){\n  const done=GOALS.filter((g,i)=>S.goals[i]).length;\n  let h=`<h2>🏆 Mål<\u002Fh2><p class=\"lead\">Fullfør alle målene for å kunne åpne en ny filial (rebirth). Du har klart <b>${done} av ${GOALS.length}<\u002Fb>.<\u002Fp>`;\n  if(allGoalsDone())h+=`<div class=\"hint\" style=\"text-align:center\"><b>Alle mål er nådd!<\u002Fb> Du kan spille videre så lenge du vil, eller åpne en ny filial.<br><button class=\"go big\" style=\"margin-top:8px\" data-act=\"rebirth\">🌟 Åpne ny filial (+${lpGain()} LP)<\u002Fbutton><\u002Fdiv>`;\n  GOALS.forEach((g,i)=>{\n    const tgt=goalTarget(g),cur=g.g(),ok=S.goals[i];\n    let prog;\n    if(g.lvl)prog='';\n    else if(g.dec)prog=`${Math.min(cur,tgt).toFixed(1).replace('.',',')} / ${String(tgt).replace('.',',')}`;\n    else if(g.kr)prog=`${fmt(Math.min(cur,tgt))} / ${fmt(tgt)}`;\n    else prog=`${Math.min(cur,tgt)} / ${tgt}`;\n    h+=`<div class=\"goal ${ok?'done':''}\"><span class=\"gi\">${ok?'✅':'⬜'}<\u002Fspan><div class=\"gt\"><b>${g.n.replace(/[0-9][0-9 ]*[0-9]|[0-9]/,m=>g.sc?Math.round(parseInt(m.replace(/ /g,''))*scaleM()).toLocaleString('nb-NO'):m)}<\u002Fb>${!ok&&prog?`<div class=\"small\">${prog}<\u002Fdiv><div class=\"gbar\"><i style=\"width:${clamp(cur/tgt,0,1)*100}%\"><\u002Fi><\u002Fdiv>`:''}<\u002Fdiv><span class=\"pill\">+${fmt(goalReward(g))}<\u002Fspan><\u002Fdiv>`;\n  });\n  h+=`<h3 style=\"margin-top:18px\">🌟 Legendebonuser <span class=\"small\">– du har ${META.lp} LP · filial nr. ${META.rebirths+1}<\u002Fspan><\u002Fh3><p class=\"small\">Legendepoeng får du når du åpner en ny filial. Bonusene varer for alltid.<\u002Fp><div class=\"grid\">`;\n  PERKS.forEach(p=>{\n    const lv=perk(p.id);\n    h+=`<div class=\"card\"><b>${p.n}<\u002Fb> <span class=\"pill\">${lv}/${p.max}<\u002Fspan><div class=\"small\">${p.d}<\u002Fdiv>${lv<p.max?`<button class=\"small\" style=\"margin-top:6px\" data-act=\"perk\" data-id=\"${p.id}\" ${META.lp<perkCost(p)?'disabled':''}>Kjøp: ${perkCost(p)} LP<\u002Fbutton>`:'<span class=\"pill\">Maks<\u002Fspan>'}<\u002Fdiv>`;\n  });\n  return h+'<\u002Fdiv>';\n}\nfunction reportHTML(r,withBtn){\n  const income=r.revenue+r.tips;\n  let h=`<h2>📒 Regnskap for dag ${r.day}<\u002Fh2><table>\n  <tr><th colspan=\"2\">Inntekter<\u002Fth><\u002Ftr>\n  <tr><td>Salg av pizza (${r.served} stk.)<\u002Ftd><td class=\"num\">${fmt(r.revenue)}<\u002Ftd><\u002Ftr>\n  <tr><td>Tips<\u002Ftd><td class=\"num\">${fmt(r.tips)}<\u002Ftd><\u002Ftr>\n  <tr><td><b>Sum inntekter<\u002Fb><\u002Ftd><td class=\"num\"><b>${fmt(income)}<\u002Fb><\u002Ftd><\u002Ftr>\n  <tr><th colspan=\"2\">Kostnader<\u002Fth><\u002Ftr>\n  <tr><td>Ingredienser brukt<\u002Ftd><td class=\"num\">−${fmt(r.cogs)}<\u002Ftd><\u002Ftr>\n  <tr><td>Svinn i natt (${r.spoilN} porsjoner)<\u002Ftd><td class=\"num\">−${fmt(r.spoilVal)}<\u002Ftd><\u002Ftr>\n  <tr><td>Lønn<\u002Ftd><td class=\"num\">−${fmt(r.wages)}<\u002Ftd><\u002Ftr>\n  <tr><td>Husleie<\u002Ftd><td class=\"num\">−${fmt(r.rent)}<\u002Ftd><\u002Ftr>\n  ${r.interest?`<tr><td>Renter på lån<\u002Ftd><td class=\"num\">−${fmt(r.interest)}<\u002Ftd><\u002Ftr>`:''}\n  <tr><td><b>Dagens resultat<\u002Fb><\u002Ftd><td class=\"num\" style=\"color:${r.profit<0?'var(--red)':'var(--greend)'}\"><b>${r.profit<0?'':'+'}${fmt(r.profit)}<\u002Fb><\u002Ftd><\u002Ftr><\u002Ftable>`;\n  h+=`<p class=\"small\">Kassen: ${fmt(r.cash0)} ved åpning → ${fmt(r.cash1)} nå.${r.loanPay?' Inkludert avdrag på lån.':''} Varer du har kjøpt, men ikke brukt, ligger fortsatt på lageret.<\u002Fp>`;\n  const tips=[];\n  if(r.angry)tips.push(`😠 ${r.angry} gjester ble lei av å vente. Ansett hjelp, eller oppgrader ovnen.`);\n  if(r.pricey)tips.push(`💸 ${r.pricey} gjester syntes prisen var for høy.`);\n  if(r.empty)tips.push(`😕 ${r.empty} gjester gikk fordi du var tom for ingredienser.`);\n  if(r.full)tips.push(`🚪 ${r.full} gjester snudde i døra fordi det var fullt. Større restaurant gir plass til flere.`);\n  if(r.wrong)tips.push(`😒 ${r.wrong} gjester fikk feil pizza.`);\n  if(r.burnt)tips.push(`🔥 ${r.burnt} pizzaer ble brent.`);\n  if(r.profit<0)tips.push('📉 Du tapte penger i dag. Se på priser, lønn og husleie.');\n  if(tips.length)h+=`<div class=\"hint\">${tips.join('<br>')}<\u002Fdiv>`;\n  if(withBtn)h+=`<div style=\"text-align:center;margin-top:10px\"><button class=\"go big\" data-act=\"nextday\">Neste dag ☀️<\u002Fbutton><\u002Fdiv>`;\n  return h;\n}\nfunction renderBooks(){\n  let h=`<h2>📒 Regnskap<\u002Fh2>`;\n  if(D){const t=D.today;h+=`<div class=\"card\" style=\"margin-bottom:12px\"><b>I dag så langt:<\u002Fb> ${t.served} pizzaer solgt, inntekt ${fmt(t.revenue+t.tips)}, ingredienser brukt ${fmt(t.cogs)}.<\u002Fdiv>`;}\n  if(S.lastReport)h+=`<div class=\"card\" style=\"margin-bottom:12px\">${reportHTML(S.lastReport,false)}<\u002Fdiv>`;\n  else h+=`<p class=\"lead\">Regnskapet for første dag kommer når du stenger.<\u002Fp>`;\n  if(S.history.length){\n    const mx=Math.max(1,...S.history.map(x=>Math.abs(x.profit)));\n    h+=`<h3>Resultat per dag<\u002Fh3><div class=\"chart\">`+S.history.map(x=>`<div class=\"b ${x.profit<0?'neg':'pos'}\" style=\"height:${Math.max(3,Math.abs(x.profit)/mx*100)}%\" title=\"Dag ${x.day}: ${fmt(x.profit)}\"><\u002Fdiv>`).join('')+`<\u002Fdiv><div class=\"small\">Grønn = overskudd, rød = underskudd. Hold musen over en søyle for å se tallet.<\u002Fdiv>`;\n  }\n  h+=`<h3 style=\"margin-top:16px\">🏦 Banken<\u002Fh3>`;\n  if(S.loan)h+=`<div class=\"card\">Du har et lån. Du betaler ${fmt(S.loan.pay)} hver dag i ${S.loan.left} dager til.<\u002Fdiv>`;\n  else h+=`<div class=\"card\"><b>Nødlån:<\u002Fb> Få 1 500 kr nå. Du betaler tilbake 150 kr hver dag i 12 dager – det blir 1 800 kr totalt. De 300 ekstra kronene er <b>renter<\u002Fb>, prisen for å låne penger.<br><button class=\"small\" style=\"margin-top:6px\" data-act=\"loan\">Ta opp lån<\u002Fbutton><\u002Fdiv>`;\n  h+=`<p class=\"small\" style=\"margin-top:12px\">Totalt solgt denne filialen: ${fmt(S.stats.revenue)} · ${S.stats.served} pizzaer servert${META.lifetime?` · Alle filialer: ${fmt(META.lifetime+S.stats.revenue)}`:''}<\u002Fp>`;\n  return h;\n}\n\n/* ================= MODAL / TOAST ================= */\nfunction showModal(html){document.getElementById('modal').innerHTML=`<div class=\"overlay\"><div class=\"modal\">${html}<\u002Fdiv><\u002Fdiv>`;}\nfunction closeModal(){document.getElementById('modal').innerHTML='';}\nfunction toast(msg){\n  const box=document.getElementById('toasts');const el=document.createElement('div');el.className='toast';el.textContent=msg;box.appendChild(el);\n  while(box.children.length>4)box.removeChild(box.firstChild);\n  setTimeout(()=>el.remove(),3200);\n}\nfunction helpHTML(){\n  return `<div style=\"text-align:center\">${roleImg('kokk')}<\u002Fdiv><h2>🍕 Velkommen til Pizzabutikken!<\u002Fh2><p>Du starter med en liten pizzavogn. Kan du bygge et pizzaimperium – uten å gå konkurs?<\u002Fp>\n  <ol><li><b>Før dagen:<\u002Fb> Kjøp ingredienser under <b>Innkjøp<\u002Fb> og sett priser under <b>Meny og priser<\u002Fb>.<\u002Fli>\n  <li>Trykk <b>Åpne dørene<\u002Fb>. Gjestene kommer til disken.<\u002Fli>\n  <li><b>Klikk på en gjest<\u002Fb> for å ta bestillingen.<\u002Fli>\n  <li>Bygg pizzaen i kjøkkenet: <b>deig først<\u002Fb>, så resten av ingrediensene på lappen.<\u002Fli>\n  <li><b>Sett den i ovnen<\u002Fb>, og trykk <b>Server<\u002Fb> når den er ferdig – før den brenner!<\u002Fli>\n  <li>Etter stengetid får du <b>regnskapet<\u002Fb>. Husleie og lønn må betales hver dag.<\u002Fli>\n  <li>Oppgrader, ansett folk og fullfør alle <b>mål<\u002Fb>. Da kan du åpne en <b>ny filial<\u002Fb> og få bonuser som varer for alltid.<\u002Fli><\u002Fol>\n  <p class=\"small\">Tips: Gjestene går hvis de venter for lenge eller synes prisen er for høy. Fornøyde gjester gir tips og bedre omdømme ⭐.<\u002Fp>\n  <div style=\"text-align:center\"><button class=\"go big\" data-act=\"close\">La oss bake!<\u002Fbutton><\u002Fdiv>`;\n}\n\n/* ================= HENDELSER ================= */\nfunction handle(act,ds){\n  switch(act){\n    case 'tab':UI.tab=ds.v;break;\n    case 'open':openDay();return;\n    case 'cust':if(D)clickCust(+ds.id);break;\n    case 'ing':addIng(ds.k);break;\n    case 'oven':toOven();break;\n    case 'trash':trashBuild();break;\n    case 'serve':if(D&&servePizza(+ds.id))dirty=true;break;\n    case 'toss':if(D)tossPizza(+ds.id);break;\n    case 'buy':buy(ds.k,+ds.n);break;\n    case 'unlock':unlockRecipe(ds.id);break;\n    case 'hire':hire(+ds.id);break;\n    case 'fire':fire(+ds.id);return;\n    case 'fireok':fireOk(+ds.id);break;\n    case 'course':course(+ds.id);break;\n    case 'upg':buyUpg(ds.k);break;\n    case 'level':buyLevel();break;\n    case 'rebirth':askRebirth();return;\n    case 'rebirthok':doRebirth();return;\n    case 'perk':buyPerk(ds.id);break;\n    case 'pause':UI.paused=!UI.paused;break;\n    case 'speed':UI.speed=+ds.v;break;\n    case 'sound':META.sound=!META.sound;save();break;\n    case 'loan':takeLoan();break;\n    case 'nextday':nextDay();return;\n    case 'showreport':if(S.lastReport)showModal(reportHTML(S.lastReport,true));return;\n    case 'close':closeModal();if(!META.intro){META.intro=true;save();}return;\n    case 'help':showModal(helpHTML());return;\n    case 'export':{let code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify({S,META}))));}catch(e){}\n      showModal(`<h2>💾 Lagre-kode<\u002Fh2><p>Kopier koden og ta vare på den. Da kan du fortsette på en annen maskin eller nettleser.<\u002Fp><textarea readonly onclick=\"this.select()\">${code}<\u002Ftextarea><div class=\"row\" style=\"margin-top:8px\"><button data-act=\"close\">Lukk<\u002Fbutton><\u002Fdiv>`);return;}\n    case 'import':showModal(`<h2>📂 Last inn kode<\u002Fh2><p>Lim inn en lagre-kode. Det du har nå blir erstattet.<\u002Fp><textarea id=\"imp\"><\u002Ftextarea><div class=\"row\" style=\"margin-top:8px\"><button class=\"go\" data-act=\"importok\">Last inn<\u002Fbutton><button data-act=\"close\">Avbryt<\u002Fbutton><\u002Fdiv>`);return;\n    case 'importok':{try{const o=JSON.parse(decodeURIComponent(escape(atob(document.getElementById('imp').value.trim()))));if(!o.S||!o.META)throw 0;S=o.S;META=Object.assign(defaultMeta(),o.META);D=null;if(S.phase!=='prep'){S.phase='report';nextDayFromLoad();}save();closeModal();toast('✅ Spillet er lastet inn');}catch(e){toast('Koden fungerte ikke');}break;}\n    case 'reset':showModal(`<h2>🗑️ Start helt på nytt?<\u002Fh2><p>Alt blir slettet – også legendepoeng og bonuser. Dette kan ikke angres.<\u002Fp><div class=\"row\"><button class=\"primary\" data-act=\"resetok\">Ja, slett alt<\u002Fbutton><button data-act=\"close\">Avbryt<\u002Fbutton><\u002Fdiv>`);return;\n    case 'resetok':META=defaultMeta();META.intro=true;S=newRun();genPool();D=null;save();closeModal();UI.tab='play';break;\n  }\n  dirty=true;\n}\nfunction nextDayFromLoad(){S.day++;S.phase='prep';S.todaySpent=0;genPool();restock();}\nlet tap=null;\ndocument.addEventListener('pointerdown',e=>{\n  if(e.button&&e.button!==0)return;\n  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;\n  if(e.pointerType==='mouse'){e.preventDefault();handle(el.dataset.act,el.dataset);return;}\n  tap={act:el.dataset.act,ds:{...el.dataset},x:e.clientX,y:e.clientY,id:e.pointerId};\n});\ndocument.addEventListener('pointerup',e=>{\n  if(!tap||e.pointerId!==tap.id)return;\n  const t=tap;tap=null;\n  if(Math.hypot(e.clientX-t.x,e.clientY-t.y)<12)handle(t.act,t.ds);\n});\ndocument.addEventListener('pointercancel',()=>{tap=null;});\ndocument.addEventListener('click',e=>{\n  if(e.detail!==0)return; // tastatur\n  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;\n  handle(el.dataset.act,el.dataset);\n});\ndocument.addEventListener('change',e=>{\n  const t=e.target;\n  if(t.dataset.price){S.prices[t.dataset.price]=clamp(Math.round(+t.value||0),0,9999);if(S.phase==='prep')save();dirty=true;}\n  if(t.dataset.target){S.target[t.dataset.target]=clamp(Math.round(+t.value||0),0,999);if(S.phase==='prep')save();}\n});\ndocument.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('input[data-price],input[data-target]'))e.target.blur();});\n\n/* ================= LØKKE ================= */\nlet last=performance.now(),hdrT=0;\nfunction loop(now){\n  const real=Math.min(0.25,(now-last)/1000);last=now;\n  if(S.phase==='open'&&D&&!UI.paused){\n    let dt=real*UI.speed;\n    while(dt>0&&S.phase==='open'){const s=Math.min(dt,0.1);tick(s);dt-=s;}\n  }\n  hdrT+=real;if(hdrT>0.25){hdrT=0;renderHeader();}\n  if(dirty){\n    const ae=document.activeElement;\n    const typing=ae&&ae.tagName==='INPUT'&&document.getElementById('view').contains(ae);\n    if(!typing){dirty=false;renderNav();renderView();}\n  }\n  if(S.phase==='open'&&UI.tab==='play')updateBars();\n  requestAnimationFrame(loop);\n}\n\n/* ================= START ================= */\nif(!load()){META=defaultMeta();S=newRun();genPool();}\nelse{if(S.phase==='open'){S.phase='prep';}else if(S.phase==='report'){nextDayFromLoad();}if(!S.pool)genPool();}\nrenderAll();\nif(!META.intro)showModal(helpHTML());\nrequestAnimationFrame(loop);\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
